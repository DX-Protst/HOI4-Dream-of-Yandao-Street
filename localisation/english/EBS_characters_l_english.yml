l_english:
 EBS_leader_chen_zhuanyuan:0 "Commissioner Chen"
 EBS_leader_chen_zhuanyuan_desc:0 "Grand Commissioner of the Supreme Education Bureau Inspection Taskforce. Permanently attired in a crisp dark grey Mao suit with a gold-trimmed badge, he preaches 'The Four Returns' and 'Squeezing the Water out of Classrooms'. Beneath his austere facade of integrity lies the chief broker of elite quota allocation, systematically draining admission quotas from provinces like Shanhe and Dongbei to build an impenetrable wall of Beijing privilege."
 EBS_huai_zonggong:0 "Chief Engineer Huai"
 EBS_huai_zonggong_desc:0 "Academician of Educational Cybernetics and Chief Engineer of Algorithmic Examinations. A believer in absolute technological rationality and computational determinism. In his eyes, human exam management is inherently flawed. He advocates installing panoramic facial-microexpression cameras and neural wristbands in every exam hall, calculating students' loyalty and academic destiny with lines of code via the supercomputing mainframe beneath Tsinghua High School."
 EBS_zhou_zongdao:0 "Director General Zhou"
 EBS_zhou_zongdao_desc:0 "Supreme Commander of the Five-Day Sudden School Evaluation Campaign, feared nationwide as the 'Intercontinental Ballistic Missile'. Believing that 'Formalism is productive force', his visits send principals into panic. In five days of surprise inspection, he forces schools to spray toxic green paint over dirt playgrounds, plant wheat stalks in pavement cracks to fake experimental bases, and have millions of teachers copy fake lesson plans all night."
 EBS_wang_sichang:0 "Director Wang"
 EBS_wang_sichang_desc:0 "Director of the Campus Sports and Arts Quota Office and the Czar of Campus Football. Overseeing tens of billions in special funds, he runs secret slush funds and monetizes fitness into financial derivatives. By commercializing National Second-Class Athlete certificates and art exemptions, he cashes in on sports admissions quotas through overpriced gilded goalposts and wholesale certificates for archery and canoeing."
 EBS_wang_zongguan:0 "General Manager Wang"
 EBS_wang_zongguan_desc:0 "General Manager of Nationwide School Banquet and Logistics Consortium. His personal motto: 'Sober up in the morning, wine and dine at noon, issue transfers at the KTV at night.' He monopolizes catering concessions across school districts with cheap pre-made meal packs while diverting student nutritional subsidies, binding local inspectors tightly to his banquet slush funds."
 EBS_dongbei_council:0 "Northeast Schools Coalition"
 EBS_dongbei_council_desc:0 "The supreme governing organ of Manchurian test-takers formed by High School Attached to Northeast Normal University, Harbin No. 3 High School, Benxi High School, and Liaoning Experimental High School. Representing millions of students drilling through thousands of heavy-industry exam sets in sub-zero blizzards, they smashed their tea mugs in fury and mobilized armored exam trains along the Beijing-Mukden Railway to march south and demand ironclad equality!"
 EBS_enlightened_teachers:0 "Northern Enlightened Teachers Union"
 EBS_enlightened_teachers_desc:0 "A grassroots democratic mutual-aid alliance of thousands of frontline master teachers and curriculum researchers across northern provinces. Exhausted by formalistic evaluations, fake dossiers, and quota manipulation by the elites, they advocate returning classrooms to students and teachers, abolishing bureaucracy, and revitalizing genuine education."
 EBS_xi_teshi:0 "Special Envoy Xi"
 EBS_xi_teshi_desc:0 "Special Envoy for High Plateau Borderland Score-Reduction Corridors. Mastermind of both the Hengshui assembly line system and quota arbitrage. He perfected the art of fake academic registrations in borderlands, allowing privileged offspring to stay in Beijing for three years while enjoying a 200-point lower admission threshold to Tsinghua and Peking University."
 EBS_haidian_council:0 "Haidian Elite Committee"
 EBS_haidian_council_desc:0 "An oligarchic lobbying coalition of elite Haidian school directors and Shunyi international school parents. They crafted the myth of 'Early Cultivation' and high-stakes cramming while monopolizing independent admissions committees, designating equestrianism, fencing, sailing, and Antarctic expeditions as 'core comprehensive qualities' to shut out ordinary working-class students."
