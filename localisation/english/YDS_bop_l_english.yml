l_english:
 YDS_class_1_bop:0 "Class 1 Balance of Power"
 YDS_class_1_bop_desc:0 "The covert power struggle inside Class 1. Tang Siyi advocates for student self-governance and educational freedom, while Teacher Deng Shuang demands strict discipline and curriculum control to secure academic excellence."
 YDS_student_side:0 "Tang Siyi (Student Autonomy)"
 YDS_student_side_desc:0 "Tang Siyi and her followers champion student rights, extracurricular freedom, and democratic decision-making."
 YDS_teacher_side:0 "Deng Shuang (Faculty Mentorship)"
 YDS_teacher_side_desc:0 "Teacher Deng Shuang leads the faculty mentoring committee, enforcing strict study habits, disciplined evening sessions, and authoritarian order."
 YDS_student_takeover:0 "Student Total Takeover"
 YDS_student_takeover_desc:0 "Students have taken complete control over class governance, fully sidelining faculty interference."
 YDS_student_dominant:0 "Student Dominance"
 YDS_student_dominant_desc:0 "Student autonomy heavily dominates daily class affairs, fostering creativity at the expense of strict test performance."
 YDS_student_leaning:0 "Leaning Toward Student Autonomy"
 YDS_student_leaning_desc:0 "The balance leans towards student autonomy, relaxing faculty restrictions."
 YDS_fragile_alliance:0 "Fragile Faculty-Student Alliance"
 YDS_fragile_alliance_desc:0 "A precarious equilibrium between student freedom and faculty authority. Neither side has seized full control."
 YDS_teacher_leaning:0 "Leaning Toward Faculty Mentorship"
 YDS_teacher_leaning_desc:0 "Faculty mentorship gains ground, restoring classroom discipline."
 YDS_teacher_dominant:0 "Faculty Dominance"
 YDS_teacher_dominant_desc:0 "The faculty heavily controls class operations, enforcing military-level study routines and maximizing GPA."
 YDS_teacher_takeover:0 "Faculty Total Takeover"
 YDS_teacher_takeover_desc:0 "Teacher Deng Shuang has completely taken the helm, instituting a rigorous academic lockdown."
