 YDS_gaokao_war_mobilization: "Gaokao Wartime Mobilization"
 YDS_gaokao_war_mobilization_desc: "The final battle has begun. Enact wartime educational mobilization across the entire school to repel the repeater coalition and rival provincial warlords."
 YDS_exam_hall_tactics: "Exam Hall Tactics"
 YDS_exam_hall_tactics_desc: "Apply high-pressure examination timing and disciplined pacing to frontline battlefield tactics, enhancing unit attack and defense."
 YDS_break_repeater_siege: "Break the Repeater Siege"
 YDS_break_repeater_siege_desc: "Smash through the repeater encirclement network with overwhelming speed and breakthrough power, liberating the examination corridors out of Sichuan."
 YDS_all_front_counterattack: "All-Front Counterattack"
 YDS_all_front_counterattack_desc: "Assert territorial and educational claims across every examination district in China, sweeping away all provincial education warlords."
 YDS_all_china_educational_hegemony: "All-China Educational Hegemony"
 YDS_all_china_educational_hegemony_desc: "With all regional education cliques subdued, Yandao Street Middle School establishes supreme educational dominion over the entire nation."
 YDS_liu_yan_focus_tree: "Liu Yan Totalitarian Focus Tree"
 YDS_liu_yan_focus_tree_desc: "High-pressure totalitarian national focus tree forcibly enacted following full Bureau takeover."
 YDS_ly_absolute_control: "Absolute Total Control"
 YDS_ly_absolute_control_desc: "Enforce total administrative control, suspending all non-exam subjects and requiring 16-hour daily study."
 YDS_ly_purge_dissent: "Purge Dissenting Teachers and Students"
 YDS_ly_purge_dissent_desc: "Purge anyone deviating from standardized syllabus, replacing individuality with rote machine learning."
 YDS_ly_extreme_meritocracy: "Extreme Meritocracy"
 YDS_ly_extreme_meritocracy_desc: "Implement dynamic blackboard judgment and basement intensive drill rooms, classifying students solely by score."
 YDS_ly_thought_policing: "Thought Policing"
 YDS_ly_thought_policing_desc: "Inspect daily learning journals and transform students into informants watching one another."
 YDS_ly_ban_all_clubs: "Ban All Student Clubs"
 YDS_ly_ban_all_clubs_desc: "Permanently ban all extracurricular clubs, throwing romance and hobbies into iron bins."
 YDS_ly_monitor_every_class: "24/7 Classroom Surveillance"
 YDS_ly_monitor_every_class_desc: "Deploy 360-degree PTZ cameras across all classrooms to capture every stroke of pencil and movement."
 YDS_ly_the_perfect_machine: "Build the Soulless Perfect Machine"
 YDS_ly_the_perfect_machine_desc: "Celebrate the completion of the soulless, flawless examination megamachine."