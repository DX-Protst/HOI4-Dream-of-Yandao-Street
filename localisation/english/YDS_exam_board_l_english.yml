 YDS_ivory_tower_hegemony:0 "[Ivory Tower Hegemony]"
 YDS_ivory_tower_hegemony_desc:0 "1938 Gaokao scores released: we monopolized elite admissions, entering a research frenzy while besieged by all contenders!"
 YDS_repeater_coalition_pact:0 "[Repeater Coalition Pact]"
 YDS_repeater_coalition_pact_desc:0 "Angered by high cutoffs, displaced students form an unbreakable deathmatch faction!"
