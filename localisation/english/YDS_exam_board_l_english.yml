 YDS_repeater_coalition_pact_desc:0 "Angered by high cutoffs, displaced students form an unbreakable deathmatch faction!"
 YDS_repeater_underdog_spirit:0 "[Underdog Repeater Mobilization]"
 YDS_repeater_underdog_spirit_desc:0 "With university quotas taken, student test-takers mobilize an overwhelming push!"
 yds_national_war.100.t:0 "[Historical Reckoning] National Gaokao Results Released!"
 yds_national_war.100.d:0 "The morning sun of June 7, 1938 shines on the red boards. National entrance examination rankings and quota distributions are officially released!\n\nThree grueling years of high school competition culminate in this historic reckoning."
 yds_national_war.100.a:0 "Ranked in the National Top 3! Ivory Tower Titans stand solo and refuse alliance!"
 yds_national_war.100.b:0 "Failed to reach the Top 3... The Repeater Coalition will reclaim our quotas!"
 yds_national_war.101.t:0 "[Summer Tempest] National Repeater Coalition Declares War!"
 yds_national_war.101.d:0 "The publication of results shatters peace across provinces.\n\nAccording to three years of Olympiad scores and entrance examination calculations, the Top 3 warlords stand supreme atop the ivory tower, strictly refusing any alliance. The remaining contenders have united in an unbreakable deathmatch coalition!\n\nProvincial representatives form the National Repeater Coalition and declare total war against the three isolated titans!"
 yds_national_war.101.a:0 "The fury of students turns into an iron flood! Defend the line!"
 yds_national_war.102.t:0 "[Reversal of Fate] Lead the National Repeater Army to Crush the Ivory Tower!"
 yds_national_war.102.d:0 "Elite admissions were monopolized by the Top 3 warlords. If exams cannot deliver justice, we unite all displaced contenders under the National Repeater Coalition to take back our quotas with artillery!"
 yds_national_war.102.a:0 "For scores, for our future, attack!"
