 # EBS Rules Box
 EBS_RULES_BOX_TITLE:0 "§HImperial Exam Board Codex & Inspection Guide§!"
 EBS_RULES_BOX_DESC:0 "§W1. [Deployment] Each inspector provides +0.7% weekly progress. Reaching 70% in any pillar permanently locks +12 points on the National Ladder!\n2. [Directives] Deploy decrees and inter-provincial raids to suppress rivals and reinforce central authority.\n3. [Gaokao Reckoning] On June 7, 1938: Holding Top 3 secures Ivory Tower Hegemony; falling to 4th or below collapses central authority and triggers nationwide revolution!§!"

