l_simp_chinese:

 # Country Names
 TLB:0 "铜梁巴中"
 TLB_DEF:0 "铜梁区巴川中学"
 TLB_ADJ:0 "铜巴"
 TLB_paternal_autocrat:0 "铜梁巴川公学"
 TLB_paternal_autocrat_DEF:0 "铜梁区巴川封闭式寄宿学校"
 TLB_authoritarian_democrat:0 "巴川数理实验学校"
 TLB_authoritarian_democrat_DEF:0 "铜梁巴川数理菁英学校"
 TLB_social_liberal:0 "巴川学生自治公社"
 TLB_social_liberal_DEF:0 "铜梁区巴川中学学生自治委员会"
 TLB_radical_socialist:0 "巴川联合起义公社"
 TLB_radical_socialist_DEF:0 "铜梁巴川中学各班自治联合会"

 # Characters
 TLB_tang_qimei:0 "汤启梅"
 TLB_tang_qimei_desc:0 "老年英语教师，拥有超20年的丰富教育经验。虽然教学风格扎实严密，但本人重女轻男，在班级管理中存在显著偏袒行为，极力推行高压封闭式教育。"
 TLB_hu_chaoqiang:0 "胡朝强"
 TLB_hu_chaoqiang_desc:0 "资深数学教师，年事已高却幽默风趣。曾为昔日高考状元，解题思路精妙绝伦，主张以幽默化解焦虑、以思维效率替代无效刷题的高效教育法。"
 TLB_class_6_council:0 "六班自治委员会"
 TLB_class_6_council_desc:0 "五十六名学生，五十六只花。由高一·六班全体同学组成的自治权力机构。看似对外团结一心，实则内部派系林立、各怀鬼胎，为不同学业路线争执不休。"
 TLB_zhang_hanyu:0 "张瀚予"
 TLB_zhang_hanyu_desc:0 "六班关键核心学生之一。身兼班级多个重要职务，横跨学术、组织与后勤等多领域，是六班自治体系中不可或缺的实际操盘手。"

 # Traits
 TLB_strict_administrator:0 "严格的管理者"
 TLB_strict_administrator_desc:0 "实施铁腕高压的封闭式教学与严密纪律。政治点数与稳定度大幅上升，但沉闷的教条亦压制了学术科研的自主创新。"
 TLB_humorous_educator:0 "幽默的教育家"
 TLB_humorous_educator_desc:0 "以风趣幽默的讲授风格和状元级别的思维启发学生，极大地激发了师生的科研热情，并大幅减少了形式主义与资源浪费。"
 TLB_class_6_trait:0 "各怀鬼胎"
 TLB_class_6_trait_desc:0 "五十六名学生各持己见，内部派系频繁倾轧，导致集体行政决策效率受损，内部摩擦成本剧增。"
 TLB_multi_talented_student:0 "全能干事"
 TLB_multi_talented_student_desc:0 "身兼数职，在多个学科与学生工作领域皆有建树，能高效调动班级各方资源。"

 # Ideas
 TLB_class_6_discord:0 "各怀鬼胎"
 TLB_class_6_discord_desc:0 "班级内部五十六只花各具心机，小团体众多且路线竞争激烈，随时可能因琐碎分歧引发内部混乱。"
 TLB_tongba_movement:0 "“铜巴运动”的起义怒潮"
 TLB_tongba_movement_desc:0 "源自反抗教育高压与不公的悲壮怒火，全体师生同仇敌忾，誓要打破旧体制的枷锁！"
 TLB_hegemon_of_sichuan:0 "全川教育新主"
 TLB_hegemon_of_sichuan_desc:0 "铜梁巴中成功进占成都，彻底摧垮了旧日教育局的傲慢体制，成为掌控全川教育话语权的崭新核心！"
 TLB_chongqing_autonomous_zone:0 "重庆教育特区自治权"
 TLB_chongqing_autonomous_zone_desc:0 "通过艰苦的抗争，铜梁巴中在重庆站稳了脚跟，获得了无可争议的区域教育自治地位。"

 # Decisions
 TLB_civil_war_category:0 "四川教育内战与巴川危机"
 TLB_civil_war_category_desc:0 "随着铜梁巴中起义爆发，双方必须在战场上决出四川教育的主导权，亦或走向妥协分治。"
 YDS_tlb_truce_offer:0 "签署巴川停战协定（半成功）"
 YDS_tlb_truce_offer_desc:0 "眼下战局陷入僵局，双方伤亡惨重。盐道街可选择承认铜梁巴中对重庆的实际控制权，换取全川和平。"
 YDS_tlb_truce_not_pending_tt:0 "目前没有正在进行中的停火交涉"
 YDS_tlb_truce_offer_effect_tt:0 "向铜梁巴中递交停战备忘录，等待对方答复。若遭拒绝，20天后可再次发起。"
 TLB_armistice_chongqing:0 "确立重庆教育特区（半成功）"
 TLB_armistice_chongqing_desc:0 "我们的起义已经牢牢控制了重庆。只要逼迫盐道街承认现状，我们就能在重庆建立自主的巴川乐土。"
 TLB_tlb_truce_not_pending_tt:0 "目前没有正在进行中的停战交涉"
 TLB_armistice_chongqing_effect_tt:0 "向盐道街校委会递交停战最后通牒，等待对方答复。若遭拒绝，20天后可再次发起。"

 # Events
 tlb_event.1.t:0 "被压力压垮的学生！"
 tlb_event.1.d:0 "重庆铜梁巴川中学的凌晨四点半，没有书声，只有三声沉闷的坠地声。在密不透风的防盗网宿舍楼与永无止境的周考排名绞肉机里，三名年轻的学生选择从教学楼顶纵身跃下，用最决绝的方式交出了他们人生的最后一张白卷。\n\n事发不到两小时，当地教育局的维稳专班便展现了惊人的行政效率：校门焊死、电话线掐断、知情学生的书包被挨个搜检，连死者课桌里没写完的周记都被当成“违禁品”连夜销毁。在官僚们的统计报表上，这不过是三个需要被迅速抹平的“非正常减员指标”。\n\n然而，巴中学生会硬是靠着藏在鞋底的手抄血书，将真相送出了封锁线。一夜之间，全川高中的走廊都在颤抖。盐道街中学的办公桌上，市教育局要求“严防死守、绝不许学生借题发挥”的红头密函已经摞了三寸高。"
 tlb_event.1.a:0 "按教育局的意思办，谁敢在校内议论直接记过！"
 tlb_event.1.b:0 "多事之秋，校委会装聋作哑，私底下找人把风声压下去……"

 tlb_event.11.t:0 "大字报与地下油印传单"
 tlb_event.11.d:0 "天还没亮透，盐道街中学的梧桐树干和黑板报就被刷满了浆糊。早读的师生惊讶地发现，满校园都贴着白底黑字的《巴川学子泣血告全川同窗书》。课桌抽屉里塞满了连夜用老式蜡纸油印的传单，上面一字一句列着铜梁巴中死难学生的生前账单：每周强制刷卷七十二套、日均睡眠不足四小时、因打瞌睡被扣操行分四十七次。\n\n早读课的铃声响了三遍，走廊上却依然聚满了红着眼眶、捏着传单不肯进教室的学生。保卫处科长已经拎着橡胶警棍和麻袋站在楼道口请示：到底是一把掀翻所有人的课桌进行大搜捕，还是找个体面的台阶把火气泄出去？"
 tlb_event.11.a:0 "保卫处全员出动！翻遍每一个书包，私藏传单者一律停课！"
 tlb_event.11.b:0 "堵不如疏，把周五下午的班会课改成“学业心理减压座谈会”。"

 tlb_event.12.t:0 "黑板上的抗议口号与空课桌"
 tlb_event.12.d:0 "上午第一节数学课，老教师夹着三角板走进高一·六班，却差点以为自己走错了片场——全班五十多张课桌空了一大半，剩下十几个班委手臂上系着白布条，笔直地坐在讲台台阶上一言不发。黑板右上角那块神圣不可侵犯的“距高考还有XX天”倒计时牌，被人用红粉笔画了一个巨大的叉，旁边写着一行力透黑板的狂草：“如果分数的尽头是太平间，我们拒绝发卷！”\n\n隔壁几个重点班也传来了罢课静坐的骚动声。巡堂的教导主任气得浑身发抖，正拿着开除学籍的空白处分单等校委会签字。"
 tlb_event.12.a:0 "反了天了！带头罢课的班干部全部开除学籍，装进档案袋跟一辈子！"
 tlb_event.12.b:0 "让平时人缘好的年轻老师去把学生劝回来，本周联考红黑榜暂停张贴。"

 tlb_event.13.t:0 "铜梁巴中代表团抵蓉"
 tlb_event.13.d:0 "绿皮火车拉响长笛驶入成都火车北站，几十名身穿巴中校服、胸戴白纸花的重庆学生手挽着手走出出站口。他们高举着写满死难同学名字的挽联横幅，一路沿着人民南路向省教育厅和盐道街中学徒步进发。沿途四七九与各区中学的学生纷纷翻墙出校加入游行，“争主权，反不公，不要带血的升学率”的口号声差点把九眼桥的桥洞震塌。\n\n成都市教育局局长急得在电话里破口大骂，勒令盐道街校委会立刻调动校卫队焊死大门，“就算拿水龙管滋，也绝不能让这群重庆来的刺头跨进盐中半步！”"
 tlb_event.13.a:0 "拉起铁丝网配合督导队封锁九眼桥，把巴中代表团强行押回火车站！"
 tlb_event.13.b:0 "顶住教育局的压力，请巴中学生代表进校外招待所喝碗热茶、当面详谈。"

 tlb_event.14.t:0 "校委会讲台上的派系决裂"
 tlb_event.14.d:0 "在烟雾缭绕的紧急校务扩大会议上，往日里斯文客气的老师们彻底撕破了脸皮。行政督导派把搪瓷茶缸砸得山响，咆哮着“今天敢罢课，明天就敢拆教学楼，必须用高压电棍维护百年校规的尊严”；而以一线青年班主任和教研骨干为首的改良派则红着脖子跳上桌子，指着督导派的鼻子大骂他们是“拿学生人命换升学率政绩的冷血屠夫”。\n\n两派人马在会议室里推搡扭打，眼镜片碎了一地，最后齐刷刷把目光投向了坐在主位上的最高决策者。"
 tlb_event.14.a:0 "给脸不要脸！把替学生说话的刺头教师全部停职，发配去守传达室！"
 tlb_event.14.b:0 "够了！校委会承认管理失职，明早在全校大礼堂召开公开听证会！"

 tlb_event.3.t:0 "密报：争主权，反不公！"
 tlb_event.3.d:0 "半夜十二点，一声闷响惊醒了盐道街值班室的保安。一把用圆规改装的土制飞镖死死钉在校长办公室的红漆木门上，镖尾夹着一张从练习本上撕下来的方格纸。纸上没有落款，只有用毛笔饱蘸浓墨写下的六个大字：\n\n“争主权，反不公！”\n\n三天后，忍无可忍的铜梁巴川中学学生自治联合会正式在重庆砸毁教导处、宣布武装起义！他们将成捆的《五年高考三年模拟》点燃成烽火，向全川发出讨伐应试暴政与盐道街学阀的起义檄文。山城重庆一夜变天，数万川东学子扛起拖把与实验室硫酸瓶揭竿而起，四川教育史上最惨烈的成渝校园内战正式爆发！"
 tlb_event.3.a:0 "给校卫队配发防暴盾牌，平定这群重庆叛逆！"
 tlb_event.3.b:0 "去他娘的周考排名！我们现在就倒戈加入铜梁巴中！（切换扮演铜巴起义军）"

 tlb_event.4.t:0 "铜梁巴中的讲台"
 tlb_event.4.d:0 "老校长的红木办公桌已经被愤怒的巴中学生劈成了柴火，起义大旗在重庆教学楼顶猎猎作响。然而，打下教导处容易，怎么坐江山却成了大问题：前排的学霸、后排的体育生、还有趁乱想把小卖部收归公有的各班山头吵成了一锅粥；而在走廊暗处，几位资历深厚的老牌名师正揣着教案冷眼旁观，随时准备出来“主持大局”。\n\n在这场把全重庆高中生绑上战车的疯狂起义里，究竟该把麦克风交到谁的手上？"
 tlb_event.4.a:0 "造反也得背单词！请英语铁娘子汤启梅出山搞军事化封闭管理！"
 tlb_event.4.b:0 "笑着把仗打赢！推举数学鬼才胡朝强老师推行段子手减负新政！"
 tlb_event.4.c:0 "踢开所有老师！高一·六班“五十六朵花”学生公社直接掌权！"

 tlb_event.10.t:0 "起义成功：接管全川"
 tlb_event.10.d:0 "铜梁巴中的起义红旗终于插上了成都九眼桥头与盐道街主教学楼的钟塔！在这场席卷巴蜀大地的青年风暴面前，盐道街苦心经营的绩点帝国与省教育厅的官僚防线像纸糊的一样土崩瓦解。\n\n全川各校的铁丝网被尽数拆除，臭名昭著的周考红黑榜被扔进锦江喂了鱼。从嘉陵江畔到天府广场，属于全川百万中学生的自治新时代，今天正式上课！"
 tlb_event.10.a:0 "从此全川的课桌，由我们自己做主！"

 tlb_event.21.t:0 "盐道街提出成渝停火备忘录"
 tlb_event.21.d:0 "来自成都的密使抵达了铜梁。战事陷入胶着，伤亡与日俱增。盐道街校委会提出方案：承认铜梁巴中对重庆各校及地区的实际控制权与自治地位，双方即刻停火，成渝分治。\n\n我们是否接受这项停战协定？"
 tlb_event.21.a:0 "同意停战，确立重庆特区自治地位"
 tlb_event.21.b:0 "拒绝妥协！誓师进军成都，解放全川！"

 tlb_event.22.t:0 "铜梁巴中拒绝了停火协定！"
 tlb_event.22.d:0 "铜梁巴中自治联合会撕毁了我们送去的停火草案。前线战报显示，起义学生与教师发誓要推翻盐道街应试学阀的高压体制，绝不接受划江而治。\n\n和平谈判破裂，战事将继续进行！"
 tlb_event.22.a:0 "既然他们执迷不悟，那就彻底剿灭叛逆！"

 tlb_event.23.t:0 "铜梁巴中提出停战与重庆自治协定"
 tlb_event.23.d:0 "铜梁巴中起义军已牢牢控制重庆。其谈判代表向校委会递交了停战最后通牒：盐道街必须正式承认重庆教育特区的独立自治地位，双方以龙泉山脉为界划疆停火。\n\n面对山城的武装割据，我们是否接受妥协？"
 tlb_event.23.a:0 "同意停战，承认铜梁巴中对重庆的管辖权"
 tlb_event.23.b:0 "绝不妥协！调动校卫队平定叛乱！"

 tlb_event.24.t:0 "盐道街拒绝了承认重庆特区！"
 tlb_event.24.d:0 "盐道街校委会以极其傲慢的措辞退回了我们的和平倡议，叫嚣着要调集装甲推土机将铜梁巴中的校门彻底推平！\n\n和平的希望破灭了，唯有拿起拖把与钢管战斗到底！"
 tlb_event.24.a:0 "誓与山城共存亡！"

 tlb_event.20.t:0 "停火协定：接管重庆"
 tlb_event.20.d:0 "成渝高速上的粉笔灰与催泪瓦斯渐渐散去，打得精疲力竭的双方终于意识到，再打下去今年大家就只能集体去读技校了。在省教育厅官员哭天抢地的居中调停下，盐道街中学与铜梁巴中起义军在内江服务区签署了历史性的《成渝分治停火备忘录》。\n\n盐道街被迫咽下苦果，正式承认铜梁巴中对整个重庆学区的独立自治管辖权，并承诺永不跨界查寝。虽然没能解放成都的同胞，但重庆崽儿们终究用拳头在山城打出了一片不用凌晨五点起床的自由天空。"
 tlb_event.20.a:0 "守住了嘉陵江，重庆的娃娃们不用再跳楼了。"

 tlb_event.25.t:0 "停火协定：承认重庆教育特区"
 tlb_event.25.d:0 "成渝高速上的粉笔灰与催泪瓦斯渐渐散去，打得精疲力竭的双方终于意识到，再打下去今年大家就只能集体去读技校了。在省教育厅官员哭天抢地的居中调停下，盐道街中学与铜梁巴中起义军在内江服务区签署了历史性的《成渝分治停火备忘录》。\n\n校委会经过彻夜闭门研讨，被迫承认铜梁巴中对重庆各校及地区的独立管辖权与特区自治地位，双方即刻停战撤兵。虽然未能完全平息叛乱，但至少成都本部的教学秩序得以恢复，全川高三学子免于全军覆没的灭顶之灾。"
 tlb_event.25.a:0 "成渝分治，各保一方平安。"

 tlb_event.30.t:0 "失败的斗争"
 tlb_event.30.d:0 "用课桌和床板搭起的街垒，终究没能挡住盐道街正规校卫队与省教育局联军的装甲推土机。随着重庆主教学楼的最后一间广播室被破门而入，轰动全川的铜梁巴中大起义在刺耳的警笛声中宣告覆灭。\n\n重庆的校门重新焊上了生锈的铁锁，幸存的学生们被押回各自的座位，继续默写还没背完的古文。只是在无数张课桌底板的最深处，用圆规尖刻下的“争主权，反不公”六个小字，依然在黑暗中发着烫。"
 tlb_event.30.a:0 "把刺头全部记大过，明天早上六点准时恢复周考。"

 tlb_event.31.t:0 "失败的斗争"
 tlb_event.31.d:0 "防线彻底垮了。督导队沉重的皮靴声在重庆教学楼空旷的走廊里回荡，广播里重新响起了冰冷的眼保健操音乐，我们的讲台终究还是被夺走了。\n\n领头的同学们被戴上手铐押上了大巴车，但没有一个人低头。只要应试绞肉机还在转动一天，课桌底下的刻痕就永远不会被橡皮擦平……"
 tlb_event.31.a:0 "课桌上的刻痕，永不磨灭……"

 tlb_event.99.t:0 "暴风雨后的妥协"
 tlb_event.99.d:0 "盐道街大礼堂的公开听证会上，压抑已久的哭声与雷鸣般的掌声足足持续了两个小时。面对台下上千名眼窝深陷却目光如炬的年轻学子，高高在上的校委会大佬们终于放下了官架子，全体起立向铜梁巴中的死难学生默哀三分钟，并当众撕毁了之前的全套处分决定。\n\n当天下午，校方正式颁布《盐道街减负与学生权益保障十条》，永久废除周考羞辱性红黑榜，晚自习统一提前一小时放学。铜梁巴中代表团在拿到全川教改联署承诺书后体面地踏上了返渝列车。一场险些把整个四川盆地炸上天的学潮火药桶，终于在最后的理智线前被温柔地拆除了引信。"
 tlb_event.99.a:0 "少刷两套卷子天塌不下来，但孩子们得好好活着。"
