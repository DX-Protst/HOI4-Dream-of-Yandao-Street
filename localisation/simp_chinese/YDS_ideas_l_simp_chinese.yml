 YDS_exam_hall_tactics_spirit:0 "考场压迫战术精神"

 YDS_exam_hall_tactics_spirit_desc:0 "将高考考场上的分秒必争与高度冷静融入部队战术体系中，使部队在攻守两端皆展现出极高水准。"

 YDS_break_siege_spirit:0 "破围突击意志"

 YDS_break_siege_spirit_desc:0 "面对复读生大军重重围堵所激发出的决死突围信念，大幅提升部队行军速度与正面突破攻坚能力。"

 YDS_national_exam_hegemony:0 "全国统考霸权神话"

 YDS_national_exam_hegemony_desc:0 "盐道街中学已彻底登顶全国教育秩序之巅，成为天下学子无上朝圣地，举国科研与政治威望达至极盛。"

 YDS_academic_ivory_tower_bias:0 "象牙塔应试偏科"

 YDS_academic_ivory_tower_bias_desc:0 "盐道街中学的学子们深居象牙塔，擅长高等数学逻辑推导与模拟试卷解题。然而在重工业装备、工程车床制造以及现代陆军枪炮军械等实操领域缺乏基本实践经验，科研重心极度偏科。"

