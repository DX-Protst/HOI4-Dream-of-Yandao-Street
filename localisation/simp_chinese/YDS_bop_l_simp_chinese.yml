l_simp_chinese:
 YDS_class_1_bop:0 "高一·一班权力平衡"
 YDS_class_1_bop_desc:0 "高一·一班讲台与课桌之间的隐秘角力。学生自治派主张放开管束、探索自由求知之境；教师指导派则强调纪律威权、通过严格规训换取绝对的高分与秩序。双方的较量将决定盐道街未来的发展走向与领导核心。"
 YDS_student_side:0 "唐思懿（学生自治派）"
 YDS_student_side_desc:0 "唐思懿主张学生应当享有充分的自治权与自由发展的空间，摆脱压抑人性的填鸭式管束与行政说教。然而过度放任的学风也将带来纪律涣散与绩点崩溃的深层隐患。"
 YDS_teacher_side:0 "邓霜（教师指导派）"
 YDS_teacher_side_desc:0 "邓霜老师坚信唯有严明的教学纪律、全方位的晚自习辅导与准军事化的作息管束，才能带领一班学子在残酷的高考与奥赛竞争中脱颖而出，但过度严苛的规训也会窒息青年的自主创新与活力。"
 YDS_student_takeover:0 "学生主权完全确立"
 YDS_student_takeover_desc:0 "唐思懿与自治委员会彻底接管了班级的一切管理权力。教师指导派的权威被连根拔起，学生自治在讲台上彻底确立！"
 YDS_student_dominant:0 "学生自治派主导"
 YDS_student_dominant_desc:0 "学生自治派在班级事务中占据绝对优势。课余自由与探索氛围空前高涨，但散漫的学风也开始对常规教学效率产生不可忽视的负面冲击。"
 YDS_student_leaning:0 "倾向学生自治"
 YDS_student_leaning_desc:0 "唐思懿的主张赢得了多数同学的共鸣，班级决策向自主管理倾斜，教师的日常干涉受到显著限制。"
 YDS_fragile_alliance:0 "脆弱的师生联盟"
 YDS_fragile_alliance_desc:0 "唐思懿的学生自治派与邓霜的教师指导派在此勉强维持均势。双方在讲台与课桌间互相牵制，任何细微的变故都将打破这一脆弱的平衡。"
 YDS_teacher_leaning:0 "倾向教师督导"
 YDS_teacher_leaning_desc:0 "邓霜老师的纪律守则正在被逐步推行，自习纪律与答疑制度收紧，学风逐步回归严谨轨道。"
 YDS_teacher_dominant:0 "教师督导派主导"
 YDS_teacher_dominant_desc:0 "邓霜老师与教师督导团队完全掌控了课堂与自习节奏。铁腕纪律确保了绩点与科研效率的稳定产出，但学生的反抗情绪也在阴影中暗流涌动。"
 YDS_teacher_takeover:0 "教师改良完全接管"
 YDS_teacher_takeover_desc:0 "邓霜老师彻底平息了散漫的学潮，全班转入全封闭军事化轮训。教师指导委员会成为唯一的权力中枢，秩序与分数铸就了无可动摇的铁幕！"
