l_simp_chinese:
 YDC: "盐中校委会"
 YDC_ADJ: "校委会"
 YDC_DEF: "盐道街中学管理委员会"
 YDD: "一班自治联盟"
 YDD_ADJ: "一班"
 YDD_DEF: "一班学生自治联盟"
 YDF: "老校区复兴军"
 YDF_ADJ: "复兴派"
 YDF_DEF: "老校区复兴阵线"
 YDS_abolish_extra_curriculars: "废除课外活动"
 YDS_abolish_extra_curriculars_desc: "所有社团、球赛与文艺汇演全面停办。校园里不再需要欢声笑语，只需要整齐划一的读书声和精准执行的作息表。"
 YDS_abolish_uniforms: "废除校服与发型限制"
 YDS_abolish_uniforms_desc: "告别千篇一律的机械装束，允许学生展示个性与审美自由。多样化与个性的张扬成为了新校园的标号。"
 YDS_advance_coastal_plain: "挥师关东：进军中原与沿海"
 YDS_advance_coastal_plain_desc: "秦岭的晨钟已停，巫山的雾已散。西南三大割据政权或降或亡，盐道街的教研大纲第一次真正跨过了省界。\n然而地图并没有因此安静下来：山河四省的百万卷王正在中原筑墙，华南的双轨考霸在珠江口磨刀，江南的精英们在秦淮河畔研究高等数学。一条横贯东西的‘抗盐防线’已然成形。\n挥师关东，越过平原与长江，把高考霸权大决战推进到中原与沿海的辽阔战场。"
 YDS_alumni_alliance: "校友资本同盟"
 YDS_alumni_alliance_desc: "与社会各界杰出校友企业签署赞助协议，海量校友资金与社会资源源源不断地注入学校后勤。"
 YDS_alumni_network: "暗中联络老校友"
 YDS_alumni_network_desc: "老校区的光荣不容在均等化的泥潭中被抹杀。李刚老师在校外的酒馆与茶楼中秘密奔走，重新唤醒了历届杰出毕业生对母校的情感。庞大的资金、社会声望以及人脉网络正在暗中集结，成为李刚最坚实的后盾。"
 YDS_anime_propaganda: "二次元的大字报"
 YDS_anime_propaganda_desc: "当旧世界的教导守则被撕下，动漫社用绝妙的画笔将严肃的政教指令改造成二次元梗图，瓦解了威权统治的最后威严。"
 YDS_annex_yunnan: "同化各区生源"
 YDS_annex_yunnan_desc: "收服全国各大考霸联盟的精英生源。"
 YDS_autonomous_school: "自由学校的胜利"
 YDS_autonomous_school_desc: "改组的校委会中第一次出现了学生和教师的席位，压抑的纪律被民主的评议所取代。盐道街中学探索出了一条非传统的去中心化自治之路，自由思考的微风吹拂着每一个人的课桌，宣告了属于师生自治的终极胜利。"
 YDS_balanced_curriculum: "素质与应试平衡大纲"
 YDS_balanced_curriculum_desc: "兼顾高考应试与素质拓展，既保留尖子培优，又设立丰富的社团兴趣课程，寻找最平稳的中间道路。"
 YDS_breach_guizhou: "攻破滇黔堡垒"
 YDS_breach_guizhou_desc: "拔除滇黔联考同盟的坚固校园防御。"
 YDS_break_provincial_borders: "打破省界：全国高考霸权扩张"
 YDS_break_provincial_borders_desc: "川渝的教研版图已在盐中治下连成一片：成都的晨读声、重庆的晚自习、昌都山坳里传来的背诵声，被同一份大纲缝合成了完整的霸权。\n但现在，教室的围墙之外还有更辽阔的疆域——秦岭那边的起床铃比我们早一个小时，武汉的压轴题比我们多一道，昆明的联考卷比我们多印了三版。\n是时候撕下那张写着‘各省自研’的旧地图了。打破省界，让盐道街的钟声第一次越过盆地，向全国的高考霸权宣战。"
 YDS_bureau_inspectors: "教育局督导组进驻"
 YDS_bureau_inspectors_desc: "单凭校内的力量已不足以维持这脆弱的统一，蒋光平决定向更高的权力借势。上级教育局的专业督导组正式常驻行政楼。他们冰冷的灰色西装和手中的评估本，成为了笼罩在每个课堂上空无法驱散的阴霾。"
 YDS_bureaucractic_integration: "官僚化一体化"
 YDS_bureaucractic_integration_desc: "当学校大权独揽于校委会之手，下一步便是将所有非标准化的行政漏洞彻底堵死。行政命令将直接穿透班级壁垒，确立教育局的绝对直属指挥权。"
 YDS_campus_asset_inventory: "校园后勤与资产盘点"
 YDS_campus_asset_inventory_desc: "面对风起云涌的校园局势，后勤处率先发起了全校范围内的资产大盘点。无论是废弃的课桌椅、储物箱，还是各班闲置的文具物资，都被重新登记造册，为盐中的后勤建设打下基石。"
 YDS_campus_logistics_gigafactory: "盐中校园后勤联合总社"
 YDS_campus_logistics_gigafactory_desc: "小卖部、文印室、体育库与实验室被深度整合，形成了涵盖物资采购、生产制造、试剂合成与物流配送的庞大后勤联合体。盐道街中学的后勤保障能力正式迈入终极形态。"
 YDS_chemistry_lab_reagents: "化学社试剂与红墨水调制"
 YDS_chemistry_lab_reagents_desc: "化学社的优秀学员们利用实验室设备，开展了试剂与高分子材料的自主调制。无水乙醇、高锰酸钾以及海量的作业批改红墨水自给自足，彻底解除了外部供应链的锁喉威胁。"
 YDS_chengdu_eight_school_joint_exam: "成都市八校大联考"
 YDS_chengdu_eight_school_joint_exam_desc: "为了检验我校学科竞赛的初步成果，我们必须主动发起成都市八校大联考，与七中、石室、树德等成都顶尖中学进行公开较量。"
 YDS_chengdu_school_district_geopolitics: "成都学区地缘政治"
 YDS_chengdu_school_district_geopolitics_desc: "在盐中内战平息后，我们正式面向全成都学区迈出扩张的步伐。与其他顶尖名校的文斗与武斗博弈就此拉开序幕。"
 YDS_class_1_awakening: "一班的觉醒"
 YDS_class_1_awakening_desc: "即使铁幕拉下，一班的烛光也从未熄灭。在唐思懿的带领下，学生们利用课余和晚自习的间隙，在监控的死角自发重组学术讨论会。他们读着未被允许的书，思考着未被拉平的问题，自由的灵魂在这一刻开始觉醒。"
 YDS_class_stratification: "火箭班与流放班"
 YDS_class_stratification_desc: "设立绝对封闭的火箭班与流放班，将顶尖教研力量全量倾斜给极少数精英考霸，彻底放弃后进学生。"
 YDS_club_feudalism: "社团封建割据"
 YDS_club_feudalism_desc: "校委会跑路后，学校陷入了前所未有的权力真空。各大学社团乘虚而入，划界自治，建立起属于自己的学园封建领地。"
 YDS_communitarian_academy: "公社化联合公学"
 YDS_communitarian_academy_desc: "班级与班级的界限被彻底打破，知识共享、资源公有。盐道街中学转变为全员平等的公社化理想公学。"
 YDS_conquer_shanhe: "决战山河"
 YDS_conquer_shanhe_desc: "中原的四百万考生，四个省份的录取名额加起来还不够一座省会分配。山河四省教育联盟就是在这种绝望里长出来的：每一个卷王都是一块砖，砌成了退无可退的绝望壁垒。\n他们守得很稳，稳得像一道不会松动的分数线。但分数线是死的，人是活的——我们带着盐中的大纲与成渝的晨光而来。\n决战中原，击碎这面由苦难浇筑的高墙。\n\n§Y若山河四省教育联盟已被消灭，本国策将自动跳过。§!"
 YDS_cooperate_no_7: "林荫学术共建"
 YDS_cooperate_no_7_desc: "与七中签署林荫协议，结成平等的学术互助同盟，引入七中的高级网课与联考资源，拉升盐中的研究上限。"
 YDS_craft_class_armory: "劳技课粉笔与防暴棍流水线"
 YDS_craft_class_armory_desc: "利用劳技课的木工台、车床以及手工社的3D打印机，后勤处将课余时间转化为流水线生产。标尺、加固木棍与简易防暴盾被成批制造出来，极大地充实了巡逻队的武装储备。"
 YDS_credit_system: "全面学分制改革"
 YDS_credit_system_desc: "引入大学式的自主选修与学分绩点制，学生可以根据个人兴趣自主安排课表与选修科目。"
 YDS_criticize_academic_authorities: "批判学术权威"
 YDS_criticize_academic_authorities_desc: "摒弃名师的特权与傲慢，将教学资源全面向普通班级倾斜。每一个学生都享有同等的受教育与发言权利。"
 YDS_crush_hubei: "踏平华中题海"
 YDS_crush_hubei_desc: "武汉的试卷从江边堆到江心。华中楚天考霸集团坐拥黄冈秘籍与华师一的物理神话，周鹏的集训队把奥赛压轴题当早餐。\n他们是南方考霸中最硬的一块骨头：突破力惊人，火力凶猛，一旦让他们站稳脚跟，整个中原都会沦为他们的卷面。\n亮剑，必须趁他们还没把下一道压轴题印刷完毕。\n\n§Y若华中楚天考霸集团已被消灭，本国策将自动跳过。§!"
 YDS_defy_central_bureau: "抗击中央督导组"
 YDS_defy_central_bureau_desc: "全国的大区逐一平定，地图上只剩下最后一块没有变色的地方：北京。\n最高教育局巡视督导组坐在东三环的大楼里，手里攥着京津录取率的特权与东北工业基地的人脉，红头文件从他们的案头出发，曾管着全国每一间教室的进度表。\n现在，是时候让他们知道：高考的规矩，不再由京城单方面书写。\n\n§Y若最高教育局巡视督导组已被消灭，本国策将自动跳过。§!"
 YDS_discipline_pact: "宁夏街纪律协定"
 YDS_discipline_pact_desc: "与树德中学签署宁夏街纪律协定，共同制定川渝中学生日常行为规范，联手取缔两校周边的不良娱乐场所。"
 YDS_educational_crisis: "教育局的指标压力"
 YDS_educational_crisis_desc: "教育局派驻的行政官僚们只在乎表格上的达标率和整齐划一的汇报。为了在评估中拿到所谓的‘教育均等化示范校’称号，校委会开始用严苛的行政指标压榨一线教师。课后拓展、自由讨论被全面取缔，所有人都在指标的高压下喘不过气来。"
 YDS_equalized_education: "均等化蓝图的胜利"
 YDS_equalized_education_desc: "每一道题都有标准答案，每一个学生都被塑造成一模一样的标准件。蒋光平终于建成了他理想中的均等化乌托邦：没有天才的傲慢，也没有落后者的绝望，只有在绝对的平庸与机械的统一中沉沉睡去的盐道街。"
 YDS_expel_troublemakers: "清除刺头学生"
 YDS_expel_troublemakers_desc: "为了群体的绝对服从，必须将最具反叛精神的害群之马彻底清除。校委会亲自签发的开除决定书贴在布告栏最显眼的位置，这不仅是对被开除学生的羞辱，更是悬在所有幸存学生头顶上的达摩克利斯之剑。"
 YDS_experimental_base: "综合教学改革基地"
 YDS_experimental_base_desc: "盐中正式被评为全省唯一的综合教学改革试点基地，务实温和的改良模式赢得了全校师生的普遍拥护。"
 YDS_free_speech_corners: "设立自由言论角"
 YDS_free_speech_corners_desc: "在主教学楼走廊与校报大厅设立自由辩论与贴大字报的言论角，思想的火花在此激烈碰撞。"
 YDS_general_strike: "讲台上的风"
 YDS_general_strike_desc: "当做题家与发卷人同时选择放下手中的笔，考试制度便在寂静中宣告瓦解。讲台上的风吹散了试卷，也吹散了恐惧。"
 YDS_gpa_darwinism: "绩点达尔文主义"
 YDS_gpa_darwinism_desc: "唯分数论的终极演化。绩点决定一切待遇：从座位挑选、饭堂优待到教辅分配，弱者流泪退场，强者主宰一切。"
 YDS_great_yandao_empire: "大盐道帝国"
 YDS_great_yandao_empire_desc: "兼并周边中小学，建立横跨多个校区与附属学校的庞大教育帝国，老校区复兴主义迎来终极胜利。"
 YDS_handicraft_standardization: "手工社标准化模具与班服"
 YDS_handicraft_standardization_desc: "手工社牵头制定了全校纠察队袖标、班服缝制与后勤工具的统一标准。模具的标准化不仅降低了生产损耗，也让各班级的装备互换效率大幅跃升。"
 YDS_hoard_study_guides: "囤积绝版教辅"
 YDS_hoard_study_guides_desc: "在均等化的大纲之外，是名校选拔的残酷考场。利用校友资助的地下印刷厂，海量的绝密考卷、高端奥数题和名师备考资料在深夜被偷运进校。尖子生们在手电筒的光芒下疯狂刷题，为重回精英巅峰磨砺着利刃。"
 YDS_industrial_bonus: "后勤与基础建设科研提速"
 YDS_interact_with_no_7: "接触成都七中"
 YDS_interact_with_no_7_desc: "与川渝学术霸主成都七中展开正面接触，探索合作共建或渗透竞争的可能性。"
 YDS_interact_with_shishi: "接触石室中学"
 YDS_interact_with_shishi_desc: "与千年名校石室中学取得联系，探讨文史学术同盟与传统教育合作。"
 YDS_interact_with_shude: "接触树德中学"
 YDS_interact_with_shude_desc: "与纪律严密的树德中学展开对话，摸索两校纪律框架与教研交流。"
 YDS_iron_discipline: "铁腕整肃秩序"
 YDS_iron_discipline_desc: "没有规矩，何谈效率？蒋光平校长为了彻底消灭不稳定因素，在全校推行军事化作息与言行管控。纠察队戴上了红色袖章， 走廊里的摄像头被擦得发亮，任何敢于抬头张望的异端杂音都将被铁腕无情粉碎。"
 YDS_labor_education: "全面劳动教育"
 YDS_labor_education_desc: "走出书本的象牙塔，让学生在劳动与实践中锤炼意志。劳技课与校园建设成为了培养集体主义精神的主阵地。"
 YDS_march_east_china: "经略华东"
 YDS_march_east_china_desc: "江南的雨水渗进石阶，也渗进每一间教室。华东学校组织把强基计划做成了玄学，把自主招生做成了暗器——他们的精英们讨论的不是课本，而是高等数学的边界。\n沪苏浙赣闽，五省教研资源像一坛陈年的黄酒，浓得化不开。谁拿下华东，谁就拿到了全国教研皇冠上最重的一颗明珠。\n直取江南，让盐中的大纲在秦淮河畔生根。\n\n§Y若华东学校组织已被消灭，本国策将自动跳过。§!"
 YDS_martial_competition: "武斗角逐"
 YDS_martial_competition_desc: "纪律终究要在斗争中检验。与树德中学在教研杯和社团对抗中展开针锋相对的武斗竞争，用硬实力碾压对手的秩序。"
 YDS_merger_aftermath: "盐中合并的余波"
 YDS_merger_aftermath_desc: "并校的命令只用了一张白纸，但撕裂两个学校的尊严却需要数年。老盐道街的优秀积淀被视作资产强行并入，而合并带来的并非资源互补，而是教学进度的混乱、教师地位的落差以及两个群体间冰冷的敌意。尘埃之下，矛盾正在如铁矿石般凝聚。"
 YDS_militarized_study_rooms: "军事化自习工坊"
 YDS_militarized_study_rooms_desc: "自习室实行高压准军事化管理，纠察队全程监考防作弊，每一分每一秒都被压榨至极限。"
 YDS_national_exam_triumph: "全国高考霸权大一统"
 YDS_national_exam_triumph_desc: "从盐道街中学的走廊到大江南北的每一间教室，最后一张试卷终于盖上了同一枚印章。\n陕南的起床铃、华中的压轴题、云贵的高原联考、山河的绝望壁垒、华南的双轨车票、江南的强基玄学，以及京城印厂里封存多年的标准答案——全部汇入同一部《盐道街高考大纲》。\n盐道街模式，正式成为全国高考唯一最高标准。而这一切的起点，不过是成都一条老街上一所中学的钟声。"
 YDS_national_olympiad_finals: "全国奥赛决赛"
 YDS_national_olympiad_finals_desc: "万众瞩目的全国学科奥林匹克决赛正式开幕！这是我们与全国顶尖高手的终极决战，成败在此一举。赢得金牌的学生将获得清华北大的直接保送名额。"
 YDS_negotiate_with_admin: "与校方谈判"
 YDS_negotiate_with_admin_desc: "长桌两端，是权力的傲慢与尊严的抗争。邓霜与唐思懿带着数千名师生的联署签名，正式与校委会展开面对面的交锋。他们索要的不仅是自习课的归属，更是每一个盐中人决定自己命运的学术自由。"
 YDS_neo_confucian_alliance: "新儒家学术联盟"
 YDS_neo_confucian_alliance_desc: "与石室中学结成学术联盟，主打文史道统与新古典教育，共同举办川渝中学生文史论坛，抗衡应试技术主义。"
 YDS_nihilistic_nirvana: "灰烬中的寂静涅槃"
 YDS_nihilistic_nirvana_desc: "没有高压，也没有升学率。在这片推倒重来的灰烬之上，盐道街迎来了彻底的清零与涅槃。"
 YDS_olympiad_initiative: "奥赛特长班试点"
 YDS_olympiad_initiative_desc: "在内战结束后，我们必须重建学校的学术声望。通过开设数学、物理、化学、生物和信息学五大学科竞赛班，招揽尖端特长生，开启盐道街中学的重返荣光之路。"
 YDS_overhead_corridor_network: "打通架空层雨棚连廊"
 YDS_overhead_corridor_network_desc: "针对成都阴雨绵绵的气候，后勤部门连夜搭建了贯穿主教学楼、实验楼与食堂的风雨连廊。防雨连廊大大缩短了课间10分钟各班级之间的通行时间，物资流动畅通无阻。"
 YDS_pacify_huanan: "平定华南"
 YDS_pacify_huanan_desc: "珠江口的风里带着虾饺的香气和试卷的油墨味。华南考试同盟握着高考与国际部的双轨车票，进可攻高考，退可走AP，实用主义得像一部计算器。\n他们有钱，有后路，有沿海名校集群撑腰——但退路太多的人，往往不会把命押在一场战斗上。\n挥师南下，用一场彻底的胜利告诉他们：在高考霸权面前，没有第二条轨道。\n\n§Y若华南考试同盟已被消灭，本国策将自动跳过。§!"
 YDS_playground_bonfire: "三高五模的末日狂欢"
 YDS_playground_bonfire_desc: "数以万计的模拟卷与错题本在操场中央化为冲天大火，学子们在热浪与纸灰中载歌载舞，亲手烧毁压迫青春的旧秩序。"
 YDS_pragmatic_deal: "师生妥协协议"
 YDS_pragmatic_deal_desc: "一班代表与教员委员会达成务实和解，在保障基本教学秩序的前提下，逐步扩大学生的自治自主权。"
 YDS_print_shop_overdrive: "文印室全天候超频复印"
 YDS_print_shop_overdrive_desc: "地下文印室的复印机24小时轰鸣运转。从绝密教辅真题到各派系的宣传传单，油墨与纸张的高速喷涌不仅保障了全校的教学与宣传消耗，也极大地推动了教学科研效率。"
 YDS_prod_bonus: "标准化后勤生产与模具提速"
 YDS_red_star_committee: "红星自治委员会"
 YDS_red_star_committee_desc: "打破行政官僚的垄断，建立由师生代表共同组成的红星委员会，确立校园大众集体管理的最高权力。"
 YDS_reformist_alliance: "师生联合阵线"
 YDS_reformist_alliance_desc: "学生的抗争不该成为孤军。一班班主任邓霜老师正式选择与学生并肩作战，她用自己数十年的教职声誉和全部的前途做赌注，在行政会议上为学生自治运动作保。师生联合的钢铁防线，自此坚不可摧。"
 YDS_regional_claims: "索回历史校区与教育资源"
 YDS_regional_claims_desc: "凭借强大的校友网络与社会声望，向教育局施压要求划拨周边地块与优质生源指标，重塑老校名威。"
 YDS_republic_of_letters: "自由学术共和国"
 YDS_republic_of_letters_desc: "彻底摒弃灌输式应试教育，建立学术自治、思想包容的学生学术共和国，实现真正的全面素质教育。"
 YDS_restore_old_glory: "重夺老校光荣"
 YDS_restore_old_glory_desc: "镏金的旧牌匾重新高悬，精英主义的凯歌在校园里奏响。这里恢复了唯分数论的残酷淘汰制与尖子班，所有的资源向最顶尖的天才倾斜。虽然平庸者在此流泪退场，但老盐道街中学终于重夺了川渝之巅的无上荣光。"
 YDS_school_canteen_monopoly: "承包校园小卖部与贩卖机"
 YDS_school_canteen_monopoly_desc: "将全校的小卖部、冰镇汽水机与辣条贩卖机统一收归后勤处经营。垄断能量补给线不仅带来了可观的流动资金，也让校方在校园博弈中掌握了坚实的物资话语权。"
 YDS_school_security_force: "校友赞助治安队"
 YDS_school_security_force_desc: "利用校友资助建立专职的校园治安队，铁腕维持校门与周边秩序，清查任何破坏学校名誉的言行。"
 YDS_specialty_funding_boost: "竞赛经费专项拨款"
 YDS_specialty_funding_boost_desc: "学科竞赛不仅需要学生的拼搏，更需要充足的物质保障。从校委会 of 日常预算或校友资助中进行专项拨款，用于添置高端机房设备与高端教辅资料。"
 YDS_sports_league_militia: "荷尔蒙防线"
 YDS_sports_league_militia_desc: "体育生们建立了属于自己的民兵组织，用课桌和器材防线占领操场，以绝对的物理力量捍卫社团联盟的安宁。"
 YDS_sports_room_requisition: "征用体育器材室与扫把库"
 YDS_sports_room_requisition_desc: "体育器材室里的实心球、羽毛球拍以及扫把库里的加厚木柄，在特殊时期就是最好的防卫工具。后勤部正式将其划归治安管制，为后续的校园武装化奠定基础。"
 YDS_standardized_syllabi: "标准化教学大纲"
 YDS_standardized_syllabi_desc: "摒弃名师的‘独创内容’，推行全区唯一的教案与教学进度。在公平的框架下，个性与深刻被视为偏离标准的冗余杂音。"
 YDS_student_parliament: "学生议会政治"
 YDS_student_parliament_desc: "成立由各班选举代表组成的校园学生议会，行政决策必须经过议会公开辩论与投票表决方可生效。"
 YDS_students_unrest: "学生群体的骚动"
 YDS_students_unrest_desc: "当最后一堂自由讨论课被强制改为‘标准大纲复习课’时，一班的学生们明白，他们已经退无可退。桌子下的铅笔摩擦声和传阅的传单，是青春对这堵均等化高墙最直接的宣战。骚动正在全校蔓延，只等一个临界点的到来。"
 YDS_subdue_shaanxi: "横扫陕南考霸"
 YDS_subdue_shaanxi_desc: "秦岭横在面前，像一道三百公里长的天然阅卷线——北边是关中，是西安，是那座凌晨五点就亮灯的衡式军营。\n陕南秦岭考霸同盟把作息表打磨成了兵器：五点的起床铃、二十分钟的跑操、分秒不差的错题复盘。他们的城墙很高，但再高的墙也挡不住一支决心翻山的队伍。\n挥师北进，让关中的清晨重新属于睡够八小时的学子。\n\n§Y若陕南秦岭考霸同盟已被消灭，本国策将自动跳过。§!"
 YDS_subdue_yun_gui: "横扫滇黔"
 YDS_subdue_yun_gui_desc: "云贵高原没有平原，只有雾。滇黔名校联考同盟的营地像水一样流动——今天在昆明的教室里，明天在大理的屋檐下，你永远扑不中他们的影子。\n但流动也意味着没有根基。只要切断他们串联的联考网络，再锋利的游击也会变成散沙。\n扫荡高原，把云贵的民办联考秩序犁成盐中式的整齐田垄。\n\n§Y若滇黔名校联考同盟已被消灭，本国策将自动跳过。§!"
 YDS_subvert_no_7: "渗透七中教研"
 YDS_subvert_no_7_desc: "学术霸主并非不可动摇。利用各种手段渗透七中的教研组，挖走他们的骨干教师，窃取他们内部的机密冲刺试卷。"
 YDS_syndicalist_playground: "辣条与理想国"
 YDS_syndicalist_playground_desc: "食堂与小卖部被社团接管，辣条与可乐成为硬通货，整个学校在欢声笑语中迎来了短暂而纯粹的理想国盛宴。"
 YDS_synth_bonus: "化学试剂与高分子研究突破"
 YDS_teachers_grievances: "教师群体的怨言"
 YDS_teachers_grievances_desc: "优秀的教研成果被强制‘共享拉齐’，原本个性化的教学方法被官僚视作‘偏离大纲’。无数的名师在无意义的填表中耗尽了精力，他们在深夜的红笔批改中，写下的不再是对学生的期望，而是对体制的满腔怨愤。这股怨火，正等待着一个人去点燃。"
 YDS_technocratic_meritocracy: "应试技术主义专政"
 YDS_technocratic_meritocracy_desc: "将提分与刷题打造为分毫不差的工业流水线，老盐道街以技术主义的高姿态重登川渝应试之巅。"
 YDS_the_perfect_standard_school: "完美标准化学校"
 YDS_the_perfect_standard_school_desc: "没有个性，没有杂音，每一个班级都如工厂流水线般精准运行。蒋光平校长终于建成了他理想中的均等化模范校园。"
 YDS_the_tipping_point: "临界点：盐中大危机"
 YDS_the_tipping_point_desc: "妥协的锁链已经被崩断，虚假的和平也彻底粉碎。当双方都无法在讲台前退让半步时，校委会的行政铁腕、一班自治会的自由抗争、李刚派系的精英复兴，将在同一个清晨迎来最终的暴力决口。谁能在此刻主宰盐中的明天？"
 YDS_train_olympiad_elites: "魔鬼集训与名师指导"
 YDS_train_olympiad_elites_desc: "国赛决赛每日临近。我们必须开启高强度的魔鬼式闭门集训，邀请国内顶尖教练进行定向题型指导，将我们的三名主力选手的竞技状态提升至极限。"
 YDS_unify_chengdu_schools: "成都学区终极统一"
 YDS_unify_chengdu_schools_desc: "昔日被迫并校的二流中学，如今已将四七九名校的光环悉数踩在脚下。盐道街中学的金字招牌，正式成为川渝至高无上的教育帝冕。"
 YDS_yandao_street_coup: "发动校内政变"
 YDS_yandao_street_coup_desc: "清晨的操场上，喇叭里响起的不再是机械的广播操音乐，而是久违的老校歌。李刚老师正式宣告校委会的倒台，旧的均等化政策被付之一炬。在校友车队与支持师生的欢呼中，老校区的铁腕重掌盐中大权。"
 YDS_gaokao_war_mobilization: "全国高考战时总动员"
 YDS_gaokao_war_mobilization_desc: "决战号角已经吹响！面对复读生同盟与各省考霸军阀的联合绞杀，全校进入战时应试管制状态。试卷化为弹药，操场化为阵地，动员全体师生迎击全国围剿！"
 YDS_exam_hall_tactics: "考场压迫战术"
 YDS_exam_hall_tactics_desc: "将考场上的计时心理战与压迫感转化为军队的战术素养。分秒必争、先易后难、稳扎稳打，在交锋的前线建立牢不可破的攻防节奏。"
 YDS_break_repeater_siege: "粉碎复读生包围网"
 YDS_break_repeater_siege_desc: "复读生同盟仗着多年题海战术企图将我们扼杀在四川盆地之内。集结精锐突击力量，以绝对的速度与突穿力撕裂包围圈，打通出川考道！"
 YDS_all_front_counterattack: "全线教育大反攻"
 YDS_all_front_counterattack_desc: "从秦岭到长江，从山河四省到江南沿海，向全国各大考区宣告盐道街的全面主权声索。彻底终结地方考霸割据的旧时代！"
 YDS_all_china_educational_hegemony: "全国高考教育帝冕"
 YDS_all_china_educational_hegemony_desc: "六大教育军阀尽数臣服，全国各大考区试卷院皆归盐中统摄。至此，川渝老校区完成了从濒临兼并的二流中学到全国教育唯一真理神话的伟大加冕！"
 YDS_liu_yan_focus_tree: "刘彦极权高压国策树"
 YDS_liu_yan_focus_tree_desc: "上级教育局全面接管后强制启用的高压极权国策树。"
 YDS_ly_absolute_control: "全面绝对管制"
 YDS_ly_absolute_control_desc: "刘彦带着美工刀与红色马克笔接管了校长办公室。墙上的均等化报表被尽数割下，取而代之的是一条笔直贯穿墙面的红线。从即日起，所有非高考科目全面停课，学生每日学习时长不得少于十六小时。偏离红线者，将被彻底抹杀在这台精密校准的升学机器之外。"
 YDS_ly_purge_dissent: "清洗异见师生"
 YDS_ly_purge_dissent_desc: "清洗从语文教研室开始。任何包含‘大纲外情感延伸’的课堂停顿都被定性为严重违规，名师马小容等七名骨干教师相继被迫离职。标准教案不再需要备课，因为复印机与读卡器会精准代替人类的心灵，替这所学校决定何为标准、何为超纲。"
 YDS_ly_extreme_meritocracy: "极端唯成绩论"
 YDS_ly_extreme_meritocracy_desc: "一楼大厅的荣誉榜被改建为巨大的黑板审判屏。每日晨光未曦，退步者的名字便会被红色粉笔画上死刑般的圆圈。体育馆地下室的强化自习室内，无数被红圈宣判的学生在毫无窗户的冷光下机械刷题。在这里，没有个性，只有名次与分数构筑的绝对阶级。"
 YDS_ly_thought_policing: "思想高压监控"
 YDS_ly_thought_policing_desc: "政教处日记审查科全面运转。全校学生每日必须上交详尽的学习日记与课堂纪律观察记录，荧光笔下的每一次审查都在逼迫所有人成为同伴的告密者。在恐惧与麻木中，两千三百名学生学会了用‘无异常’三个字互相掩护，也将真实的思想深深锁进脑海深处。"
 YDS_ly_ban_all_clubs: "彻底取缔一切社团"
 YDS_ly_ban_all_clubs_desc: "刘彦的第四号行政令撕碎了全校四十三所社团的门扉。黑色的封条上涂抹着未干的白漆，文学社的藏书、吉他社的琴弦与天文社的镜片被统统扫入操场中央的铁桶之中。任何不能转化为高考分数的浪漫与热爱，都在‘待处理’的冰冷标签下化为死寂。"
 YDS_ly_monitor_every_class: "全班级全天候监听"
 YDS_ly_monitor_every_class_desc: "第七十六只三百六十度无死角的PTZ云台摄像头钉死在教室后墙正中央。二十倍变焦镜头穿透空气，将学生草稿纸上的每一道笔痕与每一次低头实时上传至教育局云端。在永不闭合的机械之眼注视下，人类的自由意志被逼退至最隐秘的神经褶皱中。"
 YDS_ly_the_perfect_machine: "建造无灵魂的完美机器"
 YDS_ly_the_perfect_machine_desc: "礼堂正中央的巨型屏幕上跳动着百分之九十九点八的本科上线率。鼓掌作为低效行为已被全面废止，取而代之的是两千三百根食指在课桌上同时敲击两下的机械校准声。刘彦微笑着完成了他的杰作——一所没有灵魂、没有波澜、运转如初的完美考试机器。"
