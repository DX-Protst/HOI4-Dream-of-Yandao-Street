 YDS_TRACK_PHYSICS_TT:0 "§Y【物理赛道 · 俄罗宁贝】§!\n- 特点：直觉敏锐，重工业动力与机械化天才。\n§H每周净变化 = 精力×0.6 + 加成 - 阻力§!\n- 加成：全校 GPA > 80 时 §G+0.4%/周§!。\n- 阻力：华中楚天 (HBE) §R-0.35%/周§!（“压制楚天集团”冷却期内清零）。\n- 目标：国决时达到 §G70%§! 即锁定全国物理金牌！"
