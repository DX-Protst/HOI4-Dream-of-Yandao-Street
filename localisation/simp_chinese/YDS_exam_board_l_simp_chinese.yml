 YDS_olympiad_physics_gold_spirit:0 "全国物理奥赛金牌荣誉"
 YDS_olympiad_physics_gold_spirit_desc:0 "在全国学科冬令营中斩获物理金牌，奠定了本校物理学霸权。"
 YDS_olympiad_chem_gold_spirit:0 "全国化学奥赛金牌荣誉"
 YDS_olympiad_chem_gold_spirit_desc:0 "在全国学科冬令营中斩获化学金牌，实验与理论两开花。"
 YDS_olympiad_bio_gold_spirit:0 "全国生物奥赛金牌荣誉"
 YDS_olympiad_bio_gold_spirit_desc:0 "在全国学科冬令营中斩获生物金牌，生物队长不负众望。"
 YDS_olympiad_info_gold_spirit:0 "全国信息学奥赛金牌荣誉"
 YDS_olympiad_info_gold_spirit_desc:0 "在全国学科冬令营中斩获信息学金牌，AC绿光闪烁全国。"
 YDS_ivory_tower_hegemony:0 "【象牙塔技术霸权】"
 YDS_ivory_tower_hegemony_desc:0 "1938年高考放榜，我校独占清北保送与顶尖录取指标，享有无可撼动的象牙塔学术统治地位，科研暴走但陷入群敌围攻！"
 YDS_repeater_coalition_pact:0 "【全国落榜生复读公约】"
 YDS_repeater_coalition_pact_desc:0 "录取名额被切空、录取线被垫高的愤怒促使落榜考生团结在铁链同盟之下。誓死复读，誓破学阀！绝对不可退出！"
 YDS_repeater_underdog_spirit:0 "【哀兵必胜·总复读动员】"
 YDS_repeater_underdog_spirit_desc:0 "面对清北指标被瓜分的现实，全校做题家同仇敌忾，以人海战术踏平关东！"
 yds_national_war.100.t:0 "全国统一高考大放榜"
 yds_national_war.100.d:0 "1938年6月7日清晨，初夏的毒日头把各省招办门口的大红榜晒得直冒烟。\n\n决定全国数百万青年是金榜题名、还是进厂打螺丝的全国统一高考大考，今日清晨正式放榜！三年里，从高一分班时的明争暗斗，到奥赛冲刺时的掉发熬夜，所有被吞进肚里的冷盒饭、所有在自习室咬碎的笔杆子，在这一刻全被阅卷中心的巨型光电读卡机折算成了冷冰冰的数字！\n\n老式针式打印机发出刺耳的滋滋声，各大教育巨头的最终座次，正一寸一寸吐出纸槽……"
 yds_national_war.100.a:0 "深呼吸，看大榜！咱们三年心血是龙是虫，全看这一把了！"
 yds_national_war.100.b:0 "教导主任手抖得拿不住红墨水，大家先去隔壁吃碗肥肠粉压压惊！"
 yds_national_war.101.t:0 "象牙塔霸权：我们挤进全国前三甲！"
 yds_national_war.101.d:0 "大捷！惊天大捷！\n\n当全国总排名的榜单在广播电台念出声来的时候，九眼桥校门外挤满的人群当场沸腾！凭借奥赛积累的巨额加分与五大学科金牌的核心战果，盐道街中学硬生生踩碎了黄冈与衡水的神话，稳稳杀进了全国前三甲！\n\n清华北大的录取喜报跟下暴雪一样漫天乱飞，省教育厅厅长亲自带队敲锣打鼓送来功勋牌匾。我们成功夺取了【象牙塔技术霸权】！在接下来的全国大战中，我们将拥有无可匹敌的生源与科研加成，做题帝国的辉煌在此刻登峰造极！"
 yds_national_war.101.a:0 "清北抢人抢破头，九眼桥今天就是全中国的做题圣殿！"
 yds_national_war.102.t:0 "名落孙山：全国落榜生复读大同盟宣战！"
 yds_national_war.102.d:0 "悲报传来！由于奥赛国策推进迟缓，我们在放榜的总排位中遗憾跌出了第一梯队。\n\n数万名痛失名校名额的高三落榜生，在校门口红黑榜前红了眼眶。绝望转化为冲天的怒火，不知是谁把手中的准考证点燃成火把，愤怒的怒吼响彻云霄：‘既然试卷给不了我们公道，老子们就用大炮去省招办要名额！’\n\n【全国落榜生复读大同盟】在全国各大省城正式起义宣战！数百万不甘向命运低头的复读大军拿起了拖把与钢管，跨江跨省誓死反击。一场更加血腥的教育全面内战，已不可避免地爆发了！"
 yds_national_war.102.a:0 "复读大军揭竿而起！用大炮去招办把失去的名额夺回来！"
