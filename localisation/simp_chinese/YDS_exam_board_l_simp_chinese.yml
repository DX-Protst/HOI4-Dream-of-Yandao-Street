 YDS_TRACK_CHEM_TT:0 "§Y【化学赛道 · 周敬淞】§!\n- 特点：灵性激进，高危化学与军工炸药奇才。\n§H每周净变化 = 精力×0.6 + 加成 - 阻力§!\n- 加成：周敬淞灵性探索 §G+0.2%/周§!；冲刺 §G+15%§! 但作弊风险 §R+10%§!（>25% 时国决有 40% 概率被查）。\n- 阻力：华东探究派 (ECE) §R-0.3%/周§!（“压制华东六校”冷却期内清零）。\n- 目标：国决时达到 §G70%§! 即锁定全国化学金牌！"
