 YDS_TRACK_MATH_TT:0 "§Y【数学赛道 · 赖思翰】§!\n- 特点：数论功底顶尖，火控弹道潜在导师。\n§H每周净变化 = 精力×0.6 + 加成 - 阻力§!\n- 加成：学校稳定度 > 60% 时 §G+0.3%/周§!。\n- 阻力：华东六校 (ECE) §R-0.3%/周§!（“压制华东六校”冷却期内清零）。\n- 目标：国决时达到 §G70%§! 即锁定全国数学金牌与清北保送！"
