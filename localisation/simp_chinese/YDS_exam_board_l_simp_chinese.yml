 YDS_RULES_BOX_DESC:0 "§W1. 金牌保送线：§! 国决（完成国策【全国五大学科奥赛总决赛】）时赛道进度 达到 §G70%§! 即斩获国家金牌（每金 §G+15 积分§!）。\n§W2. 每周结算：§! 每周按“精力×0.6 + 加成 - 对手阻力”推进各赛道，数值即赛道旁显示的“每周”变化。\n§W3. 积分核算：§! 模拟积分 = 金牌×15 + 声望/2 + GPA/5；国决前按当前达到 70% 的赛道数计为“预计金牌”。\n§W4. 高考鸣钟：§! §Y1938年6月7日§! 放榜锁定全国前三甲（Top 3），前三独享【象牙塔霸权】，其余结成【复读大同盟】。"
