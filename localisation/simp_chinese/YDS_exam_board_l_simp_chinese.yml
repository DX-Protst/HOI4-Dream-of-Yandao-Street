 YDS_EXAM_BOARD_ENERGY_TT:0 "§Y【教练精力分配机制】§!\n点击各赛道右侧的 §G[+]§! / §R[-]§! 按钮调配精力：\n- 每投入 1 点精力，该赛道 §G每周 +0.6%§! 进度（每周结算一次，赛道旁实时显示“每周净变化”）。\n- 每条赛道同时承受对手的每周阻力（约 §R-0.3%~-0.35%§!），不派精力的赛道会缓慢下滑。\n- 增派精力消耗 10 政治点，收回精力消耗 5 政治点。\n- 完成国策【培养奥赛精英】可将总精力池上限由 8 点提升至 12 点。"
 YDS_TRACK_MATH_TITLE:0 "§O【数学】§! 赖思翰 vs §RECE华东六校§!"
