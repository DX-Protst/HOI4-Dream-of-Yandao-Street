l_simp_chinese:
 EBS_leader_chen_zhuanyuan:0 "陈专员"
 EBS_leader_chen_zhuanyuan_desc:0 "最高教育督导专署总专员。常年身着笔挺深灰中山装，胸前佩戴金边校徽，大会发言张口闭口“四个回归、狠挤课堂水分”。曾主导“淘汰水课、打造样板金课”运动，表面上道貌岸然清廉威严，实则是京津大院特权阶层保送名单的幕后总庄家。他用精密的行政调令无情挤干了山河四省与关外各地的招生名额，美其名曰“挤水分”，实则将省下来的巨量配额全部暗中截留给京津直辖市的大院子弟，将北京一本录取率做成了外省学子倾尽三代心血也无法撼动的铁壁铜墙。"
 EBS_huai_zonggong:0 "怀总工"
 EBS_huai_zonggong_desc:0 "国家教育数字化工程院院士、赛博考务总工程师。信奉绝对的理性与唯算力论。在他看来，传统的人工命题、人工阅卷乃至人工做题早已充斥着低效与感性杂质。他主张在全国所有考场架设全景高清微表情抓拍摄像头与脑电波生物手环，通过清华附中地下超算中心实时计算全国考生的“忠诚度与升学潜力”。信奉“算法即命运，算力定乾坤”，试图让人类考官全员下岗，用清华附中地下超算中心的一行代码决定万千学子的命运。"
 EBS_zhou_zongdao:0 "周总导"
 EBS_zhou_zongdao_desc:0 "重点中学教学水平五年大评估行动特派总司令，民间闻风丧胆的“洲际导弹”。毕生信奉“以评促建，形式也是生产力”。他的名号所到之处，万校校长与督学战栗失眠。他能在短短五天内发起极限无预警大突击，逼得全国高中戴着防毒面具在泥巴操场上通宵喷刷刺鼻绿漆、在水泥缝里插满麦苗伪造科学基地，更逼得百万师生通宵手抄十年假试卷与假教案。只要迎检专家组进校时展台光鲜夺目，教学的彻底停滞便全在计划之中。"
 EBS_wang_sichang:0 "王司长"
 EBS_wang_sichang_desc:0 "全国校园球类与艺术特长统筹办公室主任、校园足球特许状倒卖王。掌管数百亿专项体卫艺扶持基金，私设数十个秘密洗钱小金库。深谙“特长曲线救国”的暴利法则，把强身健体做成了明码标价的金融衍生品。将国家二级运动员证书与艺术统测免考名额全盘商业化，无论是买卖高价镀金足球门框还是批发武术、射箭、皮划艇降分批文，每一张盖着红印的特长证书都在推高着他的体卫艺商业黑金帝国。"
 EBS_wang_zongguan:0 "王总管"
 EBS_wang_zongguan_desc:0 "全国校园宴饮与后勤统筹总管。官场名言是“早上醒酒听汇报，中午陪餐过流水，晚上会所定调令”。独家垄断各大学区中小学统一配餐特许权，以廉价预制菜料理包与克扣学生营养补贴筑造了庞大的流动资金池。深谙酒桌应酬与政商往来之道，善于用昂贵的茅台宴席与海外账户小金库将地方督学死死捆绑在利益链条上。在他眼里，学校不过是每日稳定消耗数百万份速冻调理包的变现终端。"
 EBS_dongbei_council:0 "东三省名校联合公社"
 EBS_dongbei_council_desc:0 "由吉林长春东北师大附中、黑龙江哈尔滨三中、辽宁本溪高中与辽宁省实验中学联合组成的关外做题家最高权力机关。代表着黑土地上千万在零下三十度冰原与高炉铁水旁苦读的重工业做题学子。他们蔑视北京贵胄的温室骑马作秀，痛恨关外生源配额被残酷剥夺与名师被高薪挖角。在摔碎搪瓷茶缸后，他们将装甲军列改装为重工做题专列，打出“当年奉系能入关，今天东三省考霸也能入主教育部”的旗号誓师入关，誓要踏平教委大楼，焚毁贵族档案，让教育重归铁血平权！"
 EBS_enlightened_teachers:0 "北方开明教师联合会"
 EBS_enlightened_teachers_desc:0 "由北方各省数千名一线特级教师、学科带头人与教研员自发组成的民主维权同盟。他们长期坚守讲台，饱受总署形式主义的大迎检与假台账折腾，痛恨特权阶层对自主招生与保送名额的巧取豪夺。他们主张“把课堂还给学生，把时间还给老师”，呼吁废除一切假大空的督导评估与官僚折腾，推行温和理性的教育改良，让教学真正回归课堂、启发心智与育人本质。"
 EBS_xi_teshi:0 "郗特使"
 EBS_xi_teshi_desc:0 "边疆专项降分通道特派督导使、高原三年挂职直通车使节。衡水流水线模式与边疆通道的双重操盘手，民间流传其至理名言：“你在华北平原卷生卷死，我儿在雪域高原吸氧保送”。精通“跨省空挂学籍”大阵，善于利用对口援建政策漏洞，让嫡系特权子弟高中三年足不出京，高考却能在千里之外的高原享受直降两百分的超低降分通道保送清北，构筑起权贵降维打击普通做题家的隐秘跳板。"
 EBS_haidian_council:0 "海淀贵胄委员会"
 EBS_haidian_council_desc:0 "以海淀六小强校董、顺义大藤派权贵家长联合构成的精英游说寡头集团。他们一手缔造了“海淀早培神话”与疯狂的“鸡娃军备竞赛”，另一手深度垄断了顶级高校自主招生与强基计划的命题人席位。他们刻意将马术、击剑、帆船、高尔夫与南极科考列为综合素质评价的“核心加分项”，以此将缺乏雄厚财力支撑的平民学子彻底排斥在外，为京城名门子弟量身定制特权壁垒。"
