  YDS_bop_student_wall_newspapers:0 "张贴自治进步大字报"
  YDS_bop_student_wall_newspapers_desc:0 "在走廊、黑板报和公告栏张贴唐思懿派系的自治传单，宣扬学生当家作主理念，拉动自治民意。"
  YDS_bop_fund_student_clubs:0 "放权筹办自治社团嘉年华"
  YDS_bop_fund_student_clubs_desc:0 "学生会主导在下午停课举办社团文化节与自由辩论会，以牺牲教学时间为代价拉动自治声势。"
  YDS_bop_mobilize_campus_guard:0 "扩编一班自治纠察队"
  YDS_bop_mobilize_campus_guard_desc:0 "配发步兵装备组建学生民兵巡逻队，维持自习秩序与集会安全，彰显自治武装力量。"
  YDS_bop_boycott_standardized_tests:0 "发动罢考与自治总动员"
  YDS_bop_boycott_standardized_tests_desc:0 "号召全班学生集体交白卷或罢考统一模拟考，彻底否定旧应试体制，向教师派系施加极限施压。"
  YDS_bop_enforce_study_discipline:0 "推行课堂教学秩序守则"
  YDS_bop_enforce_study_discipline_desc:0 "由邓霜老师牵头制定严格的考勤与听课纪律，整肃散漫的学风，确立教师在课堂的主导权威。"
  YDS_bop_academic_remedial_funds:0 "强制推行晚自习名师培优"
  YDS_bop_academic_remedial_funds_desc:0 "邓霜老师协调各科任课教师全面进驻晚自习进行针对性答疑，整肃散漫纪律，快速拉升全班绩点。"
  YDS_bop_recruit_faculty_constabulary:0 "组建教工校纪巡察督导组"
  YDS_bop_recruit_faculty_constabulary_desc:0 "抽调驻校教职员组织纪律督导巡查队，深入走廊和寝室严抓违纪，恢复校园威权秩序。"
  YDS_bop_emergency_curriculum_lockdown:0 "启动全封闭军事化轮训"
  YDS_bop_emergency_curriculum_lockdown_desc:0 "全面转入战时封闭冲刺集训模式，实行准军事化作息管理，以铁的纪律将权力彻底集中至教师导师手中。"
