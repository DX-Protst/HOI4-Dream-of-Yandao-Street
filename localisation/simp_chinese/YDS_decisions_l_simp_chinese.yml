 YDS_TT_LAX_FOCUS:0 "班级平均绩点 §R-10§!\n学生自治度 §G+15§!"
 YDS_TT_MOD_END:0 "本模组的内容到此结束，感谢游玩！"
 YDS_TT_RALLY_STUDENTS:0 "§R扣除 4 点全校绩点§!\n§R学风散漫：学生自治度 +8§!\n§C权力天平向唐思懿倾斜 -8%§!"
 YDS_TT_STRICT_FOCUS:0 "班级平均绩点 §G+15§!\n学生自治度 §R-10§!"
 YDS_TT_TEACHER_CRACKDOWN:0 "§G整肃学风：学生自治度 -8§!\n§G全校平均绩点 +5§!\n§C权力天平向邓霜倾斜 +8%§!"
 YDS_alumni_funds:0 "校友赞助基金"
 YDS_anarchy:0 "无政府"
 YDS_bop_rally_students:0 "组织学生自治集会"
 YDS_bop_rally_students_desc:0 "在班级内发表演讲，牺牲部分整体成绩来换取学生自治权和话语权的提升。"
 YDS_bop_teacher_crackdown:0 "强化教师晚自习巡查"
 YDS_bop_teacher_crackdown_desc:0 "配合邓霜老师的行动，压制散漫的学生风气，这会提高成绩但损害自治权。"
 YDS_bureau_intervention:0 "教育局干预度"
 YDS_class_1_bop_decisions:0 "班级内部权力博弈"
 YDS_class_1_bop_decisions_desc:0 "唐思懿与邓霜老师的博弈已经公开化，必须积极扩大我们的影响力才能在权力天平上占据优势。"
 YDS_contact_alumni:0 "决议：暗中联络老校区校友"
 YDS_contact_alumni_desc:0 "老校区的积淀并非几份红头文件可以抹除。他们在金融街西装革履，在区政府身处要职。用老校区历届名师的联署信重新激起他们的母校归属感，将庞大的社会资金与声誉网络，转化为我们同校长室行政命令分庭抗礼的筹码。"
 YDS_decision_open_day:0 "举办校园开放日"
 YDS_decision_poach_teacher:0 "高薪挖角顶尖名师"
 YDS_decision_spread_rumors:0 "散布教改小道消息"
 YDS_decision_wendou:0 "派遣学生卧底团队 (文斗)"
 YDS_decision_wudou:0 "强行抢夺周边生源 (武斗)"
 YDS_dismiss_deng:0 "辞退 邓云博"
 YDS_dismiss_deng_desc:0 "将邓云博移出当前的竞赛国家队。"
 YDS_dismiss_eluo:0 "辞退 俄罗宁贝"
 YDS_dismiss_eluo_desc:0 "将俄罗宁贝移出当前的竞赛国家队。"
 YDS_dismiss_lai:0 "辞退 赖思翰"
 YDS_dismiss_lai_desc:0 "将赖思翰移出当前的竞赛国家队。"
 YDS_dismiss_tuo:0 "辞退 庹文"
 YDS_dismiss_tuo_desc:0 "将庹文移出当前的竞赛国家队。"
 YDS_dismiss_zhoujs:0 "辞退 周敬淞"
 YDS_dismiss_zhoujs_desc:0 "将周敬淞移出当前的竞赛国家队。"
 YDS_free_route_struggle:0 "一班内部派系斗争"
 YDS_free_route_struggle_desc:0 "§C当前学生派系影响力：§! [?YDS_student_influence|G0]\n§C当前教师派系影响力：§! [?YDS_teacher_influence|G0]\n\n（当某一方影响力突破 80，且大于另一方时，可确立最终路线）"
 YDS_fs_cement_student_rule:0 "彻底确立学生自治"
 YDS_fs_cement_student_rule_desc:0 "学生派系的影响力已经无可阻挡，唐思懿将成为盐道街的新领袖。"
 YDS_fs_cement_teacher_rule:0 "确立教员指导委员会"
 YDS_fs_cement_teacher_rule_desc:0 "教师派系压倒了激进的学生，邓霜将作为稳健的导师领导盐道街。"
 YDS_fs_promote_student:0 "宣传学生自治路线"
 YDS_fs_promote_student_desc:0 "唐思懿主张彻底的学生自治，脱离传统教师的约束。"
 YDS_fs_promote_teacher:0 "宣传教师指导路线"
 YDS_fs_promote_teacher_desc:0 "邓霜主张由进步教师领导学生，防止无政府主义的失控。"
 YDS_gpa_score:0 "全校平均绩点"
 YDS_hoard_books:0 "决议：秘密囤积绝版教辅"
 YDS_hoard_books_desc:0 "在大纲规范的死板练习册之外，是顶尖大学残酷的选拔修罗场。利用地下校友网络提供的小型货车，在深夜的监控死角中，将成箱的‘内部考点预测’和‘奥数原题集’偷运进物理实验室的铁柜中。这些纸页，将成为我们日后打破均等化大锅饭最锋利的武器。"
 YDS_national_war_coring_category:0 "全国教育资源整合与学区核化"
 YDS_national_war_coring_category_desc:0 "割据政权的旗帜已倒，但真正意义上的统一，要从一张课桌的作息表开始。\n在这片新纳入版图的土地上，铃声的节奏、作业的分量、乃至红笔批改的笔迹，都还残留着旧主人的习惯。我们需要用 180 天的时间，把这些习惯一件一件地改造成盐道街的形状。\n决议期满之日，这片土地将真正属于盐中——连同它的清晨、它的讲台、它未来每一场考试的答案。"
 YDS_olympiad_category:0 "全国高考试卷院与五轨奥赛"
 YDS_olympiad_category_desc:0 "全国各大名校在五大学科奥赛中展开殊死拉锯。合理调配有限的教练精力，在1937年冬令营国决前将关键学科推进至 70% 以上以斩获金牌与保送；在1938年高考放榜日决算全国录取指标！"
 YDS_pa_buy_rare_materials:0 "高价收购绝版真题"
 YDS_pa_buy_rare_materials_desc:0 "动用校友基金从黑市和老教师手中高价买下那些早已不再印刷的绝版内部教辅，这将直接转化为极高的教学绩点。\n\n§R执行要求：当前校友赞助基金必须严格大于 10 万§!"
 YDS_pa_hoard_books:0 "搜集绝版奥数题"
 YDS_pa_hoard_books_desc:0 "动用校友基金搜集绝版奥数题库并暗中施压，既能压制教育局的插手干预，又能提振全校备考斗志。\n\n§R执行要求：当前校友赞助基金必须严格大于 10 万§!"
 YDS_pa_sponsor_entertainment:0 "赞助校园娱乐活动"
 YDS_pa_sponsor_entertainment_desc:0 "用金钱堆砌出一些光鲜亮丽的校园歌舞会或娱乐活动。沉迷于这些糖衣炮弹的学生们，自然不会再去搞什么自治运动了。\n\n§R执行要求：当前校友赞助基金至少达到 10 万§!"
 YDS_pa_sponsorship_drive:0 "校友企业拉赞助"
 YDS_pa_sponsorship_drive_desc:0 "向那些曾经从老盐道街毕业并步入社会的成功校友发送倡议书，请求他们为复兴母校捐献资金。"
 YDS_pb_bureau_intervention:0 "深化均等化改革"
 YDS_pb_bureau_intervention_desc:0 "强化教育局的干预，彻底贯彻均等化指示，获得政治点数和稳定度。"
 YDS_pb_dorm_sweep:0 "突击查寝与违禁品搜查"
 YDS_pb_dorm_sweep_desc:0 "利用教育局赋予的行政力量突击扫荡学生宿舍，没收漫画、小说与违规电器。这将极大打击学生们发展自治联盟的热情。\n\n§R执行要求：当前教育局干预度至少达到 6%§!"
 YDS_pb_forced_mock_exam:0 "强制大纲模拟考"
 YDS_pb_forced_mock_exam_desc:0 "在全校范围推行强制性的教育局标准化统测。虽然这能有效拉高绩点水平，但极度高压的环境会让师生们怨声载道。"
 YDS_peacetime_alumni:0 "老校区精英建设"
 YDS_peacetime_alumni_desc:0 "§Y当前校友赞助基金：§! [?YDS_alumni_funds|G0] 万\n§Y当前全校平均绩点：§! [?YDS_gpa_score|C0]\n\n重夺老校区的荣光，用资金砸出升学率。"
 YDS_peacetime_bureau:0 "教育局行政建设"
 YDS_peacetime_bureau_desc:0 "§Y当前教育局干预度：§! [?YDS_bureau_intervention|G0]\n§Y当前全校平均绩点：§! [?YDS_gpa_score|C0]\n\n战后恢复期，必须强化管理以提升学术成绩。"
 YDS_peacetime_student:0 "自治同盟建设"
 YDS_peacetime_student_desc:0 "§Y当前学生自治度：§! [?YDS_student_autonomy|G0]\n§Y当前全校平均绩点：§! [?YDS_gpa_score|C0]\n\n自由的空气是学术繁荣的土壤，但也需要防范无政府主义，同时小心绩点过低导致的后果！"
 YDS_ps_host_club_activities:0 "开展社团活动"
 YDS_ps_host_club_activities_desc:0 "通过开展丰富的社团活动，我们能有效提升学生们的自治热情。"
 YDS_ps_official_clubs:0 "成立官方自治社团"
 YDS_ps_official_clubs_desc:0 "通过消耗大量政治资源将散漫的学生自治活动正规化，纳入学校管理框架。这能有效把无序的狂热转化为校园的稳定力量。\n\n执行要求：当前学生自治度必须严格大于 12"
 YDS_ps_promote_autonomy:0 "推行社团自治"
 YDS_ps_promote_autonomy_desc:0 "消耗自治度来换取更多的民主支持与政治权力。\n\n执行要求：当前学生自治度必须严格大于 8"
 YDS_ps_voluntary_night_study:0 "组织自发晚自习"
 YDS_ps_voluntary_night_study_desc:0 "号召那些有心向学的自治代表们组织互助晚自习。虽然这背离了绝对自由的初衷，但在目前成绩下滑的危机下，这是不得不做出的妥协。\n\n执行要求：当前学生自治度必须严格大于 8"
 YDS_recruit_deng:0 "招募 邓云博 (全能队长)"
 YDS_recruit_deng_desc:0 "【邓云博 - 生物】竞赛队的精神支柱，各项素质极为均衡。无论任何恶劣环境，均有 60% 的平稳成功率，且能提升其他队员的备考信心（稳定发挥）。"
 YDS_recruit_eluo:0 "招募 俄罗宁贝 (物理系黑马)"
 YDS_recruit_eluo_desc:0 "【俄罗宁贝 - 物理】物理基础十分牢固，状态极易受到学校整体 GPA 绩点大环境的影响。如果全校 GPA > 80，她的成功率暴增至 90%；如果 GPA < 60，她的成功率则跌至 10%。"
 YDS_recruit_lai:0 "招募 赖思翰 (数学怪才)"
 YDS_recruit_lai_desc:0 "【赖思翰 - 数学】数学天赋超绝，能轻松解出各种极难压轴题。但极易受到考试压力的波动。当学校稳定度高时，发挥概率极大提升；稳定度低下时则大概率翻车。"
 YDS_recruit_tuo:0 "招募 庹文 (信息学硬核战士)"
 YDS_recruit_tuo_desc:0 "【庹文 - 信息学】代码实力扎实，逻辑严密。她的成功率极其依赖专项资源的积累（在蒋光平线为 GPA > 80，李刚线为校友资金 > 50，唐思懿线为学生自治度 > 70 时，成功率提升至 85%）。"
 YDS_recruit_zhoujs:0 "招募 周敬淞 (灵性博弈型选手)"
 YDS_recruit_zhoujs_desc:0 "【周敬淞 - 化学】脑筋灵活，长于投机，常常能押中题目。具有 80% 的极高胜率，但会增加全校的“作弊暴露风险”。如果学校整体作弊风险偏高，他将有 50% 概率在决赛中被抓并导致全校被取消资格。"
 YDS_school_district_category:0 "成都学区地缘政治"
 YDS_school_district_category_desc:0 "内战已经结束，但成都的教育界暗流涌动。我们必须将目光放向整个学区。"
 YDS_select_communist:0 "决议：效忠蒋光平与校委会"
 YDS_select_communist_desc:0 "将我们的前途寄托于教育局派驻的行政官僚。尽管这无异于向无形的体制低头，但机械的秩序与冰冷的数字才是能平息当下合并风暴的唯一船锚。我们将以校长室的盖章文件为武器，荡平一切妄图抗衡宏大蓝图的杂音。"
 YDS_select_fascist:0 "决议：支持李刚与老校区"
 YDS_select_fascist_desc:0 "当昔日的光荣在平庸的磨合中化为粉尘，唯许铁血与高分能唤醒盐中沉睡的灵魂。我们要将老教师、老毕业生以及不甘沦于凡庸的尖子生集结在老校歌的旗帜下。校长室里蒋校长的办公桌，该换一位真正懂得精英教育的先生了。"
 YDS_student_autonomy:0 "学生自治度"
 YDS_student_elections:0 "决议：推动学生自治委员会选举"
 YDS_student_elections_desc:0 "‘如果台上站着的代表永远是校委会指定的听话班干部，那这所谓的自治便是一场虚妄的木偶戏。’在操场一角的小讲台上，唐思懿的声音传遍了人群。我们要打破指派制，推行公开选举。让第一张雪白的选票，在盐中的课桌间自发传阅。"
 YDS_student_influence:0 "学生派系影响力"
 YDS_teacher_influence:0 "教师派系影响力"
 YDS_teacher_symposium:0 "决议：召开教学改良学术座谈会"
 YDS_teacher_symposium_desc:0 "邓霜老师在教研组的圆桌前，推开了一摞死板的教学台账：‘教师不是算盘上的珠子，我们需要空间来真正设计教学。’把老中青骨干教师聚集在茶杯的雾气中，秘密商讨将走班选课与探究式学习付诸实施的草案。这是学术自由对行政压迫的一场隐秘夺权。"
 YDS_uc_spread_of_freedom:0 "散漫的学风"
 YDS_uc_spread_of_freedom_desc:0 "长期的动荡导致纪律意识极度淡薄，一股散漫的学风正在蔓延。每过 60 天将自动结算一次危机恶化（GPA -5、自治度 +10）。请密切注意决议对冲，并优先推进右侧奥赛国家队国策抢分备考！"
 YDS_universal_crisis:0 "学风危机：自由的蔓延"
 YDS_universal_crisis_desc:0 "班级平均绩点警戒线：<40 | 学生自治度警戒线：>90 | 教育局干预度警戒线：100%\n【核心战略】每60天自动结算一次危机。请使用下方决议组合对冲数值，并★优先推进右侧奥赛国家队国策分支★拿分，备战1938年6月7日全国统一高考大放榜！（注意：极端教务统制、大纲绝对均等派、校务官僚专制路线禁绝奥赛国策，注定在高考决战落败）"
 YDS_wa_attack_order:0 "破釜沉舟"
 YDS_wa_attack_order_desc:0 "为了重夺老校区的荣光，所有师生发动决死冲锋！"
 YDS_wa_black_market_weapons:0 "黑市采购高端教辅"
 YDS_wa_black_market_weapons_cost_tt:0 "校友赞助基金：§R-10 万§!"
 YDS_wa_black_market_weapons_desc:0 "用校友基金在黑市购买被查封的高端教辅，作为我们最锐利的武器。"
 YDS_wa_black_market_weapons_gain_tt:0 "步兵装备 I：§G+250§!"
 YDS_wa_gather_funds:0 "发起校友募捐活动"
 YDS_wa_gather_funds_cost_tt:0 "§Y募捐活动进行中...§!"
 YDS_wa_gather_funds_desc:0 "消耗政治点数联系历届校友，筹集更多的校友基金。"
 YDS_wa_gather_funds_gain_tt:0 "校友赞助基金：§G+15 万§!"
 YDS_wa_hire_mercenaries:0 "重金悬赏突击队"
 YDS_wa_hire_mercenaries_cost_tt:0 "校友赞助基金：§R-25 万§!"
 YDS_wa_hire_mercenaries_desc:0 "重金之下必有勇夫，雇佣校外的闲散社会人员组建突击队。"
 YDS_wa_hire_mercenaries_tt:0 "在首都重庆部署 1 支满编且经验丰富的 §Y重金精锐突击队§!。"
 YDS_wartime_alumni:0 "战时老校区动员"
 YDS_wartime_alumni_desc:0 "§Y当前校友赞助基金：§! [?YDS_alumni_funds|G0] 万\n\n有钱能使鬼推磨，在内战中更是如此。"
 YDS_wartime_bureau:0 "战时行政督导"
 YDS_wartime_bureau_desc:0 "§Y当前教育局干预度：§! [?YDS_bureau_intervention|G0]\n\n随着战争的进行，我们可以呼叫教育局的资源来武装自己。"
 YDS_wartime_student:0 "战时自治同盟"
 YDS_wartime_student_desc:0 "§Y当前学生自治度：§! [?YDS_student_autonomy|G0]\n\n青年学生们的热血是我们在内战中最宝贵的武器。"
 YDS_wb_conscript_militia:0 "征召街道保安"
 YDS_wb_conscript_militia_cost_tt:0 "行政处干预度：§R-20§!"
 YDS_wb_conscript_militia_desc:0 "将周边的街道保安和物业大队编入校委会卫队，填补兵力空缺。"
 YDS_wb_conscript_militia_tt:0 "在首都成都部署 1 支满编且经验丰富的 §Y精锐街道保安大队§!。"
 YDS_wb_defensive_order:0 "下达死守命令"
 YDS_wb_defensive_order_desc:0 "在均等化秩序的感召下，校委会卫队将死守防线，寸土不让。"
 YDS_wb_gather_intervention:0 "请求教育局行政支援"
 YDS_wb_gather_intervention_cost_tt:0 "§Y行政支援筹备中...§!"
 YDS_wb_gather_intervention_desc:0 "消耗政治点数向教育局申诉，以换取更多的行政干预度。"
 YDS_wb_gather_intervention_gain_tt:0 "行政处干预度：§G+15§!"
 YDS_wb_request_weapons:0 "请求教育局调拨物资"
 YDS_wb_request_weapons_cost_tt:0 "行政处干预度：§R-10§!"
 YDS_wb_request_weapons_desc:0 "利用我们在教育局的人脉，申请紧急调拨一批防爆装备和警棍，以镇压叛乱。"
 YDS_wb_request_weapons_gain_tt:0 "步兵装备 I：§G+200§!"
 YDS_ws_confiscate_supplies:0 "没收后勤处物资"
 YDS_ws_confiscate_supplies_cost_tt:0 "学生自治度：§R-15§!"
 YDS_ws_confiscate_supplies_desc:0 "学生们砸开了后勤处的仓库，把囤积的扫把和圆规作为自卫武器。"
 YDS_ws_confiscate_supplies_gain_tt:0 "步兵装备 I：§G+150§!"
 YDS_ws_fervor_order:0 "自由的狂热"
 YDS_ws_fervor_order_desc:0 "不自由毋宁死，学生们在狂热中无视了疲惫和恐惧。"
 YDS_ws_gather_autonomy:0 "召开学生自治大会"
 YDS_ws_gather_autonomy_cost_tt:0 "§Y学生自治代表动员中...§!"
 YDS_ws_gather_autonomy_desc:0 "消耗政治点数在操场集会，提升学生们的自治意识和凝聚力。"
 YDS_ws_gather_autonomy_gain_tt:0 "学生自治度：§G+15§!"
 YDS_ws_student_strike:0 "煽动全校罢课起义"
 YDS_ws_student_strike_cost_tt:0 "学生自治度：§R-30§!"
 YDS_ws_student_strike_desc:0 "用大喇叭在操场煽动更多学生加入罢课，壮大我们的队伍。"
 YDS_ws_student_strike_tt:0 "在首都康定部署 1 支满编且经验丰富的 §Y狂热起义军精锐§!。"
 YDS_yandao_street_decisions:0 "盐中大危机：局势博弈"
 absorb_ece_olympiad_base:0 "华东江南强基竞赛基地兼并（180天）"
 absorb_ece_olympiad_base_desc:0 "江南的精英们把强基计划做成了玄学，把自主招生做成了暗器——如今玄学与暗器都摊在了我们桌上。\n沪苏浙的教研组将在一场又一场茶话会里与我们坦诚相见：微积分的讲法、压轴题的出法、尖子生的培养法，全部汇入同一本盐中教案。\n（耗时180天，期满触发风趣教研结算事件并获得华东9省核心）"
 absorb_hbe_curriculum:0 "华中楚天理科大纲吸收（180天）"
 absorb_hbe_curriculum_desc:0 "黄冈的题库密不透风，华师一的集训队已经作鸟兽散，但那些压箱底的绝版卷还在抽屉深处发着光。\n我们要把楚天的理科心血拆开、消化、再重新组装进盐中的大纲——让洞庭湖与长江之间的每一间教室，都记住同一套解题的步法。\n（耗时180天，期满触发风趣教研结算事件并获得华中4省核心）"
 connect_sne_global_track:0 "华南沿海国际/高分考霸对接（180天）"
 connect_sne_global_track_desc:0 "珠三角的双轨车票还攥在华南考霸手里：左边是高考，右边是AP与IB，他们从不把全部身家押在同一条铁轨上。\n我们把这两条轨道收进同一座车站——保留国际部的视野与实用主义的精明，但终点站必须写上同一个名字：盐道街。\n（耗时180天，期满触发风趣教研结算事件并获得华南6省核心）"
 integrate_sxi_education:0 "陕南关中教研重构（180天）"
 integrate_sxi_education_desc:0 "关中的铃还响在凌晨五点，作息表上的每一个时辰都被旧主人钉死在了军事化的表格里。\n从跑操的节奏到错题本的格式，我们将在秦岭脚下重新丈量时间的刻度，把衡式的钢铁作息改造成盐中式的从容节律。\n（耗时180天，期满触发风趣教研结算事件并获得陕南6省核心）"
 integrate_yne_alliance:0 "滇黔名校联考统筹（180天）"
 integrate_yne_alliance_desc:0 "高原上的民办联考网络像雾一样散去了，但云贵学子的习惯还留在山路上：流动的考场、临时的课桌、山雨欲来时依然亮着的台灯。\n我们将把这套灵活的联考秩序收拢进统一的框架——高原的坚韧保留下来，无根的漂泊到此为止。\n（耗时180天，期满触发风趣教研结算事件并获得滇黔4省核心）"
 reform_shs_exam_factory:0 "山河四省卷王大纲改制（180天）"
 reform_shs_exam_factory_desc:0 "山河四省的高考工厂昼夜不熄：凌晨四点的早读、十七小时的课表、被录取率压弯的脊背——这套机器曾把一整个时代的青春磨成标准件。\n改造从最温柔的地方开始：先让周末属于球场与郊游，再让双休写进课表，最后让试卷的分量降到可以呼吸的程度。\n曾经被苦难磨出老茧的卷王们，将第一次以自愿的姿态，加入我们。\n（耗时180天，期满触发风趣教研结算事件并获得山河6省核心）"
 restructure_central_bureau:0 "最高教育局全域教研归一（180天）"
 restructure_central_bureau_desc:0 "京城印厂的大门已经敞开，那些被锁在铁柜里几十年的标准答案，第一次见到了阳光。\n从阅卷标准的每一分细则，到高考大纲的每一处标点，我们将把督导组垄断的规矩全部摊开来重写——用盐道街的笔，写全国的题。\n（耗时180天，期满触发风趣教研结算事件并获得EBS 11省核心）"
