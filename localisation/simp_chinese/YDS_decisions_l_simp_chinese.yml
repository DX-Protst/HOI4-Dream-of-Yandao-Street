 YDS_TT_CRISIS_BOP_INTRO:0 "散漫的学风危机机制及权力平衡系统已激活。"
 YDS_TT_CRISIS_INTRO:0 "散漫的学风危机机制已激活。请密切关注决议面板中的数值变化。"
 YDS_TT_CRISIS_RESOLVED:0 "彻底解决了学风散漫危机，散漫的学风机制将被永久移除。"
 YDS_TT_OLYMPIAD_FORBIDDEN_EQUALIZED:0 "执政党不能为：极端教务统制、大纲绝对均等派、校务官僚专制（均等化与官僚专制路线禁绝奥赛精英选拔）"
 YDS_TT_FREE_FOCUS:0 "教学绩点 §R-5§!\n学生自治度 §G+15§!"
