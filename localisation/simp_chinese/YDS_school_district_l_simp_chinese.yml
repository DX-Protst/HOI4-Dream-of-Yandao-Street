 YDS_ACADEMIC_PRESTIGE_TEXT:0 "学术声望: [?YDS_academic_prestige|Y0]"
 YDS_ACADEMIC_PRESTIGE_TT:0 "代表学校在成都市的社会认可度，通过完成国策、赢得联考或举办开放日等活动获得。\n\n作为对其他学校发起地缘渗透行动的基础门槛与消耗品。"
 YDS_STUDENT_ATTRACTION_TEXT:0 "生源吸引力: [?YDS_student_attraction|Y0]"
 YDS_STUDENT_ATTRACTION_TT:0 "决定你能从周边区县获取多少优秀的生源。\n通过部分低级决议，或者压制其他名校（使其成为附庸）后持续获得。\n\n向外校发起地缘渗透行动时，除了声望，还需要消耗生源去挤占对方的空间。"
 YDS_NODE_YANDAO_TT:0 "§Y盐道街中学§!\n我们的母校。"
 YDS_NODE_SHISHI_TT:0 "§Y石室中学 (四中)§!\n当前渗透度: [?YDS_infiltration_shishi|G0]/100\n成都历史最悠久的顶级名校。\n\n§H点击进行战略渗透：§!\n需求：\n- 无冷却惩罚：不在“渗透行动冷却期”内\n- 已完成国策：成都学区地缘政治\n- £pol_power 政治点数 §Y> 29§!\n- 学术声望 §Y> 4§!\n- 生源吸引力 §Y> 4§!\n\n效果：\n- £pol_power 政治点数 §R-30§! (若点亮相关国策将降低至 -25 或 -20)\n- 学术声望 §R-5§!\n- 生源吸引力 §R-5§!\n- 渗透度增加 §G+10§! (若点亮相关国策将提升至 +15 或 +20)"
