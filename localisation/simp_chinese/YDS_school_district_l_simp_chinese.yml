 YDS_elite_schools_united:0 "四七九名校集团臣服"
 YDS_elite_schools_united_desc:0 "石室、七中、树德——成都最顶尖的三所名校终于全部纳入盐道街的学区版图。数千年文脉与顶尖理科、铁腕管理在同一个体系下合流，教研成果、组织能力与学术威望同时达到前所未有的高度。"
 YDS_regular_schools_united:0 "外围名校集团臣服"
 YDS_regular_schools_united_desc:0 "成外、实外、川师附中——三所实力强劲的外围名校相继臣服。多语种教学、多元管理经验与稳定的师资输出汇聚成一股不可忽视的教研洪流，为盐道街提供了坚实的外围支撑。"
 YDS_school_resistance_debuff:0 "学区渗透暗流"
 YDS_school_resistance_debuff_desc:0 "对周边名校的渗透行动正在推进，但被渗透学校的师生对此日益警觉。流言四起、校际关系紧张，社会摩擦拖累了整体教研与生产秩序。"
