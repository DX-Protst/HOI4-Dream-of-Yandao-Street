  EBS_affirmative_action_tt:0 "§G签发中央强基批文，为 EBS 强行注入 15 点做题积分，但会降低 5% 稳定度！§!"
  EBS_integrate_national_curriculum_start_tt:0 "§Y开启长达 180 天的全国大同教研同化工程……§!"
