 EBS_manchurian_crisis_category:0 "关外暗流：东三省羁縻与暗涌"
 EBS_manchurian_crisis_category_desc:0 "东北三省的学校表面上顺从应考，暗地里却在重工业车间与暖气管道旁密谋。必须谨慎平衡对关外的压榨与安抚。"
 EBS_exam_board_category:0 "全国高考试卷院与算力干预部"
 EBS_exam_board_category_desc:0 "借助清华附中算力中枢与中央印厂特权，直接影响全境奥赛阻力并对地方考霸积分进行定点削弱。"
 EBS_wartime_reconstruction_category:0 "全国战后考纲统一与核心化"
 EBS_wartime_reconstruction_category_desc:0 "在占领敌对考区后，启动为期180天的深度教研同化，将其彻底转变为督导总署的忠诚核心考区。"
 EBS_launch_surprise_inspection:0 "开展跨省突击督查"
 EBS_launch_surprise_inspection_desc:0 "派出巡视车队无预警进驻地方重点高中，翻检垃圾桶里的偷吃外卖与未备案习题册。"
 EBS_audit_canteen_nutrition:0 "启动全国学生营养餐突击审计"
 EBS_audit_canteen_nutrition_desc:0 "由王总管亲自挂帅，名为清查营养餐克扣，实则是将各校后勤流水全额划入总署小金库。"
 EBS_midnight_lesson_plan_check:0 "假教案全城突击抽检"
 EBS_midnight_lesson_plan_check_desc:0 "在凌晨两点突袭各校教师办公室，查验十年教案的手抄完整度，不合格者通报全省。"
 EBS_allocate_bonus_quota_to_dongbei:0 "向下划拨奥赛加分名额安抚关外"
 EBS_allocate_bonus_quota_to_dongbei_desc:0 "拿出一小部分强基计划与保送特许状施舍给关外名校，暂时平息东北师资与校长的怒火。"
 EBS_crackdown_on_underground_test_groups:0 "突击查封沈阳长春地下自招联考"
 EBS_crackdown_on_underground_test_groups_desc:0 "东三省诸校竟然试图绕过京城统考私自联合命题！派出宪兵队强行没收试卷印版！"
 EBS_bribe_dongbei_principals:0 "调派京城教研编制招抚关外名师"
 EBS_bribe_dongbei_principals_desc:0 "用海淀与西城带编制的特级教师头衔，把东北最顶尖的名师重金挖角进京，抽空东北教研底蕴。"
 EBS_manipulate_informatics_board:0 "调动清华附中机房加码算力封锁"
 EBS_manipulate_informatics_board_desc:0 "提升全国信息学赛道阻力至 -0.5%/周，直接削减对手进度并为总署增加 10 点做题积分！"
 EBS_strike_at_jiangnan_math:0 "突击查抄江南华东六校奥数真题"
 EBS_strike_at_jiangnan_math_desc:0 "没收华东学校组织（ECE）压箱底的竞赛讲义，重挫其天梯排位积分！"
 EBS_strike_at_chutian_physics:0 "突击查禁华中楚天黄冈物理题库"
 EBS_strike_at_chutian_physics_desc:0 "查封华中考霸集团（HBE）的物理实验秘卷，直接削弱其大盘积分！"
 EBS_issue_affirmative_action_directive:0 "签发督导总署强基特惠批文"
 EBS_issue_affirmative_action_directive_desc:0 "以内阁令直接为总署追加 15 点模拟做题积分，但会引发地方考区强烈不公抗议。"
 EBS_integrate_national_curriculum:0 "启动全国考区大纲统一化 (180天)"
 EBS_integrate_national_curriculum_desc:0 "全面推行督导总署全国统一教材大纲，用180天时间消除地方教育割据，将全国各大名校彻底转化为核心领土。"

 # ========================================================
 # EBS CLASSIC NARRATIVE EVENTS (经典大事件长文)
 # ========================================================
 ebs_event.1.t:0 "最高教育局巡视督导专署成立"
 ebs_event.1.d:0 "北京西单教育部大楼的中央礼堂内，头顶悬挂着数十盏沉重的水晶吊灯，将深红色的天鹅绒帷幕映照得如凝固的血浆一般。台下整整齐齐地坐着来自全国北方各省的四百余名教育特派员、直辖市重点中学校长与各学科带头人，人手一本烫金的《督导工作手册》，神色紧绷得如同等待发令枪响的死刑犯。\n\n台上，总专员身着没有一丝褶皱的深灰中山装，左胸端端正正地佩戴着一枚金边校徽。他慢条斯理地拧开紫砂保温杯，抿了一口热茶，随即以沉稳而略带官腔的语调发表题为《回归教育常识、狠挤课堂水分》的主旨报告。讲话中，“四个回归”、“淘汰水课”、“打造样板金课”与“全国一盘棋”等词汇在扩音喇叭里震荡回响，台下适时爆发出雷鸣般的掌声。\n\n然而，散布在后排的外省代表们却各个手心冰凉。所有人都心知肚明，所谓“狠挤水分”，绝非削减课业负担，而是通过最严苛的行政规训，将外省做题家十载寒窗考来的高考录取大盘狠狠挤干，连皮带肉全部补贴给海淀与西城大院的子弟。随着鲜红的督导公章重重砸在首批全国巡视调令上，一场以常识之名行特权之实的应试整风，已如寒潮般席卷大江南北。"
 ebs_event.1.a:0 "传令全署，即日启动全国特级巡视！"

 ebs_event.2.t:0 "周总导的评估风暴：麦田插麦苗"
 ebs_event.2.d:0 "全国中学教学水平五年大评估的风暴，如同一枚呼啸而至的洲际导弹，精准砸中了华北平原上的某所百年示范高中。带队特使那句“以评促改、重在建设、形式也是生产力”的严令尚未降温，县城里的校长已经整整三天两夜不敢合眼。\n\n按照专家组下达的验收标准，学校必须具备“现代化全生态绿色实验基地”与“全覆盖绿色草坪”。然而时值数九寒冬，操场早已被冻成干裂起皮的黄泥沼泽，校门外的试验田更是一片焦枯。为了避免在督察专列进站时被当场摘除全国重点名牌，校长连夜动员了全校七百名师生。刺鼻的劣质军绿油漆在零下十度的夜色中被灌进高压喷枪，操场泥地被一层层刷得反出刺目的荧光绿；校门口十亩荒地上，更是被连夜插满了从隔壁公社菜棚高价收购来的嫩绿麦苗。\n\n次日清晨，当督察特使的黑色轿车缓缓驶入校门，看着寒风中随风摇曳的插秧麦苗与刺目反光的草绿操场，车窗缓缓摇下，带队官员满意地点了点头：“这才是现代化教育应有的蓬勃生机！”"
 ebs_event.2.a:0 "形式也是生产力，批准为全国示范样板！"
 ebs_event.2.b:0 "内部下发通报批评，但达标报告照样归档。"

 ebs_event.3.t:0 "体优生风波：87名国家二级运动员"
 ebs_event.3.d:0 "辽宁本溪的一所超级高中再次将教育部推上了舆论的风口浪尖。一封由退职教师联名签署的绝密举报信直接递到了总署督察室：该校本届高三千余名毕业生中，竟然有整整八十七人整整齐齐地被授予了“国家二级运动员”称号，并顺理成章地在高考档案中锁定了二十分的巨额加分。\n\n更荒诞的是加分项目的分布——本溪地处辽东山区，冬季大雪封门，市内甚至没有一座符合国家标准的室内恒温游泳馆或专业击剑道，但名单上却赫然列着三十名“国家游泳健将”、二十名“高级赛艇舵手”与十余名“现代五项全能高手”。面对总署督察专员的严肃质询，本溪校方昂首挺胸地在办公桌上拍出成堆的比赛获奖证书：“这是老工业基地重型体力劳动熔铸出的做题家体魄，我们学生天生肺活量大，边刷理综卷边跑步，怎么就不算国家运动员？！”\n\n后勤与体卫艺司的官员翻看着那一摞墨迹未干的特长批文，若有所思地合上了文件夹。在金钱与指标的交易链条上，这些薄薄的纸片不仅是分数，更是一笔庞大的横向流转资产。"
 ebs_event.3.a:0 "责令地方纪委突击复核，严厉整肃造假！"
 ebs_event.3.b:0 "由体卫艺处出面指导，将经验‘合规化’吸收。"

 ebs_event.4.t:0 "高原天梯：谁在雪域空挂学籍？"
 ebs_event.4.d:0 "一则带有高清航拍与学籍截图的深喉长文在全国教育论坛上悄然炸开：某所全国著名中学的校长独子，高中三年每天在海淀最顶级的空调实验班里接受国家级特级名师一对一小灶，然而其高考报名的电子档案，却神不知鬼不觉地被归档在了海拔四千余米的雪域高原自治区。\n\n凭借郗特使签署的“边疆干部定向帮扶与民族教育援建”名目，该生在没有任何高原居住记录的前提下，顺利获得了少数民族降分照顾与专属强基通道。四百分出头的折算总分，足以让普通省份的寒门子弟落榜专科，而在这份特殊的名单上，却赫然被拟录取为最高学府的钱学森力学实验班。\n\n面对网络舆情的剧烈发酵，西单大楼新闻发布厅的发言人端起茶杯，神情泰然自若：“这是深入贯彻对口援藏国家战略的生动体现。干部子弟克服低压缺氧、在精神层面扎根边疆，其做出的牺牲与奉献，绝非几张冷冰冰的考卷所能衡量。”"
 ebs_event.4.a:0 "压制网络讨论，以边疆稳定为由低调处理。"

 ebs_dongbei.1.t:0 "⭐️ 东三省学校之问：为何我们不能取而代之？！"
 ebs_dongbei.1.d:0 "吉林长春与黑龙江哈尔滨的夜空下，暴风雪呼啸着撞击着老旧教工大楼的双层木框玻璃。在东北师大附中深处的一间会议室里，来自东三省二十所重点高中的老校长与骨干教师围聚在烧得通红的铸铁取暖炉旁。空气中弥漫着廉价旱烟与浓苦茉莉花茶的味道，桌面上摊开的，是北京督导组刚刚下发的又一份红头调令——东三省本年度清北录取指标再度削减一成，而东北精心培育的六名奥数国家集训队尖子，也被督导组以“全国拔尖人才集中孵化”为由强令无偿调拨进京。\n\n整间屋子死一般沉寂，只有铸铁暖气管发出的沉闷水锤声。忽然，哈尔滨三中的一位老校长猛地把掉瓷的搪瓷茶缸狠狠砸在铁皮桌上，铁皮凹陷的脆响在暴风雪中炸开：\n\n“凭什么？！凭什么海淀那帮骑马击剑的少爷小姐，北京卷考四百分就能大摇大摆跨进名校；咱们黑土地上的孩子在零下三十度的暴雪里早晨五点爬起来刷穿三千套重工卷子，却只能去争高职调剂？！”\n\n“当年奉系大帅能坐着铁甲专列入关进北京，咱东三省几百万冰雪做题家，难道就当不得这教育部的主人？！”\n\n“督导组的龙椅，北京的大官坐得，咱东三省为何不能取而代之？！”\n\n这一句回荡在漫天飞雪中的灵魂诘问，终于将压抑数十年的关外做题家之怒彻底点燃。一场问鼎北京中枢、誓要将全国考卷彻底翻盘的逆袭大谋，在黑土地的熔炉中轰然启动！"
 ebs_dongbei.1.a:0 "关外龙吟，京城将变！"

 ebs_dongbei.2.t:0 "⭐️ 奉系考霸大举入关：接管教育部！"
 ebs_dongbei.2.d:0 "长春与沈阳发出的铁甲列车如巨兽般撞碎了山海关的封锁道口！在东北师大附中、哈尔滨三中与本溪高中的联合帅旗下，数十万身穿深蓝加厚校服的关外重工做题大军与体训生军团，以不可阻挡之势踏破了北京西单教育部大楼的青铜大门！\n\n大厅里，陈专员的保卫纠察队望风而逃，海淀贵胄锁在保险柜里的暗箱保送名册被当众抛下天井，在风中撕碎成漫天白纸。满头白发的老校长踩着破碎的门框大步踏入最高常务会议室，将整整一套经由东北重工业淬火的全国统一理综试卷重重砸在主席台正中央：\n\n“从今天起，全国考纲归黑土地说了算！全国所有考生，不论大院出身还是深山寒门，一律凭卷面红笔分数见真章！”\n\n东三省名校联合公社宣告成立，关东考霸彻底入主中枢，华夏应试秩序自此翻天覆地！"
 ebs_dongbei.2.a:0 "换了人间！重工做题家万岁！"

 ebs_event.20.t:0 "试卷院捷报：清华附中算力彻底封锁信息学！"
 ebs_event.20.d:0 "清华附中地下超算中心发来红头捷报：通过动态调整全国高考试卷院的信息学竞赛命题逻辑与实时阅卷权重，清华附中工程团队已彻底将全国信息学赛道纳入督导总署的绝对算力掌控之中！\n\n外省竞赛强校精心准备的传统贪心与图论算法，在海淀地下机房庞大的矩阵对抗算法面前遭遇全面降维打击。外省选手的解题模型接连超时崩溃，总署在全国八校排位天梯中的领先优势被进一步拉大到不可追赶的量级。"
 ebs_event.20.a:0 "算力即真理，代码重构天下！"

 ebs_event.21.t:0 "1938 盛夏全国教育大战总动员令！"
 ebs_event.21.d:0 "1938年6月7日清晨，随着全国统一高考放榜钟声在天安门广场上空敲响，各大地方考霸集团公然拒绝承认总署签发的全国录取排位大盘，全面引爆了席卷全中国的教育大战！\n\n最高教育督导总署签署一级战备管制动员令！所有巡视专列就地挂装装甲板转化为铁甲军列，所有高三考场就地修筑堑壕转化为战斗要塞。督导铁旅将以铁血纪律踏平一切抗拒中枢大纲的割据学校，用绝对的权威征服全国每一个考区！"
 ebs_event.21.a:0 "为了中央考纲的绝对威严，全线出击！"

 # ========================================================
 # EBS INTERWOVEN CRISIS EVENTS (中枢交织危机链，每事件严格2选项，无领导人名)
 # ========================================================
 ebs_crisis.1.t:0 "西单保密室的撬痕"
 ebs_crisis.1.d:0 "北京西单教育部大楼的深秋清晨，薄雾笼罩着灰蒙蒙的红砖外墙。九楼机要档案处的值班员在换岗时，惊恐地发现那扇加厚防盗铁门的锁芯被某种液压工具强行顶开，门缝间残留着刺鼻的润滑油味。\n\n档案室深处，三只涂着草绿色防锈漆的绝密保险柜门大敞，里面用麻绳捆扎的厚重卷宗不翼而飞。那绝非普通的教学总结，而是过去三年来整个北方应试帝国的命根子：京津大院内定直升清北的自招名单、中小学食堂统一采购预制菜的高达七成流水回扣账本、由突击检查组签发的“麦田插麦苗、泥地刷绿漆”评估造假报告，以及辽宁某重点中学数十名凭空捏造的国家二级运动员审批表。\n\n消息在半小时内震动了整座九层大楼。常务走廊上的脚步声骤然杂乱，几个办公室的厚重红木大门接连反锁。所有人心里都清清楚楚，这些材料一旦顺着邮筒流出西单大街，就足以在北方乃至全中国引爆一场摧毁所有既得利益者的政治地震。保卫科的皮靴在大理石地面上急促回响，中枢的巨头们必须在晨光彻底破晓前，做出第一道封锁决断。"
 ebs_crisis.1.a:0 "调动保卫科封锁西单路口，启动内部特权核查"
 ebs_crisis.1.b:0 "接入中央机房算力矩阵，对整座大楼实施全天候通信监控"

 ebs_crisis.2.t:0 "餐盒里的料理包与虚构的运动员"
 ebs_crisis.2.d:0 "封锁指令终究慢了一步。失窃案发生后的第三天，几份用老式油印机复印的绝密清单便如同雪片般飞向了南方各大报馆与各大高校的传达室。尽管多数报纸在收到总署禁令后选择了撤稿，但字里行间那令人瞠目结舌的黑金流水，已在私下抄送的油印小册子中疯狂传抄。\n\n清单上的内容触目惊心：辽宁本溪某高中本届毕业生中，整整八十七名凭借“羽毛球与现代五项”享受高考二十分加分的国家二级运动员，其训练场证明竟然全部盖着北京某烤鸭店后厨的公章；而分发至北方各中小学校园的所谓“营养午餐”，竟全是保质期长达三百六十五天、常温堆放在生锈集装箱里的高盐重油料理包，其幕后特许代理商正是总务后勤巨头堂兄名下的空壳皮包公司。\n\n远在千里之外的关外黑土地上，长春与哈尔滨的校长们捏着泛黄的油印单据，怒火终于冲破了压抑的冬夜。而在西单大楼内部，后勤总务处紧闭的百叶窗后烟雾弥漫，一张张支票与调令正在被紧急销毁或腾挪，危机正以不可遏制的速度向中枢心脏蔓延。"
 ebs_crisis.2.a:0 "动用总务专项公关小金库，设宴封口并内部消化"
 ebs_crisis.2.b:0 "关外名校发出联名质询电报，公开声讨招生与加分黑幕"

 ebs_crisis.3.t:0 "绿漆操场上的刺鼻晨雾"
 ebs_crisis.3.d:0 "为了强行转移公众对后勤与加分黑料的视线，督导总署紧急启动了新一轮“全国重点高中教学水平特级达标迎检”。突击专家组的黑色轿车车队呼啸着开进华北某示范重点中学，勒令该校必须在七十二小时内达到“百分之百绿色生态校园”的严苛指标。\n\n面对完不成就当场摘牌降级的红头通报，陷入绝境的校方在零下八度的严寒长夜里动员了全校七百名师生。刺鼻的工业军绿油漆被一桶桶倒进高压喷枪，两万平米坑洼泥泞的黄土操场连夜被涂刷得反出刺目欲呕的荧光绿。然而次日清晨，当全校学生在寒风中集合晨跑时，蒸发的高浓度苯与芳香烃有毒溶剂如浓雾般在跑道上方弥漫，两百余名高三考生相继剧烈咳嗽、口吐白沫晕倒在反光的绿漆泥地里，急救车的警笛声撕裂了整座县城的破晓。\n\n荒诞的是，当督导专家组的专车缓缓驶过校门，看着反光的绿地与整齐手抄的十年达标档案，带队的督学不仅在报告上郑重批下“全国生态文明示范样板”的高分，更在内部会议上拍板要求将这套“绿漆经验”向北方万所中学全面铺开推广。师生的鲜血与官僚的狂热撞击在了一起，全国性的学潮抗议已处于爆炸边缘。"
 ebs_crisis.3.a:0 "签发督导战备命令：迎检标准绝不妥协，戴防毒面具继续推行"
 ebs_crisis.3.b:0 "大院出面调解：为中毒重灾区批复自招保送名额和稀泥"

 ebs_crisis.4.t:0 "开往雪域的绝密软卧专列"
 ebs_crisis.4.d:0 "一则来自青海省境内的紧急电报，彻底引爆了全中国做题家最后的理智底线。一列编号绝密、从北京西站直达拉萨的专线客车，在西宁机务段被数百名自发聚集的普通考生与离休教师围堵在铁轨中央。\n\n破门而入的记者与群众在车厢里目睹了足以载入应试史册的奇观：整整五节豪华软卧车厢内，坐满了来自海淀与西城大院的五百名应届考生。这群连一次雪山都没见过的干部子弟，人手一本墨迹未干的高原边疆户籍薄与少数民族加分证明。凭借郗特使签署的“边疆挂职定向援建”红头便条，他们甚至无须在高原落脚一天，只要在拉萨考场签个名字，就能以四百分的超低门槛将全国最高学府的强基名额尽数收入囊中。\n\n围堵专列的群众在雪地里扯出白布横幅，散落一地的特批卧铺车票被冰雪冻结。北方各省与东三省各大高中的广播站里，学生们自发掐断了早自习的听力广播，播音员哽咽而愤怒地宣读着专列名单：“关外黑土地的孩子在零下三十度冰原上刷穿三千套卷子，却比不上大院子弟一张进藏的软卧包厢票！”怒火已经形成海啸，直冲北京中枢。"
 ebs_crisis.4.a:0 "以红头文件严厉通报：边疆对口交流不容非议，违纪追责"
 ebs_crisis.4.b:0 "关外考霸与各地学子联合起草檄文，誓要冲破京津特权壁垒"

 ebs_crisis.5.t:0 "山海关外的长鸣汽笛与西单绝境"
 ebs_crisis.5.d:0 "刺骨的北风卷着鹅毛大雪掠过华北平原，山海关外的铁轨发出剧烈震颤。满载着数千名东三省重点高中校长、骨干教师、重工业校友代表与体训生的三列重型铁甲蒸汽军列，撞碎了地方道口孱弱的阻拦网，拉响震天长笛呼啸冲入关内！\n\n西单教育部大楼已被潮水般的请愿人群层层合围。而在大楼内部，往日威严整洁的红地毯走廊已经变成了派系火拼的防线：保卫科荷枪实弹在楼梯口架设沙袋与铁丝网；机房的技术官僚切断了全楼电梯只给地下服务器供电，喇叭里播放着无休止的代码防暴通告；迎检特使在大厅拉响了尖锐的防空警报，下令实施全员戒严；而后勤财阀的运钞车更是直接顶死了正门大玻璃，保镖们握着金条与支票四处招揽倒戈的卫兵。\n\n大楼外的口号声震天动地，大楼内的电闸火花四溅。权力平衡的天平终于在这一刻倾覆，数周以来的暗流、账本、绿漆、专列与做题家的怒火，全部汇聚在紧闭的顶层会议室门前。命运的决算就在今晚，谁也无法逃脱最终的审判。"
 ebs_crisis.5.a:0 "依托大院纠察与督导宪兵，在西单大街构筑最后行政防线"
 ebs_crisis.5.b:0 "接管广播与数据中枢，呼应外部力量彻底终结旧时代"

 # ========================================================
 # EBS CRISIS ENDINGS (危机终局裁定，严格单选唯一定局)
 # ========================================================
 ebs_ending.1.t:0 "大院深处的红头调令"
 ebs_ending.1.d:0 "晨曦的微光穿透了西单教育部大楼顶层的厚重天鹅绒窗帘。暴乱的喧嚣在保卫科森严的枪刺与数道红头调令面前渐渐平息。\n\n陈专员理了理笔挺的深灰中山装，胸前的金边校徽在朝阳下闪烁着冰冷的光芒。大院的保卫纠察队彻底接管了所有楼层，技术派的服务器被贴上封条，迎检特使与后勤商人被客气却决绝地请出了常务委员会。红木会议桌的正中央，那份被盗掘的绝密自招名单被重新端端正正地盖上了大印——不仅没有撤销，反而追加了直辖市的一本保护比例。\n\n外省的杂音被定性为“个别人员受境外教研思潮煽动的违规闹事”。大院深处的大门再次轰然关闭，官僚的齿轮依旧严丝合缝地运转，在这片古老的土地上，门禁与出身筑起的铜墙铁壁，依然不可撼动。"
 ebs_ending.1.a:0 "大院的规矩，历来不可逾越。"

 ebs_ending.2.t:0 "机房里的最后一行代码"
 ebs_ending.2.d:0 "整座西单大楼的照明灯在午夜时分骤然熄灭，唯有清华附中地下二十米的超算机房爆发出幽蓝色的冷光。\n\n怀总工的工程师团队用液压钳剪断了大楼所有的内线电话，中央处理器的指令直接覆写了总督署的红头印鉴。那些泛黄的档案、推杯换盏的酒局、以及写满人情关系的自招批条，在一行行无情滚动的自执行智能合约面前被全盘作废。\n\n全国每一间教室的微表情摄像头与脑电波监控矩阵被同时激活。高考不再需要人工阅卷，算法将在三微秒内解析出每一位学生的智力模型与社会奉献潜力，并将录取结果直接推送到生物终端上。人类考官的时代结束了，一个由绝对理性与纯粹算力主宰的赛博考务帝国，在服务器的低吼声中冷酷降临。"
 ebs_ending.2.a:0 "代码即命运，算力面前众生平等。"

 ebs_ending.3.t:0 "迎检风暴下的绝对样板"
 ebs_ending.3.d:0 "刺耳的警报声中，周总导身披沾满绿漆的深色风衣大步踏入西单中枢礼堂，身后是数百名手持标尺、红笔与检查夹板的铁血督察宪兵。\n\n大礼堂的大门被铁链锁死。周总导将一份厚达一米的《全国教学整肃特急通报》狠狠拍在讲台上，怒吼声回荡在空旷的大厅：“什么黑金预制菜，什么西藏专列，统统是因为平时的迎检抓得不够紧、材料造得不够全！”\n\n所有反抗的声音被按在椅子上接受合规审查。全国万所中学被即刻宣布进入“永久战备迎检状态”——凡操场绿化不达标者摘牌，凡十年教案不工整者撤职，凡对督导标准有微词者开除。在一片刺鼻的油漆味与整齐划一的手抄教案中，整座国家化作了一座窗明几净、却死寂无声的终极样板房。"
 ebs_ending.3.a:0 "以评促建到底，形式才是最高生产力。"

 ebs_ending.4.t:0 "西单金库的清脆回响"
 ebs_ending.4.d:0 "随着清脆的支票盖印声，西单大楼长达数月的政治僵局在金钱的纯金履带下被彻底碾平。\n\n王司长与王总管端坐在纯金雕花的真皮扶手椅上，两侧是堆叠如山的海外教育基金离岸账册。大院的元老收下了挂名顾问的百万年薪，督察的骨干拿到了校园配餐特许权的干股分红，喧嚣的抗议声在数以亿计的餐补资金与特长生名额拍卖中烟消云散。\n\n全国中小学的食堂彻底被预制菜托拉斯所统领，二级运动员证书被明码标价陈列在阳光大厅的展示柜里。只要资金充裕，清北的录取通知书甚至可以开具正规税务发票。应试的终极秘密被彻底揭开：教育本就是一门生意，而在金钱的王座面前，胜者拥有一切。"
 ebs_ending.4.a:0 "流水不息，金钱统治天下。"

 ebs_ending.5.t:0 "黑土地的军列开进教育部"
 ebs_ending.5.d:0 "伴随着惊天动地的巨响，教育部大楼厚重的铜制大门被一根粗壮的铁轨直接撞开！\n\n来自东北师大附中、哈三中、本溪高中与辽宁省实验中学的校长与骨干，在数十万关外做题大军与体训生方阵的簇拥下踏平了门槛。风雪随之席卷大厅，那份被奉为至宝的京津自招名单在老校长的铁掌下被撕成了碎片，扬向漫天风雪。\n\n“当年张大帅能坐专列入关，今天东三省考霸也一样能坐镇中枢！”老校长昂首走上主席台，将整套冰雪淬火的重工业全国试卷重重砸在讲台上。所有保送与大院特权被一扫而空，全国千万考生在同一张重工试卷面前凭借真才实学厮杀，黑土地的怒火彻底改写了华夏教育的苍穹！"
 ebs_ending.5.a:0 "教育部的主人，今天轮到东三省了！"

 # ========================================================
 # EBS FOCUS COMPLETION NARRATIVE EVENTS (34个国策完成全景长文)
 # ========================================================
 ebs_focus_event.1.t:0 "中枢决裂尘埃落定"
 ebs_focus_event.1.d:0 "西单大楼顶层的烟雾终于散去，被砸裂的红木会议桌与地毯上的碎瓷片已被保洁人员默默清扫干净。往日里互相倾轧、彼此算计的四大巨头，如今只剩下一张崭新的办公调令高悬在大厅正中。\n\n无论胜出的是哪一方，旧时代的脆弱共识都已被彻底埋葬。全国各省驻京办的教育联络员连夜排起了长队，战战兢兢地递交着效忠书与新的指标分配备忘录。这头庞大的官僚巨兽，在完成换血后，正以更加坚决的步伐驶向下一个应试周期。"
 ebs_focus_event.1.a:0 "大局已定，传令全国各省遵照执行。"

 ebs_focus_event.2.t:0 "督导总署全体常务例会开幕"
 ebs_focus_event.2.d:0 "西单中枢礼堂内座无虚席。四百余名来自北方各省的巡视专员身着统一深色制服，人手一本印着烫金大印的会议简报。台上的报告冗长而平稳，从“课堂挤水分”一路念到“教风学风一体化建设”。\n\n然而在长条桌下方，一张张手抄着本省自招保留名额与特级教师指标的折叠便签，却在皮包与公文夹间飞速传递。每个人都在焦急地打听今年京津特区分走的蛋糕究竟有多大。台面上是教育的宏图大计，台面下则是冷酷的利益交割。"
 ebs_focus_event.2.a:0 "官僚的齿轮已然咬合运转。"

 ebs_focus_event.3.t:0 "招待所里的密室分肥妥协"
 ebs_focus_event.3.d:0 "夜深人静，西单教育部大楼对面的第三招待所二楼却灯火通明。厚重的窗帘拉得严严实实，浓烈的烟草味与茅台酒香混杂在闭塞的套房内。几位老资格的督学与海淀名校的校董推杯换盏，言笑晏晏。\n\n几份没有任何正式红头编号的秘密会谈纪要摆在茶几上。在一片酒杯相碰的脆响中，本年度外省各重点高中被悄悄划扣的千分之五自招调剂名额，被轻描淡写地瓜分殆尽，悉数充入京津重点中学的小金库中。"
 ebs_focus_event.3.a:0 "皆大欢喜，除了外省的考生。"

 ebs_focus_event.4.t:0 "稽查处的绝密档案柜"
 ebs_focus_event.4.d:0 "总署稽查科深处的铁皮密码柜前，两名年轻的机要员戴着白手套，正将过去三年内北方各省的违规自招材料、假特长生档案与配餐流水账簿逐一贴上封条。\n\n这些档案详细记录了每一笔灰色赞助费的走向与每一个关系户的调档记录。只要这排密码柜的锁扣依然紧闭，它们就是维系总署内部恐怖平衡的杀手锏；可一旦柜门被撬开，足以在教育界掀起滔天巨浪。"
 ebs_focus_event.4.a:0 "将锁芯封蜡，锁入最深处的密室。"

 ebs_focus_event.5.t:0 "陈专员太上皇威权确立"
 ebs_focus_event.5.d:0 "大院的深红大门再度紧闭。总督学的一票否决权正式被载入总署最高章程，任何试图引入技术治理或市场化运作的激进提议，在总专员那支吸饱红墨水的钢笔下一律被画上了粗暴的红叉。\n\n海淀与西城的老大院子弟重新高枕无忧。官僚家长制的古老法则再次证明了其坚不可摧的生命力：规矩是老一辈定下的，而名额，自然也是大院的子嗣理所应当继承的特产。"
 ebs_focus_event.5.a:0 "大院规矩，万世不易。"

 ebs_focus_event.6.t:0 "京津录取铁壁铜墙铸就"
 ebs_focus_event.6.d:0 "由总署亲自批发的全新全国一本招生调控文件在全国各大名校公告栏上悄然公示。京津特区的一本上线率与重点大学本地保护配额，被以国家强制法令的形式永远锁死在全国平均线的三倍以上。\n\n在黄河两岸与太行山脉的千万做题修罗场里，外省学子必须刷穿上千套模拟卷才能争夺一个专科名额；而城墙之内的大院考生，却能在清晨的林荫道上从容漫步，轻松叩开全国最高学府的朱红大门。"
 ebs_focus_event.6.a:0 "给大院子弟铺就万代金光大道。"

 ebs_focus_event.7.t:0 "海淀幼儿园早培神话"
 ebs_focus_event.7.d:0 "海淀早培班的选拔战线正式推进到了幼儿园小班。四岁半的幼童在厚重的隔音考场内排成方阵，手持触控笔解析着由清北教授量身定制的奥数微积分模型与少儿马术理论。\n\n这套自摇篮直至博士后工作站的封闭式直通循环，将平民阶层的上升通道完全封死在城门之外。素质教育的旗帜迎风飘扬，上面用金线绣满了阶级繁衍的精密代码。"
 ebs_focus_event.7.a:0 "素质教育的终极闭环宣告落成。"

 ebs_focus_event.8.t:0 "不可动摇之特权阶层"
 ebs_focus_event.8.d:0 "西单大楼的门卫换上了荷枪实弹的内卫纠察。任何外省考霸的信访件在门房处便被统一塞入工业碎纸机，化作漫天纸屑。紫禁城角楼下的林荫道上，大院子弟骑着高头大马神采奕奕。\n\n在特权的铁幕之下，分数已不再是通行的货币，血统与编制才是决定命运的唯一符码。官僚贵胄的地位自此坚不可摧，化作一座不可撼动的应试神殿。"
 ebs_focus_event.8.a:0 "铁打的大院，流水的做题家。"

 ebs_focus_event.9.t:0 "清华附中服务器掌权"
 ebs_focus_event.9.d:0 "机房的指示灯在冰冷的机柜间连缀成星海。随着怀总工敲下最后一行回车指令，全国所有的纸质档案调令与人工审批印鉴被全面作废。\n\n一条条自执行智能合约如冰冷的铁链般锁死了各省教育局的数据接口。主考官的人情世故在纯粹的二进制算力面前荡然无存，一个由中央处理器自主决策、秒级裁断天下考生命运的赛博专政时代正式拉开序幕。"
 ebs_focus_event.9.a:0 "唯算力永恒，代码君临天下！"

 ebs_focus_event.10.t:0 "地下超算阵列全功率运转"
 ebs_focus_event.10.d:0 "清华附中操场地表以下二十米，数千台液冷服务器机柜爆发出震颤地底的低吼。在每秒数十万亿次的浮点运算压迫下，全国每一所重点中学上传的做题日志被解析得体无完肤。\n\n外省竞赛团队试图隐藏的独门压轴题解法，在算力中枢的穷举重构下无所遁形。信息学与奥赛的制高点被总署彻底焊死，外省再无夺金可能。"
 ebs_focus_event.10.a:0 "算法已将未来的考题全部穷举完毕。"

 ebs_focus_event.11.t:0 "脑电波与瞳孔微表情追踪全面部署"
 ebs_focus_event.11.d:0 "全国所有考场的课桌边缘，均被焊上了高精度的神经突触生物传感器与瞳孔对焦光圈。\n\n只要考生的眼球游离离开试卷超过零点三秒，红外系统便会发出低频警示并自动扣除信用积分；若脑电波波动出现发呆或焦虑特征，考场天顶的微型无人机将直接盘旋投下黄牌处分。在天网面前，连思维本身也被纳入了作弊审查的范畴。"
 ebs_focus_event.11.a:0 "在绝对的监控下，思想违纪无所遁形。"

 ebs_focus_event.12.t:0 "全国做题家信用算法生效"
 ebs_focus_event.12.d:0 "一套覆盖全体考生的动态信用分模型正式并网运行。早自习朗读分贝不足扣零点五分，错题本订正未按标准三栏排版扣一分，课间未按规定做眼保健操扣二分。\n\n学子们惊恐地发现，自己的一言一行、呼吸与步伐，都被折算成了冰冷的积分流动。唯有毫无个性的绝对做题机器，才能在信用大盘上维持绿色的通行权。"
 ebs_focus_event.12.a:0 "人类考生全面降格为算力节点。"

 ebs_focus_event.13.t:0 "算法即命运：秒下大专通知书"
 ebs_focus_event.13.d:0 "高考阅卷不再需要漫长的盛夏等待。当最后一场考试的交卷电铃响起的刹那，超算机房仅耗费了零点零三秒，便完成了全境数百万份电子试卷的交叉验证与难度对冲。\n\n考生的生物手环剧烈震颤，一行绿莹莹的荧光字迹冷酷地浮现在皮肤表面：“经神经网络判定，您的社会综合算力产出模型与某职业技术学院完美匹配，录取通知书已自动签章生效，终身不可更改。”"
 ebs_focus_event.13.a:0 "赛博命理学的终极闭环。"

 ebs_focus_event.14.t:0 "周总导吹响全境迎检号角"
 ebs_focus_event.14.d:0 "“谁敢在迎检的硬指标上打马虎眼，我就摘了谁的校长乌纱帽！”周总导身披沾满泥浆的皮风衣，在全国电视电话动员大会上把讲台拍得震天价响。\n\n全国数万所重点高中停下了所有的常规授课，整座北方的校园陷入了狂暴的战备迎检狂潮。形式主义的风暴拔地而起，每一块黑板、每一寸台阶，都被拉上了皮尺接受毫米级测量。"
 ebs_focus_event.14.a:0 "以评促改，形式才是最高生产力！"

 ebs_focus_event.15.t:0 "通宵手抄十年假教案"
 ebs_focus_event.15.d:0 "深夜两点的北方各大高中教师办公室里，数十万盏台灯彻夜未熄。特级教师与青年班主任们眼眶熬得血红，右手手指磨出了厚厚的老茧。\n\n桌上堆叠着高逾半米的手抄笔记本，教师们被勒令用不同颜色的圆珠笔、甚至是不同年代的陈旧墨水，通宵补齐过去十年来每一堂课的所谓“即时教学反思”与“家访详录”。材料厚度必须达到三尺，稍微潦草便是一票否决。"
 ebs_focus_event.15.a:0 "字迹整齐划一，这就是国家级示范！"

 ebs_focus_event.16.t:0 "迎检不过当场摘牌免职"
 ebs_focus_event.16.d:0 "突击督察宪兵队荷枪实弹开进某百年重点高中。在检查门卫室值班记录时，带队督学用白手套在登记簿背面抹出了一抹灰尘。\n\n冰冷的免职公文当场贴上了校门照壁，拥有四十年教龄的老校长被当场停职带离，学校降格为合格类薄弱校。万校肃然战栗，北方再无一人敢对迎检标准提出哪怕半句质疑。"
 ebs_focus_event.16.a:0 "重在建设，狠在肃反！"

 ebs_focus_event.17.t:0 "空无一人的绝对样板校"
 ebs_focus_event.17.d:0 "操场是刺目的军绿油漆，试验田里连夜插满带露水的嫩麦苗，档案室里的假材料从地面一直码到天花板。全校三千名学生被勒令集体闭门反锁在宿舍内，不准发出半点声响。\n\n当督察专车在空无一人的校园里转了一圈后，带队特使满意地在考评表上给出了全项满分的评语。一座完美无瑕、却连一个活人都不存在的荒诞示范帝国，在形式主义的顶峰悄然屹立。"
 ebs_focus_event.17.a:0 "完美而荒诞的极权样板。"

 ebs_focus_event.18.t:0 "王总管后勤商会登基"
 ebs_focus_event.18.d:0 "王司长与王总管并肩步入西单大楼最高会议室，身后跟着数十名西装革履的海外离岸基金顾问与后勤配餐财阀代表。大楼一层的传达室被改造成了金碧辉煌的商务洽谈大堂。\n\n每天数以亿计的校园配餐现金流与特长加分赞助费如瀑布般冲入特许账户。红头文件变成了特许经营合同，应试教育在资本的加持下被剥离了一切虚伪的面纱，化作最赤裸而高效的提款机器。"
 ebs_focus_event.18.a:0 "金钱开道，流水永存！"

 ebs_focus_event.19.t:0 "保质期一年的预制菜全面进驻"
 ebs_focus_event.19.d:0 "全国所有中小学的明火现炒食堂在三日内被全部强行封停拆除。一辆辆贴着统一特许标签的冷链集装箱车开入校园，卸下了数以亿计保质期长达三百六十五天的预制料理包。\n\n学生们在食堂里默默咀嚼着胶质般的料理肉块与重油重盐的调味汁，而后勤托拉斯的净利润率在当季财报上暴涨了整整七成。后勤巨头在庆功宴上开怀大笑：“吃不坏肚子，还能多收餐费，这就是现代物流的胜利！”"
 ebs_focus_event.19.a:0 "安全、标准、高利润！"

 ebs_focus_event.20.t:0 "离岸教育小金库秘密扩张"
 ebs_focus_event.20.d:0 "通过开曼群岛与苏黎世的数十家离岸空壳信托基金，数以十亿计的加分咨询服务费与校服采购回扣被悄然洗出境外。\n\n地中海沿岸的私人码头里停满了总署要员家眷名下的游艇，高尔夫球场上回荡着关于下半学期特长生指标拍卖的私密报价。金钱与权力的勾兑，在这里构筑起永不沉没的避风港。"
 ebs_focus_event.20.a:0 "资本无国界，加分亦有道。"

 ebs_focus_event.21.t:0 "黑金财阀掌舵全国教育"
 ebs_focus_event.21.d:0 "西单大楼底层设立了公开的“教育发展战略咨询大厅”。清北保送名额标价一千万，重点高中实验班录取资格五百万，甚至挂科与留级处分也可以通过现场认购后勤基金免除。\n\n手持大额支票的富商与豪绅在柜台前排起长龙，礼仪小姐面带微笑地开具着盖有总署公章的正规发票。只要资金到位，哪怕白卷亦能铸就栋梁！"
 ebs_focus_event.21.a:0 "金钱面前，人人平等买卷！"

 ebs_focus_event.22.t:0 "东北师大附中重工考纲母机秘密运转"
 ebs_focus_event.22.d:0 "长春自由大路的红砖教研楼深处，东北师大附中的特级教师天团已连续奋战了四十个昼夜。黑板上写满了关于重型机械传动、流体力学极限方程与唯物辩证法压轴大题。\n\n这台被称为“关东教研母机”的命题核心，剔除了所有大院子弟赖以自夸的击剑马术冷门八股，将试卷铸造得如同坦克装甲般厚重坚韧。黑土地的真才实学，正在这里淬火成锋利的冰雪利刃。"
 ebs_focus_event.22.a:0 "做题长子，铸造真理之剑！"

 ebs_focus_event.23.t:0 "关外四名校签下做题家血盟"
 ebs_focus_event.23.d:0 "沈阳浑河岸边的一间老式重工业厂房内，来自东北师大附中、哈尔滨三中、本溪高中与辽宁省实验中学的校长们在冰冷的铁桌旁紧紧握手。一份用毛笔写在老式蓝图图纸背面的《关外考霸铁血同盟条约》被共同盖上了钢印。\n\n东三省数百万重工子弟与冰雪做题家被全面动员，铁血同盟宣告成立。整座关外的教育资源连成铁板一块，向着山海关投去了复仇的目光。"
 ebs_focus_event.23.a:0 "誓与京津大院决一死战！"

 ebs_focus_event.24.t:0 "奉系考霸专列破关呼啸入京"
 ebs_focus_event.24.d:0 "刺耳的汽笛声如防空警报般撕裂了山海关的寒雾！满载着数万名关外做题尖子、体训生纠察队与上千箱重工教辅试卷的铁甲专列，以排山倒海之势撞飞了关卡上的阻车木桩。\n\n列车沿着京山铁路线呼啸前行，车窗上挂满了白底黑字的醒目横幅：“誓夺命题大权，还我黑土名额！”关外大军势不可挡，直插京师心脏！"
 ebs_focus_event.24.a:0 "专列破关，天地换色！"

 ebs_focus_event.25.t:0 "全国统一重工卷横空出世"
 ebs_focus_event.25.d:0 "西单教育部大楼顶层换上了黑土地名校的战旗。自招加分、边疆空挂、早培特权在红墨水的批注下一律作废，一套厚达十六页、涵盖重工业物理与极限代数的《全国统一重工试卷》被派发至全国每一间考场。\n\n考卷扉页上印着一行粗黑的大字：“分数面前，众生平等；唯有实学，方为真理！”黑土地的怒火彻底洗涤了应试的泥垢，重铸了教育平权的钢铁丰碑！"
 ebs_focus_event.25.a:0 "黑土地重铸华夏教育荣光！"

 ebs_focus_event.26.t:0 "绝密试卷印厂彻底封锁"
 ebs_focus_event.26.d:0 "北京郊区密林深处的高考试卷特种印厂四周，拉起了两道通电铁丝网与机枪掩体。重装宪兵日夜巡逻，任何进出印厂的工人和技术员均须接受防窃听防夹带检查。\n\n大型印刷机日夜轰鸣，刺鼻的特种油墨香气弥漫在厂区上空。全国千万做题家的命运被压缩在这一张张薄薄的试卷铅版之中，掌控了印厂，便掌控了整个帝国的神经中枢。"
 ebs_focus_event.26.a:0 "掌控试卷印厂者，号令天下！"

 ebs_focus_event.27.t:0 "突击查抄江南华东竞赛题库"
 ebs_focus_event.27.d:0 "由督导特派员率领的查抄车队以迅雷不及掩耳之势扑向江浙沪各大名校。在华东学校组织（ECE）的核心集训营内，专家组以“涉嫌超纲内卷与违规培训”为由，强行贴封了其压箱底的全国数学奥赛真题库与密卷讲义。\n\n一箱箱珍贵的数理教案被装上军用卡车拉往北京，华东考霸在全国排位天梯上的技术壁垒遭遇沉重一击，总署在天梯大盘上的积分再度跃升。"
 ebs_focus_event.27.a:0 "重挫南方考霸的技术壁垒！"

 ebs_focus_event.28.t:0 "全国试卷院难度曲线暗箱调控"
 ebs_focus_event.28.d:0 "全国高考试卷院地下机房内，命题组的专家们正在微调下一季度全真模拟考的难度参数。通过在压轴题中暗插京津重点中学常练的变式模型，同时在南方擅长的题型中设置超纲陷阱，两地的平均分被巧妙地拉开了整整四十分的鸿沟。\n\n地方省份的校长们百思不得其解，而总署在全国模拟联考天梯中的霸主地位，已在精密的数据调控下固若金汤。"
 ebs_focus_event.28.a:0 "大盘走势尽在掌控之中。"

 ebs_focus_event.29.t:0 "锁定全国前三甲象牙塔神位"
 ebs_focus_event.29.d:0 "放榜前夕，全国高考试卷院排位天梯大屏幕上，督导总署的积分进度条以无可争议的绝对优势突破了关键阈值，提前锁定了全国前三甲的孤傲象牙塔神位！\n\n无论是川渝的盐中同盟，还是两湖的黄冈题库，在总署庞大的体制与资源压制下，皆无法动摇中枢的王座。这一场盛夏大考尚未开锣，胜负却早已在西单的红头文件里注定。"
 ebs_focus_event.29.a:0 "象牙塔霸权，舍我其谁！"

 ebs_focus_event.30.t:0 "机械化督导组接管山河四省"
 ebs_focus_event.30.d:0 "数十支机械化督导突击支队沿着京汉铁路线南下，大举进驻晋冀鲁豫高考修罗场。衡水与毛坦厂的超级寄宿学校被全盘改组接管，军事化的作息与洗脑口号被无缝并入总署的战时动员体制。\n\n山河四省千万精锐做题大军放下了对地方校领导的忠诚，排成望不到边际的做题军团，整装待发接受总署的最高调遣。"
 ebs_focus_event.30.a:0 "华北修罗场全盘收归中枢统率！"

 ebs_focus_event.31.t:0 "华中楚天黄冈题库全盘抄没"
 ebs_focus_event.31.d:0 "大军强渡长江，武汉教育要塞在连日围攻下轰然开门。华师一附中与黄冈中学传承百年的绝密物理实验题库与独门教案，被一箱箱贴上督导总署的封条，装上重型军列直发北京。\n\n楚天考霸的傲骨在督导铁旅面前折断，两湖名师悉数登报声明拥护全国统一考纲，华中考区自此彻底平定。"
 ebs_focus_event.31.a:0 "南方题库尽归总署囊中！"

 ebs_focus_event.32.t:0 "粉碎华东华南自主命题联盟"
 ebs_focus_event.32.d:0 "江南的自主命题特权土崩瓦解，岭南私立国际部的贵族壁垒在督导宪兵的战靴下粉碎。从黄浦江畔的百年名校到珠江三角洲的国际实验园区，全线降下了地方考纲的旗帜。\n\n整齐划一的全国统一教材与作息时间表被强推至每一所学校，江南文人墨客的自主骄傲，在中央集权的铁律面前烟消云散。"
 ebs_focus_event.32.a:0 "江南诸侯，悉数平定归附！"

 ebs_focus_event.33.t:0 "兵临蓉城锦江：合围盐道街"
 ebs_focus_event.33.d:0 "督导铁旅大军兵临成都锦江两岸，重重合围了盐道街中学的最后校区。高倍望远镜中，老校区的红砖楼与新校区的试验田清晰可见，大喇叭广播里的劝降通告昼夜不息。\n\n川渝教育独立的最后阵地已退无可退。在这片孕育了无数反抗传奇的校园门前，决定全中国应试文明未来命运的总决战，已在刺刀与粉笔之间全面引爆！"
 ebs_focus_event.33.a:0 "发起总攻，拿下盐道街！"

 ebs_focus_event.34.t:0 "太和殿颁布中央统考万世圣典"
 ebs_focus_event.34.d:0 "全国万校归一，四海九州宾服！在紫禁城太和殿前的万仞白石广场上，来自全国各省各学区的数千名校长神情肃穆地跪拜在中轴线两侧。\n\n总署向全天下庄严颁发《大一统全国统一高考万世圣典》，正式确立了为期一百八十天的全国大同核心化规训体制。从雪域高原到南海之滨，千万学子面对同一张试卷、同一种大纲，华夏应试帝国迎来了它最辉煌、亦最森严的永恒纪元！"
 ebs_focus_event.34.a:0 "华夏教育，千秋一统！"

