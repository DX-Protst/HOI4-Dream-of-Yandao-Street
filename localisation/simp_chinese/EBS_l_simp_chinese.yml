l_simp_chinese:
 # ========================================================
 # EBS IDEOLOGY PARTIES (十大意识形态党派全名与简称)
 # ========================================================
 EBS_paternal_autocrat_party:0 "巡视督导总署"
 EBS_paternal_autocrat_party_long:0 "教育部派驻最高教育巡视督导专员公署"
 EBS_totalist_party:0 "铁血督察特使处"
 EBS_totalist_party_long:0 "教育部最高铁腕督导特派行动署"
 EBS_authoritarian_democrat_party:0 "赛博考务技术总署"
 EBS_authoritarian_democrat_party_long:0 "国家教育数字化与AI天网监考总工程师公署"
 EBS_social_conservative_party:0 "京津学阀建制派"
 EBS_social_conservative_party_long:0 "京津大院特权与校董联合会"
 EBS_social_liberal_party:0 "开放学术评议同盟"
 EBS_social_liberal_party_long:0 "多元评价与顺义国际部教育同盟"
 EBS_national_populist_party:0 "考霸体育达尔文军团"
 EBS_national_populist_party_long:0 "全国校园体优加分与军事化考霸突击阵线"
 EBS_market_liberal_party:0 "全国校园后勤商会"
 EBS_market_liberal_party_long:0 "全国中小学统一营养配餐特许经营总会"
 EBS_radical_socialist_party:0 "关外名校平权公社"
 EBS_radical_socialist_party_long:0 "东北三省做题家平权与大纲重构总公社"
 EBS_syndicalist_party:0 "关东重工做题总工会"
 EBS_syndicalist_party_long:0 "东三省重型机械子弟与体训生做题联合工团"
 EBS_social_democrat_party:0 "北方开明教研联合会"
 EBS_social_democrat_party_long:0 "北方中小学特级教师民主维权公会"

 # ========================================================
 # 1936 BOOKMARK (开局大选主界面历史档案)
 # ========================================================
 EBS_GATHERING_STORM_DESC:0 "坐落于北京大院深处的【最高教育局巡视督导专署】，是统治北方乃至全中国应试帝国的官僚巨兽。它手里死死攥着两件号令天下的权柄：全国统一高考试卷的绝密印厂，以及京津特区压倒全国的外省生源收割特权。\n\n表面上，督导总署由道貌岸然的陈专员执掌，高呼“回归常识、课堂挤水分”；而在总署厚重朱红大门的背后，怀总工的AI微表情天网、周总导的“五天刷绿操场”迎检狂潮、王司长的体育加分黑金与王总管的预制菜帝国，正在将应试教育变现为无穷无尽的官僚财富。\n\n然而，在这座应试堡垒的北方，极寒暴雪中的东三省考霸们已经在蒸汽锅炉前摔碎了茶缸。当权力的贪婪演变为绝对的掠夺，长春、哈尔滨与沈阳的名校已经在暗夜中发出灵魂诘问：“当年大帅能坐专列入关，这教育部龙椅，我们为何不能取而代之？！”"

 # ========================================================
 # EBS CHARACTERS & BIOGRAPHIES (领袖生平与文本介绍)
 # ========================================================
 EBS_leader_chen_zhuanyuan:0 "陈专员"
 EBS_leader_chen_zhuanyuan_desc:0 "最高教育督导专署总专员。常年身着笔挺深灰中山装，胸前佩戴金边校徽，大会发言张口闭口“四个回归、狠挤课堂水分”。曾主导“淘汰水课、打造样板金课”运动，表面上清廉威严，实则是京津大院子弟保送名单的幕后总庄家。他用精密的行政调令挤干了各省的招生名额，将直辖市一本录取率做成了不可撼动的铁壁铜墙。"
 EBS_huai_zonggong:0 "怀总工"
 EBS_huai_zonggong_desc:0 "国家教育数字化工程院院士、赛博考务总工程师。信奉绝对的理性与唯算力论。在他看来，传统的人工出题与做题早已落后于时代。他主张在全国所有考场架设全景高清微表情摄像头与脑电波生物手环，通过清华附中地下超算中心实时计算全国考生的“忠诚度与升学潜力”，用一行代码决定万千学子的命运。"
 EBS_zhou_zongdao:0 "周总导"
 EBS_zhou_zongdao_desc:0 "重点中学教学水平五年大评估行动特派司令，民间闻风丧胆的“洲际导弹”。毕生信奉“以评促建，形式也是生产力”。他的名号所到之处，校长们战栗失眠。他能在短短五天内逼得全国所有高中将枯泥操场刷成翠绿、在荒地上连夜插满麦苗伪造科学基地，并让百万师生通宵手抄十年假试卷与假教案，以格式的绝对完美掩盖教学的彻底停滞。"
 EBS_wang_sichang:0 "王司长"
 EBS_wang_sichang_desc:0 "全国校园球类与艺术特长统筹办公室主任。掌管数百亿专项体卫艺扶持基金，私设数十个秘密小金库。深谙“特长曲线救国”的暴利法则，将国家二级运动员证书与艺术统测免考名额全盘商业化。无论是买卖足球门框还是批发武术段位，每一分钱都在推高着他的体育加分商业帝国。"
 EBS_wang_zongguan:0 "王总管"
 EBS_wang_zongguan_desc:0 "全国校园宴饮与后勤总管。名言是“早上醒酒听汇报，中午陪餐过流水，晚上会所定调令”。独家垄断各大学区中小学统一配餐特许权，以廉价预制菜筑造了庞大的流动资金池。深谙官场应酬之道，善于用昂贵的宴席与特供教辅将地方督学牢牢捆绑在自己的利益链条上。"
 EBS_dongbei_council:0 "东三省名校联合公社"
 EBS_dongbei_council_desc:0 "由吉林长春东北师大附中、黑龙江哈尔滨三中、辽宁本溪高中与辽宁省实验中学联合组成的关外做题家最高权力机关。代表着黑土地上千万在零下三十度冰原中苦读的重工业做题学子。他们蔑视北京贵胄的温室骑马作秀，誓要挥师入关踏平教委大楼，夺回被窃取的高考命题权，让教育重归绝对平权！"
 EBS_enlightened_teachers:0 "北方开明教研联合会"
 EBS_enlightened_teachers_desc:0 "由北方各省数千名一线特级教师、学科带头人与教研员组成的民主自救组织。他们厌倦了高层官员形式主义的大迎检与假教案折腾，痛恨特权阶层对自招名额的瓜分，主张废除假大空评估、让教育回归课堂与育人本质。"
 EBS_xi_teshi:0 "郗特使"
 EBS_xi_teshi_desc:0 "边疆专项降分通道特派督导使。精通“跨省空挂学籍”大阵，善于利用援藏援疆政策漏洞，让嫡系子弟高中三年足不出京，高考却能在雪域高原享受两百分超低降分直通清北。"
 EBS_haidian_council:0 "海淀贵胄委员会"
 EBS_haidian_council_desc:0 "以海淀六小强校董与顺义大藤派家长组成的精英游说集团。垄断了自主招生与强基计划命题人席位，将马术、击剑、帆船与南极科考列为“综合素质必备项”，筑起平民学子永世无法逾越的素质壁垒。"

 # ========================================================
 # EBS TRAITS (领袖特质详细说明)
 # ========================================================
 EBS_the_grand_commissioner:0 "挤水分的大督学"
 EBS_the_grand_commissioner_desc:0 "“要把课堂里的水分彻底挤干！”——虽然挤掉的其实是普通省份的录取名额，但督导组的权威无人敢质疑。"
 EBS_cybernetic_technocrat:0 "赛博考务总工程师"
 EBS_cybernetic_technocrat_desc:0 "以算法与工程学重构考场，任何微小的作弊或发呆都逃不过人脸微表情算力的无情锁定。"
 EBS_evaluation_maniac:0 "五天突击大迎检"
 EBS_evaluation_maniac_desc:0 "“以评促建，重在建设！”——只要专家组进校时墙皮是绿的、麦苗是挺的、教案是全的，学校就是全国模范。"
 EBS_football_czar:0 "校园足球特许状"
 EBS_football_czar_desc:0 "绿茵场上踢的不是球，是数不尽的专项补贴与保送批文。"
 EBS_plateau_skygate:0 "三年挂职直通车"
 EBS_plateau_skygate_desc:0 "户籍在雪域高原，肉身在海淀六小强。分数线一降到底，寒门学子只能望洋兴叹。"
 EBS_banquet_mastermind:0 "醒酒查课总调度"
 EBS_banquet_mastermind_desc:0 "酒过三巡，调令自出；后勤流水，源源不断。"
 EBS_haidian_aristocrat:0 "早培神话与素质霸权"
 EBS_haidian_aristocrat_desc:0 "从幼儿园早培班直通名校，马术与冰球才是最高等级的做题家修养。"
 EBS_dongbei_equality:0 "重工做题家平权意志"
 EBS_dongbei_equality_desc:0 "黑土地冰雪中熔铸的钢铁意志。誓要打破一切大院特权与暗箱保送，让全国每一个孩子面对同一张试卷！"
 EBS_enlightened_reform:0 "渐进理性教研之光"
 EBS_enlightened_reform_desc:0 "摒弃形式主义假教案与官僚折腾，以一线师资的真才实学重构科学严谨的教学秩序。"

 # ========================================================
 # EBS IDEAS (国家精神详细说明)
 # ========================================================
 EBS_privilege_iron_fist:0 "京津高考特权与铁腕巡视"
 EBS_privilege_iron_fist_desc:0 "京津地区拥有全国最高的一本录取率与保送特权，红头文件所及之处万校肃立。"
 EBS_northeast_undercurrent:0 "关外暗流：东三省之怨"
 EBS_northeast_undercurrent_desc:0 "东三省被总署定位为廉价生源供给站与调剂大粮仓。漫天飞雪中，关外各校的怨气正在锅炉管道里剧烈发酵。"
 EBS_chen_absolutism_spirit:0 "陈专员太上皇威权"
 EBS_chen_absolutism_spirit_desc:0 "官僚总督学独揽大权，红头文件与行政调令凌驾于一切教学规律之上。"
 EBS_cybernetic_dictatorship_spirit:0 "赛博算力专政矩阵"
 EBS_cybernetic_dictatorship_spirit_desc:0 "清华附中算力天网全面接管全国考务，脑电波算法监控每一位考生的神经突触。"
 EBS_lawn_greening_totalism_spirit:0 "全域大迎检与绿漆狂热"
 EBS_lawn_greening_totalism_spirit_desc:0 "全国陷入连夜刷绿操场与插麦苗的狂暴整风中，一切生产与教学服务于专家组的视察路线。"
 EBS_canteen_black_gold_spirit:0 "校园后勤黑金托拉斯"
 EBS_canteen_black_gold_spirit_desc:0 "全国中小学校堂配餐被预制菜财阀垄断，巨额现金流水源源不断注入特许金库。"
 EBS_dongbei_liberation_spirit:0 "关东重工做题家平权公社"
 EBS_dongbei_liberation_spirit_desc:0 "打破大院垄断！东三省工农学联合执政，全国重工试卷君临天下！"
 EBS_information_monopoly_spirit:0 "全国高考试卷院信息学霸权"
 EBS_information_monopoly_spirit_desc:0 "清华附中算力中枢对全国信息学赛道施加绝对算力压迫，封锁一切外省选手的夺金通道。"
 EBS_inspection_frenzy:0 "突击大迎检与材料造假"
 EBS_inspection_frenzy_desc:0 "为了应付突击检查，全校师生停工停课连夜伪造假教案、给操场刷绿漆。表面光鲜亮丽，教学与生产实则停滞。"
 EBS_cybernetic_exam_grid:0 "赛博考务天网"
 EBS_cybernetic_exam_grid_desc:0 "全国统一的微表情人脸识别与神经监控矩阵。没有人能逃过天网的凝视。"
 EBS_haidian_privilege:0 "海淀素质教育特权"
 EBS_haidian_privilege_desc:0 "京津大院与海淀名校专属的自招加分渠道，固若金汤。"
 EBS_dongbei_unrest_high:0 "关外躁动：为何不能取而代之"
 EBS_dongbei_unrest_high_desc:0 "“当年奉系能入关，今天东三省考霸，难道就当不得这教育部的主人？！”关外各校暗中磨刀，准备挥师入关！"
 EBS_bureau_total_control:0 "督导总署战时管制体制"
 EBS_bureau_total_control_desc:0 "教育部全面军事化运作，考场即战场，准考证即动员令。"

 # ========================================================
 # EBS NATIONAL FOCUSES (全部国策标题与全量剧情文本)
 # ========================================================
 EBS_supreme_inspection_bureau:0 "最高教育局巡视督导专署"
 EBS_supreme_inspection_bureau_desc:0 "北京教委大楼顶层，督导总署的大印已经盖下。我们手握全国教学大纲的生杀大权与巡视利剑，全国每一块黑板、每一盒粉笔都必须在总署规矩下运转。"
 EBS_inspectors_general_assembly:0 "督导总署全体常务例会"
 EBS_inspectors_general_assembly_desc:0 "各路巡视特使与大督学齐聚中枢大礼堂。台面上是一团和气的教育宏图，台面下则是各大派系对今年全国直辖市名额与自招批文的激烈撕扯。"
 EBS_balance_bureaucratic_interests:0 "安抚各派既得利益"
 EBS_balance_bureaucratic_interests_desc:0 "陈专员亲自举杯调解，在教委大楼招待所里给各路学阀分发甜头：海淀拿自招，清华附拿算力，王司长拿足球，暂时维持脆弱的官僚同盟。"
 EBS_uncover_internal_corruption:0 "暗中收集各派黑料"
 EBS_uncover_internal_corruption_desc:0 "总署稽查处悄然出动，暗中调取王总管的配餐流水账本、王司长的体优加分名册与郗特使的高原专列车票，作为日后政治摊牌的绝命杀手锏。"
 EBS_the_council_schism:0 "中枢路线总博弈：四巨头决裂"
 EBS_the_council_schism_desc:0 "虚伪的和平终于破裂。在常务办公会上，关于全国名额分配的大盘爆发出毁灭性争吵。陈专员拍了桌子，怀总工拔了网线，周总导摔了教案，内阁彻底走向摊牌！"

 # Branch A
 EBS_chen_absolutism:0 "陈专员太上皇集权"
 EBS_chen_absolutism_desc:0 "陈专员动用总督学一票否决权，强行驱逐技术官僚与后勤刺头，确立官僚大院特权的绝对正统地位。"
 EBS_strengthen_beijing_admissions:0 "巩固京津录取特权"
 EBS_strengthen_beijing_admissions_desc:0 "将北京天津的一本上线率用红头文件永远锁死在40%以上。外省考生的名额水分被狠狠挤干，充入京津大盘。"
 EBS_fortify_haidian_bastion:0 "海淀早培垄断深化"
 EBS_fortify_haidian_bastion_desc:0 "将早培神童的遴选年龄直接提前至幼儿园小班，打通大院子弟免试直升清北的终身保送封闭循环。"
 EBS_tibet_airdrop_express:0 "西藏三年挂职产业化"
 EBS_tibet_airdrop_express_desc:0 "郗特使的高原直通车正式纳入总署特批程序。大院子弟足不出户，学籍挂满高原，以200分超低门槛空降全国顶级名校。"
 EBS_the_untouchable_nobility:0 "京津不可动摇之特权"
 EBS_the_untouchable_nobility_desc:0 "大院铁律坚不可摧。任何外省考霸的抗议都被定性为严重干扰考务秩序，官僚贵胄的地位万世不易！"

 # Branch B
 EBS_huai_technocratic_coup:0 "怀总工赛博算力政变"
 EBS_huai_technocratic_coup_desc:0 "怀总工率领清华附中机房工程师切断了教委大楼的电力供应，宣布全面废止官僚审批，将全国教育移交给超算中心管理！"
 EBS_tsinghua_supercomputer_grid:0 "清华附中超算算力天网"
 EBS_tsinghua_supercomputer_grid_desc:0 "地下算力矩阵轰鸣运转。千万个量子核心并发运算，直接解析全国所有考生的神经网络模型与做题效率。"
 EBS_ai_proctoring_neurolink:0 "脑电波微表情防作弊"
 EBS_ai_proctoring_neurolink_desc:0 "在每一个课桌安装红外传感器与瞳孔追踪仪。考生只要眼神游离超过0.3秒，系统便自动判定为思维违纪并扣除信誉分。"
 EBS_algorithmic_credit_system:0 "全国做题家信用算法"
 EBS_algorithmic_credit_system_desc:0 "彻底废除人情关系与档案调令。每个学生的升学权利完全由算法模型决定，数据面前人人成为无情的算力节点。"
 EBS_algorithm_determines_destiny:0 "算法即命运：算力决定大专"
 EBS_algorithm_determines_destiny_desc:0 "赛博考务终极形态达成。全国高考试卷院完全由人工智能自主出题、秒级批改、瞬时分配录取通知书，人类考官彻底失业！"

 # Branch C
 EBS_zhou_evaluation_frenzy:0 "周总导铁血迎检大极权"
 EBS_zhou_evaluation_frenzy_desc:0 "周总导手持大评估令箭全面夺权。他宣布全国进入“特级教学战备状态”，任何学校必须无条件通过迎检抽查，否则当场摘牌！"
 EBS_nationwide_lawn_greening:0 "全国万校操场狂刷绿漆"
 EBS_nationwide_lawn_greening_desc:0 "数万吨军绿油漆紧急调配全国。师生连夜动员，把所有灰扑扑的操场涂成刺目反光的生机绿，把荒地连夜插满带露水的麦苗！"
 EBS_midnight_paperwork_mobilization:0 "百万师生通宵抄假教案"
 EBS_midnight_paperwork_mobilization_desc:0 "严令各校教师停止正常讲课，集体闭门手抄过去十年的教学反思与批改记录。只要材料厚达半米、签字整齐划一，便是国家样板！"
 EBS_evaluation_or_shutdown:0 "不迎检便关停：以评促肃反"
 EBS_evaluation_or_shutdown_desc:0 "派出督察宪兵队驻扎各大名校。凡敢对迎检标准提出质疑的校长与教师，一律按教学不合格定性就地免职！"
 EBS_total_inspection_state:0 "极权示范帝国：造假的艺术"
 EBS_total_inspection_state_desc:0 "全国所有学校已变成窗明几净、口号震天、资料完美却空无一人的绝对样板房。周总导在主席台上满意地露出了笑容。"

 # Branch D
 EBS_wang_commercial_consortium:0 "王司长与王总管黑金帝国"
 EBS_wang_commercial_consortium_desc:0 "后勤与体育巨头结成坚不可摧的商业联盟。他们用数以亿计的配餐现金流收买巡视人员，将整座教委大楼改造成巨型教育商业托拉斯！"
 EBS_sports_quota_black_market:0 "国家二级运动员批发明码标价"
 EBS_sports_quota_black_market_desc:0 "体卫艺司的红头批文在地下黑市被公开拍卖。游泳、羽毛球、马术二级证书按分计价，成为富裕阶层的特权硬通货。"
 EBS_school_canteen_cartel:0 "全国中小学预制菜垄断包干"
 EBS_school_canteen_cartel_desc:0 "取缔所有学校的独立食堂与现炒窗口。由王总管旗下的中央厨房统一配送保质期一年的预制餐，榨取高达70%的毛利。"
 EBS_educational_slush_funds:0 "黑金小金库全球布局"
 EBS_educational_slush_funds_desc:0 "将滚滚而来的后勤与加分黑钱转入海外空壳教育基金会，为总署高官购置游艇与豪华庄园提供源源不断的燃料。"
 EBS_educational_plutocracy:0 "金钱万能：黑金教育财阀"
 EBS_educational_plutocracy_desc:0 "只要充值到位，清北亦可预订；只要赞助充足，挂科立即免死。教育彻底沦为赤裸裸的资本狂欢场！"

 # Branch E (Dongbei)
 EBS_dongbei_conspiracy_active:0 "关外风暴：校长摔碎茶缸"
 EBS_dongbei_conspiracy_active_desc:0 "在长春零下三十度的暴风雪夜，东北各大名校的校长们看着北京督导组再次削减东北名额的红头文件，当场砸烂了搪瓷茶缸，密谋举义！"
 EBS_placate_dongbei_normal:0 "联络东北师大附中教研母机"
 EBS_placate_dongbei_normal_desc:0 "关东教育长子站了出来。东北师大附中汇聚全东北最顶尖的名师天团，秘密起草打破京津垄断的全新全国重工教学大纲。"
 EBS_secret_alliance_of_three_provinces:0 "长春哈尔滨沈阳铁血结盟"
 EBS_secret_alliance_of_three_provinces_desc:0 "东北师大附中、哈三中、本溪高中、辽宁省实验正式签订《关外考霸铁血同盟条约》，集结数百万重工做题大军！"
 EBS_mukden_express_to_beijing:0 "奉系考霸誓师：专列大举入关！"
 EBS_mukden_express_to_beijing_desc:0 "当年张大帅能坐专列入关，今天东三省考霸也一样能！一列列满载冰雪考霸与重工教辅的铁甲列车冲破山海关，直插北京中枢！"
 EBS_dongbei_takes_over_moe:0 "攻占教育部：这龙椅咱也能坐！"
 EBS_dongbei_takes_over_moe_desc:0 "关外做题大军攻占教委大楼！陈专员与大院官僚落荒而逃。东北老校长昂首走上主席台：“教育部的主人，今天轮到咱东三省了！”"
 EBS_heavy_industry_exam_equality:0 "全国重工卷：彻底打破京津特权！"
 EBS_heavy_industry_exam_equality_desc:0 "焚毁一切自招保送特权协议！全国统一推行冰雪淬火的重工业全国试卷，分数面前人人平等，黑土地重铸华夏教育荣光！"

 # Exam Board Branch
 EBS_seize_central_printing_press:0 "掌控全国统考绝密印厂"
 EBS_seize_central_printing_press_desc:0 "北京郊区的高考试卷特种印厂被督导组卫队彻底封锁。试卷印版的一笔一划，都成为我们操控全国做题大盘的终极杠杆。"
 EBS_rig_informatics_syllabus:0 "垄断全国信息学命题"
 EBS_rig_informatics_syllabus_desc:0 "由清华附中特级教师亲自操刀全国信息学大纲。设计只有京城机房才能跑得通的极端算法题目，全面封杀外省选手的夺金梦想！"
 EBS_suppress_southern_olympiad:0 "定点打击华东与楚天奥赛题库"
 EBS_suppress_southern_olympiad_desc:0 "以“超纲违规集训”为由突击查封黄冈密卷与华师一试题库，扣押华东六校的奥数模拟卷，直接打崩对手在天梯上的积分！"
 EBS_manipulate_national_exam_board:0 "全面操纵高考试卷院排位大盘"
 EBS_manipulate_national_exam_board_desc:0 "通过动态调控模拟试题难度与特许赋分权，将督导总署在全国八校排位天梯中的总分推向不可企及的高峰。"
 EBS_lock_ivory_tower_top3:0 "锁定全国前三甲象牙塔霸权"
 EBS_lock_ivory_tower_top3_desc:0 "在 1938 盛夏大考放榜前夕，提前锁定全国前三强地位，坐稳象征教育界最高荣耀的孤傲象牙塔赢家宝座！"

 # 1938 National War Branch
 EBS_war_mobilization_1938:0 "督导组战时全境管制动员"
 EBS_war_mobilization_1938_desc:0 "1938年盛夏放榜钟声敲响，全国高考总决战全面引爆！督导总署宣布全北方进入一级战备，动员所有师生奔赴考场前线！"
 EBS_pacify_shanhe_coalition:0 "踏平山河四省修罗场"
 EBS_pacify_shanhe_coalition_desc:0 "晋冀鲁豫千万做题大军汹涌反扑。派出机械化督导兵团，强行接管其军事化寄宿基地，彻底平定华北考区！"
 EBS_subjugate_huazhong_hbe:0 "抄没黄冈华师一楚天题库"
 EBS_subjugate_huazhong_hbe_desc:0 "挥师南下跨过长江，攻克武汉教育要塞，彻底抄没华中考霸压箱底的全部真题库与教学大纲。"
 EBS_strike_east_and_south:0 "摧垮华东华南自主命题联盟"
 EBS_strike_east_and_south_desc:0 "粉碎江南自主招生壁垒，击溃岭南国际部武装，将督导总署的红旗插上江浙沪与珠三角各大名校的大门。"
 EBS_final_siege_of_yandao:0 "兵临蓉城：彻底接管盐道街！"
 EBS_final_siege_of_yandao_desc:0 "大军兵临锦江两岸，重重包围盐道街中学校区。川渝教育独立的最后阵地就在眼前，终极考卷在此决断！"
 EBS_nationwide_educational_dominion:0 "全国一统：颁发中央统考圣典"
 EBS_nationwide_educational_dominion_desc:0 "四海一统，万校归心。在紫禁城礼堂隆重颁发《大一统全国高考考纲大典》，开启长达180天的全国考区大同核心化整合！"

 # ========================================================
 # EBS DECISIONS (决议标题与操作效果说明)
 # ========================================================
 EBS_inspection_category:0 "最高教育督导与全国迎检指挥部"
 EBS_inspection_category_desc:0 "红头文件从这里发出，巡视专列通达全国。任何学校敢有丝毫懈怠，摘牌降级就在一念之间。"
 EBS_manchurian_crisis_category:0 "关外暗流：东三省羁縻与暗涌"
 EBS_manchurian_crisis_category_desc:0 "东北三省的学校表面上顺从应考，暗地里却在重工业车间与暖气管道旁密谋。必须谨慎平衡对关外的压榨与安抚。"
 EBS_exam_board_category:0 "全国高考试卷院与算力干预部"
 EBS_exam_board_category_desc:0 "借助清华附中算力中枢与中央印厂特权，直接影响全境奥赛阻力并对地方考霸积分进行定点削弱。"
 EBS_wartime_reconstruction_category:0 "全国战后考纲统一与核心化"
 EBS_wartime_reconstruction_category_desc:0 "在占领敌对考区后，启动为期180天的深度教研同化，将其彻底转变为督导总署的忠诚核心考区。"
 EBS_launch_surprise_inspection:0 "开展跨省突击督查"
 EBS_launch_surprise_inspection_desc:0 "派出巡视车队无预警进驻地方重点高中，翻检垃圾桶里的偷吃外卖与未备案习题册。"
 EBS_audit_canteen_nutrition:0 "启动全国学生营养餐突击审计"
 EBS_audit_canteen_nutrition_desc:0 "由王总管亲自挂帅，名为清查营养餐克扣，实则是将各校后勤流水全额划入总署小金库。"
 EBS_midnight_lesson_plan_check:0 "假教案全城突击抽检"
 EBS_midnight_lesson_plan_check_desc:0 "在凌晨两点突袭各校教师办公室，查验十年教案的手抄完整度，不合格者通报全省。"
 EBS_allocate_bonus_quota_to_dongbei:0 "向下划拨奥赛加分名额安抚关外"
 EBS_allocate_bonus_quota_to_dongbei_desc:0 "拿出一小部分强基计划与保送特许状施舍给关外名校，暂时平息东北师资与校长的怒火。"
 EBS_crackdown_on_underground_test_groups:0 "突击查封沈阳长春地下自招联考"
 EBS_crackdown_on_underground_test_groups_desc:0 "东三省诸校竟然试图绕过京城统考私自联合命题！派出宪兵队强行没收试卷印版！"
 EBS_bribe_dongbei_principals:0 "调派京城教研编制招抚关外名师"
 EBS_bribe_dongbei_principals_desc:0 "用海淀与西城带编制的特级教师头衔，把东北最顶尖的名师重金挖角进京，抽空东北教研底蕴。"
 EBS_manipulate_informatics_board:0 "调动清华附中机房加码算力封锁"
 EBS_manipulate_informatics_board_desc:0 "提升全国信息学赛道阻力至 -0.5%/周，直接削减对手进度并为总署增加 10 点做题积分！"
 EBS_strike_at_jiangnan_math:0 "突击查抄江南华东六校奥数真题"
 EBS_strike_at_jiangnan_math_desc:0 "没收华东学校组织（ECE）压箱底的竞赛讲义，重挫其天梯排位积分！"
 EBS_strike_at_chutian_physics:0 "突击查禁华中楚天黄冈物理题库"
 EBS_strike_at_chutian_physics_desc:0 "查封华中考霸集团（HBE）的物理实验秘卷，直接削弱其大盘积分！"
 EBS_issue_affirmative_action_directive:0 "签发督导总署强基特惠批文"
 EBS_issue_affirmative_action_directive_desc:0 "以内阁令直接为总署追加 15 点模拟做题积分，但会引发地方考区强烈不公抗议。"
 EBS_integrate_national_curriculum:0 "启动全国考区大纲统一化 (180天)"
 EBS_integrate_national_curriculum_desc:0 "全面推行督导总署全国统一教材大纲，用180天时间消除地方教育割据，将全国各大名校彻底转化为核心领土。"

 # ========================================================
 # EBS EVENTS (经典剧情事件)
 # ========================================================
 ebs_event.1.t:0 "最高教育局巡视督导专署成立"
 ebs_event.1.d:0 "北京教委大楼内，陈专员身着深色中山装，面对台下数百名来自全国各省的教育特派员发表题为《回归教育常识与狠挤课堂水分》的主旨报告。\n\n讲话中，陈专员多次强调‘全国一盘棋’与‘京津特区的引领带头示范作用’。台下掌声雷动，而各省代表的心情却沉到了谷底——因为所有人心里都清楚，所谓的‘挤水分’，不过是把外省考生辛辛苦苦考来的录取名额挤干，尽数充实给海淀与西城的大院子弟。\n\n督导总署的红头文件已经盖上了鲜红的印章，一场席卷全国考场的绝对整肃即将开始！"
 ebs_event.1.a:0 "传令全国，即日迎检！"
 ebs_event.2.t:0 "周总导的评估风暴：麦田插麦苗"
 ebs_event.2.d:0 "全国教学水平五年大评估的风暴席卷北方！在周总导‘以评促改，以评促建’的严令下，某重点中学的校长陷入了绝望。\n\n为了赶在督导专家组专车抵达前完成‘现代化绿色生态校园’的达标要求，全校师生在零下十度的寒夜里被集体动员，手持油漆刷将枯黄泥泞的操场整整齐齐地刷上翠绿的油漆，并在校门口十亩荒地上连夜突击插满了新鲜嫩绿的麦苗，伪装成‘现代农业科学探究实践基地’。\n\n当周总导的轿车驶过校门，看着随风招展的插秧麦苗与反着刺目绿光的操场，总导欣慰地点了点头：“这才是我们教育现代化的样子！”"
 ebs_event.2.a:0 "形式也是生产力！"
 ebs_event.2.b:0 "通报批评，但把迎检报告定为全国示范"
 ebs_event.3.t:0 "体优生风波：87名国家二级运动员"
 ebs_event.3.d:0 "辽宁本溪高中再次成为全国舆论的风口浪尖。根据群众密报，该校本届高三毕业生中，竟然有整整87人集体获得了‘国家二级运动员证书’并享受高考20分加分，项目甚至涵盖了该市根本没有训练场地的羽毛球、游泳与现代五项！\n\n面对督导组的严厉质询，本溪校方昂首挺胸地辩解道：“这是我们辽东老工业基地重型体力劳动铸就的强悍体魄，每一位做题家都有博尔特一般的冲刺速度！”\n\n王司长翻看着加分名册，若有所思地摸了摸下巴：“这门技术……倒是有很大的‘横向合作空间’。”"
 ebs_event.3.a:0 "严肃查处，撤销加分！"
 ebs_event.3.b:0 "让王司长带队‘深入辅导’"
 ebs_event.4.t:0 "高原天梯：谁在雪域空挂学籍？"
 ebs_event.4.d:0 "一则绝密举报信引爆了全国教育圈：某超级中学的校长公子，高中三年每天在海淀最顶级的空调实验班刷题，然而其高考报名地点却悄然出现在了海拔四千米的高原自治区，并顺理成章地凭借超低分数线锁定了清华强基计划！\n\n虽然郗特使的援藏期限按章程还差大半年，但这丝毫阻挡不了专列飞驰的脚步。面对汹涌舆情，督导组官员神色自若：“这体现了我们优秀干部子弟克服高原缺氧、扎根边疆的奉献精神，何来特权之说？”"
 ebs_event.4.a:0 "特事特办，注意舆情平息"
 ebs_dongbei.1.t:0 "⭐️ 东三省学校之问：为何我们不能取而代之？！"
 ebs_dongbei.1.d:0 "沈阳与长春的夜空大雪纷飞，极寒的北风拍打着双层玻璃窗。在老旧教工大楼深处的一间会议室里，来自东北师大附中、哈尔滨三中、本溪高中、辽宁省实验中学的校长与骨干们秘密围聚在烧得通红的铸铁暖气炉旁。\n\n桌面上，是北京督导组刚刚下发的又一份红头文件——京津高校再次削减东三省招生名额，而东北多所名校精心培养的奥赛尖子，也被督导组以‘卓越培养’为名强行征调进京。\n\n屋内是一片死一般的沉寂，只有蒸汽锅炉沉重的喘息。\n\n忽然，一位老校长猛地把掉瓷的搪瓷茶缸狠狠砸在铁皮桌上，霍然站起，声音在冰冷的空气中炸响：\n\n“凭什么？！凭什么海淀那帮骑马打球的少爷小姐，北京卷考四百分就能进名校；咱们黑土地上的孩子在零下三十度的暴雪里五点起早刷穿三千套重工卷子，却只能挤破头去争调剂？！”\n\n“当年张大帅能坐着专列入关进北京，咱东三省几百万做题家，难道就当不得这教育部的主人？！”\n\n“督导组的龙椅，北京的官僚坐得，咱东三省为何不能取而代之？！”\n\n这一句灵魂拷问在飞雪中回荡。关外考霸的怒火已经点燃，一场问鼎北京中枢、彻底颠覆全国高考秩序的惊天企划，已在暗夜中悄然启幕！"
 ebs_dongbei.1.a:0 "关外龙吟，京城将变！"
 ebs_dongbei.2.t:0 "⭐️ 奉系考霸大举入关：接管教育部！"
 ebs_dongbei.2.d:0 "长春与沈阳的铁甲列车呼啸着冲破了山海关！在东北师大附中、哈三中与本溪高中的号令下，数十万关外做题铁旅与体训生进占北京教委大楼！\n\n陈专员的警卫仓皇逃窜，海淀贵胄的保送名单被当众撕得粉碎！老校长昂首走上主席台，将东北重工全国统一试卷重重拍在讲台上：\n\n“从今天起，全国考纲由黑土地说了算！全国所有学子，不分大院寒门，一律凭分说话！”\n\n东三省名校联合公社正式成立，关外考霸入主中枢，改写历史！"
 ebs_dongbei.2.a:0 "换了人间！重工做题家万岁！"
 ebs_event.20.t:0 "试卷院捷报：清华附中算力彻底封锁信息学！"
 ebs_event.20.d:0 "清华附中超算中心传来捷报：通过调整全国信息学命题与阅卷算法，全国信息学竞赛已被督导总署完全掌控！外省选手的解题算法在海淀算力压制下纷纷崩溃，总署在全国做题天梯中的领先优势进一步扩大！"
 ebs_event.20.a:0 "算力即真理！"
 ebs_event.21.t:0 "1938 盛夏全国教育大战总动员令！"
 ebs_event.21.d:0 "1938年6月7日清晨，全国统一高考大盘放榜！各大地方考霸集团公然抗拒中央统考大纲，全面引爆全国教育大战！\n\n督导总署签署最高战时全境管制动员令！所有巡视专列转化为铁甲军列，所有考场转化为军事要塞，督导铁军将以铁血纪律踏平一切叛逆学校，彻底征服全国考区！"
 ebs_event.21.a:0 "为了中央大纲的绝对权威，开战！"

 # ========================================================
 # EBS INTERWOVEN CRISIS EVENTS (中枢路线多阶段危机交织链)
 # ========================================================
 ebs_crisis.1.t:0 "危机序幕：教委大楼密件失窃案"
 ebs_crisis.1.d:0 "北京西单教育部大楼顶层的保密机要室被撬开！\n\n保险柜中，一份标注着‘绝密·特供’的红头卷宗不翼而飞。里面详尽记录着过去三年内京津大院保送清北的内定名单、王总管独家垄断各学区预制菜采购的70%回扣流水账，以及周总导迎检突击检查各校的造假评语标准！\n\n消息传出，整座大楼陷入恐慌。四巨头齐聚顶层圆桌，目光闪烁，互相猜忌。所有人都明白，谁掌握了这份黑料，谁就能将政敌送进教研农场劳改！"
 ebs_crisis.1.a:0 "陈专员下令大院保卫科封锁现场，启动老干部特权内查！"
 ebs_crisis.1.b:0 "怀总工启动机房天网，全面审查所有人的即时通讯记录！"
 ebs_crisis.1.c:0 "周总导咆哮着宣布启动全员‘思想大迎检’与保密达标突击！"
 ebs_crisis.1.d:0 "王司长动用后勤小金库，开出十万悬赏买回失窃密件！"

 ebs_crisis.2.t:0 "第一回合：预制菜流水与本溪加分案爆雷"
 ebs_crisis.2.d:0 "失窃的部分密件被匿名复印，贴满了西单街头的公告栏与各大名校传达室！\n\n舆论瞬间炸锅：辽宁本溪高中87名‘国家二级运动员’的羽毛球与现代五项证书，竟是在北京某烤鸭店包厢里由王司长一手批发出来的；而中小学校园食堂里保质期长达一年的料理包预制菜，竟全是王总管堂兄旗下的皮包食品厂独家特供！\n\n更要命的是，关外东北三省的校长们已经敏锐地嗅到了京城虚弱的气息，一封言辞激烈的质询函已通过电报拍至教育部！"
 ebs_crisis.2.a:0 "王总管将责任推给地方临时工，并给大院高层送去特供茅台！"
 ebs_crisis.2.b:0 "怀总工提出以‘AI无人营养液自动配餐机’彻底取缔传统食堂！"
 ebs_crisis.2.c:0 "周总导率督察宪兵队突击查封涉事食堂，勒令所有窗口手抄反思！"
 ebs_crisis.2.d:0 "关外三省校长借机发难，公开声讨京城后勤吸血！"

 ebs_crisis.3.t:0 "第二回合：操场喷绿漆与迎检大中毒事件"
 ebs_crisis.3.d:0 "为了压制后勤丑闻，周总导强推‘全国迎检大冲刺’，下达了‘全校绿化率必须达到100%’的死命令。\n\n某模范示范高中为了通过达标验收，在零下严寒中组织师生连夜手持工业喷枪，用劣质军绿油漆将三千平米的泥地操场全部喷刷成翠绿色！刺鼻的苯溶剂气体笼罩校园，次日清晨晨跑的数百名学生因急性吸入中毒集体送医！\n\n更荒诞的是，周总导的评估专家组在视察时，竟将这片反光的绿漆操场评定为‘全国高科技环保生态样板’！全国家长与社会的怒火彻底被点燃！"
 ebs_crisis.3.a:0 "周总导铁青着脸：“迎检是政治任务！戴防毒面具继续刷！”"
 ebs_crisis.3.b:0 "陈专员出面和稀泥，将中毒学生调入大院疗养并内定自招保送！"
 ebs_crisis.3.c:0 "怀总工在大礼堂展示AR全息数字虚拟草坪，嘲笑人工绿漆落后！"
 ebs_crisis.3.d:0 "关外各校联合发表《讨绿漆督导檄文》，宣布无限期抵制迎检！"

 ebs_crisis.4.t:0 "第三回合：西藏高考专列与空降兵大曝光"
 ebs_crisis.4.d:0 "一辆由北京西站开往拉萨的挂牌专列在青海被当地群众与记者强行拦截！\n\n车厢内满载着来自海淀与西城顶尖中学的五百名高三学生。他们身穿笔挺校服，手持刚印出的西藏户籍卡与‘少数民族语言特长加分证明’，正准备前往拉萨考场享受两百分超低门槛直通清北的特惠通道！\n\n面对漫天闪光灯，领队的郗特使昂首挺胸：“这体现了大院子弟扎根高原、奉献边疆的精神！”然而，一张张软卧包厢车票的暗箱交易收据被当场甩在雪地上，全国做题家的忍耐已经逼近临界点！"
 ebs_crisis.4.a:0 "陈专员拍案怒斥：“这是边疆对口帮扶项目，谁敢妄议大院子弟？！”"
 ebs_crisis.4.b:0 "怀总工黑入全国考务网，将所有专列学生改为‘赛博云端少数民族’！"
 ebs_crisis.4.c:0 "王司长宣称专列软卧明码标价，提议成立‘进藏考务商业投资公司’！"
 ebs_crisis.4.d:0 "东三省做题家彻底暴怒：“十年冰雪寒窗，抵不过京城一张卧铺票？！”"

 ebs_crisis.5.t:0 "第四回合：关外代表团进京与西单大楼被围"
 ebs_crisis.5.d:0 "局势走向彻底失控！\n\n东三省千人名校联名代表团冲破地方关卡，乘坐蒸汽专列直抵北京郊区，在西单教育部大楼外拉起了数丈长的白底黑字横幅：“还我东三省名额！打破大院垄断！”\n\n在教育部大楼内部，四派势力已经撕破了所有体面：陈专员召集了大院警卫把守走廊；怀总工锁死了电梯门禁只给机房供电；周总导拉响了突击迎检防空警报；而王司长与王总管则用运钞车把正门堵得水泄不通！\n\n大决战的钟声已经敲响，谁能踏出这间会议室，谁就是教育部唯一的主人！"
 ebs_crisis.5.a:0 "陈专员下令大院纠察队封锁西单路口，准备决战！"
 ebs_crisis.5.b:0 "怀总工切断大楼供电与外网，用广播宣布算法专政降临！"
 ebs_crisis.5.c:0 "周总导拉响全城防空警报，下令实施全员迎检戒严！"
 ebs_crisis.5.d:0 "王司长与王总管在正门散发金条，悬赏重金拉拢倒戈保卫！"
 ebs_crisis.5.e:0 "关外代表团突破最后警戒线，直接向教委大门发起冲击！"

 ebs_crisis.6.t:0 "终局决断：西单大楼绝杀夜！"
 ebs_crisis.6.d:0 "暴风骤雨席卷北京城，西单教育部大楼顶层的会议室大门被狂风狠狠拍开！\n\n历经数轮惊心动魄的明争暗斗与舆论厮杀，各大派系的影响力与底牌已经在西单大楼的天平上称量完毕。每一个派系都亮出了最后的刺刀：陈专员的大院调令、怀总工的代码天网、周总导的迎检令箭、王总管的金钱支票，以及在楼外高呼口号的关外做题大军！\n\n历史的指针在此刻停顿。今夜过后，这庞大教育帝国的权柄，究竟落入谁手？！"
 ebs_crisis.6.a:0 "【陈专员大权独揽】官僚大院正统！红头文件万岁！（父权威权派胜出）"
 ebs_crisis.6.b:0 "【怀总工赛博政变】代码重构考纲！算力决定命运！（威权民主派胜出）"
 ebs_crisis.6.c:0 "【周总导极权接管】五天刷绿全境！形式主义万岁！（极权派胜出）"
 ebs_crisis.6.d:0 "【王总管后勤商会】预制菜与特长生统治全国！（市场自由派胜出）"
 ebs_crisis.6.e:0 "【关外考霸反客为主】东北三省攻占教育部，重工平分天下！（激进社会主义胜出）"

 # ========================================================
 # EBS FOCUS COMPLETION EVENTS (全部国策对应完成剧情事件)
 # ========================================================
 ebs_focus_event.1.t:0 "中枢决裂尘埃落定"
 ebs_focus_event.1.d:0 "西单大楼的硝烟终于散去。无论胜利者是谁，旧时代的虚伪共识已被彻底埋葬。崭新的权力架构已经确立，最高教育巡视督导专署翻开了全新的篇章！"
 ebs_focus_event.1.a:0 "大局已定，传令全国！"

 ebs_focus_event.2.t:0 "督导总署全体常务例会开幕"
 ebs_focus_event.2.d:0 "来自北方各省的巡视专员在西单礼堂整齐落座。表面上讨论的是新学期的教研重点，私底下传递的纸条全是在打听今年各省特长生与保送名额的分赃比例。"
 ebs_focus_event.2.a:0 "官僚的齿轮开始转动"

 ebs_focus_event.3.t:0 "招待所里的密室分肥妥协"
 ebs_focus_event.3.d:0 "在教委后勤招待所的烟雾缭绕中，几份绝密的名额调剂批文被悄悄盖上了蓝章。各大院学阀碰杯言欢，外省考生的名额在谈笑间已被瓜分殆尽。"
 ebs_focus_event.3.a:0 "皆大欢喜，除了考生"

 ebs_focus_event.4.t:0 "稽查处的绝密档案柜"
 ebs_focus_event.4.d:0 "总署稽查科深夜加班，将各省违规加分、假赛艇队、假航模证书与预制菜回扣的账本整理成厚厚的黑料卷宗，锁进了双重密码铁皮柜中。"
 ebs_focus_event.4.a:0 "这些都是未来的杀手锏"

 ebs_focus_event.5.t:0 "陈专员太上皇威权确立"
 ebs_focus_event.5.d:0 "深灰中山装的陈专员缓步走上主席台。任何试图挑战大院保送名单的技术派与后勤商人都被调往偏远教研所。总督学一票否决权高悬，官僚特权不可撼动！"
 ebs_focus_event.5.a:0 "大院规矩，不可逾越！"

 ebs_focus_event.6.t:0 "京津录取铁壁铜墙铸就"
 ebs_focus_event.6.d:0 "全新批发的红头文件正式下发：京津特区一本上线率与名校录取率被死死锁死在全国最高水平。外省考生想进京？请先在修罗场考到全省前一百名！"
 ebs_focus_event.6.a:0 "给大院子弟铺就金光大道"

 ebs_focus_event.7.t:0 "海淀幼儿园早培神话"
 ebs_focus_event.7.d:0 "海淀早培班的考核延伸至幼儿园托班。四岁幼童开始解析微积分与马术理论。这一条从婴儿床直通清北的封闭流水线，彻底将平民学子隔绝在城墙之外。"
 ebs_focus_event.7.a:0 "素质教育的终极闭环"

 ebs_focus_event.8.t:0 "不可动摇之特权阶层"
 ebs_focus_event.8.d:0 "教委大楼门口竖起了荷枪实弹的警戒哨卡。外省考霸的请愿信被直接扔进碎纸机。大院子弟在紫禁城脚下的林荫道上从容漫步，神权自此永固！"
 ebs_focus_event.8.a:0 "铁打的大院，流水的做题家"

 ebs_focus_event.9.t:0 "清华附中服务器掌权"
 ebs_focus_event.9.d:0 "机房的指示灯在黑暗中如繁星闪烁。怀总工站在主控机柜前，敲下了回车键。所有的官僚盖章程序被一行自执行智能合约取代，赛博考务专政正式建立！"
 ebs_focus_event.9.a:0 "唯算力永恒！"

 ebs_focus_event.10.t:0 "地下超算阵列全功率运转"
 ebs_focus_event.10.d:0 "清华附中操场地下二十米，数千台液冷服务器轰鸣咆哮。它在0.01秒内计算出全国每一道压轴题的最优解，并锁死了所有外省竞赛选手的积分通道！"
 ebs_focus_event.10.a:0 "算力碾压一切题海战术"

 ebs_focus_event.11.t:0 "脑电波与瞳孔微表情追踪全面部署"
 ebs_focus_event.11.d:0 "每个考生的课桌被加装了神经突触感应圈。发呆超过两秒被判定为潜意识弃考，眼球微颤被判定为企图偷瞄，算法实时扣除做题积分！"
 ebs_focus_event.11.a:0 "在天网面前，思维也是违纪"

 ebs_focus_event.12.t:0 "全国做题家信用算法生效"
 ebs_focus_event.12.d:0 "全员动态信用分上线。晨读声音不够洪亮扣0.5分，演算纸草稿不整齐扣1分，唯有完美执行算法指令的精密做题机器才能获得升学许可证！"
 ebs_focus_event.12.a:0 "人类退化为算力终端"

 ebs_focus_event.13.t:0 "算法即命运：秒下大专通知书"
 ebs_focus_event.13.d:0 "高考放榜不再需要人工评卷。交卷后三毫秒，录取通知书直接推送到考生的生物手环上：大专、三本还是清北，全凭代码决定！"
 ebs_focus_event.13.a:0 "赛博命理学的伟大胜利！"

 ebs_focus_event.14.t:0 "周总导吹响全境迎检号角"
 ebs_focus_event.14.d:0 "“谁砸迎检的牌子，我就砸谁的饭碗！”周总导的动员讲话通过全国广播响彻校园。数万所学校停课整风，所有人投入到迎接大评估的战斗中！"
 ebs_focus_event.14.a:0 "形式主义的风暴，降临了！"

 ebs_focus_event.15.t:0 "通宵手抄十年假教案"
 ebs_focus_event.15.d:0 "深夜两点，北方各省的教师办公室灯火通明。老师们眼含热泪、手腕痉挛，正在用五种颜色的圆珠笔补抄过去十年的‘教学反思’与‘家访记录’。"
 ebs_focus_event.15.a:0 "字迹整齐，这就是国家级示范！"

 ebs_focus_event.16.t:0 "迎检不过当场摘牌免职"
 ebs_focus_event.16.d:0 "迎检督察组进驻某百年名校，发现门卫室台账少盖了一个章，校长当场被免职，学校直接降为合格类薄弱校。万校肃然，无人敢有微词！"
 ebs_focus_event.16.a:0 "重在建设，狠在肃反！"

 ebs_focus_event.17.t:0 "空无一人的绝对样板校"
 ebs_focus_event.17.d:0 "操场是刺目的荧光绿，麦田里插满新鲜麦苗，档案室里假材料堆到天花板。全校学生都被安排在宿舍闭嘴待命，迎检专家组一致给出满分！"
 ebs_focus_event.17.a:0 "完美而荒诞的极权乌托邦"

 ebs_focus_event.18.t:0 "王总管后勤商会登基"
 ebs_focus_event.18.d:0 "王司长与王总管端坐在纯金雕花的老板椅上。校园体育赛事与后勤预制菜的流水每天高达数千万，整座教育部变成了后勤托拉斯的提款机！"
 ebs_focus_event.18.a:0 "有钱能使鬼做题！"

 ebs_focus_event.19.t:0 "保质期一年的预制菜全面进驻"
 ebs_focus_event.19.d:0 "所有学校的明火现炒食堂被全部取缔。一箱箱保质期长达365天的料理包运进校园。学生们嚼着橡皮般的红烧肉，后勤集团的利润率突破历史极值！"
 ebs_focus_event.19.a:0 "安全、卫生、高利润！"

 ebs_focus_event.20.t:0 "离岸教育小金库秘密扩张"
 ebs_focus_event.20.d:0 "加分服务费与后勤特许经营费通过空壳教育基金会源源不断汇往海外。西单高官的私人游艇停满了地中海港口，教育黑金统治一切！"
 ebs_focus_event.20.a:0 "资本没有国界，加分也是"

 ebs_focus_event.21.t:0 "黑金财阀掌舵全国教育"
 ebs_focus_event.21.d:0 "收费大厅直接设在教育部一楼。赞助费一千万包送清北，五百万直升实验班，连保送录取通知书都可以现场扫码开票！"
 ebs_focus_event.21.a:0 "金钱面前，人人平等！"

 ebs_focus_event.22.t:0 "东北师大附中重工考纲母机秘密运转"
 ebs_focus_event.22.d:0 "在长春自由大路的红砖教研楼深处，东北师大附中的特级教师天团通宵达旦。以冰雪工业、极限压轴题与唯物辩证法为核心的重工大纲终于成型！"
 ebs_focus_event.22.a:0 "做题长子，铸造真理之剑！"

 ebs_focus_event.23.t:0 "关外四名校签下做题家血盟"
 ebs_focus_event.23.d:0 "东北师大附中、哈三中、本溪高中、辽宁省实验中学的校长在沈阳碰杯，共同签署《重工做题家联合战线誓约》。数百万关外学子同仇敌忾！"
 ebs_focus_event.23.a:0 "誓与京津大院决一死战！"

 ebs_focus_event.24.t:0 "奉系考霸专列破关呼啸入京"
 ebs_focus_event.24.d:0 "汽笛长鸣，铁轨震颤！满载重工考卷与体训生军团的铁甲专列以不可阻挡之势撞破山海关关卡，关外做题大军昂首入关，直扑北京城！"
 ebs_focus_event.24.a:0 "大帅当年能入关，今天咱也行！"

 ebs_focus_event.25.t:0 "全国统一重工卷横空出世"
 ebs_focus_event.25.d:0 "教育部大楼顶层换上了黑土地的旗帜。大院自招与暗箱加分被全盘废除，全国统一推行冰雪淬火的重工业全国试卷。考场之上，只凭真才实学说话！"
 ebs_focus_event.25.a:0 "黑土地重铸华夏教育荣光！"

 ebs_focus_event.26.t:0 "绝密试卷印厂彻底封锁"
 ebs_focus_event.26.d:0 "北京郊区的高考试卷特种印厂被督导宪兵拉上铁丝网。特种油墨散发出刺鼻香气，每一张印出的考卷都承载着全国千万学子的命运大盘！"
 ebs_focus_event.26.a:0 "掌控试卷者，掌控天下"

 ebs_focus_event.27.t:0 "突击查抄江南华东竞赛题库"
 ebs_focus_event.27.d:0 "巡视督导突击队直扑江浙沪与黄冈，以‘违规内卷竞赛’为由强行没收了华东六校压箱底的数理绝密模拟卷，给南方考霸一记沉重闷棍！"
 ebs_focus_event.27.a:0 "削减对手模拟大盘积分！"

 ebs_focus_event.28.t:0 "全国试卷院难度曲线暗箱调控"
 ebs_focus_event.28.d:0 "试卷院通过动态操纵全国联考难度系数，定向抬高京津考区得分率，同时在南方考题中安插超纲陷阱，总署在全国做题天梯上一骑绝尘！"
 ebs_focus_event.28.a:0 "大盘尽在掌控之中"

 ebs_focus_event.29.t:0 "锁定全国前三甲象牙塔神位"
 ebs_focus_event.29.d:0 "放榜前夕，督导总署在全国八校排位天梯上的积分已牢牢锁定前三甲！没有任何地方诸侯能够撼动总署统治全国教育的神圣地位！"
 ebs_focus_event.29.a:0 "前三甲霸权，舍我其谁！"

 ebs_focus_event.30.t:0 "机械化督导组接管山河四省"
 ebs_focus_event.30.d:0 "督导大军兵分四路踏入晋冀鲁豫。毛坦厂与衡水的军事化管理模式被总署全面接管改造，华北千万做题大军尽归中枢指挥！"
 ebs_focus_event.30.a:0 "华北考区，彻底肃清！"

 ebs_focus_event.31.t:0 "华中楚天黄冈题库全盘抄没"
 ebs_focus_event.31.d:0 "大军跨过长江攻陷武汉！华师一附中与黄冈中学的百年秘密题库被一箱箱装上军列运往北京，华中考霸俯首称臣！"
 ebs_focus_event.31.a:0 "南方题库尽归督导总署！"

 ebs_focus_event.32.t:0 "粉碎华东华南自主命题联盟"
 ebs_focus_event.32.d:0 "江南的自主命题特权被彻底粉碎，岭南贵族国际部的私立壁垒轰然倒塌。从黄浦江畔到珠江两岸，所有学校挂起了全国统考大纲的红旗！"
 ebs_focus_event.32.a:0 "江南诸侯，悉数平定！"

 ebs_focus_event.33.t:0 "兵临蓉城锦江：合围盐道街"
 ebs_focus_event.33.d:0 "督导铁旅兵临成都锦江两岸，重重合围盐道街中学校区。川渝教育独立的最后堡垒在炮火与大喇叭广播中摇摇欲坠，终极统一只在今朝！"
 ebs_focus_event.33.a:0 "发起总攻，拿下盐道街！"

 ebs_focus_event.34.t:0 "太和殿颁布中央统考万世圣典"
 ebs_focus_event.34.d:0 "全国万校归一，海内四海宾服！在紫禁城太和殿前，总署向全国千百所重点高中校长庄严颁发《大一统全国高考考纲大典》，开启长达180天的全国考区大同核心化整合！"
 ebs_focus_event.34.a:0 "华夏教育，千秋一统！"

