  # ========================================================
  ebs_event.1.t:0 "最高教育局巡视督导专署成立：西单礼堂的水晶吊灯"
  ebs_event.1.d:0 "北京西单教育部大楼的三层中央礼堂内，头顶悬挂着数十盏沉重的水晶吊灯，将深红色的天鹅绒帷幕映照得如凝固的血浆一般。大厅里的暖气烧得滚烫，空气中弥漫着高级雪茄、浓苦茉莉花茶与印泥干涸的复杂气味。台下整整齐齐地坐着来自全国北方各省的四百余名教育特派员、直辖市重点中学校长与各学科带头人，人手一本烫金的《督导工作手册》，神色紧绷得如同等待发令枪响的死刑犯。\n\n“得嘞，您瞧瞧台下这帮外省来的校长，一个个缩着脖子，两只耳朵竖得比天线还直！”坐在主席台侧翼的大院干事压低嗓门，带着一口地道的京片子冲身旁冷笑，“今儿个西单大门一关，里头哪怕掉根针，外头各省都得当平地惊雷听！这叫规矩，大院红墙根底下的规矩，千百年都是这么定下来的。”\n\n台上，总专员身着没有一丝褶皱的深灰中山装，左胸端端正正地佩戴着一枚金边校徽。他慢条斯理地拧开紫砂保温杯，抿了一口热茶，随即以沉稳而略带官腔的燕京官话发表题为《回归教育常识、狠挤课堂水分》的主旨报告。讲话中，“四个回归”、“淘汰水课”、“打造样板金课”与“全国一盘棋”等词汇在扩音喇叭里震荡回响，台下适时爆发出雷鸣般的掌声。"
  ebs_event.1.next:0 "下一页 →"
  ebs_event.101.t:0 "最高教育局巡视督导专署成立（续）"
  ebs_event.101.d:0 "然而，散布在后排走廊边缘的外省代表们却各个手心冰凉、如坠冰窟。来自冀南平原与鲁西南的几位老校长紧紧攥着泛黄的笔记本，指关节捏得发白。所有人都心知肚明，所谓“狠挤水分”，绝非减轻中小学生的课业负担，而是通过最严苛的行政规训与大纲统裁，将外省做题家十载寒窗考来的高考录取大盘狠狠挤干，连皮带肉全部补贴给海淀与西城大院的子弟。\n\n“局气？大局？俺们村里的娃娃天天五更天爬起来背书，头悬梁锥刺股，到头来连个大专线都快摸不着了，合着俺们流的血汗全是‘水分’？！”一位老教师在阴影里咬着牙低声啜泣，但声音瞬间被雷鸣般的颂扬掌声彻底淹没。\n\n主席台上，陈专员神情泰然自若，手握那枚纯铜铸造的‘最高教育巡视督导之印’，在首批全国特级巡视调令上重重砸下一圈鲜红刺目的印油。随着公章落下的沉闷脆响，一场以常识之名行特权之实的应试整风，已如寒冬腊月的冻雨般席卷大江南北。"
  ebs_event.101.a:0 "传令全署，即日启动全国特级巡视！"
  ebs_event.2.t:0 "周总导的评估风暴：麦田插麦苗"
  ebs_event.2.d:0 "全国中学教学水平五年大评估的风暴，如同一枚呼啸而至的洲际导弹，精准砸中了华北平原上的某所百年示范高中。带队特使那句“以评促改、重在建设、形式也是生产力”的严令尚未降温，县城里的校长已经整整三天两夜不敢合眼。\n\n按照专家组下达的验收标准，学校必须具备“现代化全生态绿色实验基地”与“全覆盖绿色草坪”。然而时值数九寒冬，华北平原狂风呼啸，零下十二度的严寒早已将操场冻成干裂起皮的黄泥沼泽，校门外的十亩农研田更是一片焦枯瓦砾。为了避免在督察专列进站时被当场摘除全国重点名牌、校长撤职查办，全校七百名师生在半夜被刺耳的警报声强行拉出被窝。\n\n“作孽啊！弄啥嘞这是！”后勤主任冻得鼻涕直流，跺着脚在大喇叭里嘶吼，“县里所有油漆厂的军绿油漆全给老子包圆了！高压喷枪给我顶上去！不管泥地结多厚的冰碴子，天亮前必须给我喷出反光的草绿色来！还有菜棚里的麦苗，连夜拔，按株算钱，天亮前必须在焦土上给我插得溜齐！”"
  ebs_event.2.next:0 "下一页 →"
  ebs_event.102.t:0 "周总导的评估风暴：麦田插麦苗（续）"
  ebs_event.102.d:0 "刺鼻的劣质工业军绿油漆在严寒的夜色中被灌进高压喷枪，浓烈的苯类溶剂与稀释剂气味弥漫了整座校园。学生们戴着线手套，在反光的绿漆泥地里冻得牙齿打战；校门外十亩瓦砾荒地上，成排的师生打着手电筒，用粗铁丝和热熔胶硬生生把几万株嫩麦苗插进龟裂冻土里。\n\n次日清晨八点整，周总导那辆挂着特殊牌照的黑色伏尔加轿车缓缓驶入校门。晨光照耀下，操场在剧毒的油漆蒸汽中反出刺目欲呕的荧光草绿色，校门外的十亩荒地更是不可思议地立满了碧绿挺拔的嫩麦苗，宛如神迹。\n\n车窗缓缓摇下，周总导深吸了一口刺鼻的油漆风味，神色威严地推了推玳瑁眼镜，露出了赞许的笑容：“瞧瞧！这就叫大干快上的革命干劲！形式抓得硬，教学才能立得住！外省那些老古董整天念叨师资、生源，全是一派胡言！只要思想不滑坡，荒地也能长麦苗！”"
  ebs_event.2.a:0 "形式也是生产力，批准为全国示范样板！"
  ebs_event.2.b:0 "内部下发通报批评，但达标报告照样归档。"
  ebs_event.3.t:0 "体优生风波：87名国家二级运动员"
  ebs_event.3.d:0 "辽宁本溪的一所超级高中再次将教育部推上了舆论的风口浪尖。一封由退职教师联名签署的绝密举报信直接递到了总署督察室：该校本届高三千余名毕业生中，竟然有整整八十七人整整齐齐地被授予了“国家二级运动员”称号，并顺理成章地在高考档案中锁定了二十分的巨额特长加分。\n\n更荒诞的是加分项目的分布——本溪地处辽东深山区，冬季大雪封门长达四个月，市内甚至连一座符合国家标准的室内恒温游泳馆或专业击剑道都没有，但名单上却赫然列着三十名“国家游泳健将”、二十名“高级赛艇舵手”与十余名“现代五项全能高手”。\n\n“嘛玩意儿？赛艇？深山老林里滑旱船呢？！”总署督察组的年轻专员翻看着档案，忍不住嗤笑出声，“合着辽宁的学生个个是浪里白条，在冰碴子里能游出奥运标准来？这假造得连底裤都不要了！”"
  ebs_event.3.next:0 "下一页 →"
  ebs_event.103.t:0 "体优生风波：87名国家二级运动员（续）"
  ebs_event.103.d:0 "然而面对质询，本溪校方与体卫艺司的对接人员却显得气定神闲。在西单一处私密茶楼里，厚厚一沓训练考勤表与获奖记录被拍在红木桌上——令人瞠目结舌的是，这些赛艇与击剑的俱乐部实训章，赫然全部盖着北京王府井某家老字号烤鸭店后厨配餐部的公章！\n\n王司长端起紫砂杯，慢条斯理地吐出一口茶沫子：“小同志，甭少见多怪。这叫‘特长曲线救国’，懂不懂？大院的指标有限，地方有钱有门路的家长想让孩子上清北，走走体育加分的绿色通道，那是促进教育资金活化的双赢之举！烤鸭店怎么了？烤鸭店的冷库能模拟极地耐寒训练，怎么就不算国家高水平基地了？！”\n\n在金钱与指标的隐秘链条上，这八十七张薄薄的二级证书早已脱离了体育的本质，化作了每张价值六位数、在地下黑市疯狂流转的特权兑换券。"
  ebs_event.3.a:0 "责令地方纪委突击复核，严厉整肃造假！"
  ebs_event.3.b:0 "由体卫艺处出面指导，将经验‘合规化’吸收。"
  ebs_event.4.t:0 "高原天梯：谁在雪域空挂学籍？"
  ebs_event.4.d:0 "一则带有高清航拍与学籍截图的深喉长文在全国教育论坛上悄然炸开：某所全国顶级名校的校长独子，高中三年每天在海淀最豪华的恒温空调实验班里接受国家级特级名师一对一辅导，然而其高考报名的电子档案与户籍底册，却神不知鬼不觉地被归档在了海拔四千余米的青藏雪域高原自治区。\n\n凭借郗特使亲自审批签署的“边疆干部定向帮扶与民族教育专项援建”名目，该生在没有任何高原生后痕迹的前提下，顺利获得了少数民族降分照顾与专属强基名额。四百分出头的折算总分，足以让河南、河北的寒门学子名落孙山，而在这份特殊的红头名单上，却赫然被拟录取为最高学府的钱学森力学实验班。\n\n网络论坛与各省教研群内瞬间炸开了锅，做题家们的质问帖在短短两小时内刷爆了十万层楼：“我们在平原熬干心血考六百分上专科，大院子弟在海淀吹着空调空挂边疆就能四百分进清北？这天底下还有没有讲理的地方？！”"
  ebs_event.4.next:0 "下一页 →"
  ebs_event.104.t:0 "高原天梯：谁在雪域空挂学籍？（续）"
  ebs_event.104.d:0 "面对网络舆情的剧烈发酵，西单教育部大楼新闻发布厅的大门准时敞开。发言人理了理西装领带，端起白瓷茶杯抿了一口温水，神情泰然自若，声音平稳得听不出一丝波澜：\n\n“关于部分网民反映的援建学籍问题，总署在此作如下说明：这是深入贯彻对口援藏国家战略的生动体现。相关干部子弟克服了严重的低压缺氧心理障碍，在精神层面深度扎根边疆、反哺民族教育。其在思想政治觉悟与大局意识上做出的巨大牺牲，绝非几张冷冰冰的文化课试卷所能衡量！”\n\n“个别省份人员借题发挥、煽动地域对立，系严重违背大局意识的行为。相关违规发帖已被依法依规清理，请广大考生安心备考，切勿听信谣言。”\n\n大厅的落地窗外，北京深秋的落叶漫天飘零，寒门学子的悲愤质问被无形的权力大网彻底抹平在互联网的死寂深处。"
  ebs_event.4.a:0 "压制网络讨论，以边疆稳定为由低调处理。"
  ebs_dongbei.1.t:0 "⭐️ 东三省学校之问：为何我们不能取而代之？！"
  ebs_dongbei.1.d:0 "吉林长春与黑龙江哈尔滨的夜空下，暴风雪呼啸着撞击着老旧教工大楼的双层木框玻璃。在东北师大附中深处的一间会议室里，来自东三省二十所重点高中的老校长与骨干教师围聚在烧得通红的铸铁取暖炉旁。空气中弥漫着廉价旱烟与浓苦茉莉花茶的味道，桌面上摊开的，是北京督导组刚刚下发的又一份红头调令——东三省本年度清北录取指标再度削减一成，而东北精心培育的六名奥数国家集训队尖子，也被督导组以“全国拔尖人才集中孵化”为由强令无偿调拨进京。\n\n整间屋子死一般沉寂，只有铸铁暖气管发出的沉闷水锤声。忽然，哈尔滨三中的一位老校长猛地把掉瓷的搪瓷茶缸狠狠砸在铁皮桌上，铁皮凹陷的脆响在暴风雪中炸开：\n\n“凭什么？！凭什么海淀那帮骑马击剑的少爷小姐，北京卷考四百分就能大摇大摆跨进名校；咱们黑土地上的孩子在零下三十度的暴雪里早晨五点爬起来刷穿三千套重工卷子，却只能去争高职调剂？！”\n\n“当年奉系大帅能坐着铁甲专列入关进北京，咱东三省几百万冰雪做题家，难道就当不得这教育部的主人？！”\n\n“督导组的龙椅，北京的大官坐得，咱东三省为何不能取而代之？！”\n\n这一句回荡在漫天飞雪中的灵魂诘问，终于将压抑数十年的关外做题家之怒彻底点燃。一场问鼎北京中枢、誓要将全国考卷彻底翻盘的逆袭大谋，在黑土地的熔炉中轰然启动！"
  ebs_dongbei.1.a:0 "关外龙吟，京城将变！"
  ebs_dongbei.2.t:0 "⭐️ 奉系考霸大举入关：接管教育部！"
  ebs_dongbei.2.d:0 "长春与沈阳发出的铁甲列车如巨兽般撞碎了山海关的封锁道口！在东北师大附中、哈尔滨三中与本溪高中的联合帅旗下，数十万身穿深蓝加厚校服的关外重工做题大军与体训生军团，以不可阻挡之势踏破了北京西单教育部大楼的青铜大门！\n\n大厅里，陈专员的保卫纠察队望风而逃，海淀贵胄锁在保险柜里的暗箱保送名册被当众抛下天井，在风中撕碎成漫天白纸。满头白发的老校长踩着破碎的门框大步踏入最高常务会议室，将整整一套经由东北重工业淬火的全国统一理综试卷重重砸在主席台正中央：\n\n“从今天起，全国考纲归黑土地说了算！全国所有考生，不论大院出身还是深山寒门，一律凭卷面红笔分数见真章！”\n\n东三省名校联合公社宣告成立，关东考霸彻底入主中枢，华夏应试秩序自此翻天覆地！"
  ebs_dongbei.2.a:0 "换了人间！重工做题家万岁！"
  ebs_event.20.t:0 "试卷院捷报：清华附中算力彻底封锁信息学！"
  ebs_event.20.d:0 "清华附中地下超算中心发来红头捷报：通过动态调整全国高考试卷院的信息学竞赛命题逻辑与实时阅卷权重，清华附中工程团队已彻底将全国信息学赛道纳入督导总署的绝对算力掌控之中！\n\n外省竞赛强校精心准备的传统贪心与图论算法，在海淀地下机房庞大的对抗生成网络面前遭遇全面降维打击。外省选手的解题模型接连超时崩溃，总署在全国八校排位天梯中的领先优势被进一步拉大到不可追赶的量级。"
  ebs_event.20.a:0 "算力即真理，代码重构天下！"
  ebs_event.21.t:0 "1938 盛夏全国教育大战总动员令！"
  ebs_event.21.d:0 "1938年6月7日清晨，随着全国统一高考放榜钟声在天安门广场上空敲响，各大地方考霸集团公然拒绝承认总署签发的全国录取排位大盘，全面引爆了席卷全中国的教育大战！\n\n最高教育督导总署签署一级战备管制动员令！所有巡视专列就地挂装装甲板转化为铁甲军列，所有高三考场就地修筑堑壕转化为战斗要塞。督导铁旅将以铁血纪律踏平一切抗拒中枢大纲的割据学校，用绝对的权威征服全国每一个考区！"
  ebs_event.21.a:0 "为了中央考纲的绝对威严，全线出击！"
  # ========================================================
  # EBS INTERWOVEN CRISES & ENDINGS
  # ========================================================
  ebs_crisis.1.t:0 "西单保密室的撬痕：九楼走廊的寒意"
  ebs_crisis.1.d:0 "北京西单教育部大楼的深秋清晨，薄雾笼罩着灰蒙蒙的红砖外墙。九楼机要档案处的值班干事在换岗时，手中的搪瓷茶缸险些脱手砸在水磨石地面上——那扇用两寸厚冷轧钢板特制的甲级防盗铁门，锁芯竟被某种高压液压剪强行顶开，扭曲的黄铜簧片散落一地，门缝间弥漫着刺鼻的润滑油与焦糊电路味。\n\n“张处……张处！出天大的娄子了！”年轻干事连滚带爬地冲进值班室，脸色白得像刚捞出来的石灰粉，“里头三号机要柜的锁全让人给崩了！”\n\n档案室深处，三只涂着草绿色防锈漆的绝密保险柜门大敞，里面用红麻绳捆扎的厚重卷宗不翼而飞。那绝非普通的学期总结，而是过去三年来整个北方应试帝国的命根子：京津大院内定直升清北的自招名单、中小学食堂统一采购预制菜的高达七成流水回扣账本、由突击检查组签发的“麦田插麦苗、泥地刷绿漆”评估造假报告，以及辽宁某重点中学数十名凭空捏造的国家二级运动员审批表。"
  ebs_crisis.1.next:0 "下一页 →"
  ebs_crisis.101.t:0 "西单保密室的撬痕（续）"
  ebs_crisis.101.d:0 "消息在短短半小时内震动了整座九层大楼。九楼常务走廊上的脚步声骤然杂乱，几个核心处室的厚重红木大门接连反锁。所有大院官僚心里都清清楚楚，这些黑料一旦顺着邮筒流出西单大街，就足以在北方乃至全中国引爆一场摧毁所有既得利益者的政治海啸。\n\n“得嘞，这回是真要底儿掉了！”保卫科的头儿反锁上门，在沙发前急得直转磨磨，“这些账本要是落在外省那帮不要命的做题家手里，长安街都得让人给堵瓷实了！陈专员的电话刚打过来，就一句话：哪怕把西单掘地三尺，也得把这窟窿给老子堵上！”\n\n保卫科荷枪实弹的皮靴声在大理石走廊上急促回响。机房的技术官僚与大院的内卫纠察在大厅里撞在了一起，双方神色戒备、剑拔弩张。中枢的巨头们必须在晨光破晓前，做出第一道关乎生死的封锁抉择。"
  ebs_crisis.1.a:0 "调动保卫科封锁西单路口，启动内部特权核查"
  ebs_crisis.1.b:0 "接入中央机房算力矩阵，对整座大楼实施全天候通信监控"
  ebs_crisis.2.t:0 "餐盒里的料理包与虚构的运动员：传抄的油印小册子"
  ebs_crisis.2.d:0 "封锁指令终究慢了一步。失窃案发生后的第三天，几份用老式油印机复印的绝密清单便如同雪片般飞向了南方各大报馆、各省教研室与各大重点高中的传达室。尽管多数大报在收到总署禁令后选择了撤稿，但字里行间那令人瞠目结舌的黑金流水，已在私下抄送的油印小册子中疯狂传抄。\n\n清单上的内容触目惊心：辽宁本溪某高中本届毕业生中，整整八十七名凭借“羽毛球与现代五项”享受高考二十分加分的国家二级运动员，其训练场证明竟然全部盖着北京王府井某家烤鸭店后厨的公章；而分发至北方各中小学校园的所谓“国家营养改善配餐”，竟全是保质期长达三百六十五天、常温堆放在生锈集装箱里的高盐重油预制菜包，其幕后特许总代理正是后勤巨头堂兄名下的空壳皮包公司。\n\n“八十七个运动员全在烤鸭店集训？！吃了一年料理包，学生肝肾功能指标全线爆表，合着咱们天天交伙食费，全在给北京大院喂肥猪？！”山河四省与江南各大高中的贴吧和论坛瞬间陷入了狂暴的愤怒。"
  ebs_crisis.2.next:0 "下一页 →"
  ebs_crisis.102.t:0 "餐盒里的料理包与虚构的运动员（续）"
  ebs_crisis.102.d:0 "远在千里之外的关外黑土地上，长春与哈尔滨的校长们捏着泛黄油印单据的手在剧烈颤抖，多年积压的怒火终于冲破了压抑的冬夜。东三省名校联合起草了一封措辞极其严厉的通电质询书，直接砸向西单中枢。\n\n而在西单大楼内部，总务后勤处紧闭的百叶窗后烟雾弥漫。后勤官员们一边撕碎着原始采购单，一边手忙脚乱地往碎纸机里填塞支票存根。王总管满头大汗地抓着保密电话大喊：\n\n“慌什么？！慌个屁！把今年预备给各省巡按使的‘教研津贴’翻一倍！在京城大饭店摆上五十桌海参鲍鱼宴，请那些带头闹事的骨干校长过来吃！酒杯一端，调令一转，谁要是再敢嚼舌根子，老子直接扣他们学校明年的自招强基名额！看谁骨头硬！”\n\n推杯换盏的酒香与油印账本的焦墨味在空气中剧烈厮杀，危机的引线已经烧到了雷管边缘。"
  ebs_crisis.2.a:0 "动用总务专项公关小金库，设宴封口并内部消化"
  ebs_crisis.2.b:0 "关外名校发出联名质询电报，公开声讨招生与加分黑幕"
  ebs_crisis.3.t:0 "绿漆操场上的刺鼻晨雾：剧毒的示范样板"
  ebs_crisis.3.d:0 "为了强行转移公众对后勤与加分黑料的视线，督导总署紧急启动了新一轮“全国重点高中教学水平特级达标迎检”。突击专家组的黑色轿车车队呼啸着开进华北某示范重点中学，勒令该校必须在七十二小时内达到“百分之百绿色生态校园”的严苛指标。\n\n面对完不成就当场摘牌降级的红头通报，陷入绝境的校方在零下八度的严寒长夜里动员了全校七百名师生。刺鼻的工业军绿油漆被一桶桶倒进高压喷枪，两万平米坑洼泥泞的黄土操场连夜被涂刷得反出刺目欲呕的荧光绿。然而次日清晨，当全校学生在寒风中集合晨跑时，蒸发的高浓度苯与芳香烃有毒溶剂如浓雾般在跑道上方弥漫。\n\n“咳……咳咳！老师，俺眼睛疼得睁不开……嗓子着火了！”一名高三尖子生突然一头栽倒在反光的绿漆泥地里，紧接着，第二名、第三名学生相继剧烈抽搐、口吐白沫晕厥过去。短短半小时内，两百余名高三考生在绿漆操场上倒伏不起，救护车的凄厉警笛声撕裂了整座县城的破晓！"
  ebs_crisis.3.next:0 "下一页 →"
  ebs_crisis.103.t:0 "绿漆操场上的刺鼻晨雾（续）"
  ebs_crisis.103.d:0 "荒诞的是，当督导专家组的专车缓缓驶过校门，看着反光的绿地与整齐手抄的十年达标档案，带队的督学不仅在报告上郑重批下“全国生态文明示范样板”的高分，更在内部会议上拍板要求将这套“绿漆经验”向北方万所中学全面铺开推广。\n\n“周总导在电话里说得清清楚楚：‘搞改革哪有不死人的？！当年搞工业化还得流血流汗，迎检为了绿化环境，学生吸点油漆味怎么就不能克服了？！’传令下去，给全校师生配发防毒面具，戴着防毒面具也要按大纲把晨跑跑完！谁敢在迎检表上给差评，全家教职就地开除！”\n\n然而，学生家长的愤怒如同火山般爆发了。成千上万名愤怒的群众堵住了县城教育局的大门，手中高举着沾满绿漆的染血校服。师生的健康与官僚的狂热迎头相撞，全国性的学潮抗议已处于引爆边缘。"
  ebs_crisis.3.a:0 "签发督导战备命令：迎检标准绝不妥协，戴防毒面具继续推行"
  ebs_crisis.3.b:0 "大院出面调解：为中毒重灾区批复自招保送名额和稀泥"
  ebs_crisis.4.t:0 "开往雪域的绝密软卧专列：西宁铁轨上的拦截网"
  ebs_crisis.4.d:0 "一则来自青海省境内的紧急电报，彻底引爆了全中国做题家最后的理智底线。一列编号绝密、从北京西站直达拉萨的专线特快列车，在西宁机务段被数百名自发聚集的普通考生与离休教师围堵在铁轨中央。\n\n刺骨的风雪中，愤怒的群众拉起了白布黑字的长条横幅。当西宁地方铁路警力试图驱散人群时，几名退职老校长带头冲上了机车头，拔掉了机车刹车气阀。车厢大门被强行拉开，破门而入的记者与群众在车厢里目睹了足以载入华夏应试史册的奇观：\n\n整整五节豪华软卧车厢内，地暖温暖如春，坐满了来自海淀与西城大院的五百名应届考生。这群连一次雪山都没见过的干部子弟，正优哉游哉地吃着空运车厘子打着桥牌，人手一本墨迹未干的高原边疆户籍薄与少数民族加分证明。"
  ebs_crisis.4.next:0 "下一页 →"
  ebs_crisis.104.t:0 "开往雪域的绝密软卧专列（续）"
  ebs_crisis.104.d:0 "凭借郗特使签署的“边疆干部定向援建”红头便笺，这群大院子弟甚至无须在高原落脚一天，只要在拉萨考场签个名字，就能以四百分的超低门槛将全国最高学府的强基名额尽数收入囊中。\n\n围堵专列的群众在雪地里放声痛哭，散落一地的特批卧铺车票被冰雪冻结。北方各省与东三省各大高中的广播站里，学生们自发掐断了早自习的听力广播，播音员哽咽而愤怒地宣读着专列名单：\n\n“我们在零下三十度的冰原上把手脚冻烂，刷穿三千套理综卷子，到头来考六百分上专科；而他们大院的少爷小姐，坐着豪华软卧去高原晃悠一圈，四百分就能读清华力学实验班！这是何等彻头彻尾的掠夺与耻辱？！”\n\n怒火已经汇聚成汹涌的海啸，成千上万名考霸与青年教师砸碎了讲台，潮水般向着山海关与北京中枢涌去。"
  ebs_crisis.4.a:0 "以红头文件严厉通报：边疆对口交流不容非议，违纪追责"
  ebs_crisis.4.b:0 "关外考霸与各地学子联合起草檄文，誓要冲破京津特权壁垒"
  ebs_crisis.5.t:0 "山海关外的长鸣汽笛与西单绝境：兵临城下"
  ebs_crisis.5.d:0 "刺骨的北风卷着鹅毛大雪掠过华北平原，山海关外的铁轨发出剧烈震颤。满载着数千名东三省重点高中校长、骨干教师、重工业校友代表与体训生的三列重型铁甲蒸汽军列，撞碎了地方道口孱弱的阻拦网，拉响震天长笛呼啸冲入关内！\n\n北京西单教育部大楼已被潮水般的请愿人群层层合围。而在大楼内部，往日威严整洁的红地毯走廊已经变成了派系火拼的最后防线：保卫科荷枪实弹在楼梯口架设沙袋与铁丝网；机房的技术官僚切断了全楼电梯只给地下服务器供电，喇叭里播放着无休止的代码防暴通告；迎检特使在大厅拉响了尖锐的防空警报，下令实施全员戒严；而后勤财阀的运钞车更是直接顶死了正门大玻璃，保镖们握着金条与支票四处招揽倒戈的卫兵。"
  ebs_crisis.5.next:0 "下一页 →"
  ebs_crisis.105.t:0 "山海关外的长鸣汽笛与西单绝境（续）"
  ebs_crisis.105.d:0 "大楼外的口号声震天动地，大楼内的配电盘火花四溅。长安街上的路灯在风雪中忽明忽暗，数周以来的暗流、账本、绿漆、专列与千万做题家的怒火，全部汇聚在紧闭的顶层会议室门前。\n\n“各位老哥们儿，咱们今天算是把路走绝了！”陈专员站在窗前，看着楼底下黑压压一眼望不到头的人海，握着紫砂杯的手抖得连杯盖都在磕碰，“要么，把保卫科的所有家底压上去，在大街上筑起铁壁铜墙；要么……这西单大楼的主人，今晚就得彻底易主！”\n\n命运的指针在午夜十二点准时重合，四大巨头在黑暗中死死对视着，最终的审判已无法回避！"
  ebs_crisis.5.a:0 "依托大院纠察与督导宪兵，在西单大街构筑最后行政防线"
  ebs_crisis.5.b:0 "接管广播与数据中枢，呼应外部力量彻底终结旧时代"
  ebs_ending.1.t:0 "大院深处的红头调令：铁壁铜墙的王朝"
  ebs_ending.1.d:0 "晨曦的微光穿透了西单教育部大楼顶层的厚重天鹅绒窗帘。暴乱的喧嚣在保卫科森严的枪刺与数道红头调令面前渐渐平息。\n\n陈专员理了理笔挺的深灰中山装，胸前的金边校徽在朝阳下闪烁着冰冷的光芒。大院的保卫纠察队彻底接管了所有楼层，技术派的服务器被贴上封条，迎检特使与后勤商人被客气却决绝地请出了常务委员会。红木会议桌的正中央，那份被盗掘的绝密自招名单被重新端端正正地盖上了大印——不仅没有撤销，反而追加了直辖市的一本保护比例。"
  ebs_ending.1.next:0 "下一页 →"
  ebs_ending.101.t:0 "大院深处的红头调令（续）"
  ebs_ending.101.d:0 "“得嘞！瞧见没？这就叫大院的底蕴！”陈专员冷冷地吐出一口茶沫子，眼神如鹰隼般扫视着匍匐在地的外省教育联络员，“外省那些叫驴瞎嚷嚷什么？没有咱们大院子弟镇着中枢，这华夏的应试江山早让人折腾散架了！把这道红头调令下发全国：直辖市一本保护率提至百分之四十五，外省敢有妄议者，按破坏考务一律从严法办！”\n\n外省的杂音被定性为“个别人员受境外思潮煽动的违规闹事”。大院深处的大门再次轰然关闭，官僚的齿轮依旧严丝合缝地运转，在这片古老的土地上，门禁与出身筑起的铜墙铁壁，依然不可撼动。"
  ebs_ending.1.a:0 "大院的规矩，历来不可逾越。"
  ebs_ending.2.t:0 "机房里的最后一行代码：二进制神国"
  ebs_ending.2.d:0 "整座西单大楼的照明灯在午夜时分骤然熄灭，唯有清华附中地下二十米的超算机房爆发出幽蓝色的冷光。\n\n怀总工的工程师团队用液压钳剪断了大楼所有的内线电话，中央处理器的指令直接覆写了总督署的红头印鉴。那些泛黄的档案、推杯换盏的酒局、以及写满人情关系的自招批条，在一行行无情滚动的自执行智能合约面前被全盘作废。"
  ebs_ending.2.next:0 "下一页 →"
  ebs_ending.102.t:0 "机房里的最后一行代码（续）"
  ebs_ending.102.d:0 "全国每一间教室的微表情摄像头与脑电波监控矩阵被同时激活。液氮冷却管道散发着白雾，每秒数十万亿次的浮点运算冷酷地重构了每一个考生的命运档案。高考不再需要人工阅卷，算法将在零点零三微秒内解析出每一位学生的智力模型与社会奉献潜力，并将录取结果直接推送到生物终端上。\n\n“碳基生物的低效时代彻底终结了。”怀总工站在控制台前，指尖敲下回车键，“在绝对客观的算力面前，没有人能托关系，也没有人能偷奸耍滑。大专还是名校，算法早已算定。”人类考官的时代结束了，一个由绝对理性主宰的赛博考务帝国冷酷降临。"
  ebs_ending.2.a:0 "代码即命运，算力面前众生平等。"
  ebs_ending.3.t:0 "迎检风暴下的绝对样板：死寂的展览馆"
  ebs_ending.3.d:0 "刺耳的警报声中，周总导身披沾满绿漆的深色风衣大步踏入西单中枢礼堂，身后是数百名手持标尺、红笔与检查夹板的铁血督察宪兵。\n\n大礼堂的大门被铁链死死锁住。周总导将一份厚达一米的《全国教学整肃特急通报》狠狠拍在讲台上，怒吼声回荡在空旷的大厅：“什么黑金预制菜，什么西藏专列，统统是因为平时的迎检抓得不够紧、材料造得不够全！形式主义就是最高生产力，谁敢不服，老子当场摘了他的顶戴！”"
  ebs_ending.3.next:0 "下一页 →"
  ebs_ending.103.t:0 "迎检风暴下的绝对样板（续）"
  ebs_ending.103.d:0 "所有反抗的声音被按在椅子上接受合规审查。全国万所中学被即刻宣布进入“永久战备迎检状态”——凡操场绿化不达标者摘牌，凡十年教案不工整者撤职，凡对督导标准有微词者开除。\n\n全国三千所高中的操场日夜喷涂着荧光绿漆，百万师生戴着防毒面具在毒雾中通宵抄写假教案。整座国家化作了一座窗明几净、口号震天，却连一个活人的叹息都听不到的绝对示范样板房。周总导在空旷的操场上满意地露出了笑容。"
  ebs_ending.3.a:0 "以评促建到底，形式才是最高生产力。"
  ebs_ending.4.t:0 "西单金库的清脆回响：期货时代的应试狂欢"
  ebs_ending.4.d:0 "随着清脆的支票盖印声，西单大楼长达数月的政治僵局在金钱的纯金履带下被彻底碾平。\n\n王司长与王总管端坐在纯金雕花的真皮扶手椅上，两侧是堆叠如山的海外教育基金离岸账册。大院的元老收下了挂名顾问的百万年薪，督察的骨干拿到了校园配餐特许权的干股分红，喧嚣的抗议声在数以亿计的餐补资金与特长生名额拍卖中烟消云散。"
  ebs_ending.4.next:0 "下一页 →"
  ebs_ending.104.t:0 "西单金库的清脆回响（续）"
  ebs_ending.104.d:0 "西单教育部大楼底层被彻底改造成了“全国高考试卷期货交易所”。大屏幕上，清北保送名额标价一千万银元一股，名牌高中重点班学籍被包装成理财产品公开发行。全国中小学的食堂彻底被高利润预制菜托拉斯统领，二级运动员证书被明码标价陈列在玻璃展柜里。\n\n“哈哈哈哈！兄弟，买定离手！”王总管端着香槟放声大笑，“教育本就是天底下最暴利的买卖！只要银子到位，卷面零分也能保送博士！有钱能使鬼推磨，这金钱的王座，才是万岁不倒的真理！”"
  ebs_ending.4.a:0 "流水不息，金钱统治天下。"
  ebs_ending.5.t:0 "黑土地的军列开进教育部"
  ebs_ending.5.d:0 "伴随着惊天动地的巨响，教育部大楼厚重的铜制大门被一根粗壮的铁轨直接撞开！\n\n来自东北师大附中、哈三中、本溪高中与辽宁省实验中学的校长与骨干，在数十万关外做题大军与体训生方阵的簇拥下踏平了门槛。风雪随之席卷大厅，那份被奉为至宝的京津自招名单在老校长的铁掌下被撕成了碎片，扬向漫天风雪。\n\n“当年张大帅能坐专列入关，今天东三省考霸也一样能坐镇中枢！”老校长昂首走上主席台，将整套冰雪淬火的重工业全国试卷重重砸在讲台上。所有保送与大院特权被一扫而空，全国千万考生在同一张重工试卷面前凭借真才实学厮杀，黑土地的怒火彻底改写了华夏教育的苍穹！"
  ebs_ending.5.a:0 "教育部的主人，今天轮到东三省了！"
  # ========================================================
  # EBS FOCUS COMPLETION NARRATIVE EVENTS (1-34)
  # ========================================================
  ebs_focus_event.1.t:0 "中枢路线总博弈：常务会议室的绝命摊牌"
  ebs_focus_event.1.d:0 "北京西单教育部大楼顶层的常务会议室内，厚重的双层天鹅绒窗帘挡住了外头刺骨的秋风。长条红木会议桌正中央，那张铺开的《全国各省高考录取指标调控总表》已被各种颜色的红蓝铅笔划得千疮百孔。\n\n“陈老，您这算盘珠子拨得也太响了点儿吧？！”周总导猛地一拍桌子，桌上的茶杯震得嗡嗡作响，“迎检！老子带队在底下各省跑断了腿，三天给操场刷绿漆，五天手抄十年假教案，把各省学校整得服服帖帖！到头来分蛋糕，您大院一句话，把直辖市一本保护率提到百分之四十，合着俺们在前线拼命，全给海淀的少爷小姐当了长工？！”\n\n陈专员慢悠悠地摘下老花镜，拿真丝手绢擦了擦，嘴角浮起一抹冰凉的讥笑：“周司令，注意您的用词。大院的规矩，那是老一辈定下的制度基石。没有京津稳定的基本盘，你那套刷绿漆的把戏，在地方上能唬得住谁？得嘞，您甭跟这儿跟我瞪眼，坐下！”"
  ebs_focus_event.1.next:0 "下一页 →"
  ebs_focus_event.101.t:0 "中枢路线总博弈：四巨头决裂（续）"
  ebs_focus_event.101.d:0 "“够了！全都给我闭嘴！”怀总工猛地合上面前的便携式工业终端，机身外壳碰撞发出清脆的金属撞击声，“一帮沉溺在二十世纪官僚分肥游戏里的老朽！什么大院门荫，什么形式主义迎检，全都是注定被淘汰的垃圾！清华附中机房的算力矩阵已经就绪，从今往后，全国考务由算法绝对主宰，人类考官统统下岗！”\n\n“哎哎哎，怀院士，您这话说得可就生分了！”王总管打着饱嗝，剔着牙从真皮转椅上站起来，满身昂贵的茅台酒香与油腻气，“算力？代码能当饭吃啊？没有老子旗下三千家配餐公司的预制菜流水，没有王司长体卫艺司批发的二级运动员赞助款，你们机房连交电费的银子都没有！谁有钱，谁才是这西单大楼的太上皇！”\n\n茶杯在争吵中砸碎在墙上，电线被盛怒之下拔断，保卫科的荷枪警卫猛地推开了大门。脆弱的同盟在这一刻彻底粉碎，四大巨头各自摔门而去，中枢总决算正式拉开序幕！"
  ebs_focus_event.101.a:0 "大局已定，传令全国各省遵照执行。"
  ebs_focus_event.2.t:0 "督导总署全体常务例会开幕"
  ebs_focus_event.2.d:0 "西单中枢礼堂内座无虚席。四百余名来自北方各省的巡视专员身着统一深色制服，人手一本印着烫金大印的会议简报。台上的报告冗长而平稳，从“课堂挤水分”一路念到“教风学风一体化建设”。\n\n然而在长条桌下方，一张张手抄着本省自招保留名额与特级教师指标的折叠便签，却在皮包与公文夹间飞速传递。‘张处，今年海淀自招给咱省匀几个名额？’‘得了吧，海淀自家的大院子弟都分不过来，您还是多买两车预制菜巴结王总管去吧！’台面上是教育的宏图大计，台面下则是冷酷的利益交割。"
  ebs_focus_event.2.a:0 "官僚的齿轮已然咬合运转。"
  ebs_focus_event.3.t:0 "招待所里的密室分肥妥协"
  ebs_focus_event.3.d:0 "夜深人静，西单教育部大楼对面的第三招待所二楼却灯火通明。厚重的窗帘拉得严严实实，浓烈的烟草味与茅台酒香混杂在闭塞的套房内。几位老资格的督学与海淀名校的校董推杯换盏，言笑晏晏。\n\n几份没有任何正式红头编号的秘密会谈纪要摆在茶几上。在一片酒杯相碰的脆响中，外省各重点高中被悄悄划扣的千分之五自招调剂名额，被轻描淡写地瓜分殆尽，悉数充入京津重点中学的小金库中。‘局气！就按这个数定，外省那帮泥腿子翻不起大浪！’"
  ebs_focus_event.3.a:0 "皆大欢喜，除了外省的考生。"
  ebs_focus_event.4.t:0 "稽查处的绝密档案柜"
  ebs_focus_event.4.d:0 "总署稽查科深处的铁皮密码柜前，两名年轻的机要员戴着白手套，正将过去三年内北方各省的违规自招材料、假特长生档案与配餐流水账簿逐一贴上封条。\n\n这些档案详细记录了每一笔灰色赞助费的走向与每一个关系户的调档记录。只要这排密码柜的锁扣依然紧闭，它们就是维系总署内部恐怖平衡的杀手锏；可一旦柜门被撬开，足以在教育界掀起滔天巨浪。"
  ebs_focus_event.4.a:0 "将锁芯封蜡，锁入最深处的密室。"
  ebs_focus_event.5.t:0 "陈专员太上皇威权确立"
  ebs_focus_event.5.d:0 "大院的深红大门再度紧闭。总督学的一票否决权正式被载入总署最高章程，任何试图引入技术治理或市场化运作的激进提议，在总专员那支吸饱红墨水的钢笔下一律被画上了粗暴的红叉。\n\n海淀与西城的老大院子弟重新高枕无忧。官僚家长制的古老法则再次证明了其坚不可摧的生命力：规矩是老一辈定下的，而名额，自然也是大院的子嗣理所应当继承的特产。"
  ebs_focus_event.5.a:0 "大院规矩，万世不易。"
  ebs_focus_event.6.t:0 "京津录取铁壁铜墙铸就"
  ebs_focus_event.6.d:0 "由总署亲自批发的全新全国一本招生调控文件在全国各大名校公告栏上悄然公示。京津特区的一本上线率与重点大学本地保护配额，被以国家强制法令的形式永远锁死在全国平均线的三倍以上。\n\n在黄河两岸与太行山脉的千万做题修罗场里，外省学子必须刷穿上千套模拟卷才能争夺一个专科名额；而城墙之内的大院考生，却能在清晨的林荫道上从容漫步，轻松叩开全国最高学府的朱红大门。"
  ebs_focus_event.6.a:0 "给大院子弟铺就万代金光大道。"
  ebs_focus_event.7.t:0 "海淀幼儿园早培神话"
  ebs_focus_event.7.d:0 "海淀早培班的选拔战线正式推进到了幼儿园小班。四岁半的幼童在厚重的隔音考场内排成方阵，手持触控笔解析着由清北教授量身定制的奥数微积分模型与少儿马术理论。\n\n这套自摇篮直至博士后工作站的封闭式直通循环，将平民阶层的上升通道完全封死在城门之外。素质教育的旗帜迎风飘扬，上面用金线绣满了阶级繁衍的精密代码。"
  ebs_focus_event.7.a:0 "素质教育的终极闭环宣告落成。"
  ebs_focus_event.8.t:0 "不可动摇之特权阶层"
  ebs_focus_event.8.d:0 "西单大楼的门卫换上了荷枪实弹的内卫纠察。任何外省考霸的信访件在门房处便被统一塞入工业碎纸机，化作漫天纸屑。紫禁城角楼下的林荫道上，大院子弟骑着高头大马神采奕奕。\n\n在特权的铁幕之下，分数已不再是通行的货币，血统与编制才是决定命运的唯一符码。官僚贵胄的地位自此坚不可摧，化作一座不可撼动的应试神殿。"
  ebs_focus_event.8.a:0 "铁打的大院，流水的做题家。"
  ebs_focus_event.9.t:0 "清华附中服务器掌权"
  ebs_focus_event.9.d:0 "机房的指示灯在冰冷的机柜间连缀成星海。随着怀总工敲下最后一行回车指令，全国所有的纸质档案调令与人工审批印鉴被全面作废。\n\n一条条自执行智能合约如冰冷的铁链般锁死了各省教育局的数据接口。主考官的人情世故在纯粹的二进制算力面前荡然无存，一个由中央处理器自主决策、秒级裁断天下考生命运的赛博专政时代正式拉开序幕。"
  ebs_focus_event.9.a:0 "唯算力永恒，代码君临天下！"
  ebs_focus_event.10.t:0 "地下超算阵列全功率运转"
  ebs_focus_event.10.d:0 "清华附中操场地表以下二十米，数千台液冷服务器机柜爆发出震颤地底的低吼。在每秒数十万亿次的浮点运算压迫下，全国每一所重点中学上传的做题日志被解析得体无完肤。\n\n外省竞赛团队试图隐藏的独门压轴题解法，在算力中枢的穷举重构下无所遁形。信息学与奥赛的制高点被总署彻底焊死，外省再无夺金可能。"
  ebs_focus_event.10.a:0 "算法已将未来的考题全部穷举完毕。"
  ebs_focus_event.11.t:0 "脑电波与瞳孔微表情追踪全面部署"
  ebs_focus_event.11.d:0 "全国所有考场的课桌边缘，均被焊上了高精度的神经突触生物传感器与瞳孔对焦光圈。\n\n只要考生的眼球游离离开试卷超过零点三秒，红外系统便会发出低频警示并自动扣除信用积分；若脑电波波动出现发呆或焦虑特征，考场天顶的微型无人机将直接盘旋投下黄牌处分。在天网面前，连思维本身也被纳入了作弊审查的范畴。"
  ebs_focus_event.11.a:0 "在绝对的监控下，思想违纪无所遁形。"
  ebs_focus_event.12.t:0 "全国做题家信用算法生效"
  ebs_focus_event.12.d:0 "一套覆盖全体考生的动态信用分模型正式并网运行。早自习朗读分贝不足扣零点五分，错题本订正未按标准三栏排版扣一分，课间未按规定做眼保健操扣二分。\n\n学子们惊恐地发现，自己的一言一行、呼吸与步伐，都被折算成了冰冷的积分流动。唯有毫无个性的绝对做题机器，才能在信用大盘上维持绿色的通行权。"
  ebs_focus_event.12.a:0 "人类考生全面降格为算力节点。"
  ebs_focus_event.13.t:0 "算法即命运：秒下大专通知书"
  ebs_focus_event.13.d:0 "高考阅卷不再需要漫长的盛夏等待。当最后一场考试的交卷电铃响起的刹那，超算机房仅耗费了零点零三秒，便完成了全境数百万份电子试卷的交叉验证与难度对冲。\n\n考生的生物手环剧烈震颤，一行绿莹莹的荧光字迹冷酷地浮现在皮肤表面：“经神经网络判定，您的社会综合算力产出模型与某职业技术学院完美匹配，录取通知书已自动签章生效，终身不可更改。”"
  ebs_focus_event.13.a:0 "赛博命理学的终极闭环。"
  ebs_focus_event.14.t:0 "周总导吹响全境迎检号角"
  ebs_focus_event.14.d:0 "“谁敢在迎检的硬指标上打马虎眼，我就摘了谁的校长乌纱帽！”周总导身披沾满泥浆的皮风衣，在全国电视电话动员大会上把讲台拍得震天价响。\n\n全国数万所重点高中停下了所有的常规授课，整座北方的校园陷入了狂暴的战备迎检狂潮。形式主义的风暴拔地而起，每一块黑板、每一寸台阶，都被拉上了皮尺接受毫米级测量。"
  ebs_focus_event.14.a:0 "以评促改，形式才是最高生产力！"
  ebs_focus_event.15.t:0 "通宵手抄十年假教案"
  ebs_focus_event.15.d:0 "深夜两点的北方各大高中教师办公室里，数十万盏台灯彻夜未熄。特级教师与青年班主任们眼眶熬得血红，右手手指磨出了厚厚的老茧。\n\n桌上堆叠着高逾半米的手抄笔记本，教师们被勒令用不同颜色的圆珠笔、甚至是不同年代的陈旧墨水，通宵补齐过去十年来每一堂课的所谓“即时教学反思”与“家访详录”。材料厚度必须达到三尺，稍微潦草便是一票否决。"
  ebs_focus_event.15.a:0 "字迹整齐划一，这就是国家级示范！"
  ebs_focus_event.16.t:0 "迎检不过当场摘牌免职"
  ebs_focus_event.16.d:0 "突击督察宪兵队荷枪实弹开进某百年重点高中。在检查门卫室值班记录时，带队督学用白手套在登记簿背面抹出了一抹灰尘。\n\n冰冷的免职公文当场贴上了校门照壁，拥有四十年教龄的老校长被当场停职带离，学校降格为合格类薄弱校。万校肃然战栗，北方再无一人敢对迎检标准提出哪怕半句质疑。"
  ebs_focus_event.16.a:0 "重在建设，狠在肃反！"
  ebs_focus_event.17.t:0 "空无一人的绝对样板校"
  ebs_focus_event.17.d:0 "操场是刺目的军绿油漆，试验田里连夜插满带露水的嫩麦苗，档案室里的假材料从地面一直码到天花板。全校三千名学生被勒令集体闭门反锁在宿舍内，不准发出半点声响。\n\n当督察专车在空无一人的校园里转了一圈后，带队特使满意地在考评表上给出了全项满分的评语。一座完美无瑕、却连一个活人都不存在的荒诞示范帝国，在形式主义的顶峰悄然屹立。"
  ebs_focus_event.17.a:0 "完美而荒诞的极权样板。"
  ebs_focus_event.18.t:0 "王总管后勤商会登基"
  ebs_focus_event.18.d:0 "王司长与王总管并肩步入西单大楼最高会议室，身后跟着数十名西装革履的海外离岸基金顾问与后勤配餐财阀代表。大楼一层的传达室被改造成了金碧辉煌的商务洽谈大堂。\n\n每天数以亿计的校园配餐现金流与特长加分赞助费如瀑布般冲入特许账户。红头文件变成了特许经营合同，应试教育在资本的加持下被剥离了一切虚伪的面纱，化作最赤裸而高效的提款机器。"
  ebs_focus_event.18.a:0 "金钱开道，流水永存！"
  ebs_focus_event.19.t:0 "保质期一年的预制菜全面进驻"
  ebs_focus_event.19.d:0 "全国所有中小学的明火现炒食堂在三日内被全部强行封停拆除。一辆辆贴着统一特许标签的冷链集装箱车开入校园，卸下了数以亿计保质期长达三百六十五天的预制料理包。\n\n学生们在食堂里默默咀嚼着胶质般的料理肉块与重油重盐的调味汁，而后勤托拉斯的净利润率在当季财报上暴涨了整整七成。后勤巨头在庆功宴上开怀大笑：“吃不坏肚子，还能多收餐费，这就是现代物流的胜利！”"
  ebs_focus_event.19.a:0 "安全、标准、高利润！"
  ebs_focus_event.20.t:0 "离岸教育小金库秘密扩张"
  ebs_focus_event.20.d:0 "通过开曼群岛与苏黎世的数十家离岸空壳信托基金，数以十亿计的加分咨询服务费与校服采购回扣被悄然洗出境外。\n\n地中海沿岸的私人码头里停满了总署要员家眷名下的游艇，高尔夫球场上回荡着关于下半学期特长生指标拍卖的私密报价。金钱与权力的勾兑，在这里构筑起永不沉没的避风港。"
  ebs_focus_event.20.a:0 "资本无国界，加分亦有道。"
  ebs_focus_event.21.t:0 "黑金财阀掌舵全国教育"
  ebs_focus_event.21.d:0 "西单大楼底层设立了公开的“教育发展战略咨询大厅”。清北保送名额标价一千万，重点高中实验班录取资格五百万，甚至挂科与留级处分也可以通过现场认购后勤基金免除。\n\n手持大额支票的富商与豪绅在柜台前排起长龙，礼仪小姐面带微笑地开具着盖有总署公章的正规发票。只要资金到位，哪怕白卷亦能铸就栋梁！"
  ebs_focus_event.21.a:0 "金钱面前，人人平等买卷！"
  ebs_focus_event.22.t:0 "东北师大附中重工考纲母机秘密运转"
  ebs_focus_event.22.d:0 "长春自由大路的红砖教研楼深处，东北师大附中的特级教师天团已连续奋战了四十个昼夜。黑板上写满了关于重型机械传动、流体力学极限方程与唯物辩证法压轴大题。\n\n这台被称为“关东教研母机”的命题核心，剔除了所有大院子弟赖以自夸的击剑马术冷门八股，将试卷铸造得如同坦克装甲般厚重坚韧。黑土地的真才实学，正在这里淬火成锋利的冰雪利刃。"
  ebs_focus_event.22.a:0 "做题长子，铸造真理之剑！"
  ebs_focus_event.23.t:0 "关外四名校签下做题家血盟"
  ebs_focus_event.23.d:0 "沈阳浑河岸边的一间老式重工业厂房内，来自东北师大附中、哈尔滨三中、本溪高中与辽宁省实验中学的校长们在冰冷的铁桌旁紧紧握手。一份用毛笔写在老式蓝图图纸背面的《关外考霸铁血同盟条约》被共同盖上了钢印。\n\n东三省数百万重工子弟与冰雪做题家被全面动员，铁血同盟宣告成立。整座关外的教育资源连成铁板一块，向着山海关投去了复仇的目光。"
  ebs_focus_event.23.a:0 "誓与京津大院决一死战！"
  ebs_focus_event.24.t:0 "奉系考霸专列破关呼啸入京"
  ebs_focus_event.24.d:0 "刺耳的汽笛声如防空警报般撕裂了山海关的寒雾！满载着数万名关外做题尖子、体训生纠察队与上千箱重工教辅试卷的铁甲专列，以排山倒海之势撞飞了关卡上的阻车木桩。\n\n列车沿着京山铁路线呼啸前行，车窗上挂满了白底黑字的醒目横幅：“誓夺命题大权，还我黑土名额！”关外大军势不可挡，直插京师心脏！"
  ebs_focus_event.24.a:0 "专列破关，天地换色！"
  ebs_focus_event.25.t:0 "全国统一重工卷横空出世"
  ebs_focus_event.25.d:0 "西单教育部大楼顶层换上了黑土地名校的战旗。自招加分、边疆空挂、早培特权在红墨水的批注下一律作废，一套厚达十六页、涵盖重工业物理与极限代数的《全国统一重工试卷》被派发至全国每一间考场。\n\n考卷扉页上印着一行粗黑的大字：“分数面前，众生平等；唯有实学，方为真理！”黑土地的怒火彻底洗涤了应试的泥垢，重铸了教育平权的钢铁丰碑！"
  ebs_focus_event.25.a:0 "黑土地重铸华夏教育荣光！"
  ebs_focus_event.26.t:0 "绝密试卷印厂彻底封锁"
  ebs_focus_event.26.d:0 "北京郊区密林深处的高考试卷特种印厂四周，拉起了两道通电铁丝网与机枪掩体。重装宪兵日夜巡逻，任何进出印厂的工人和技术员均须接受防窃听防夹带检查。\n\n大型印刷机日夜轰鸣，刺鼻的特种油墨香气弥漫在厂区上空。全国千万做题家的命运被压缩在这一张张薄薄的试卷铅版之中，掌控了印厂，便掌控了整个帝国的神经中枢。"
  ebs_focus_event.26.a:0 "掌控试卷印厂者，号令天下！"
  ebs_focus_event.27.t:0 "突击查抄江南华东竞赛题库"
  ebs_focus_event.27.d:0 "由督导特派员率领的查抄车队以迅雷不及掩耳之势扑向江浙沪各大名校。在华东学校组织（ECE）的核心集训营内，专家组以“涉嫌超纲内卷与违规培训”为由，强行贴封了其压箱底的全国数学奥赛真题库与密卷讲义。\n\n一箱箱珍贵的数理教案被装上军用卡车拉往北京，华东考霸在全国排位天梯上的技术壁垒遭遇沉重一击，总署在天梯大盘上的积分再度跃升。"
  ebs_focus_event.27.a:0 "重挫南方考霸的技术壁垒！"
  ebs_focus_event.28.t:0 "全国试卷院难度曲线暗箱调控"
  ebs_focus_event.28.d:0 "全国高考试卷院地下机房内，命题组的专家们正在微调下一季度全真模拟考的难度参数。通过在压轴题中暗插京津重点中学常练的变式模型，同时在南方擅长的题型中设置超纲陷阱，两地的平均分被巧妙地拉开了整整四十分的鸿沟。\n\n地方省份的校长们百思不得其解，而总署在全国模拟联考天梯中的霸主地位，已在精密的数据调控下固若金汤。"
  ebs_focus_event.28.a:0 "大盘走势尽在掌控之中。"
  ebs_focus_event.29.t:0 "锁定全国前三甲象牙塔神位"
  ebs_focus_event.29.d:0 "放榜前夕，全国高考试卷院排位天梯大屏幕上，督导总署的积分进度条以无可争议的绝对优势突破了关键阈值，提前锁定了全国前三甲的孤傲象牙塔神位！\n\n无论是川渝的盐中同盟，还是两湖的黄冈题库，在总署庞大的体制与资源压制下，皆无法动摇中枢的王座。这一场盛夏大考尚未开锣，胜负却早已在西单的红头文件里注定。"
  ebs_focus_event.29.a:0 "象牙塔霸权，舍我其谁！"
  ebs_focus_event.30.t:0 "机械化督导组接管山河四省"
  ebs_focus_event.30.d:0 "数十支机械化督导突击支队沿着京汉铁路线南下，大举进驻晋冀鲁豫高考修罗场。衡水与毛坦厂的超级寄宿学校被全盘改组接管，军事化的作息与洗脑口号被无缝并入总署的战时动员体制。\n\n山河四省千万精锐做题大军放下了对地方校领导的忠诚，排成望不到边际的做题军团，整装待发接受总署的最高调遣。"
  ebs_focus_event.30.a:0 "华北修罗场全盘收归中枢统率！"
  ebs_focus_event.31.t:0 "华中楚天黄冈题库全盘抄没"
  ebs_focus_event.31.d:0 "大军强渡长江，武汉教育要塞在连日围攻下轰然开门。华师一附中与黄冈中学传承百年的绝密物理实验题库与独门教案，被一箱箱贴上督导总署的封条，装上重型军列直发北京。\n\n楚天考霸的傲骨在督导铁旅面前折断，两湖名师悉数登报声明拥护全国统一考纲，华中考区自此彻底平定。"
  ebs_focus_event.31.a:0 "南方题库尽归总署囊中！"
  ebs_focus_event.32.t:0 "粉碎华东华南自主命题联盟"
  ebs_focus_event.32.d:0 "江南的自主命题特权土崩瓦解，岭南私立国际部的贵族壁垒在督导宪兵的战靴下粉碎。从黄浦江畔的百年名校到珠江三角洲的国际实验园区，全线降下了地方考纲的旗帜。\n\n整齐划一的全国统一教材与作息时间表被强推至每一所学校，江南文人墨客的自主骄傲，在中央集权的铁律面前烟消云散。"
  ebs_focus_event.32.a:0 "江南诸侯，悉数平定归附！"
  ebs_focus_event.33.t:0 "兵临蓉城锦江：合围盐道街"
  ebs_focus_event.33.d:0 "初冬的蓉城薄雾弥漫，锦江两岸的老柏树落了一地枯叶。督导铁旅的装甲吉普车队带着刺耳的警笛声开进望江楼外围，将盐道街中学的整个老校区与新校区围得水泄不通！\n\n九眼桥河堤边上，老茶馆‘听雨轩’的大门被督导宪兵强行踹开。而对岸盐道街中学的教学楼顶上，刺耳的防空警报声与高音大喇叭广播正以浓烈的成都方言响彻云霄：\n\n“北京来的督学算个铲铲！懂不懂啥子叫办学？！想骑在老盐中脑壳上搞大一统？你问问九眼桥下头滔滔江水答不答应！老子们就算把最后一套压轴理综卷嚼碎吞进肚子里，也绝不给西单大院当孙子！川渝的做题骨头硬得很，有种你娃就打进来试哈看！”"
  ebs_focus_event.33.next:0 "下一页 →"
  ebs_focus_event.133.t:0 "兵临蓉城锦江：合围盐道街（续）"
  ebs_focus_event.133.d:0 "望江楼下，北京督导特派使站在黑呢子伞底下，慢悠悠地吹了吹紫砂杯里的浮沫，听着对岸激烈的川骂冷笑了一声：\n\n“得嘞！瞧这帮川耗子扯把子呢！还‘九眼桥的水要改道’？今儿个哪怕都江堰决了堤，也挡不住中央统考的红头钢印！传我命令：全线架上高音喇叭，宣读总署最后通牒！防暴水枪与推土机准备就绪，只要交卷钟声一响，立刻破门接管老盐中档案室！是龙得给我盘着，是虎得给我卧着！”\n\n川渝教育独立的最后堡垒在钢铁洪流面前剧烈颤抖，终极的应试决战在锦江河畔轰然引爆！"
  ebs_focus_event.133.a:0 "发起总攻，拿下盐道街！"
  ebs_focus_event.34.t:0 "太和殿颁发中央统考万世圣典：四海宾服"
  ebs_focus_event.34.d:0 "全国万校归一，四海九州宾服！紫禁城太和殿前的三层汉白玉石阶上，狂风卷着细碎的初雪呼啸掠过。来自全国所有省份、直辖市、特区与各名校联盟的三千余名校长，身着深色正装，神情肃穆地跪拜在丹墀中轴线两侧。\n\n大殿正门轰然洞开，黄铜礼炮在午门上方鸣响二十一发，震颤了整座北京城的晴空。总专员手捧由金丝织就、厚达三百页的《大一统全国统一高考考纲万世圣典》，踩着明黄色地毯缓步走上九龙御座前台。"
  ebs_focus_event.34.next:0 "下一页 →"
  ebs_focus_event.134.t:0 "太和殿颁发中央统考万世圣典（续）"
  ebs_focus_event.134.d:0 "纯铜的‘最高教育督导之宝’沉重地砸在圣典扉页的朱砂印泥上！那刺目鲜红的印记，宣告了地方教育割据时代的彻底终结：\n\n自今日起，从关东黑土地到南海之滨，从青藏高原到江南水乡，全国千万学子面对同一套考纲、同一批命题专家、同一种评分法则！一切加分乱象、一切地方壁垒，在中央集权的绝对伟力面前化为尘埃。华夏应试帝国迎来了它最辉煌、亦最森严的永恒大一统纪元！"
  ebs_focus_event.134.a:0 "华夏教育，千秋一统！"
  # ========================================================
  # EBS FOCUS COMPLETION NARRATIVE EVENTS (35-60)
  # ========================================================
  ebs_focus_event.35.t:0 "强基与自招特权全面封闭"
  ebs_focus_event.35.d:0 "西单教育部大楼的密室门缓缓合上。红木书架后方暗格里，那份由总署与海淀校董联合签署的《拔尖创新人才直通保送章程》被郑重盖上了钢印。\n\n从今年起，全国顶级名校自主招生与强基计划的报名审核权限，被彻底收归至由大院元老掌控的特种评议委员会。所谓的综合素质评价标准，被暗中加入了马术、击剑、帆船以及南极冰川科考等唯有大院子弟方能涉足的昂贵项目。普通省份的寒门做题家即便在联考中斩获满分，亦会因‘综合素养缺乏国际视野’被一票否决于初审门外。特权的大门在无声无息中焊死了最后一道缝隙。"
  ebs_focus_event.35.a:0 "大院深似海，龙门自此闭。"
  ebs_focus_event.36.t:0 "狠挤水分：向课堂自由开刀"
  ebs_focus_event.36.d:0 "总署下发的《课堂去水化八条军规》如暴风雪般扑向北方各省的中小学校园。陈专员在万人广播大会上怒斥地方教师‘借启发式教学夹带私货、浪费课堂宝贵时间’。\n\n成百上千名特派督学员手持计时秒表与标准教案范本，悄然坐进每一间高三教室的后排。教师在黑板上多写一句诗词鉴赏、多讲一个解题思维背景，便会被当场记录为‘严重课堂注水’并扣除年终绩效。所有的黑板被要求按毫米级标准分割为题干区、公式区与答案区。个性被彻底铲除，整座北方的讲台化为了机械吐出标准答案的冷酷打印机。"
  ebs_focus_event.36.a:0 "挤干课堂水分，只留做题干货！"
  ebs_focus_event.37.t:0 "中央巡视组常态化入驻"
  ebs_focus_event.37.d:0 "一列列挂着深红号牌的黑色轿车缓缓开进北方各大重点高中的校门。车门拉开，身披呢子大衣、神情冷峻的中央督导特派员手提公文箱大步踏入行政大楼，门卫与保安无不躬身敬礼。\n\n校长办公室的电话线路被直接接入巡视组的临时机要室，学校档案室的全部十年卷宗被当面贴上封条。二十四小时匿名举报信箱被焊在教学楼最显眼的位置，任何对大院特权与指标分配稍有不满的议论，在两小时内便会化作特派员桌上的谈话笔录。中枢的鹰犬已经稳稳扼住了地方的喉咙。"
  ebs_focus_event.37.a:0 "红头巡视，令行禁止！"
  ebs_focus_event.38.t:0 "红头钢印一票否决制"
  ebs_focus_event.38.d:0 "一枚纯铜铸造、重逾三斤的‘最高教育督导特级规训之印’在西单大礼堂隆重亮相。伴随着陈专员亲手盖下的第一份行政裁决书，一项彻底剥夺地方抗辩权的铁律正式生效。\n\n凡经督导组认定存在‘教风涣散、教材超纲或考务阳奉阴违’的学校，督导组无须通过地方政府，可直接以中枢一票否决权撤销其省级示范校资质、冻结其当年全部高考报名通道，并将校长即刻移交行政惩戒处。红印盖落，如同雷霆降临，各省校长无不手心冒汗、噤若寒蝉。"
  ebs_focus_event.38.a:0 "大印落下，万校俯首！"
  ebs_focus_event.39.t:0 "新应试帝国太上皇法典颁行"
  ebs_focus_event.39.d:0 "金碧辉煌的西单大礼堂内，头顶数千盏水晶吊灯洒下灼热的白光。陈专员端坐在铺着明黄丝绒的主席台正中央，身上那套笔挺的深灰中山装上，金边校徽在聚光灯下熠熠生辉。\n\n来自全国各省的五百余名督学代表与大院名流全体起立，神情肃穆地见证《新应试帝国万世法典》的盖印大典。这部厚逾千页的法典确立了京津大院对全国高等学府录取大盘的永恒优先支配权。外省做题家被正式法典化为‘战略生源供给主体’，而大院子弟则享有免于卷面竞争的崇高庇护。古老的科举制度在官僚特权的躯壳里完成了终极蜕变，一座坚不可摧的阶级神殿傲然耸立。"
  ebs_focus_event.39.a:0 "太上皇威加海内，应试万年长青！"
  ebs_focus_event.40.t:0 "北方光纤考务骨干网合龙"
  ebs_focus_event.40.d:0 "随着最后一段加厚铠装光缆在华北平原地下两米深处熔接成功，连接清华附中超算中心与北方千所重点中学的‘考务光纤骨干网’全线贯通。\n\n机房监视壁上，数万个幽蓝色的数据节点接连亮起。试卷的起草、分发与回收不再需要脆弱的油印机与防弹押运车，而是在一微秒内以高强度量子加密数据流直接投送至每一间考场的电子黑板上。任何外省试图通过偷拍、抄袭甚至买通考官作弊的念头，在绝对的光速网络面前化作了可怜的笑话。"
  ebs_focus_event.40.a:0 "光纤所至，考场归心！"
  ebs_focus_event.41.t:0 "量子阅卷数据中心全面运转"
  ebs_focus_event.41.d:0 "清华附中操场地表以下二十米深处，液氮冷却管道散发着刺骨的白雾，数十台超导量子计算阵列爆发出极度平稳的低频蜂鸣。\n\n当全国最后一门理综考试结束的电子铃声在全境回荡的瞬间，超算中心的量子矩阵便在一微秒内完成了数百万份高考试卷的交叉阅卷、逻辑论证推演与综合赋分。每一个标点符号、每一个草稿步骤，都在算法模型的精确度量下被还原为冰冷的分数。人工阅卷教师的红墨水彻底退出了历史舞台，唯有绝对中立、亦绝对残酷的代码主宰着人生的审判。"
  ebs_focus_event.41.a:0 "零误差，亦零温度。"
  ebs_focus_event.42.t:0 "前置辍学预测大模型上线"
  ebs_focus_event.42.d:0 "清华附中机房推出了一套震惊教育界的全新算法——‘学子全生命周期潜能预测神经网络’。该模型在学生刚刚踏入小学二年级时，便通过抓取其错题更正延迟、课桌坐姿对称性以及早自习眨眼频率，对其未来的高考做题能力展开超前运算。\n\n算力系统冷酷地将全国考生划分为‘重点攻坚型’、‘通用劳力型’与‘提前分流型’。预测为大专及以下潜力的学子，其教学终端将自动关闭拔尖数理题库，提前转入车间技能培训。在算力面前，所谓的大器晚成与逆天改命，被系统直接判定为不符合统计学规律的非法扰动。"
  ebs_focus_event.42.a:0 "算法算尽众生，命数早有定型。"
  ebs_focus_event.43.t:0 "硅基大纲奇点降临"
  ebs_focus_event.43.d:0 "这是一场悄无声息却惊天动地的革命。怀总工站在控制台前，按下了解除人工干预的红色确认键。从这一刻起，全国高考大纲的编写大权正式由清华附中自主演进的深度学习大模型完全接管。\n\n屏幕上，成千上万套人类特级名师穷尽一生也无法构想出的极端逻辑拓扑题与跨学科压轴试卷，被神经网络以秒为单位疯狂吐出。试题超越了传统做题家的死记硬背，直刺人类智力的极限边缘。西单大楼里，昔日趾高气扬的命题专家们默默收拾着公文包走出大门，他们惊恐地发现，自己创造的这台机器，已经彻底超越了人类理解的范畴。"
  ebs_focus_event.43.a:0 "人类考官谢幕，硅基天网降临！"
  ebs_focus_event.44.t:0 "五天极限突击视察风暴"
  ebs_focus_event.44.d:0 "刺耳的警笛声在半夜十二点划破了某所重点中学的夜空。周总导身披皮风衣，率领三十辆督导突击吉普车如同战车集群般直接撞开校门，强行进驻校园！\n\n‘传我命令：全校灯火通明，五天之内完成百项达标整改！’带队督学手持马表，在大理石阶梯前大声宣读迎检军令。睡眼惺忪的校长在十分钟内被拉出被窝，连夜集合全校两千名师生。高压水枪洗刷地砖，电工通宵改线，教案连夜重抄。没有任何推脱的借口，在这场极限突击战面前，校园沦为了毫无人情的冲锋战场。"
  ebs_focus_event.44.a:0 "以评促建，军令如山！"
  ebs_focus_event.45.t:0 "十亩荒地连夜插麦苗样板"
  ebs_focus_event.45.d:0 "在冀东平原的一所县城高中校门外，一场足以写入荒诞应试史册的奇观在零下十度的黑夜中上演。为了满足专家组‘现代化生态农研基地’的硬性指标，整座县城的蔬菜大棚在三小时内被采购一空。\n\n刺骨的寒风中，七百名中学生与全校教师手持手电筒，在满是冻土瓦砾的荒地里排成密集横队。带着露水的嫩绿麦苗被一株株硬生生插进龟裂的冻泥中，甚至用粗铁丝和胶水固定以防倒伏。次日清晨，当晨光照亮这片在严冬中不可思议泛着翠绿的十亩‘奇迹麦田’时，连夜赶来的督察专家感动得热泪盈眶，当场在表彰通报上写下‘大寨精神重现校园’的至高评价。"
  ebs_focus_event.45.a:0 "只要思想不滑坡，荒地也能长麦苗！"
  ebs_focus_event.46.t:0 "教风教纪督导特别法庭开庭"
  ebs_focus_event.46.d:0 "学校大礼堂的长条桌上铺着墨绿色的军用呢布，三名佩戴督察袖标的法官面无表情地端坐上方，两侧是由手持防暴警棍的保卫人员组成的特别纠察队。\n\n被告席上，几位因未能在规定时间内手抄完十年假教案、或在突击检查中被翻出抽屉里藏有未批改作业的老教师神情憔悴。法槌重重落下，宣判声在寂静的大厅里激荡：‘取消特级教师待遇，降职为后勤清洁工，全省通报批评！’杀鸡儆猴的雷霆手段让全北方所有学校噤若寒蝉，再无一人敢对形式主义的严苛指标提出任何质疑。"
  ebs_focus_event.46.a:0 "铁腕整肃，谁敢怠慢迎检？！"
  ebs_focus_event.47.t:0 "永恒迎检全域战备大公社"
  ebs_focus_event.47.d:0 "周总导在全国电视动员大会上挥舞着皮质教鞭，正式签署全域动员令：北方万所中学全面并入‘永久战备迎检公社体制’！\n\n学校不再是单纯授课的场所，而是彻底转化为标准化流水线样板营。早自习清查垃圾筒与仪容仪表，上午排查教案格式与台账厚度，下午演练专家进校的集体鼓掌标准角度，晚上则在探照灯下通宵擦洗操场地砖。整座国家在周总导的调度下，化为了一座巨大、窗明几净、口号震天却空前僵死的永恒展览馆。"
  ebs_focus_event.47.a:0 "形式主义战无不胜！"
  ebs_focus_event.48.t:0 "马术与击剑特长特许状上市"
  ebs_focus_event.48.d:0 "西单大楼三层的贵宾会客厅内，雪茄的烟雾与昂贵的香水味交织在一起。王司长满面红光地端起香槟，向围坐在真皮沙发上的富商巨贾们展示着盖有体卫艺司大印的特许证书。\n\n一张由总署授权的‘全国青少年马术障碍赛一级裁判证明’与‘皇家击剑俱乐部荣誉特长特许状’，被明码标价为八十万银元起拍。只要资金到位，哪怕考生连马鞍都没见过，亦能在全国自招档案中稳获二十分的特长加分。加分在这一刻彻底脱离了肉体苦练，化作了资本市场上最为暴利的金融衍生品。"
  ebs_focus_event.48.a:0 "马术跨不过的高墙，金钱可以！"
  ebs_focus_event.49.t:0 "体育达尔文主义考核风暴"
  ebs_focus_event.49.d:0 "一份由体卫艺司签发的《全国中学生体质达尔文式大检阅》通报引发了全网震动。通报强令：所有应届高三考生必须通过严苛的长跑冲刺与负重越野测试，达不到‘做题特种兵’标准者，一律暂扣高考准考证！\n\n然而在严苛的禁令背后，后勤处却‘体贴’地开设了绿色通道——只需认购体能康复营养套餐与特许免测基金，即可由指定三甲医院出具满分免测证明。做题家们在泥泞跑道上跑得咳血晕厥，而富家子弟则微笑着在免测单上挥笔签字，将达尔文的适者生存演绎为纯粹的金钱选拔。"
  ebs_focus_event.49.a:0 "身体与钱包，总有一个要出血！"
  ebs_focus_event.50.t:0 "全国中小学强制配售垄断"
  ebs_focus_event.50.d:0 "王总管旗下的校园后勤总商会签发红头文件，宣布启动‘全国中小学校服教辅大一统配售工程’。由指定皮包工厂生产的高达市价五倍的涤纶校服与装订粗劣的教辅习题集，被按季度强行摊派至每名学生头上。\n\n任何敢于私自购买平价校服或自选复习资料的学校，将被立即通报为‘后勤安全严重失管’。数以亿计的现金流通过这一条封闭管道滚滚流入总署账房，王总管在金库前抚掌大笑：‘千教万教，不如教学生掏钱；做题刷题，最后全进我兜里！’"
  ebs_focus_event.50.a:0 "校服年年换，金币天天来！"
  ebs_focus_event.51.t:0 "醒酒查课千桌宴饮网"
  ebs_focus_event.51.d:0 "北京西单一带的高档酒楼夜夜笙歌。王总管与各路地方督学推杯换盏，桌上摆满了茅台酒与空运而来的名贵珍馐。\n\n在推杯换盏之间，原本需要繁琐审批的地方特招指标与营养餐特许经营权被轻描淡写地瓜分殆尽。‘早上醒酒听汇报，中午陪餐过流水，晚上会所定调令’已成为后勤帝国的日常运转法则。在浓烈的酒精与烟草香气中，整座国家的教育命脉被编织进了一张坚不可摧的利益大网之中。"
  ebs_focus_event.51.a:0 "酒桌之上，自有黄金万两！"
  ebs_focus_event.52.t:0 "全国试卷期货交易所开市"
  ebs_focus_event.52.d:0 "随着一声清脆的金锣敲响，设在西单教育部大楼一层的‘全国高考试卷与自主招生期货交易所’隆重开市！巨大的电子走字屏上，清华北大直升指标、名校早培免试凭证与重点实验班学籍的代码疯狂闪烁跳动。\n\n手握巨额资金的资本巨鳄与学阀代理人在交易大厅内疯狂抢单。保送指标可以做空，特长加分可以杠杆配资，甚至挂科复读亦能购买保险对冲。教育在金钱的狂欢中彻底撕下了最后一片遮羞布，成为了华夏大地上最炙手可热的超级金融帝国！"
  ebs_focus_event.52.a:0 "开盘大吉！唯金钱万岁！"
  ebs_focus_event.53.t:0 "高炉铁水旁的雪夜夜读营"
  ebs_focus_event.53.d:0 "鞍山与本溪的重工业厂区内，零下三十度的暴风雪呼啸着撞击着老旧的红砖厂房。在高耸入云的炼铁高炉旁，千百名身穿洗得发白工装校服的关外学子围坐在铁水奔流的沟渠两侧。\n\n炽热耀眼的钢水照亮了做题家们被冻得青紫的面庞，飞溅的钢花落在泛黄的理综模拟卷上，烫出一个个焦黑的小洞。工人们往锅炉里铲着焦炭，高声为挑灯夜读的孩子们鼓劲：‘黑土地的孩子不怕冷，咱连坦克大炮都能造出来，还怕他北京那几道破题？！’黑土地的钢铁意志，正在这漫天飞雪与滚烫铁水中淬火成锋！"
  ebs_focus_event.53.a:0 "钢水映雪，做题称雄！"
  ebs_focus_event.54.t:0 "沈阳机车厂铁甲军列改装完毕"
  ebs_focus_event.54.d:0 "巨大的行车吊钩在沈阳机车厂老车间上方缓缓平移，两台编号绝密的重型前进型蒸汽机车被焊接上双层高锰钢装甲板。\n\n辽宁省实验中学的特级物理教师与机车工人通宵达旦地在车厢内安装高倍通信天线与活动黑板。列车货舱里塞满了数万箱由东三省名校联合编写的绝密重工理综试卷与整箱粉笔。汽笛拉响，蒸汽喷涌，两列宛如钢铁要塞般的做题装甲军列在夜色中喷吐着烈焰，做好了随时冲破山海关的全部战备！"
  ebs_focus_event.54.a:0 "铁甲生风，关外龙吟！"
  ebs_focus_event.55.t:0 "西单天井焚毁特权保送卷宗"
  ebs_focus_event.55.d:0 "十一月的北京夜空被滚滚黑烟染成了绛紫色。在西单教育部大楼正中央的露天天井内，数千本用烫金牛皮纸装订的绝密保送名册、盖着北京某烤鸭店公章的八十七名本溪国家运动员加分批文、以及大院子弟在雪域高原空挂学籍的特批便笺，被关外做题纠察队成捆成捆地抛进熊熊燃烧的汽油铁桶中。\n\n飞扬的灰烬如同黑色的暴雪，掠过大楼顶层破碎的雕花琉璃瓦。来自东北师大附中与哈三中的老教师们站在天井四周，眼眶里倒映着烈火的光芒，许多人忍不住失声痛哭。几十年来，正是这一页页薄薄的暗箱纸片，如同沉重的铁锁般压碎了千百万黑土地与山河四省考生的青春与脊梁；而今晚，在这场大火中，一切大院血统与特权暗门，终于化为了冰冷飞舞的焦黑碎屑。\n\n大楼外，数十万聚集在长安街上的学生和工农群众爆发出震天动地的欢呼。老校长跨过仍在燃烧的灰烬堆，在主席台上向全中国庄严宣告：‘特权之卷已死，重工平权当立！’"
  ebs_focus_event.55.a:0 "大火烧得越旺，天下做题家的心越敞亮！"
  ebs_focus_event.56.t:0 "工读一体苏维埃宣告成立"
  ebs_focus_event.56.d:0 "长春第一汽车厂的大装配车间内，鲜红的标语挂满了天车大梁：‘车间即教室，机器即教具！’\n\n东三省名校联合公社在此举行盛大的工读联合大会。特级教师走下讲台向老锻工敬礼拜师，重型机械传动原理与微积分极限方程在车床旁被合二为一。工读苏维埃的成立打破了资产阶级象牙塔的虚伪壁垒，将做题家与产业工人锻造成了不可战胜的革命同盟。"
  ebs_focus_event.56.a:0 "工读一体，天经地义！"
  ebs_focus_event.57.t:0 "铁血唯才平权共和国建立"
  ebs_focus_event.57.d:0 "在紫禁城午门城楼上，老校长身穿厚重的东北羊皮大氅，在数十万重工做题大军的簇拥下向全华夏发表庄严宣言！\n\n自今日起，华夏大地上的一切自主招生、加分保送与大院特权被彻底取缔！全中国唯有一套由黑土地冰雪淬火的统一考卷，全天下考生唯凭卷面红墨水分数争夺录取名额。寒门与大院在这一刻迎来了真正的终极平等，黑土地的怒火彻底改写了华夏文明的应试星空！"
  ebs_focus_event.57.a:0 "唯分是尊！做题家万岁！"
  ebs_focus_event.58.t:0 "密发全国考纲统一最后通牒"
  ebs_focus_event.58.d:0 "中枢政局终于尘埃落定。无论胜出的是哪一方，巩固中枢对全中国教育绝对统治的野心都已昭然若揭。\n\n一份用深红封泥火漆密封的《全国考纲统一最后通牒》，由八百里加急军列特快专递送达南方各省独立考区。通牒勒令：黄冈、华师一、江浙沪与成都盐道街诸校，必须在七日内交出全部独家奥赛题库、废止地方自主命题大纲，无条件服从中枢督导组统一调度，否则大军将至、玉石俱焚！"
  ebs_focus_event.58.a:0 "顺中枢者昌，逆大纲者亡！"
  ebs_focus_event.59.t:0 "铁腕打击江南独立命题联盟"
  ebs_focus_event.59.d:0 "面对南方各大名校拒绝交出题库的抗命电报，督导总署签署了代号‘破卷行动’的铁血整肃令。\n\n数百名督察便衣宪兵秘密渡江南下，突袭了设在西湖畔的华东自主招生联合命题会馆。带头的顽固派校长被当场戴上手铐带离，数千套尚未启用的绝密奥数与理综原稿被尽数抄没装箱运往北方。江南文人墨客的清高与傲慢，在国家专政机器的战靴下被踏得粉碎。"
  ebs_focus_event.59.a:0 "江南题库，全盘收缴！"
  ebs_focus_event.60.t:0 "分化收买地方学阀代表"
  ebs_focus_event.60.d:0 "北京六国饭店的宴会厅内，银质餐具在烛光下熠熠生辉。各省驻京办教育代表与名校校董坐在长桌两侧，战战兢兢地看着总署官员端上的一盘盘‘大礼’。\n\n只要在全国教育大战的站队电报上签字拥护总署统考，其所在学区便能获得额外千分之五的降分照顾与自招特许调剂配额。在实打实的利益诱惑面前，南方原本脆弱的反抗同盟瞬间土崩瓦解。学阀代表们争先恐后地在效忠书上按下手印，将地方的教育独立彻底出卖殆尽。"
  ebs_focus_event.60.a:0 "天下攘攘，皆为名额往来。"
  EBS_view_route_guide:0 "【路线指南】中枢五大政治路线抉择秘籍"
  EBS_view_route_guide_desc:0 "随时调阅最高教育督导专署西单危机博弈全景指引与五大派系登顶选法速查手册。"
  ebs_route_guide.1.t:0 "《最高教育督导专署》中枢全路线与高考决战生存指南"
  ebs_route_guide.1.d:0 "欢迎查阅【最高教育局巡视督导专署 (EBS)】中枢机密生存指南与五大路线决算总图谱！\n\n掌控北京大院的督导总署拥有全国唯二的终极权柄：全国统考命题权与京津一本特权配额。请各位巡视督导专员务必熟读以下中枢运转机理，谨防在西单保密室决裂中被夺权清除：\n\n━━━━━━━━━ 核心决裂机制：五阶段交织危机链 ━━━━━━━━━\n【特别提示】：EBS的五大政治路线【绝非在右侧决议栏直接点击】！\n完成开局前五个主线国策（Focus 1~5）后，将分别在完成 3 天后精确引爆【西单保密室交织危机五部曲】（ebs_crisis.1 至 ebs_crisis.5）。每个危机事件翻页后的第 2 页恰好提供两个政策选项（Option A / Option B），每次选择将隐性增加对应派系的力量变量。在第五阶段结束时，系统将动态比对五大派系得分，【自动触发唯一胜出的终局事件】并强制确立执政方向与国策分支解锁权！\n\n━━━━━━━━━ 五大政治路线极简选法代码速查 ━━━━━━━━━\n1. 路线 A【陈专员 · 官僚大院特权派】（父权专制 paternal_autocrat）：\n- 理念：垄断京津一本指标，推行‘四个回归、狠挤课堂水分’，筑牢特权大院铁壁铜墙。\n- 危机选项速查：【 A - A - B - A - A 】\n- 机制优势：解锁海淀精英壁垒，极高稳定度与科研，加固京津特权。\n\n2. 路线 B【怀总工 · 清华附中赛博算力专政】（威权民主 authoritarian_democrat）：\n- 理念：信奉唯算力论，在考场架设AI微表情天网与脑电波手环，用一行代码决断天下学子。\n- 危机选项速查：【 B - A - A - A - B 】\n- 机制优势：解锁清华附中超算中心，海量科研加速与电子密码破译霸权。\n\n3. 路线 C【周总导 · 铁血大迎检极权样板】（极端教务统制 totalist）：\n- 理念：推行全境迎检军规，强令全校师生戴防毒面具在刺鼻绿漆跑道上突击达标，违者就地免职！\n- 危机选项速查：【 B - A - A - A - A 】\n- 机制优势：超高战争支持度与陆军组织度，全国迎检铁腕动员。\n\n4. 路线 D【双王黑金 · 体卫艺与后勤商会财阀】（自由市场 market_liberal）：\n- 理念：王司长体招特长加分 + 王总管全国配餐预制菜，创设‘全国高考试卷期货交易所’变现一切！\n- 危机选项速查：【 B - A - B - B - A 】\n- 机制优势：极其充沛的政治点与民用工商业，买断保送指标金融对冲。\n\n5. 路线 E【东三省名校联合公社 · 奉系考霸入关政变】（激进均等派 radical_socialist）：\n- 理念：黑土地极寒风暴中的校长摔碎搪瓷茶缸，改装铁甲军列大举入关，攻占教育部龙椅！\n- 危机选项速查：【 B - B - B - B - B 】（极简：全选 B 走东北公社！）\n- 机制优势：装配超强【关东重工做题家平权公社】（攻防各+15%，适役人口+15%），全盘砸碎特权！\n\n━━━━━━━━━ 全国高考试卷院与 1938.6.7 大清算 ━━━━━━━━━\n- 中枢督导操盘：在政治界面（U）左上角打开全国试卷院大窗。调配 8 组督导特派员派驻五大局司（进度破 70% 锁定 +12 大盘积分）。\n- 跨省定点打击：发动决议查封江南奥数秘卷（削弱 ECE 12 分）与楚天物理题库（削弱 HBE 12 分）。\n- 1938年6月7日早晨清算放榜：若 EBS 稳居全国前三甲（Top 3），斩获【象牙塔技术霸权】（科研+3%，军工+15%，核心攻防+15%）；若跌落第四，公信力崩溃，全境落榜生与地方军阀将组建复读同盟发起围攻！\n- 战后大同统考：攻克成都（1041）后在决议栏启动 180 天全国考纲大同整合，全额获得全国省份核心！"
  ebs_route_guide.1.a:0 "深谙中枢运转之道，把调令与考纲攥在手中！"
