  EBS_benxi_crackdown_tt:0 "严查体育加分造假，引发辽宁考霸强烈愤慨！"
  EBS_benxi_appease_tt:0 "暗中默许灰色利益，东三省各校野心进一步滋长。"
  EBS_manchurian_pacification_tt:0 "在关外三省维持脆弱的平衡统治。"
  EBS_dongbei_future_expansion_tt:0 "§Y【企划预留】东三省名校联合谋逆接口已解锁！在未来的重大版本中，东三省名校将能够发动入关政变或武装割据，直接取而代之入主最高教育局！§!"
