l_simp_chinese:
 YDS_anarchy_corporatist:0 "陈嘉林"
 YDS_anarchy_corporatist_desc:0 "辩论社与社团联盟的实际控制者，倡导将学校拆分为独立社团自治领。"
 YDS_anarchy_nihilist:0 "周军"
 YDS_anarchy_nihilist_desc:0 "全省第七的高考卷王，在看清应试体制的荒谬后转变为激进的虚无主义白卷运动领袖。"
 YDS_autonomous_council:0 "自治委员会"
 YDS_autonomous_council_desc:0 "由高一·一班学生自治代表与开明教师共同组成的校园民主自治联合委员会。在学生主权派与师长改良派通过权力平衡决出最终主导权之前，作为中立与协商的集体领导机构执掌校政。"
 YDS_deng_shuang:0 "邓霜"
 YDS_deng_shuang_desc:0 "高二一班班主任，深得学生尊敬的良师，为了守护学生的自由学术环境不惜与校委会对抗。"
 YDS_jiang_guangping:0 "蒋光平"
 YDS_jiang_guangping_desc:0 "盐道街中学校长，铁腕均等化改革的坚定推行者，主张用严苛的行政指标抹平一切学生落差。"
 YDS_li_gang:0 "李刚"
 YDS_li_gang_desc:0 "老校区复兴阵线领袖，坚定的精英教育崇拜者，誓要夺回老盐道街昔日的辉煌与特权。"
 YDS_liu_yan:0 "刘彦"
 YDS_liu_yan_desc:0 "校委会教务处核心骨干，均等化铁腕政策的现场执行者与严苛督导员。"
 YDS_missing_leader_c:0 "教务临时委员会"
 YDS_missing_leader_c_desc:0 "在缺乏单一领袖时暂管教务行政工作的委员会。"
 YDS_missing_leader_d:0 "学生自治临时筹委会"
 YDS_missing_leader_d_desc:0 "在失去核心领导者时维持自治运动运作的临时筹委会。"
 YDS_missing_leader_f:0 "老校复兴临时指挥部"
 YDS_missing_leader_f_desc:0 "在权力真空期协调老校区复兴派行动的临时指挥机构。"
 YDS_tang_siyi:0 "唐思懿"
 YDS_tang_siyi_desc:0 "一班学生自治联盟领袖，冷静敏锐的学生运动先锋，带领学子反抗官僚主义高墙。"
 YDS_lai_sihan:0 "赖思翰"
 YDS_lai_sihan_desc:0 "数学奥赛怪才，擅长高难度微积分与几何压轴题，能在极度复杂的数论推导中勾勒出关键辅助线。"
 YDS_eluo_ningbei:0 "俄罗宁贝"
 YDS_eluo_ningbei_desc:0 "物理奥赛战神，在全校高绩点氛围的滋养下直觉空前敏锐，对相对论与电磁共振大题有满分解答实力。"
 YDS_zhou_jingsong:0 "周敬淞"
 YDS_zhou_jingsong_desc:0 "化学大师与灵性博弈选手，擅长在复杂有机合成与未知试剂定性分析中押中关键步骤。"
 YDS_deng_yunbo:0 "邓云博"
 YDS_deng_yunbo_desc:0 "生物学科队长兼全能基石，心态稳如泰山，在植物切片观察与基因工程分析中发挥极度稳健。"
 YDS_tuo_wen:0 "庹文"
 YDS_tuo_wen_desc:0 "信息学硬核战士，代码功底扎实，凭借动态规划与算法剪枝在全国计算机冬令营中狂飙AC绿光。"
