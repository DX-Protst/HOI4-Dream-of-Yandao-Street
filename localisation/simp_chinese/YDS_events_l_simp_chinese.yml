 yds_coring_ebs_tt:0 "§G将最高教育局巡视督导区全域 11 省添加为盐道街中学的核心省份！§!"
 yds_coring_ece_tt:0 "§G将华东江南大区全域 9 省添加为盐道街中学的核心省份！§!"
 yds_coring_hbe_tt:0 "§G将华中楚天大区全域 4 省添加为盐道街中学的核心省份！§!"
 yds_coring_shs_tt:0 "§G将山河四省大区全域 6 省添加为盐道街中学的核心省份！§!"
 yds_coring_sne_tt:0 "§G将华南沿海大区全域 6 省添加为盐道街中学的核心省份！§!"
 yds_coring_sxi_tt:0 "§G将陕南关中大区全域 6 省添加为盐道街中学的核心省份！§!"
 yds_coring_yne_tt:0 "§G将滇黔名校大区全域 4 省添加为盐道街中学的核心省份！§!"
 yds_event.1.b:0 "九眼桥的钟声要敲响了！蒋光平搞那个脑壳昏的平均主义彻底玩脱，老盐中的招牌不能砸在这帮混子手里。该让刷得起理综卷子的硬核尖子生坐庄了！"
 yds_event.1.c:0 "为了每个学生的脑壳自由！我们既不当官僚的提线木偶，也不当资本的做题机器。把选票塞进粉笔盒，大家各人说了算！"
 yds_event.1.d_opt:0 "这帮娃娃反了天了！各班班主任把后门窗户盯死，政教处红袖章全部上岗，敢带头闹事的直接请家长、记大过、滚出校门！"
 yds_event.10.a:0 "只要垃圾袋够黑，马尔克斯就能在晚自习合法落户。"
 yds_event.10.d:0 "高二一班的窗户全用加厚黑色塑料大垃圾袋给糊严实了。原先的蓝布窗帘上周刚被政教处强拆，理由是‘严重阻碍值周老师的穿透性视线’。现在这层三十块钱一捆的聚乙烯黑胶皮，用透明胶带死死封在铝合金窗框上，从走廊外头看过来，黑黢黢一片，连个光斑都漏不出去。\n\n在这层黑色塑料袋的掩护下，教室后排正搞起一起足以让教导主任当场气得跳脚的大事：几个娃娃脑壳挨着脑壳，课桌底下还藏着半包冷掉的红糖锅盔，偷偷传看文印室废纸复印的《百年孤独》。\n\n‘马尔克斯写马孔多连下四年十一个月大雨的时候，估计做梦都想不到，他的书在九眼桥头会被归成非法出版物！’语文课代表一边小声嘀咕，一边警惕地瞅着后门。唐思懿坐在讲台上，手里端着个印着老盐中校徽的搪瓷盖碗，吹了吹面上的三花茶沫子，神情淡定得很：‘怕个铲铲。姚复群要是敢来砸门，老子们就把化学实验室那套蒸馏装置搬出来，就说是市科协重点科研项目，看哪个敢乱动。’\n\n窗外府南河的晚风把黑塑料袋吹得哗啦啦直响，像一面黑色的海盗旗，在盐中的夜色里招摇撞骗。"
 yds_event.10.t:0 "晚自习的火花"
 yds_event.100.a:0 "铁腕镇压！这帮娃娃就是欠收拾，红袖章全部上楼，抓到一个记过一个！"
 yds_event.100.b:0 "冷静！硬碰硬只会把桌子彻底掀翻。赶紧去教室听听学生到底想搞哪样。"
 yds_event.100.d:0 "教学楼走廊里的空气已经闷得快要冒火星子了。四百多个大小伙子大姑娘同时烦躁起来的时候，球鞋汗味、隔夜的蛋烘糕油纸包、还有刚印出来的理综卷子那股呛人的煤油墨水味，在闭塞的过道里发酵成一股怪味，吸一口进去脑壳都要炸裂。但凡长了眼睛的人都看得出来：学校这口高压锅，气阀快被顶飞了。\n\n就在刚才，大喇叭刺啦刺啦爆响，蒋校长的大嗓门传出来，宣读《关于进一步整肃校园秩序的紧急通告》。前十条全是废话，要命的是第十一条：‘即日起，全校所有课外社团、兴趣小组、晚自习私下讨论会，一律无限期封停；严禁三人以上在走廊聚集摆龙门阵！’\n\n在盐中黑话里头，这等于直接给所有课外生活判了死刑。喇叭声刚断，隔壁班就传来了拍桌子和踹倒塑料垃圾桶的巨响，整层楼的课桌都在共振。学生会、社团联盟和几个刺头班级已经在楼梯口聚拢，走廊里弥漫着一股一点即燃的火药味。"
 yds_event.100.t:0 "盐中大危机：暴风雨前夜"
 yds_event.1000.a:0 "打烂仗吧，天王老子来了也收拾不了这个烂摊子了……"
 yds_event.1000.d:0 "由于我们在战后未能按住学生们四处冒头的野路子，整个学校的局面已经彻底打烂仗了。\n\n各个社团在走廊上拿课桌板凳修街垒宣布独立，吉他社和动漫社隔着过道对骂，辩论社在广播室里抢麦克风。无论是老师的戒尺还是教育局的公章，现在连擦屁股都被嫌硬。这所百年名校，终于在自由的狂欢中裂成了无数块碎片。"
 yds_event.1000.t:0 "社团割据：失控的盐道街"
 yds_event.1001.a:0 "这是一场持久战！"
 yds_event.1001.d:0 "校园虽然勉强重新拉平扯顺，但娃娃们的心早就耍野了，一股‘要死不活、散漫混日子’的风气在走廊里四处蔓延。再不想办法刹车，怕是连期末考卷都没得人答了。\n\n【四维危机与三大防暴毙红线】\n系统已激活 60 天周期的学风危机倒计时（每轮无条件结算 GPA -5、自治度 +10）。我们必须利用专属决议组合进行常态化平抑，时刻警惕以下毁灭性临界点：\n- 警戒一：虚无白卷崩溃（GPA 跌破 40）：教学质量崩塌，全校自暴自弃交白卷，教育局强行接管校园并剥夺一切权力！\n- 警戒二：社团割据暴乱（学生自治度突破 90）：课堂纪律瓦解，操场与走廊沦为动漫社与体训队武装割据的无政府暴乱！\n- 警戒三：极权高压托管（教育局干预度达到 100%）：上级失去耐心，撤销现职并空降极权代理人“刘彦”推行无灵魂机器统治！\n\n【战略核心：奥赛路线必须优先点国策拿分！】\n伴随学风危机的爆发，国策树右侧的【奥赛国家队分支】已正式解锁！\n★ 强烈建议第一时间优先推进奥赛国策线！★\n奥赛路线不仅能快速为本路线注入巨额绩点、专属资金或自治度，更能开启教练精力分配、五大学科集训与八校联考。1938年6月7日清晨将迎来全国统一高考大放榜（Gaokao Reckoning），奥赛积累的学科金牌与攻坚点数将直接折算为高额统考分值。只有优先抢分挤进全国前三甲（Top 3），才能斩获【象牙塔技术霸权】赢家加成；若奥赛拖延不点，放榜时排位落后将被迫沦为复读生同盟，在全国大战中陷入极大被动！\n（注意：若执政党为极端教务统制、大纲绝对均等派、校务官僚专制，均等化与官僚专制路线将禁绝奥赛精英选拔，无法点击任何奥赛国策，在1938年高考放榜决战中必然沦为落后失败者并进入复读大同盟！）\n\n【机制：学区地缘渗透】\n决议面板已开放“成都学区地缘政治”界面。你可以扣除声望与生源开启为期 7 天的限时渗透任务，达到 100% 即可附庸成外、七中、树德等六所名校，获得独特的强大地缘增益！"
 yds_event.1001.t:0 "学风危机的阴霾"
 yds_event.1002.a:0 "考验我们智慧的时候到了！"
 yds_event.1002.d:0 "一班自治的大旗虽然插上了升旗台，但接踵而来的麻烦能让人脑壳痛死。学生们散漫得连早操都懒得下楼，而唐思懿的激进浪漫派和邓霜老师的温和师道派在教研室里天天拍桌子，行政机器彻底卡死在扯皮当中。\n\n【高一·一班权力平衡 (BOP) 与死锁严重警告】\n当前校政由一班师生联合组成的过渡期“自治委员会”主持。由于缺乏终决权威而陷入行政死锁扯皮，该机构附带极其严厉的全方位负面惩罚（政治点数每日 -0.15、稳定度 -15%、战争支持度 -10%、消费品需求 +5%、工厂效率上限 -10%、部队组织度 -10%）。你必须争分夺秒使用权力天平决议，将天平推向唐思懿（激进学生自治，以放任散漫换取主权）或邓霜（温和师长改良，以铁腕纪律整肃散漫），尽早决出独任领袖以彻底解除全套 Debuff！\n\n【四维危机与三大防暴毙红线】\n系统已激活 60 天常态学风危机，请密切盯紧安全线：\n- GPA 跌破 40：触发虚无主义教育局接管；\n- 学生自治度突破 90：引爆社团封建割据无政府暴乱；\n- 教育局干预度达到 100%：触发刘彦极权高压托管。\n\n【战略核心：奥赛路线必须优先点国策拿分！】\n右侧【奥赛国家队分支】已正式解锁！★ 必须优先推进奥赛国策线拿分！★\n奥赛积累的学科竞赛点数将直接决定 1938 年 6 月 7 日全国高考大放榜时的天梯排位与统考加成。唯有抓紧集训抢占高分，才能在后续全国教育大战中掌握战略主动权！\n\n【机制：学区地缘渗透】\n决议面板开放成都学区地缘政治，消耗资源渗透附庸六大名校，彻底一统蓉城学区！"
 yds_event.1002.t:0 "权力博弈与学风危机"
 yds_event.1003.a:0 "一切皆归于虚无……"
 yds_event.1003.d:0 "由于战后教学管理一塌糊涂，全校统考平均分惨烈到连成都市倒数第一的大弯中学都敢骑在我们头上嘲讽。市教育局领导在局长办公会上拍了桌子，最后通牒直接拍在门卫室。\n\n上级红头文件一纸令下，校委会、学生会所有职务就地免除，大门贴上封条。操场上的杂草随风倒，这所曾经风光无限的名校，只剩下一片虚无的白卷。"
 yds_event.1003.t:0 "教育局接管：虚无的盐道街"
 yds_event.1004.a:0 "冰冷的铁幕落下了……"
 yds_event.1004.d:0 "由于在维持秩序的过程中过于迷信行政大棒，甚至天天请教育局督导组驻校维稳，干预度指标直接冲破了天花板。\n\n教育局判定盐道街现有的管理班子全是吃干饭的酒囊饭袋。一辆黑色奥迪在防暴车护送下开进校门，督导处铁血官僚‘刘彦’踏着锃亮的皮鞋走下车。盐中的最后一丝温度，即将被这台冰冷的极权机器彻底碾碎。"
 yds_event.1004.t:0 "教育局全面托管"
 yds_event.101.a:0 "全面戒严！校门焊死，严查书包，谁敢炸刺直接送派出所！"
 yds_event.101.b:0 "为了均等化的大局，暂时当当恶人无所谓。历史会证明老子是对的。"
 yds_event.101.c:0 "算了，再搞下去成疯人院了。把摊子交给一班自治委员会，随他们折腾去。"
 yds_event.101.d:0 "你选了死磕到底。\n\n下午两点，政教处的纠察队扩招了整整两倍。老式丝网印刷机在油印室里哼哧哼哧连轴转，刚印出来四百个鲜红刺眼的红袖章，油墨味隔着三道门都闻得到。走廊上每隔十步就站着个戴红袖章的体育生和值周老师，手里拎着对讲机，眼神警惕得跟在春熙路抓小偷一样。\n\n教室门上的观察窗被擦得贼亮，班主任的脸随时贴在玻璃上，像幽灵一样盯着底下的动静。谁要是敢在自习课上传小纸条或者低头看闲书，两秒钟之内门就会被猛地踹开。这种铁桶一般的日子压得人喘不过气来，但谁都晓得，越是死死捂住的高压锅，一旦炸开，连厨房顶棚都能掀翻。"
 yds_event.101.t:0 "铁腕下的暗流"
 yds_event.102.a:0 "签字画押！唐思懿的草案虽然刺头，但娃娃们是真想把书读活，跟他们干了！"
 yds_event.102.b:0 "学生懂个锤子！让李刚出山掌舵，把老盐中的精英招牌和重本率夺回来！"
 yds_event.102.c:0 "单靠校内没得搞头。引校友会资金进场，跟李刚联手打造上市教育资本集团！"
 yds_event.102.d:0 "你决定坐下来听听真话。\n\n这在官僚系统里头比承认贪污还难。放下架子走到学生中间，等于承认你之前那些红头文件全在扯把子。但当你推开高二一班教室门的时候，讲台下面坐着黑压压一片学生，眼睛亮得像火把，桌上堆着厚厚一沓写满手写签名的建议书。\n\n唐思懿代表学生会走上讲台，拿出一份《盐中学生自主学习与校园生活草案》：废除反人类的秒表考勤、归还社团活动空间、食堂饭菜分量透明化、允许自主组建竞赛兴趣班。老教师李刚坐在后排，端着保温杯冷眼瞅着，他身后站着几个穿西装的校友会金主。走廊外面还聚着数百个看热闹的学生，都在等一个明确的说法。"
 yds_event.102.t:0 "变革的十字路口"
 yds_event.11.a:0 "对付一个资深老官僚，最好的办法就是甩给他一张盖满大红公章的A4纸。"
 yds_event.11.d:0 "政教处副主任姚复群带着六个戴红袖章的体育生杀到一班门口时，手腕上的双狮机械表刚跳过晚上八点四十三分。\n\n姚副主任在并校前是专门负责缴手机的狠角色。九眼桥老住户都晓得，经他老人家没收的诺基亚和小灵通，叠起来能直接从盐道街一路修到合江亭。今晚他揣着金属探测器突击查房，铁了心要把一班这帮刺头给一窝端了。\n\n然而，这支煞气腾腾的纠察队，在前门门槛边结结实实撞上了一堵墙。\n\n那堵墙叫邓霜。\n\n邓老师身高勉强一米六，鼻梁上架着副细银丝眼镜，手里捏着份刚盖好公章的文件。她就那么横在门框正中间，操着一口慢条斯理的成都话：‘姚主任，这么大火气跑来抓啥子嘛？上头刚批复的《蓉城中学生核心素养班级微创新实验方案》，第四条写得明明白白：实验班拥有教具与自主阅读材料的豁免权。’\n\n姚复群举着探测器的手僵在半空，脸色比吃了一嘴花椒还难看。邓霜推了推眼镜，微微一笑：‘姚主任要不要进屋喝杯三花？市局王处长明早还要听我汇报这个项目的阶段性成果呢。’姚复群咬了咬牙，狠狠瞪了教室里的学生一眼，带着红袖章们灰溜溜地撤了。"
 yds_event.11.t:0 "班主任的庇护"
 yds_event.1100.a:0 "这条红线一直划拉进每个人的脑壳里。哪个敢歪一下，当场按死。"
 yds_event.1100.d:0 "刘彦被教育局派来接管盐道街中学的头一天早晨，手里只攥了一把两块钱买的得力牌大号美工刀。\n\n我作为校办留下来的打杂跑腿，缩在门背后大气都不敢喘。他先进屋扫视了一圈这间朝南的老办公室：前任蒋光平留在窗台上的万年青早就枯成了一把柴火，正墙上那张《均等化教学大纲推进表》受潮卷了边，露出底下黄斑斑的透明胶带。刘彦背着双手盯着那张表瞅了三秒钟，摸出美工刀，咔嚓一下推出刀片，贴着墙皮唰唰几下，把整张表连胶带齐根儿铲了下来。废纸轻飘飘落在水磨石地板上，像踩扁的落叶。\n\n紧接着，老蒋留下的紫砂茶壶、红木桌牌，还有抽屉里半盒还没泡完的竹叶青，统统被他面无表情地丢进大铁垃圾桶。清理完办公桌，他从公文包里抽出一支鲜红的油性记号笔和一把一米长的木质丁字尺。\n\n他把尺子横在办公室正墙的正中间，笔尖死死压在墙皮上。滋啦一声刺耳的摩擦声过后，一道从左到右、笔直得像激光校准过的猩红长线，把白墙硬生生劈成了上下两截。"
 yds_event.1100.next:0 "下一页 →"
 yds_event.1100.t:0 "红笔与直线"
 yds_event.1101.a:0 "连范仲淹和苏东坡都得按秒表默写，哪个敢在语文课上多叹一口气？"
 yds_event.1101.d:0 "这场地毯式的大清洗，是从刘彦各人出身的语文教研组先动刀的。\n\n我是高二三班的语文课代表，也是教研组长马小容老师带的最后一届学生。马老师在盐中教了三十四年书，满头白发，讲起苏轼的《赤壁赋》能把全班讲得眼泪汪汪，平时最喜欢在自习课带大家去锦江边上看银杏落叶。但在刘彦眼里，这种‘带感情’的教法简直就是犯罪。\n\n周二下午第三节课，马老师刚在黑板上写下‘大江东去’四个行草字，教室后门突然被推开了。刘彦面无表情地带着三个穿黑夹克的纠察队员走进来，手里捧着一份《标准化教案合规手册》。他走到讲台前，伸手摸了一下黑板上的粉笔字，淡淡地说了句：‘字迹超出规定网格线十二毫米，板书结构非标准化，停课。’\n\n马老师愣在讲台上，手里的粉笔啪嗒一声掉在地上：‘刘校长，这是苏东坡的词，词有词的气象，哪能拿尺子卡？’"
 yds_event.1101.next:0 "下一页 →"
 yds_event.1101.t:0 "沉默的清洗"
 yds_event.1102.a:0 "那个红圈圈不是画在黑板上，是直接套在每个人的脖子上收紧。"
 yds_event.1102.d:0 "高三教学楼一楼大厅原本挂优秀作文和书法作品的展板，被工人们连夜拆了个精光，换成了一整面六米长、两米宽的巨型黑板，顶头刷着一行猩红大字：‘周考成绩动态淘汰警示栏’。\n\n全校两千多个学生的排名，按理科在前、文科在后的顺序排成密密麻麻的一堵墙。前五十名叫‘先锋阵列’，名字后面贴着小红旗；而后一百名叫‘预警梯队’，名字直接用鲜红的油漆笔画了个刺眼的大圆圈。更绝的是，刘彦在黑板旁边安了一个高清探头，全天候录像，谁要是敢遮挡或者涂抹，直接按破坏考风考纪全校通报。\n\n大课间做完操，大厅里挤满了脸色惨白的学生。有人看到自己的名字被画进了红圈里，当场蹲在地上抱着书包哭；有人侥幸进了前一百，但也吓得浑身哆嗦，生怕下周一掉下去。食堂阿姨路过时都直摇头：‘这哪是学堂嘛，简直比望江楼杀鸡数鸭子还吓人。’而在刘彦眼里，这块黑板就是最完美的皮鞭，抽得每头牛都不敢停下来喘气。"
 yds_event.1102.t:0 "黑板的审判"
 yds_event.1103.a:0 "当两千个人都在纸上写‘无异常’的时候，这所学校早就病得没救了。"
 yds_event.1103.d:0 "刘彦推行的第三道铁律，叫‘每日学习行动轨迹核查制度’。\n\n每人每天必须手写一份《学习行动日志》，不是写读后感，是记流水账：几点几分起床、刷了几道数学题、上了几次厕所、课间十分钟脑壳里想了啥子。每天晚自习下课前，班长统一收齐交到年级组，由值班老师挨个红笔批阅。\n\n起初大家还在上面写真话，说‘今天做立体几何做脱发了’、‘想吃九眼桥的钵钵鸡’。但不到三天，写这些的学生就被刘彦抓去办公室‘谈心’，扣上了‘思想作风滑坡、意志涣散’的大帽子。从那以后，所有人都在日记里变成了同一种机器人：‘今日学习十六小时四十分钟，完成理综试卷两套、数学压轴题三道，上厕所两次用时八分钟，无杂念，无异常。’\n\n谎言像牛皮癣一样在全校蔓延开来，每个人都在白纸上假装自己是永动机。"
 yds_event.1103.next:0 "下一页 →"
 yds_event.1103.t:0 "学习日记里的告密者"
 yds_event.1104.a:0 "琴弦崩断的声音很清脆，但水泥糊上去的声音，比死人还沉。"
 yds_event.1104.d:0 "收缴违禁物品的通知是在周五傍晚下达的。\n\n操场正中央摆了八个大号镀锌铁油桶，保安队和纠察生抬着一口口大木箱从各班走出来。里面装的全是‘非高考相关违规物资’：动漫社画了半年的手绘原稿、文学社还没装订的诗集油印册、两个被踢爆了皮的足球，还有吉他社那五把被强行拧断琴弦的吉他。\n\n刘彦背着手站在铁桶旁，戴着一副雪白的线手套。他不喜欢放火，嫌黑烟熏了校园环境，所以铁桶是专门用来灌水泥的。两辆后勤处的水泥搅拌车开进操场，轰隆隆的声音盖过了整个锦江区的晚霞。一桶桶灰白色的泥浆兜头浇在那些吉他、画板和诗集上，把所有的色彩、音符和年少时的幻想，严严实实封成了几坨硬邦邦的废渣。"
 yds_event.1104.next:0 "下一页 →"
 yds_event.1104.t:0 "最后的吉他弦"
 yds_event.1105.a:0 "头顶上的红点一闪一闪，像阎王爷在天上睁开的眼睛。"
 yds_event.1105.d:0 "刘彦任内的第五号工程，是给全校换装海康威视第七十六代全景监控球机。\n\n走廊、水房、大门口原本就有探头，但刘彦觉得盲区太大——‘学生的反叛思想往往滋生于视线的死角’。于是，每一间教室的前后黑板上方，分别被加装了一枚带着热成像和微距收音功能的超清鱼眼探头。三十六倍光学变焦，连你草稿纸上画了只小猪佩奇都能看得一清二楚。\n\n不仅如此，后排靠窗这个传统摸鱼风水宝地，也被安装了红外驻留感应器。只要你眼神脱离课本超过八秒钟，头顶上的小红灯就会开始急促闪烁。全校八十多间教室的数据实时汇总到行政楼顶层的监控指挥中心，十六块大屏幕拼成一堵电视墙，刘彦坐在真皮皮椅上，手里端着茶杯，像个检阅兵马俑的帝王。"
 yds_event.1105.next:0 "下一页 →"
 yds_event.1105.t:0 "永不闭合的眼"
 yds_event.1106.a:0 "我们终于被改造成了合格的工业件。恭喜刘校长，恭喜流水线。"
 yds_event.1106.d:0 "我是盐道街中学2023届毕业生张明，准考证号510104199906050032。\n\n今天是我在盐中的最后一天，也是刘彦接管学校的第七百三十天。高考前最后一场全真模拟考结束的铃声敲响了。大礼堂里，两千多名考生同时停笔，双手整齐划一地平放在考桌两侧，身体笔直，头朝前方微倾十五度，没有一声咳嗽，没有一声欢呼。\n\n监考老师们穿着整齐划一的白衬衫，像传送带上的机械臂一样，精准地以每张试卷三秒钟的速度收卷、清点、封箱、贴条。整个大厅里只有防盗网外锦江河水的流动声，以及日光灯管发出的微弱嗡鸣。刘彦站在二楼巡视天桥上，居高临下俯瞰着这片完美的灰色方阵，脸上没有表情，但眼神里闪烁着造物主一般的满足感。"
 yds_event.1106.next:0 "下一页 →"
 yds_event.1106.t:0 "完美机器的凯歌"
 yds_event.12.a:0 "一千三百多个红手印拍在桌上，连铜包角的老木桌都得跟着抖三抖。"
 yds_event.12.d:0 "谈判桌是后勤处大爷从行政楼地下防空洞里抬出来的老古董，三个月前签合校协议用的也是它。黄褐色的实木桌面早起了厚厚的包浆，四个角包着黄铜，摆在会议室正中间，散发着一股老茶馆里霉木头的陈年老味儿。\n\n长桌北侧坐着蒋光平和他的几个心腹副校长。六个白瓷茶缸整整齐齐码在各自面前，里头的茉莉花茶从滚烫泡到凉透，老蒋除了偶尔揭开杯盖吹两口茶叶沫沫，愣是一声不吭。\n\n南侧坐着邓霜和唐思懿。唐思懿把一沓厚厚的白纸啪地一声拍在桌面上，封皮上用马克笔写着几个大字：《关于归还学生自主支配时间的若干决议》。\n\n‘蒋校长，’唐思懿眼神贼亮，‘全校一千三百七十四个学生的按手印签名全在里头。早自习弹性考勤、晚自习开放社团讨论、食堂饭菜加量不加价。你们要是同意，明天早操大家规规矩矩排队；要是不同意，明早大课间，四百只装了荧光剂的纸飞机保准准时降落在您老的茶杯里。’\n\n蒋光平端着茶缸的手抖了一下，瞅了瞅旁边的邓霜。邓霜低着头在教案本上批改作业，连眼皮都没抬一下，仿佛桌上拍的只是一包普通的蛋烘糕。老蒋长叹了一口气，终于拧开了钢笔帽。"
 yds_event.12.t:0 "盐道街的圆桌会"
 yds_event.1214.a:0 "只要茶盖一扣，九眼桥下的江水都要跟着改道。"
 yds_event.1214.d:0 "李刚端起盖碗，慢悠悠刮了三下茶叶沫子，抿了一口热茶，声音不高，但字字带刺：‘蒋光平那个瓜娃子，懂个铲铲的办学。搞啥子教育均等化大锅饭，把老盐中好不容易攒起来的名校家底全给败光了。今年四七九联考，我们连树德的分数线都没摸到，老子这张老脸在教育局开会都没地方搁！’\n\n陈嘉林从真皮公文包里摸出一张烫金的瑞士银行本票，轻轻推到八仙桌正中央。支票右下角那串零长得晃眼睛。\n\n‘李老师，校友基金会先期筹集了一千两百万现金，’陈嘉林压低嗓门，‘还有三十套黄冈名师联考密卷、全套春熙路同款4K超清户外LED大屏，全在九眼桥外的仓库里候着。只要您老点个头，老盐中的招牌，我们拿真金白银给您砸回来！’\n\n李刚把茶盖咔哒一声扣在碗上。老头子抬起眼皮，扫了一圈桌上的商界巨鳄，嘴角露出一丝冰冷的笑意：‘叫车队备齐。明天早上早操，老子亲自回学校敲钟。’"
 yds_event.1214.prev:0 "← 上一页"
 yds_event.1214.t:0 "听雨轩的茶香（续）"
 yds_event.1216.a:0 "深夜两点的菜鸟驿站，偷运的是全川最硬通的战略物资。"
 yds_event.1216.d:0 "‘动作搞快点，莫弄出声响！’负责押运的退伍武警吴队长压低嗓门催促，耳朵里塞着战术对讲机，手里握着一台海康威视手持热成像仪，警惕地扫视着锦江河堤对面的树影。\n\n在热成像仪的绿荧荧屏幕上，整座盐道街中学宛如一座沉睡的军火库。只有三楼李刚的办公室还亮着一盏微弱的台灯。这二十四箱卷子不仅包含了今年高考物理压轴题的三种核心变体，更附带了省教科院未公开的评分细则。在普通高中还在死磕教材例题的时候，盐中的精锐部队已经提前在终点线埋伏好了。\n\n半小时后，最后一箱试卷被送进双锁保险柜，厚重的冷轧钢门咔哒一声反锁。金杯车熄着大灯，倒车滑出小巷，消失在九眼桥凌晨的夜雾里。吴队长摘下防静电手套，在点名册上划了个勾：‘货已入库。明早六点，火箭班准时开箱实测。’"
 yds_event.1216.prev:0 "← 上一页"
 yds_event.1216.t:0 "午夜的走私车（续）"
 yds_event.1237.a:0 "一个走向了清华园，一个在校门口摇奶茶。他们都有光明的未来。"
 yds_event.1237.d:0 "下午四点，热闹的人潮渐渐散去。\n\n周军推开奶茶店的玻璃门，风铃叮当一响。昔日的同桌四目相对，空气安静了三秒钟。周军身上穿着笔挺的白衬衫，手里攥着清华的预录协议书，而陈晨擦了擦手上的水渍，从吧台底下拿出一罐冰镇可乐推过去：‘老周，考得巴适嘛。’\n\n‘陈晨，你……现在一个月能挣多少？’周军有些尴尬地坐下。\n\n‘五千多块钱，除去房租还能剩个两千，给老汉儿买了盒降压药。’陈晨笑了笑，眼睛里没有自卑，也没有怨恨，倒比当年在地下自习室里生动得多，‘你呢，以后去北京当大科学家？’\n\n‘不知道，可能去搞金融或者量化投资吧，李老师说那个来钱最快。’周军低下头，抿了一口可乐。窗外老盐中的4K大屏还在不知疲倦地滚播着他的名字和照片，但在这一刻，两个站在命运分水岭两端的年轻人，突然不知道到底哪个才算真正的活过。"
 yds_event.1237.prev:0 "← 上一页"
 yds_event.1237.t:0 "两种人生（续）"
 yds_event.1242.a:0 "喝口热水都要符合逻辑三段论，这就是盐中知识分子的体面！"
 yds_event.1242.d:0 "上午十点，第一届‘中庭安全理事会’在天井的大榕树下隆重召开。\n\n吉他社把三把木吉他横在长椅上当界碑，辩论社搬出了四张折叠椅和一台小蜜蜂扩音器，桌游社作为中立调停方，派出两名裁判分发旺旺雪饼。经过长达三个小时唇枪舌剑的停火谈判，双方签署了《二楼开水房分时取水备忘录》，附带第三修正案：‘任何社团在开水房泡康师傅红烧牛肉面时，不得单方面垄断调料包投放权’。\n\n我站在三楼连廊上嚼着军屯锅盔往下看。原先天天抓违纪的政教处空无一人，而底下这帮平时做立体几何做傻了的高中生，正一本正经地在橡皮章底下按着红手印。九眼桥的河水还在流，但在这座被大人抛弃的校园里，荒诞的游戏成了唯一的生存法则。"
 yds_event.1242.prev:0 "← 上一页"
 yds_event.1242.t:0 "中庭的西发里亚合约（续）"
 yds_event.1243.a:0 "用十吨浆糊把领导画成萌妹，这是二次元对体制最狠的降维打击！"
 yds_event.1243.d:0 "全校两千多个学生全围在大字报底下，笑得前仰后合，声浪差点把行政楼的玻璃震碎。\n\n教务处两个还没来得及跑路的老教师站在人群外圈，推了推老花镜，瞅着橱窗里李刚那张楚楚可怜的女仆脸，脸色红一阵白一阵，嘴角神经质地抽搐了半天，最后居然没忍住噗嗤一声乐了出来：‘别说，这小王同学画的透视比例，比物理组的老赵画得还标准些。’\n\n政教处那块曾让无数学生吓破胆的耻辱柱，在这一天成了九眼桥最火爆的免费同人漫展。几个女生拿着手机疯狂拍照发朋友圈，男生们吹着口哨在底下排队合影。当恐惧被解构成荒诞的笑料时，旧秩序最后的尊严，连带着那些陈年浆糊，彻底被晒成了笑话。"
 yds_event.1243.prev:0 "← 上一页"
 yds_event.1243.t:0 "二次元的大字报（续）"
 yds_event.1244.a:0 "肌肉就是硬道理，操场上的棒球棍教会了做题家啥叫丛林法则！"
 yds_event.1244.d:0 "更绝的是他们的‘战略储备’。\n\n体育生们不收现金，也不要辣条，他们只要一种东西：空白的理综和文综答题大卡！每过一个人，必须上缴一张崭新的机读大卡。我当时抱着篮球路过哨卡，好奇地问了句队长：‘兄弟，你们这帮平时连作业都不交的壮汉，屯这么多空白答题卡干啥子嘛？’\n\n一米九的大队长把棒球棍往地上一插，嘿嘿一笑，露出两排大白牙：‘你懂个锤子！万一下个月教育局杀回来复辟，老子们带头闹事的铁定要被罚写万字深刻检讨。到时候有这几千张空白大卡当储备粮，写检讨连稿纸都不用买！’\n\n我站在烈日底下，看着那几个用答题卡堆起来的战略掩体，打心底里佩服这帮憨批。在这座失控的高中里，连四肢发达的体育生，都被应试体制逼出了刻进骨子里的求生本能。"
 yds_event.1244.prev:0 "← 上一页"
 yds_event.1244.t:0 "荷尔蒙防线（续）"
 yds_event.1247.a:0 "把三年做题家的心血扔进火堆，火光把九眼桥的河水都映红了！"
 yds_event.1247.d:0 "漫天的白纸灰像成都冬天的鹅毛大雪一样，洋洋洒洒飘满了整条盐道街。\n\n学生们手拉着手围着巨大的火堆跳着毫无节奏的坝坝舞，有人在大哭，有人在大笑，有人扯着嗓子吼着不成调的摇滚乐。不知哪个胆大包天的体育生，把政教处用来监控操场的超大探照灯也给砸了扔进火里，灯泡爆裂发出砰的一声巨响，升腾起一团蓝绿色的金属火花，引得全场爆发出雷鸣般的欢呼！\n\n府南河对面的老茶客们端着盖碗茶，目瞪口呆地看着盐中操场上冲天的火光。无数写着‘解：由正弦定理得’的焦黑纸页打着旋儿飞上夜空，像一群被困在牢笼里太久、终于烧断翅膀的火鸟。在这场疯狂的葬礼上，大家烧掉了过去三年的一切，哪怕明早太阳升起时，等待他们的是一无所有的荒原。"
 yds_event.1247.prev:0 "← 上一页"
 yds_event.1247.t:0 "三高五模的末日狂欢（续）"
 yds_event.1248.a:0 "重本率光荣归零，教育局连夜跑路，留下一操场的狗尾巴草。"
 yds_event.1248.d:0 "一个月后，焦黑的操场大坑里，顽强地钻出了几丛翠绿的狗尾巴草。\n\n校门口那家‘避风塘’奶茶店老板陈晨，穿着围裙推开生锈的校门走进来。他手里端着两杯加了双份珍珠的红豆奶茶，熟练地绕过倒在地上的黑板，走到焦坑边上坐下。唐思懿正坐在马路牙子上，嘴里叼着根狗尾巴草，手里拿着把旧螺丝刀在修一把断了弦的吉他。\n\n‘老唐，尝哈，新品，我起名叫“涅槃”，糖分拉满，巴适得很。’陈晨把奶茶递过去。\n\n唐思懿接过奶茶吸了一大口，甜得眯起了眼睛：‘老陈，你说咱们这帮交了白卷的人，以后能干啥子？’\n\n陈晨拍了拍手上的面粉，瞅了一眼操场上疯长的野草和远处九眼桥熙熙攘攘的车流，咧嘴一笑：‘干啥子不行嘛？天府之国这么大，连颗野草都能活得绿油油的，老子们长了手长了脚，难不成还能饿死在锦江边上？’\n\n阳光洒在焦黑的操场上，两只麻雀落在大坑边缘啄食野草籽。这里不再是名校，也不再是绞肉机。这里只是一所野蛮生长的高中，而生活才刚刚开始。"
 yds_event.1248.prev:0 "← 上一页"
 yds_event.1248.t:0 "灰烬中的寂静涅槃（续）"
 yds_event.1299.a:0 "走嘛，各人回教室刷题，反正天塌下来有高个子顶到。"
 yds_event.1299.d:0 "新调来的校长蒋光平坐在朝南的大办公室里，端起搪瓷茶缸吹了吹漂在面上的三花茶。这间屋子以前归老盐中的老校长，墙上还留着那位物理老行尊拿粉笔写的爱因斯坦质能方程。保洁嬢嬢以为那是保家宅平安的符咒，三年都没舍得擦。蒋校长倒是客气，没叫人刮墙，只是扯了张白纸，拿胶带往上一封，上头赫然印着《盐道街中学均等化教学大纲第一阶段实施方案》。成都天天下毛毛雨，潮气重，胶带四角早都起翘发黄，底下顽强地露出个‘mc²’。\n\n蒋校长心里头美滋滋的，觉着自己这是在办大功德：只要拿行政大棒把冒头的尖子生按下去、把吊车尾的差生提上来，全校拉成一条笔直的地平线，这世上就再莫得人因为考倒数挨骂了。这套逻辑在红头文件里头溜光水滑，唯一搞不懂的，就是那些被强行按住的天才娃儿，骨头脆生生的，稍不注意就会被按断。\n\n与此同时，九眼桥头的‘听雨轩’老茶馆二楼，政治老师李刚正对着另一张考卷运筹帷幄。他面前摊着张用2B铅笔画满箭头的校园地形图，右上角恰好落了一块深褐色的茶碗印子，死死扣在行政楼上。李刚眯起眼睛瞅了瞅，觉着这签抽得硬是巴适。\n\n裤兜里的手机嗡嗡震了两下，校友会大金主陈嘉林发来八个字：‘子弹备齐，看李老师的了。’\n\n李刚抿了口苦丁茶，慢悠悠回了一个字：‘等。’\n\n八年冷板凳都坐过来了，还差这几天工夫？\n\n而在教学楼一楼东头的教室里，高二一班学生领袖唐思懿把一叠墨水都没干透的《学生自主管理草案》拍在讲台上。班主任邓霜坐在对面，手里捏着支红圆珠笔，跟改错别字一样在旁边批注。她把所有的‘命令校方’改成了‘建议商榷’，把‘废除早自习’改成了‘推行弹性考勤’。\n\n‘邓老师，你这叫和稀泥。’唐思懿撇了撇嘴。\n\n‘我这叫帮你娃保命，’邓霜头都不抬，‘免得你明早连校门都进不来，直接被政教处当典型挂在大门口！’\n\n窗外府南河的水翻着浪花往前淌。三个派系、三套打法，把一所两千多人的学校架在火炉子上烤。至于底下那些只想中午吃顿好红烧肉、晚自习少刷两套模拟卷的普通学生，很快就会明白一个道理：大人们要是较起真来，连大课间做广播体操都得选边站队！"
 yds_event.1299.prev:0 "← 上一页"
 yds_event.1299.t:0 "盐道街中学：一九三六年（续）"
 yds_event.13.a:0 "纠察队的红袖章进了垃圾桶，食堂二楼的拼桌成了咱们的冬宫。"
 yds_event.13.d:0 "新成立的三方校务委员会第一次全体大会，定在老食堂二楼废弃了三年的教工小炒部开会。\n\n倒不是大伙儿喜欢闻那股陈年豆瓣酱和抽油烟机油垢的混合味儿，纯粹是因为全校几百间屋子里，只有这个角落能塞下九把椅子，而且刚好处于三十六个高清摄像头的死角里。\n\n所谓的‘圆桌’，其实是拿四张掉了漆的木方桌拼起来的，上面铺着美术社拿过来的白色油画画布，角落里还沾着半块没洗干净的群青水粉。学生自治代表三席，教师代表三席，老校委会代表三席。唐思懿把喝完的三花茶盖碗往桌上一顿，宣布《盐中自治过渡宪章》正式生效。\n\n走廊里，纠察队的红袖章被扔进了垃圾桶；布告栏上那些写满处分的白纸，被换成了各班自主设计的海报和社团招新表。虽然窗外锦江区的毛毛雨还在下，但这间充满油烟味的老厨房，今天硬是成了这群高中生的独立宣言大厅。"
 yds_event.13.t:0 "自治的黎明"
 yds_event.14.a:0 "只要茶盖一扣，九眼桥下的江水都要跟着改道。"
 yds_event.14.d:0 "九眼桥河堤边这家老茶馆叫‘听雨轩’，招牌挂了二十多年，名字酸不拉唧，但内里深谙蓉城名流规矩：二楼所有包间的雕花木窗全朝向死水一潭的天井，哪怕街对面长焦大炮架起来，也休想拍到里头半个喝茶的人影。\n\n李刚是下午三点整推门进来的。上楼前他还穿着那件领口磨破了毛边的旧夹克，肩膀微缩，活脱脱一个刚改完三百份文综卷子、被颈椎病折磨得半死的普通老教师。可当二楼‘松鹤厅’的雕花木门吱呀一声合上，里头五个穿定制西装的老总齐刷刷站起来喊了声‘李老师’时，李刚的脊梁骨在半秒钟之内挺得笔直，教书匠脸上的窝囊气荡然无存，慢条斯理地端出了老盐中开山鼻祖的教皇派头。\n\n八仙桌旁围坐着的，是老盐中历届混得最风光的几个杰出校友。坐主位的是天府实业大老板陈嘉林，这位当年文综差点挂科、全靠李刚在办公室开小灶保送财大的地产巨鳄，这会儿亲手给李刚斟了一碗滚烫的三花特级盖碗茶，双手奉上：‘李老师，您老人家在冷板凳上坐了三年，受委屈了。’"
 yds_event.14.next:0 "下一页 →"
 yds_event.14.t:0 "听雨轩的茶香"
 yds_event.15.a:0 "老钟声一响，那些想混日子的美梦全被震成了碎片。"
 yds_event.15.d:0 "清晨六点二十，老盐中的早操广播喇叭突然炸响。\n\n往常那段慢吞吞的催眠钢琴曲在半秒钟内被强行掐断，紧接着，老盐中建校初期那首铜管乐齐鸣的激昂校歌，以震耳欲聋的声浪横扫了整座操场！\n\n蒋光平穿着秋裤刚冲进广播站，就被门外两个身高一米八五的黑西装保镖客客气气地拦在了外面。行政楼正门台阶上，李刚一改往日的邋遢模样，换上了一身笔挺的深灰呢子大衣，身旁站着二十多个老盐中的特级教师骨干。而在校门外头，十辆崭新的别克商务车一字排开，车门上统一贴着‘老盐中校友基金会理事会’的烫金徽标。\n\n‘全体师生立正！’李刚拿着大号手摇铜钟，当当当在全校面前敲响了七声。钟声回荡在晨雾弥漫的锦江上空，激昂而冷酷：‘均等化的闹剧结束了。从今天起，盐道街重新奉行唯一的法则：分数决定尊严，绩点划分阶级！做题家们，欢迎回到弱肉强食的世界！’"
 yds_event.15.t:0 "钟声重鸣"
 yds_event.16.a:0 "深夜两点的菜鸟驿站，偷运的是全川最硬通的战略物资。"
 yds_event.16.d:0 "凌晨两点一刻，一辆摘了号牌的白色金杯面包车悄无声息地滑到了学校东侧的后门围墙底下。\n\n车身上刷着‘菜鸟驿站·送货上门’的褪色车贴，但从底盘下沉的深度看得出来，车厢里装的东西绝不是什么淘宝快递。驾驶座车窗摇下半截，递出来半截点燃的软中华。站在阴影里的门卫老张熟练地接过来叼在嘴上，按下遥控器，电动伸缩门无声无息地缩回墙角，留出一道刚好容一辆车通过的窄缝。\n\n车厢后门猛地拉开，里头整整齐齐码着二十四口缠满透明胶带的防水硬纸箱，箱角盖着红色的‘机密·绝密冲刺押题卷’火漆印章。八名穿黑色工装裤的校卫队员戴着雪白的防静电手套，像特警搬运C4炸药一样，四个人一组，轻手轻脚地把沉甸甸的箱子抬进地下保密室。\n\n这批卷子是校友会动用了北京、湖北和江苏三地的人脉，花了七位数从命题专家封闭酒店的碎纸机残渣里还原出来的内部天机。"
 yds_event.16.next:0 "下一页 →"
 yds_event.16.t:0 "午夜的走私车"
 yds_event.17.a:0 "学霸吃鳕鱼排，学渣啃冷馒头，这就是做题家丛林的无上法则！"
 yds_event.17.d:0 "周一清早，一份名为《盐道街中学学业表现与校园资源挂钩分配管理暂行办法》的红头文件，贴满了每一间教室的门楣。\n\n这不是普通校规，这是做题家社会的《汉谟拉比法典》。李刚用一套无懈可击的绩点算法，将全校学生的吃喝拉撒睡全部进行了明码标价：绩点排名前5%的‘神童’，拥有专属人体工学转椅、单人自习静音舱、食堂VIP免排队特权和专供深海鳕鱼排；排名前20%的优等生，享有空调自习室和竞赛名师答疑包；至于排名在后50%的后进生，只能被分流到底楼阴暗潮湿的普通自习室，吃配额缩水的标准化快餐。\n\n‘人人平等那是童话。’李刚在晨会上操着一口冰冷的川普，‘高考试卷改卷只看阿拉伯数字，社会上签合同只看资产负债表。今天在学校受不了绩点歧视的人，明天到了社会上连被歧视的资格都莫得！’台下鸦雀无声，每个学生的眼睛里都燃起了一股近乎疯狂的饥饿感。"
 yds_event.17.t:0 "绩点达尔文"
 yds_event.18.a:0 "一百三十七页方案，每一页都在说：脑壳莫想要，签字就完事。"
 yds_event.18.d:0 "文件编号：YD-1936-0047。这是老盐中建校几十年来，头一回领到这么‘硬扎’的官方身份证。这套编码规则是蒋光平在办公室啃着军屯锅盔亲自琢磨出来的：YD代表盐道街，1936是纪年，0047说明这学期校办已经一溜烟整出了四十七份红头文件。校办小秘书私底下摆龙门阵，说蒋校长的年终小目标是赶在元旦前干到三位数，凑齐梁山好汉一百单八将。\n\n这本厚达一百三十七页的《全面行政一体化管理大纲》，眼下正端端正正摊在行政楼大会议桌正中间，每一页右下角都端端正正怼着一枚血红的校委会大印。注意看，这可不是彩色复印机偷懒印出来的，是蒋校长握着他那把盘得包了浆的桃木印章槌，一页一页亲手夯上去的。办公室小妹拿计数器算过，老头子日均盖章二百一十四次，右手肱二头肌练得比体育特长生还壮实。\n\n大纲里头条条框框密密麻麻：早读起立角度必须保持八十度、上厕所不得超过五分钟、每堂课提问优等生与后进生比例必须严格一比一……在蒋校长眼里，两千个性格各异的川娃子，就该像春熙路饭馆里摆的消毒碗筷一样，拿开水烫过、消过毒，整整齐齐码在消毒柜里。至于碗里装的是担担面还是麻辣香锅，他根本不在乎。"
 yds_event.18.t:0 "盖下第一枚公章"
 yds_event.19.a:0 "每秒五十页的速度，把全成都最灵气的脑壳全复印成了砖头。"
 yds_event.19.d:0 "行政楼一楼拐角那台东芝数码复合复印机，是并校后校务处批条子从数码广场花高价扛回来的。每分钟能滋滋喷出五十页，纸盒一装就是三千张。蒋校长在报销单上大笔一挥批了八个字：‘效率倍增，整齐划一’。\n\n从那天开始，这台黑坨坨的铁疙瘩就成了全校师生的亲爹。每天清早七点，墨粉焦糊的味道就顺着走廊飘得满天飞，比九眼桥头炸油条的味儿还冲。不管你是讲鲁迅《孔乙己》的苍凉，还是讲杜甫在草堂写的‘安得广厦千万间’，统统被教研组按照督导组的模板切碎，压缩成‘考点一、考点二、答题模板A’，咔咔复印成白纸黑字的标准件。\n\n高一语文组年轻的周老师，因为私自给学生印了两篇王小波的杂文，当场被复印室管理员大爷扣了机器钥匙。大爷指着墙上的规章扯着川普喊：‘任何未经三审三校的非大纲文本，一律不得过机！你这是在搞精神走私！’周老师涨红着脸站在机器旁，看着那台东芝复印机不知疲倦地吐出一模一样的教辅，像一台胃口无限好的工业绞肉机。"
 yds_event.19.t:0 "复印机里的雷同"
 yds_event.2.a:0 "强扭的瓜不甜，但这回连掀桌子的板凳都被政教处焊死了。"
 yds_event.2.d:0 "我叫张诚，高三六班，合并前属于街对面那所‘生源垫底’的兄弟学校。今天是合校后第一次全体师生大会，大礼堂里挤得跟春运火车皮一样，我缩在倒数第二排，瞅着台上蒋光平校长操一口标准的播音腔川普宣读四十七页的《合并过渡细则》。\n\n‘资源下沉’、‘协同跨越’、‘削峰填谷’——这些大词儿从麦克风里滚出来的时候，前排老盐中的尖子生们全都在低头刷题，手里的水笔在五三卷子上划拉出刺耳的沙沙声，那架势比拍桌子骂娘还要难看。而我们这帮‘被接管’的后进生，被集中发配在右边空调吹不到的死角角，大热天三十六度，后背上的校服汗得透湿黏在背上，谁都不敢吭一声气。\n\n坐在我边上的物理老师，原先在我们学校带出过两个省二等奖的狠角色，现在被教务处打发去教初一的常识课。他的备课本被年级组扣了，理由是‘格式不合大纲统一规定’。老头子手里捏着红笔，在教案空白处一笔一笔划拉，脸色黑得跟锅底灰没得两样。\n\n散会后去上厕所，隔间外头两个老盐中的正边洗手边咬耳朵：‘那边学校连个像样的显微镜都凑不齐，现在倒好，跑来跟我们平起平坐，分明是来蹭我们省重的高考指标嘛！’另一个冷哼一声：‘教育局说是帮扶，我看是把我们的实验器材端过去给他们填窟窿。’\n\n我冲了水推门出去，那俩娃儿一瞅见我胸口那枚还没来得及换的旧校徽，话头戛然而止，扭头就走。这哪门子叫合并办学嘛，分明就是旧社会拉郎配，两边心里头都憋着一股鬼火，迟早要打烂仗。"
 yds_event.2.t:0 "尘埃未落"
 yds_event.20.a:0 "封条上的胶水干得很慢，但青春的气味走得硬是飞快。"
 yds_event.20.d:0 "吉他社活动室的大门，是周四下午第三节自习课被啪的一声贴上白封条的。封条是政教处统一配发的不干胶，红墨水印着‘政教处 封’，底下还跟了一行小字：‘擅自启封者记大过一次，取消本学期评优评奖资格’。\n\n吉他社社长站在走廊上，怀里死死抱着那把琴头磕掉了一小块漆的红棉吉他，眼圈红得跟兔子一样。隔壁动漫社、街舞社、天文社的大门也早被大铁锁焊死了。中庭原本挂满手绘海报的文化长廊，连夜被撕得干干净净，露出一片片斑驳泛黄的水泥墙皮，看着跟刚被抄了家没得两样。\n\n政教处王主任背着手巡视过来，皮鞋在水磨石地面上踩得咚咚响，操着一口椒盐川普冷笑：‘一天到晚弹些叮叮咚咚的靡靡之音，能给高考加一分不？脑壳里天天想些歪心思，有这闲工夫不如回教室多刷两套理综大题！散了散了，围在这里看啥子稀奇！’\n\n人群慢慢散去，只有那个刚贴上去的封条被穿堂风吹得沙沙响。府南河边的风吹进中庭，连空气里的吉他香气，都被消毒水味彻底盖过去了。"
 yds_event.20.t:0 "贴上封条的中庭"
 yds_event.2001.a:0 "班主任请回办公室喝茶，这间教室现在归学生会各人做主了！"
 yds_event.2001.d:0 "在一班内部长达数周的拉扯后，激进的学生自治派彻底架空了讲台。\n\n邓霜老师那套温和折中的改良方案，被急于求成的年轻人们贴上了‘向校方投降妥协’的标签。连同她的备课本和红钢笔，邓老师被礼貌地请回了年级组办公室喝茶。从今天起，唐思懿和他的学生自治联盟正式接管了一班的全部大权！\n\n讲台上不再有班主任的戒尺，取而代之的是自治议会的发言席。激进派宣布废除一切形式主义的常规考勤，课桌被排成了开放式的讨论方阵，晚自习甚至被改成了通宵辩论角。没有了老师在后门盯着，这群血气方刚的高中生终于可以在自己亲手建立的自由王国里大展拳脚，哪怕前头就是期末联考的万丈深渊！"
 yds_event.2001.t:0 "权力重组：唐思懿全面掌权"
 yds_event.2002.a:0 "姜还是老的辣，大家先把《五年高考》翻到第三十页！"
 yds_event.2002.d:0 "由于学生自治派在几次激进活动中捅了篓子，差点把期中考卷给弄丢，邓霜老师终于坐不住了。\n\n这位带了十年毕业班的女教师，联合班里的温和派骨干发动了一场教科书级别的行政接管。没有拍桌子骂娘，也没有打小报告。邓霜只是拿出了全套滴水不漏的考勤表、绩点追踪册和议事规则，三言两语就瓦解了唐思懿身边那帮群龙无首的年轻刺头，把一班的方向盘稳稳夺回了自己手里。\n\n‘散漫不是自由，那是害命。’邓霜站在讲台上，手里拿着一沓刚印出来的历年高考真题，眼神平静但气场两米八，‘想在体制的高墙底下活得像个人，就得先考出让上头挑不出刺的分数。先把《五年高考三年模拟》翻到第三十五页，今天把导数大题全给我啃下来！’"
 yds_event.2002.t:0 "纪律整顿：邓霜老师接管一班"
 yds_event.21.a:0 "我们用一块两吨重的汉白玉墓碑，给老盐中的灵魂办了场风光的葬礼。"
 yds_event.21.d:0 "并校三周年那天，校门口隆重立起了一块崭新的大理石功德碑。碑是从雅安宝兴运过来的整块汉白玉，两米多高，底座压着块厚实的黑花岗岩，正面刻了八个镏金大字：‘教育均等化示范基地’。落款是成都市教育局与盐道街中学联合党支部。\n\n剪彩那天操场上下着蒙蒙细雨，蒋光平带着行政班子在碑前头排成一排，胸口别着大红花，笑得后槽牙都露出来了。台下坐着两千多个穿一模一样校服的学生，在值周老师的手势指挥下整齐划一地鼓掌，声浪机械得像录音机回放。记者手里的单反相机闪光灯咔嚓咔嚓亮个不停，把那一块块冰凉的大理石映得惨白。\n\n放学的时候我踢着路边的小石子路过石碑，忍不住伸手摸了一把。那石头冷冰冰、滑溜溜的，没有一丝活人的温度。石碑背后刻着密密麻麻的管理条例，把每个年级、每个学科的平均分卡得死死的。九眼桥头的江水在雨雾里翻腾，可老盐中百年攒下来的那点灵气和风骨，就像被这块两吨重的大石头，结结实实地镇进了地底下。"
 yds_event.21.t:0 "大理石上的丰碑"
 yds_event.2100.a:0 "这条红线一直划拉进每个人的脑壳里。哪个敢歪一下，当场按死。"
 yds_event.2100.d:0 "‘这条线，’刘彦转过身，用冰凉的金属笔帽敲了敲墙壁，声音平得听不出喜怒，‘就是盐中从今天开始唯一的活路。左边是松懈，右边是散漫。凡是不踩在这根线上走的人，老子当天就把你的档案袋甩出校门。’\n\n他坐进那张转椅，从抽屉里翻出一份全校师生花名册，红笔在手指间灵巧地转了个圈。两千多个名字，在他眼里不是活生生会哭会笑的娃儿，而是一串串必须按部就班运转的零件参数。\n\n‘通知全校，’他头也不抬地在第一页上打了个大红叉，‘从明早开始，早读提前到五点半。晨跑步幅必须精确到七十五厘米，踩不齐节拍的班级，全员罚站到第一节课打铃。’\n\n我瞅了一眼那道红线，油墨还没完全干透，顺着白灰墙皮渗出几个细小的血滴状毛刺。九眼桥的府南河水还在流，但在刘彦的盐中，所有流动的东西，都得被这根尺子冻成冰块。"
 yds_event.2100.prev:0 "← 上一页"
 yds_event.2100.t:0 "红笔与直线（续）"
 yds_event.2101.a:0 "连范仲淹和苏东坡都得按秒表默写，哪个敢在语文课上多叹一口气？"
 yds_event.2101.d:0 "‘苏东坡当年考科举也得写馆阁体。’刘彦冷冷地打断她，把一份印好的《限期整改承诺书》拍在讲桌上，‘从今天起，语文课不再讲鉴赏，只讲得分点。每堂课讲什么句子、提问哪个学生、板书写几个字，全按教学大纲逐字背诵。做不到，明天就办内退手续。’\n\n马老师看着桌上那份全是条条框框的表格，戴上老花镜，看了足足三分钟。最后，老太太苦笑了一声，摘下眼镜擦了擦，慢慢把自己的红钢笔套上笔帽，塞进兜里：‘刘彦，你当年也是我教出来的。你语文考了一百三十八分，但你现在连句人话都听不懂了。’\n\n她没签字，转身抱起自己的旧教案本，慢慢走出了教室。走廊上静悄悄的，没有一个老师敢出来打招呼。第二天清早，语文组换上了一个刚毕业的研究生，讲台上架起了一台扩音器和一台数码读卡器。盐中的语文课，彻底死在了那台吐答案的机器里。"
 yds_event.2101.prev:0 "← 上一页"
 yds_event.2101.t:0 "沉默的清洗（续）"
 yds_event.2103.a:0 "当两千个人都在纸上写‘无异常’的时候，这所学校早就病得没救了。"
 yds_event.2103.d:0 "第十四天晚上，高二一班的学习委员因为感冒发烧，日记少写了半页，第二天清晨就被叫到了教导处。\n\n刘彦坐在大班台后面，手里捏着那本皱巴巴的日志，冷冷地看着他：‘少记录了一小时二十分钟，这段时间你干了啥子？’学习委员声音打颤：‘在医务室量体温，头晕睡着了。’刘彦把日志本往桌上一扔：‘生病不是思想开小差的借口。你的对手在树德和七中，病毒能帮你考大学？’\n\n这记闷棍敲醒了所有人。为了逃避惩罚，学生们开始互相监督，甚至在日记里举报同桌：‘同桌课间趴在桌上叹气三声，疑有悲观厌学倾向’、‘后桌晚自习看窗外飞鸟两分钟，注意力涣散’。原本放学一起在校门口吃蛋烘糕、抄作业的患难兄弟，在一夜之间变成了互相防备的特务。\n\n刘彦翻看着那些密密麻麻的告密条目，嘴角终于浮现出一丝满意的微笑。当连同窗之情都被拆解成防范指标时，这座机器就再也莫得螺丝钉敢反抗了。"
 yds_event.2103.prev:0 "← 上一页"
 yds_event.2103.t:0 "学习日记里的告密者（续）"
 yds_event.2104.a:0 "琴弦崩断的声音很清脆，但水泥糊上去的声音，比死人还沉。"
 yds_event.2104.d:0 "几个社团的负责人站在操场铁丝网外头，隔着网眼瞅着那些铁桶，没有一个人哭出声来。\n\n哭也是要扣分的。在刘彦的规矩里，因非学业事务产生过激情绪波动，属于‘心理素质不合格’，直接记入高考政治审察档案。吉他社社长把手插在校服兜里，指甲深深陷进掌心里，摸着兜里藏着的一根断掉的1弦钢丝。那是他在琴被抢走前，偷偷用指甲刀剪下来的唯一纪念品。\n\n水泥浆很快凝固了，灰突突的铁桶被叉车运到了后山废料堆。操场又恢复了死一般的平整与干净。第二天清晨，广播里准时响起了刺耳的跑操进行曲，学生们迈着一模一样的步子从铁桶旁边跑过去，眼睛目视前方，没有任何一个人转头看一眼那些被水泥封死的青春。大家都学会了做一只合格的木偶。"
 yds_event.2104.prev:0 "← 上一页"
 yds_event.2104.t:0 "最后的吉他弦（续）"
 yds_event.2105.a:0 "头顶上的红点一闪一闪，像阎王爷在天上睁开的眼睛。"
 yds_event.2105.d:0 "高二五班的物理尖子生周成，在草稿纸上算了一道偏门的光学衍射公式。同桌凑过去看了一眼，周成指了指公式开玩笑说：‘P是隐私，C是人的心智自由，θ是探头的视场角。当θ逼近三百六十度时，人就成了没有影子的鬼。’\n\n话音刚落，教室门口的喇叭就响起了刘彦冰冷的声音：‘高二五班周成，草稿纸上书写非教学符号，扣除本周操行分五分，即刻到监控室报到。’\n\n全班瞬间冻结。周成苦笑着撕碎了那张草稿纸，塞进嘴里嚼巴嚼巴咽了下去，然后站起身走出教室。从此以后，盐中的学生连在草稿纸上演算都必须用标准的正楷字。大家学会了用脑子里的橡皮擦随时擦掉那些不合规的想法。思想被锁进了最深的地牢，连呼吸都必须调成静音模式。"
 yds_event.2105.prev:0 "← 上一页"
 yds_event.2105.t:0 "永不闭合的眼（续）"
 yds_event.2106.a:0 "我们终于被改造成了合格的工业件。恭喜刘校长，恭喜流水线。"
 yds_event.2106.d:0 "‘咔哒。’\n\n收卷完毕的指令声通过无线耳机传达。两千多名学生同时站立，椅子脚摩擦地板发出的微小声响被控制在一分贝之内。没有撕书，没有扔卷子，没有相拥而泣，也没有人在校服上留下告别的签名。大家像出厂检验合格的罐头一样，依次迈着标准的步幅走出大礼堂，把胸前的准考证放进门口的回收箱里。\n\n走出校门口，九眼桥头的阳光刺得人睁不开眼。马路边卖蛋烘糕的小摊油烟滚滚，老茶铺里的竹椅子上传来老人们打长牌的吆喝声。市井的喧嚣像海啸一样涌过来，但走出来的这群年轻人却只是愣愣地站在人行道边上，手足无措。他们已经被训练成了不需要欲望、不需要情感、只需要输入题目的机器。而世界很大，却莫得一道题，能告诉他们接下来该咋个像个人一样活下去。"
 yds_event.2106.prev:0 "← 上一页"
 yds_event.2106.t:0 "完美机器的凯歌（续）"
 yds_event.22.a:0 "红星在台上金光闪闪，台下两千个脑壳冻得木囊囊。"
 yds_event.22.d:0 "主席台正中央那颗大红星，是美术组老刘带着两个实习小年轻连熬了两个通宵赶制出来的。直径两米四的大木盘，外面绷着粗糙的厚帆布，刷着刺眼的朱红丙烯，底下扯着一条三丈长的大红布横幅：‘破除升学特权，人人共享教育’。\n\n周一晨会，蒋光平校长就站在那颗红星的正下方作报告。成都冬天的清晨冷风嗖嗖刮，老头子穿着件洗得发白的旧中山装，在麦克风前头唾沫星子横飞，大谈特谈‘教育大锅饭’的划时代意义。他说要彻底斩断名校的傲慢、砸碎尖子生的优越感，把每一个娃娃都锻造成社会主义无差别的红砖。\n\n台下两千多个学生在寒风中冻得直吸鼻涕，大家一边把手揣在校服袖筒里跺脚取暖，一边在肚子里偷偷算着食堂早饭还剩不剩肉包子。没有人敢交头接耳，因为台下巡逻的值周老师手里攥着扣分小本本。在红星那巨大的阴影笼罩下，整个操场安静得像一座停尸房，只有高音喇叭里的官腔在空荡荡的天空打转。"
 yds_event.22.t:0 "主席台上的红星"
 yds_event.23.a:0 "我们把做题最厉害的人拉下了讲台，然后大家一起在及格线底下装傻。"
 yds_event.23.d:0 "高二一班后黑板上的粉笔画在一夜之间被彻底刮干净了。原来画的那幅梵高《星空》和手抄的顾城诗歌连渣都不剩，换成了一张用大黄纸手写的大字报，墨汁淋漓地写着几个大字：‘打破知识垄断，向做题学阀开火！’\n\n周二下午的自习课直接改成了现场批判会。讲台前摆了三张小板凳，唐思懿和两个在全国物理竞赛拿过名次的尖子生被勒令站在旁边听意见。几个平时在班上考倒数、自习课带头打瞌睡的刺头，这会儿却红袖章一戴，翘着二郎腿在底下拍桌子发难：‘平时做题做那么快显摆啥子嘛？老师讲道题你们非要用超纲方法写，分明是搞学科霸权、看不起普通同学！’\n\n台上的唐思懿低着头，死死咬着下嘴唇，手里的圆珠笔被捏得咔咔响，可愣是一个字都没反驳。班主任邓霜站在教室后门口，冷眼看着这场荒诞的闹剧，深深叹了一口气。窗外的锦江水还在流，但在这一刻，谁会做压轴大题，谁就成了全班的阶级公敌。"
 yds_event.23.t:0 "黑板上的大字报"
 yds_event.24.a:0 "手上的老茧磨得再厚，也抵不过理综答题卡上空着的一道压轴大题。"
 yds_event.24.d:0 "学农基地设在龙泉驿的桃园深处，颠簸破旧的大巴车把学生们晃得七荤八素。车门一开，一股混杂着发酵鸡粪和湿冷红苕土的气味扑面而来。蒋光平校长破天荒穿了一双军绿色的解放鞋，裤腿挽到小腿肚上，站在田埂上拄着锄头，笑呵呵地宣布为期两周的‘大地课堂与脱胎换骨训练’正式开营。\n\n平时连抹布都没洗过的尖子生们，被强制赶下烂泥田挖红薯、挑农家肥。十冬腊月的天气，冰冷的泥水一下子灌进崭新的球鞋里，冷得刺骨。一个女生脚下一滑，整个人摔进泥坑里，糊了满脸稀泥，惹得田埂上的督导干部拍着大腿大笑。蒋校长站在高处举着喇叭喊：‘手上磨出老茧，心里才装得下劳动人民！这叫均等化实践！’\n\n可晚上躺在透风漏气的农舍大通铺上，学生们借着昏暗的马灯，依然在偷偷从被窝里摸出皱巴巴的数学试卷。白天挑大粪，晚上偷刷题。泥巴可以沾满裤腿，但谁都明白，等回到城里，决定命运的从来不是你挖了多少斤红薯，而是高考卷子上那道该死的立体几何。"
 yds_event.24.t:0 "学农基地的泥泞"
 yds_event.25.a:0 "应试的苦海被平整成了操场，从此全员踩在泥巴地里，谁也莫想飞。"
 yds_event.25.d:0 "当最后一张老盐中传承了二十年的校本竞赛试卷被塞进碎纸机时，教学楼里泛起了一股异样的死寂。碎纸机发出沉闷的嗡嗡声，把那些写满微积分思想、量子论雏形的经典绝版讲义，一秒钟绞成了一堆毫无意义的面条碎纸。\n\n高三年级的走廊上空空荡荡，再也没有人聚在窗台边为了辅助线怎么画争得面红耳赤，也没有人在晚自习下课后弹着吉他唱歌。所有课桌上摆着整齐划一的白皮通用教材，练习题简单到不用动脑筋就能写出答案。大家就像同一个模具里倒出来的石膏像，整整齐齐坐在各自的位置上，神情木然。\n\n晚霞照进走廊，把教学楼外墙那颗红色五角星的影子拉得老长，一直盖住了整栋教学楼。蒋光平漫步在干净整洁的校园里，为自己的宏图伟业感到由衷的自豪。他确实成功消灭了所有的落后者与失败者——因为在这所学校里，也再莫得一个活生生的人愿意抬头仰望星空了。"
 yds_event.25.t:0 "红星映照的校园"
 yds_event.26.a:0 "第一号法案解决了红烧肉配额，人类宪政史由此迈出了油腻的一步！"
 yds_event.26.d:0 "盐道街中学第一届学生自治议会，在老食堂二楼正式鸣锣开张。\n\n三十七个班级选出的三十七名议员，围着六张拼起来的长方桌坐下。屋里飘着楼下传上来的回锅肉和老坛酸菜味，美术社借来的白桌布上，被人用马克笔写了一行歪歪扭扭的大字：‘今日拼桌，明日分治’。\n\n议长唐思懿敲了敲手里的搪瓷茶缸，全场肃静。第一号审议议案直接关乎国计民生：高三年级体育生联合联署，要求将食堂二楼窗口的红烧肉配额从每份三块加到五块！\n\n辩论场面精彩得比春熙路看川剧还带劲：理科议员拿出热量消耗和人体基础代谢公式，力证‘三块肉根本不够支撑做完两套理综大题’；文科议员则痛陈物价飞涨与食堂承包商的利益输送。经过长达四十分钟的唇枪舌剑，法案以三十票赞成压倒性通过，并附加特别修正案：‘周三肉汤无限量免费打’。\n\n食堂承包商李大爷在楼梯口听完结果，气得直挠光头：‘这帮瓜娃子，成立议会第一件事居然是抢老子的红烧肉！’"
 yds_event.26.t:0 "课桌拼成的议会"
 yds_event.27.a:0 "当蓝白运动服不再是防弹衣，穿睡衣来上课也成了基本人权。"
 yds_event.27.d:0 "《关于废除强制校服着装制度、实行穿衣自由的条例》在议会以压倒性优势通过那天，整个盐道街中学的中庭直接变成了九眼桥潮人街。\n\n周一清早，校门口的值周老师和保安揉了半天眼睛，以为自己走进了漫展现场。原先那片死气沉沉、跟麻袋一样的蓝白校服海洋彻底蒸发了：有穿着大红汉服、摇着折扇款款走过花坛的古风才女；有套着宽大嘻哈连帽衫、脚踩耐克踩着滑板进校的走读生；最离谱的是高一二班的两个活宝，居然穿着毛茸茸的珊瑚绒恐龙睡衣，大摇大摆地晃进早自习教室。\n\n政教处的王主任背着手站在台阶上，气得脖子上的青筋直蹦，手里的小本本捏得稀烂，却半点办法莫得——因为议会通过的法令已经由邓霜老师备了案，上面盖着‘校务创新委员会’的大印。\n\n唐思懿站在三楼连廊上瞅着底下五彩斑斓的人群，笑着对身边的同学说：‘你看，当一个人不用活在同一个模具里的时候，走路腰杆都直溜得多。’"
 yds_event.27.t:0 "中庭的彩色海洋"
 yds_event.28.a:0 "只要站上这只破木箱，哪怕考倒数第一，你也有五分钟当总统的权利！"
 yds_event.28.d:0 "那只大木箱是从总务处后院垃圾堆里刨出来的，原本装的是化学实验室订购的冷凝管和烧杯，侧面还贴着张褪了色的‘易碎物品·严禁倒置’。\n\n如今这只破木箱被四脚朝天倒扣在中庭百年老榕树的阴凉底下。学生自治议会给它起了个洋气的名字叫‘自由演讲箱’，只要你胆子够大，谁都可以站上去讲满五分钟。\n\n午休时间，树底下围满了啃着军屯锅盔和狼牙土豆的学生。高二文科班那个戴深度近视镜的书呆子第一个跳了上去，拿个大喇叭慷慨激昂地演讲：‘同学们！凭啥子周测排名要在走廊贴出来？这分明是应试资本对做题家尊严的公然践踏！’底下顿时响起一片叫好声，连带路过的保洁嬢嬢都驻足听了两句，笑着说这娃儿嘴皮子比相声演员还溜。\n\n接着上去的是个吉他手，站在木箱上弹唱周杰伦的《蜗牛》，全场几百人跟着合唱。老榕树的气根在微风里晃荡，阳光透过树叶洒在破木箱上。在这个被题海包围的高中里，这个装过烧瓶的箱子，成了大家唯一的精神避风港。"
 yds_event.28.t:0 "榕树下的肥皂箱"
 yds_event.29.a:0 "八十块钱的二手打印机虽然老卡纸，但吐出来的每个字都没盖过公章！"
 yds_event.29.d:0 "地下校刊《盐中评论》的创刊号，是在物理实验室三号柜背后的死角里搞出来的。\n\n生产工具是一台文学社从磨子桥数码城旧货摊花八十块钱淘回来的二手激光打印机。这台老古董动不动就卡纸，加热组件一启动就散发出一股呛人的烤墨粉臭氧味，但几个文学青年却乐颠颠地称这是‘思想的体香’。\n\n创刊号头版没有校领导的大头照，只印了老榕树下那只破木箱的黑白剪影，配着唐思懿亲笔题写的一行字：‘在没有路的地方，我们自己走成一条河。’里头不仅有嘲讽食堂红烧肉缩水的讽刺小品，有对最新模拟考压轴题的另类解法，甚至还有一篇用文言文写的《告全校同窗书》。\n\n当晚自习下课铃打响，三百多份油墨还没干透的小报顺着课桌被飞快传阅。学生们塞在抽屉里像看武侠小说一样偷瞄，连九眼桥外头那几家黑网吧的网管都顺手拿了一份垫泡面。在这张薄薄的纸上，大家第一次觉得自己不仅是个应试的考号，还是个有血有肉的人。"
 yds_event.29.t:0 "油墨香中的乌托邦"
 yds_event.3.a:0 "表格越填越厚，脑壳越搞越昏，这就是科学化办学的排面！"
 yds_event.3.d:0 "市局督导组那帮穿灰西装的领导是周二上午九点多杀进学校的，车屁股后头扬起一片灰。带队的王科长顶着个地中海发型，皮鞋擦得锃亮，进门就在小会议室的小黑板上画了个大红坐标系：X轴是时间，Y轴是达标率，中间划拉了一条直愣愣的红线。‘同志们，这就是咱们的及格线，任何讲超纲题、擅自加快进度的苗头，都是破坏均等化大局的违纪行为！’\n\n大课间的时候，我撞见物理组刘老师推着个两轮小铁车在走廊上走，轮子吱扭吱扭响。车斗里装了足足一尺厚的牛皮纸文件夹：教案整改表、周考分差分析表、后进生谈心台账、违规补课排查表……刘老师摘下老花镜直揉太阳穴：‘备课备个铲铲！我昨晚填这些鬼表格填到凌晨两点半，今早站在讲台上脑壳都是木的，差点把楞次定律讲成欧姆定律！’\n\n更搞笑的是周三教研会，语文组六十岁的老李老师因为读《岳阳楼记》读得起兴，语速比示范音频快了半拍，当场被督导组开了张《教学节奏非标准化整改通报》。老太太捏着通报单，气得手指头直抖：‘我教了三十年古文，范仲淹心系天下快了两秒钟，就成教学事故了？这到底是教语文，还是数签签算火锅账嘛！’\n\n王科长不管这些，坐在行政楼三楼吹着空调噼里啪啦按计算器。在他眼里，两千个活蹦乱跳的学生跟面粉厂里磨出来的精白粉没啥两样，重量、细度必须全数达标。至于里头被筛掉的是爱因斯坦的脑子还是做生意的料，表格里莫得这一栏。"
 yds_event.3.t:0 "指标之重"
 yds_event.30.a:0 "在红头文件里打太极拳，是体制内班主任保护娃娃的最高武功。"
 yds_event.30.d:0 "那支老英雄牌钢笔在邓霜老师手里捏了足足四十分钟，笔尖才终于落在签名栏上。\n\n邓老师可不是犹豫要不要签字，她把心思全用在咋个给这群胆大包天的学生‘穿防弹衣’上了。在这四十分钟里，她拿红笔在草案上动了十几处大手术：把杀气腾腾的‘强烈废除’改成了温和体面的‘阶段性优化暂缓’；把容易被扣帽子的‘学生自治’替换成了官僚最喜欢的‘素质教育自主探究实践’。每一个标点符号，都是她在体制高墙底下为娃娃们争取生存空间的掩体。\n\n改完最后一行，邓霜长舒了一口气，端起已经凉透的三花茶抿了一口。窗外操场上传来学生们打篮球的欢呼声。\n\n‘这帮千翻儿娃儿，一天到晚嫌老子和稀泥。’她看着满篇红圈圈的方案，嘴角露出一丝不易察觉的微笑，‘他们哪晓得，不把这些官话套话穿齐整，明早市局的整改通报就能把他们的乌托邦砸得稀巴烂。’她拧上笔帽，踩着平底鞋，迈着稳健的步子走向校长办公室。"
 yds_event.30.t:0 "走廊里的签字"
 yds_event.31.a:0 "只要课程简介里写着打扑克，全校做题家都能在一夜之间爱上概率论！"
 yds_event.31.d:0 "教务处那张在盐道街墙上贴了二十年的传统死课表，今天被一个1.7MB的Excel选课宏文件彻底送进了历史。\n\n以前课表是钉死在黑板边的铁律，哪怕下冰雹，周二上午第二节也必须是立体几何。而在邓霜主导的新方案下，课表变成了挂在校园内网上的自选菜单，学生可以像在春熙路吃串串香一样，自己勾选想听的模块。\n\n选课通道刚开放半小时，教务处那台奔腾处理器的老爷机服务器当场冒烟死机了两次！全校四百多号学生选出了足足一千七百种奇葩组合：高二理科班一帮糙汉子为了合法在教室里打牌，全员抢破头选了‘趣味博弈与概率初步’（主讲老师用一副德州扑克讲二项式分布）；文学社的几个姑娘则把‘唐宋诗词与现代流行音乐鉴赏’塞爆了。\n\n教务主任满头大汗地敲着键盘，嘴里直犯嘀咕：‘这成何体统嘛！高二学生不刷五三，跑去研究周杰伦跟李清照有啥子区别！’但当周考成绩出来，这帮选课奇葩班的数学平均分居然还涨了三分时，老同志彻底闭嘴了。"
 yds_event.31.t:0 "选课表上的格点"
 yds_event.32.a:0 "把洞穴出口标成高考很扎心，但至少周二下午允许大家扭头看看阳光。"
 yds_event.32.d:0 "每到星期二下午，高二各班教室里的空气就变得格外快活。\n\n没有了巡逻老师拿秒表抓迟到，高二三班的黑板破天荒被一分为二：左半边还留着上午物理课写下的洛伦兹力推导公式，右半边已经被下午的跨学科工作坊写满了粉笔涂鸦。语文老师兼古风爱好者周老师，正站在讲台上带着全班拿文言文翻译周杰伦的《晴天》：‘微风止兮，残云之不卷；落絮尽兮，春色之已阑’。\n\n更有好事的美术生用彩色粉笔在讲台边画了个大大的柏拉图洞穴：一排小人被铁链锁着看墙上的影子，而在洞穴外面透进来的光斑里，促狭地标注了一行小字：‘离高考还有270天’。\n\n全班笑成一团。物理老师端着茶缸倚在后门口听得津津有味，时不时还插嘴用角速度公式挑挑诗歌押韵的毛病。知识在这里不再是升学的刑具，而是成了大家嘴里嚼得喷香的怪味胡豆。"
 yds_event.32.t:0 "黑板上的跨界"
 yds_event.33.a:0 "只要统考达标率摆在第一位，教育部领导也能夸穿睡衣的学生有灵性！"
 yds_event.33.d:0 "国家教育部基础教育司突击视察的红头急电，是在中午十二点半直接砸到邓霜饭盒里的。当时她正用筷子夹着最后一块回锅肉，教导主任上气不接下气地跑进食堂：‘邓老师，大领导车队已经到九眼桥了！上头严令禁止搞夹道欢迎，要看真实常态！’\n\n邓霜慢条斯理把肉嚼烂咽下，抽张纸巾擦了擦嘴：‘慌个啥子嘛。开门迎客，让他们看活人就是了。’\n\n所谓‘活人常态’，具体表现为：一楼走廊上有两个男生正套着毛绒睡衣晃悠；音乐教室里传出电吉他和二胡的大杂烩合奏；而高二一班教室里，几个学生正围着一幅写满微积分与陀思妥耶夫斯基书评的手抄报争得面红耳赤。\n\n北京来的刘副司长背着手在后门看了足足十分钟。随行的市局领导冷汗把衬衫都浸透了，正准备弯腰检讨管理不力。没成想，副司长突然摘下老花镜笑了起来：‘成都是个好地方啊，连高中生都有这种盖碗茶式的从容。分没落下，人也没被磨傻。邓老师，你这个平衡木走得漂亮！’"
 yds_event.33.t:0 "钢丝上的完美平衡"
 yds_event.34.a:0 "春熙路同款的大屏，24小时把每个人的尊严扒光了示众。"
 yds_event.34.d:0 "立在行政楼正门台阶前的那块巨型户外LED屏，总共花掉了校友基金会十三万七千块钱。4K超清分辨率，120Hz高刷，IP65级防暴雨防雷击——按春熙路商圈的广告牌标准来看，这台工业奇迹唯一的毛病就是从不播放太古里的奢侈品广告。它一天二十四小时只滚播一样东西：全校一千八百名学生的实时绩点生死簿。\n\n姓名、原班级、动态总绩点、全校精确排名，每隔五秒钟无情翻动一页。前20%的尖子生用尊贵的赤红底色加粗显示；20%至50%是警告意味浓厚的明黄色；至于垫底的那10%，则是如同讣告一般的纯黑底白字。\n\n清晨六点半，上千名学生围在大屏底下，一边啃着军屯锅盔，一边抬头仰望跳动的数字。排在红榜上的昂首挺胸走进火箭班，掉进黑榜的低着头钻进食堂地下室。春熙路的霓虹灯再繁华，也比不上大屏上那跳动的0.1个绩点更能让人心惊肉跳。"
 yds_event.34.t:0 "四K大屏与红黑榜"
 yds_event.35.a:0 "一把椅子的差距，就是清华大学与大专文凭的距离。"
 yds_event.35.d:0 "在李刚治下的盐中，阶级划分是从屁股底下那把椅子开始的。\n\n高三火箭班的教室里铺着静音羊毛地毯，每张课桌前配的是校友会专门从深圳运来的赫曼米勒人体工学椅。头枕可调、腰托恒温，坐在上头刷十套试卷腰椎都不会抗议一声。教室里恒温二十四度，新风系统二十四小时送出富氧离子，空气里还隐隐飘着瑞士进口提神香薰的淡香。\n\n而仅有一墙之隔的‘基础强化班’，则被安置在食堂地下室改建的防空洞里。学生们坐的是掉了漆的硬木板凳，稍微动一下就发出吱扭吱扭的惨叫。头顶上的日光灯管年久失修，每隔五秒钟神经质地闪烁一次，把底下几十张苍白发青的脸照得跟鬼片没两样。\n\n‘坐什么椅子，取决于你做对多少道题。’李刚在走廊巡查时冷冷扔下一句话，‘想要腰舒服，就拿理综满分卷来换！’"
 yds_event.35.t:0 "椅子的阶级"
 yds_event.36.a:0 "沙漏里的细沙往下掉，每一粒都在倒数你剩下的青春。"
 yds_event.36.d:0 "图书馆三楼被改造成了一座令人窒息的现代‘边沁全景自习室’。\n\n两百个单独隔开的木质蜂巢格子间，呈同心圆一圈圈向外辐射。正中央的高台上坐着值班监考官，四周是一百八十度无死角的单向透视玻璃。每个格子里只配有一盏15流明的护眼暗光台灯，以及一个精致的红蓝黄三色沙漏。\n\n规矩严苛到变态：蓝色沙漏代表专注时间，必须坐满九十分钟；翻转黄色沙漏代表允许去洗手间，限时三分半钟，超时按秒扣除动态绩点；如果红色沙漏漏完你还没回座，格间顶上的警报蜂鸣器就会当场尖叫，并在大屏上通报‘专注力赤字违规’。\n\n学生们坐在隔间里，像被塞在培养皿里的细胞。没有人敢抬头，没有人敢多叹一口气，只有笔尖划破稿纸的沙沙声，整齐得令人毛骨悚然。在这座现代监狱里，灵魂被提炼成了纯粹的应试动力。"
 yds_event.36.t:0 "边沁的圆形自习室"
 yds_event.37.a:0 "一个走向了清华园，一个在校门口摇奶茶。他们都有光明的未来。"
 yds_event.37.d:0 "六月的烈日把盐道街的柏油马路烤得直冒油烟。高考放榜那天，校门口立起了两米高的红榜。\n\n火箭班的周军以七百零二分斩获全省理科第七名，清华大学四川招生组的别克商务车一早就停在校门口，副校长亲自陪同，闪光灯和电视台的话筒把他围得水泄不通。少年戴着厚厚的金丝眼镜，面对镜头操着一口流利的普通话谈吐自若，俨然是老盐中绩点流水线上最璀璨的工业明珠。\n\n而在马路正对面，一家新开张的‘避风塘’奶茶店里，另一个少年正熟练地摇着雪克杯。\n\n那是高二下学期因为绩点跌破警戒线被劝退的陈晨。退学后他在校门口开了这家奶茶店，穿着黑色的工装围裙，手臂上还留着当年在自习室熬夜被圆规扎醒的疤痕。店里的收音机正播着周军的获奖感言，陈晨只是淡淡一笑，把加满双份黑糖珍珠的奶茶封口，递给窗外的客人。"
 yds_event.37.next:0 "下一页 →"
 yds_event.37.t:0 "两种人生"
 yds_event.38.a:0 "按捐款金额排座位，连孔夫子来了都得先出示验资证明。"
 yds_event.38.d:0 "九十周年校庆那天，校友基金会在锦江宾馆包下了最大的千人宴会厅。\n\n红地毯从宾馆大堂一路铺到了锦江边上，豪车如云。宴会厅的座位排序严格按照捐赠支票上的零来决定：捐赠千万以上的坐第一排‘功勋桌’，享用特级茅台和澳洲龙虾；捐赠百万的坐第二排‘栋梁桌’；至于那些在科研院所苦熬、月薪几千的技术骨干校友，则被挤在靠近传菜口的‘奉献桌’，喝着普通的干红葡萄酒。\n\n李刚穿着订制西装，满面红光地端着酒杯穿梭在富商巨贾之间。天府实业陈总拍着李老师的肩膀高谈阔论：‘李老师这套搞得好啊！把学校办成投行，把学生当成期权培养，绩点高的追加投资，绩点低的及早止损！’李刚笑得合不拢嘴，连连碰杯。在这个金碧辉煌的夜晚，教育彻底脱下了圣洁的伪装，变成了一场赤裸裸的资本分红。"
 yds_event.38.t:0 "红毯上的校友"
 yds_event.39.a:0 "教育一旦做成了垄断托拉斯，每张试卷都带着钞票油墨的香气。"
 yds_event.39.d:0 "老盐中校友资本集团的扩张速度，比成都夏天的雷阵雨还要迅猛。\n\n短短两年间，挂着‘盐道街卓越教育’金字招牌的补习机构、全托集训营和全封闭复读基地，像雨后春笋一样在全省二十一个地市州疯狂铺开。从大巴山深处的达州到川南宜宾，无数望子成龙的家长变卖房产、掏空六个钱包，只为了把孩子送进这台被神话了的‘升学流水线’。\n\n而在盐道街总校，地下印刷厂扩建成了三层，每天吞吐上千万张带有防伪水印的独家冲刺试卷。这已经不再是一所单纯的公立中学，而是一座横跨房地产、金融借贷、教辅出版与生源垄断的超级应试帝国。李刚坐在宽大的红木办公桌后，看着财务报表上飙升的净利润曲线，仿佛自己已经成为了整个西南教育界无冕的皇帝。"
 yds_event.39.t:0 "帝国的基座"
 yds_event.4.a:0 "教案本上的条条框框压不住人，老子们茶馆里头见高低！"
 yds_event.4.d:0 "二楼物理教研室的门虚掩着，里头烟雾缭绕得跟失火了一样。\n\n我捧着作业本在门外头刹住脚，里头化学组特级教师赵老师的声音沙哑得像砂纸磨铁皮：‘昨晚上为了写那个劳什子“拉平自查报告”，我硬生生熬到后半夜三点！今天上午站在高三讲台上面，板书连个苯环都画得歪七扭八。底下的娃娃都在那儿偷笑，我教了二十多年书，头一回觉得自己像个跳大神的！’\n\n啪的一声脆响，哪个把手里的英雄牌钢笔砸在了办公桌上。\n\n‘老子带了六年的物理竞赛特长班，今天早上被教务处一纸公文给叫停了！’王老师扯着嗓门吼，‘理由是奥赛教学深度超过大纲23%，拉大了学生阶层差距！超过23%？我教的是竞赛，不超纲难不成给高三讲初二杠杆原理？脑壳进水了哇！’\n\n办公室里顿时没得声气，只有窗台上一台老爷吊扇吱呀吱呀转，吹出来的风都是热辣辣的。\n\n坐在阴凉角落里的李刚这时候把茶杯往桌上一磕。老头子慢条斯理掐了烟头，站起身来拍了拍裤腿上的粉笔灰：‘诸位，在蒋光平眼里，咱们这些老骨头就是阻碍他政绩的绊脚石。人家要的是数据好看，谁管学生三年后能不能考上清北？’\n\n他走到门口，手搭在门把手上顿了顿，回头扫了全场一眼：‘讲道理讲不通的时候，就别在这儿捶胸口了。今晚九眼桥茶馆，想给老盐中留点火种的，下班都过来坐坐。’\n\n门轻轻合上。几个年轻教师面面相觑，眼里头那点憋了几个月的窝囊气，总算是烧起来了。"
 yds_event.4.t:0 "办公室里的低语"
 yds_event.40.a:0 "学区房的均价涨上天，推土机推走的是最后一丝童年。"
 yds_event.40.d:0 "盐道街周边的老旧居民区在一夜之间被贴满了大红色的‘拆’字。\n\n在校友地产资本的雷霆运作下，学校周边的三处老厂区宿舍被连根拔起，改建成了号称‘天府状元府邸’的顶级学区公寓。每平方米售价直接被炒到了成都市均价的三倍，开盘当天两小时售罄。\n\n不仅如此，邻近的两所普通公办初中也相继被‘盐道街教育集团’全资兼并，原校名被摘下扔进废品站，换上了‘盐道街卓越生源孵化二部’的铜牌。所有新入学的娃娃从初一开始就必须佩戴智能绩点手环，实时监控作息心率。李刚的帝国版图在锦江区地图上一寸寸蔓延，凡是阻挡在这台做题绞肉机面前的平庸与闲适，统统被资本的推土机碾得粉碎。"
 yds_event.40.t:0 "扩张与吞并"
 yds_event.41.a:0 "敲钟的钟声在春熙路回荡，买单的依然是台下两千个做题的背影。"
 yds_event.41.d:0 "纳斯达克敲钟仪式被李刚极具创意地搬到了成都春熙路IFS国际金融中心的大天台上。\n\n上午九点半，在礼炮齐鸣和数千个彩色气球升空的盛景中，‘盐道街卓越教育控股有限公司’（股票代码：YDSG）正式敲钟挂牌！开盘首日暴涨87%，市值突破两百亿港币！\n\n李刚站在巨大的电子大屏前，接受着几十家财经媒体的闪光灯洗礼。他从怀里掏出一枚磨损严重的旧校徽，对着镜头饱含深情地讲起老盐中的艰辛创业史。而在几公里外的盐道街老校区，两千多名学生正头顶着酷暑，在没有空调的普通教室里死死掐着秒表做题。他们根本不知道自己在股市上的估值是多少，他们只知道，如果今天少背两个英文单词，明天的绩点就会被别人踩在脚下。"
 yds_event.41.t:0 "春熙路的钟声"
 yds_event.42.a:0 "喝口热水都要符合逻辑三段论，这就是盐中知识分子的体面！"
 yds_event.42.d:0 "校长带着保卫科连夜跑路后的第二天清早，我是被辩论社的一纸外交照会给砸醒的。\n\n字面意义上的外交照会。标准的A4纸油印，三号仿宋字体，标题长得一口气读不完：《就吉他社非法截留二楼开水房战略水资源一事致盐道街全体社团的紧急呼吁书》。最绝的是落款处，端端正正盖了个鲜红的大圆印。我凑近闻了闻，一股晨光橡皮擦的劣质塑料味。辩论社社长为了刻这枚萝卜章熬了个通宵，削废了三块4B橡皮，左手大拇指被美工刀拉了两道口子。但他哈着热气往红印泥上一蘸，那股教皇加冕般的庄严感，愣是把走廊过道整出了日内瓦万国宫的排场。\n\n起因纯粹是鸡毛蒜皮：吉他社为了给练琴的手指保温，把二楼开水房唯一的开水龙头霸占了四十五分钟；而辩论社辩手们舌战群儒讲得口干舌燥，端着保温杯在门口排长队，双方当场在水房门口用三段论和F和弦互问祖宗。"
 yds_event.42.next:0 "下一页 →"
 yds_event.42.t:0 "中庭的西发里亚合约"
 yds_event.43.a:0 "用十吨浆糊把领导画成萌妹，这是二次元对体制最狠的降维打击！"
 yds_event.43.d:0 "动漫社的总攻是在周五下午两点整准时打响的。\n\n社长王可为是个平时收作业都容易被课代表漏掉的高三文科男，戴着副厚厚的黑框眼镜，在B站搞鬼畜剪辑拥有两千个粉丝。但在那天中午的动员会上，他踩在美术室的维纳斯石膏像底座上，挥舞着数位板压感笔发表了战前演说：‘同志们，红头文件的旧时代已经入土了！从今天起，盐中的宣传阵地归二次元接管！’\n\n两点一刻，七大桶食堂煮稀饭剩下的浓浆糊被抬到了行政楼前的违纪通报栏。那块平时挂满‘处分通报’和‘红黑榜’的不锈钢橱窗，在一刻钟之内被彻底换了天地：李刚被画成了一个扎着双马尾、穿着蕾丝围裙的傲娇女仆学姐，手里举着满分卷大喊‘才不是为了你及格呢，笨蛋’；而前校长蒋光平则被画成了一个长满红头文件触手的深海大八爪鱼，满操场抓不穿校服的倒霉蛋！"
 yds_event.43.next:0 "下一页 →"
 yds_event.43.t:0 "二次元的大字报"
 yds_event.44.a:0 "肌肉就是硬道理，操场上的棒球棍教会了做题家啥叫丛林法则！"
 yds_event.44.d:0 "体育特长生们是在大乱斗的第四天，突然悟出自己的‘核心战斗力’的。\n\n前三天里，文科班辩论社垄断了麦克风，动漫社占领了布告栏，桌游社在小卖部倒卖可乐和辣条。四肢发达的体育生们坐在单杠上嚼着槟榔，瞅着那群平时考理综第一名的四眼田鸡为一个标点符号争得面红耳赤，终于搞懂了一个硬道理：当你能一口气做一百个卧推的时候，你根本不需要跟他们摆大道理。你只需要拎着棒球棍往讲台前一站，双手抱胸冷冷瞪着对方的近视镜片，对面自己就会乖乖闭嘴。\n\n于是，以四百米跑道和足球场为国土的‘操场合众国’正式挂牌。这群糙汉子用跳高海绵垫和废弃课桌在塑胶跑道入口修起了两道拒马，任何想穿过操场去食堂或者水房的学生，都必须向‘边境巡逻队’交出买路财。"
 yds_event.44.next:0 "下一页 →"
 yds_event.44.t:0 "荷尔蒙防线"
 yds_event.45.a:0 "拿王者荣耀换回锅肉，冷凝管里涮毛肚，这是盐中公社的顶级浪漫！"
 yds_event.45.d:0 "周五到了。日历上原本印着周三，但动漫社拿扩音器在大天井里喊了一嗓子‘同意今天提前过周末的请拍桌子’，整栋教学楼轰鸣了三分钟，周三当场被全校公投改名为周五，并被定为‘盐中大解放纪念日’。\n\n上午十点，食堂大妈阵营宣布全员倒戈加入公社。\n\n起义的原因极其接地气：动漫社社长王可为熬了三个通宵，终于兑现承诺，把食堂刘嬢嬢儿子的王者荣耀账号从钻石一路代练到了最强王者十五星！作为报答，刘嬢嬢推着两大车刚卤好的五香猪蹄和回锅肉，大摇大摆送进了化学实验室。化学社的几个极客当场拆下通风橱里的球形冷凝管和铁架台，倒进两块牛油火锅底料，接上自来水循环，当场在讲台上开涮串串香！\n\n麻辣鲜香的牛油火锅味顺着走廊飘得满天飞，九眼桥老茶馆的盖碗茶被端进了微机房，全校在这一刻化作了一场盛大的狂欢坝坝宴。没有人背单词，没有人算导数，大家就着酒精灯煮开的肥牛卷，大口嚼着青春最后的放纵。"
 yds_event.45.t:0 "辣条与理想国的终极盛宴"
 yds_event.46.a:0 "全员静坐不答卷，老师还在罢课宣言上顺手改了个错别字。"
 yds_event.46.d:0 "全校性的默契大罢课，是在一个阴雨连绵的早晨自然而然发生的。\n\n现场没有英雄振臂高呼，也没有发传单煽动，安静得像一场靠眼神传染的流感。清晨七点半打铃，第一个坐进高三一班教室的学生没有翻开课本，只是把书包扔在桌上，两手插在校服兜里发呆。同桌看了他一眼，默默把刚掏出来的《五三》塞回了课桌肚子里。五分钟后，整座高三教学楼二十四个班级，两千多名学生，全员安安静静坐在座位上，没有一个人动笔。\n\n语文组李向荣老师夹着教案走上讲台，看着底下黑压压一片沉默的脑袋。老头子愣了半晌，低头看了看黑板边上那张写着‘绝不复课’的纸条，居然掏出红钢笔，认真地把纸条上的病句和标点符号给改顺了，然后叹了口气，背着手默默退出了教室。\n\n邓霜老师站在走廊尽头，面对匆匆赶来的市局督导员，操着一口语速极快的地道川普英语，把督导员绕得云里雾里。没有口号，没有流血，大家用最极致的冷漠与沉默，给这台狂奔了几十年的做题机器拔掉了电源线。"
 yds_event.46.t:0 "讲台上的风"
 yds_event.47.a:0 "把三年做题家的心血扔进火堆，火光把九眼桥的河水都映红了！"
 yds_event.47.d:0 "‘篝火晚会燃料统筹委员会’是在下午三点整由全体学生投票成立的。\n\n委员长由火箭班的物理尖子生周军全票当选。这位在成都市模拟统考拿过全省前十的做题怪物，推了推八百度的厚镜片，面无表情地对全校发表了就职演讲：‘老子三年刷完的卷子，叠起来比校门口那根旗杆还高两米。今晚我别的不管，只负责让它烧起来的时候，火光能照亮九眼桥的河心岛！’\n\n傍晚六点十八分，第一缕火苗在操场正中央升腾而起。\n\n头一批被扔进火堆当祭品的，是周军亲手整理的二十三本四色标记错题集。紧接着，整座学校彻底疯了：两千多名学生像蚂蚁搬家一样，把厚达十几公分的黄冈密卷、历年真题、模拟周考卷，连同木质教具柜、讲台抽屉一股脑往火堆里扔！烈火冲天而起，十米高的火舌贪婪地吞噬着那些印满公式的白纸，在夜空中爆发出噼里啪啦的巨响！"
 yds_event.47.next:0 "下一页 →"
 yds_event.47.t:0 "三高五模的末日狂欢"
 yds_event.48.a:0 "重本率光荣归零，教育局连夜跑路，留下一操场的狗尾巴草。"
 yds_event.48.d:0 "第二天清晨，整座盐道街中学的操场黑得像块刚从灶膛里掏出来的蜂窝煤。\n\n塑胶跑道被昨晚那场疯狂的大火硬生生烧出了一个十多米宽的焦黑大坑，坑边翻卷着焦糊的橡胶皮，露出底下惨白的水泥地基。坑里散落着烧熔成一团铁疙瘩的铝合金讲台框架、几截断掉的铁椅子腿，还有半本被露水打湿的《高考冲刺终极押题》，封面上的烫金字早就缩成了焦黑的炭粒。\n\n风一吹，满操场的黑灰打着卷儿飞起来。高三整整两个年级，期末联考全员交了白卷，重本达标率破天荒喜提‘零蛋’！市教育局的调查组在看到这份惨绝人寰的数据报表后，连夜召开紧急会议，最终全票通过决议：‘放弃对盐道街中学校舍与行政权力的兜底托管’。官僚们像躲避瘟疫一样撕毁了所有对接文件，甚至连大门上的校牌都懒得派人来摘。"
 yds_event.48.next:0 "下一页 →"
 yds_event.48.t:0 "灰烬中的寂静涅槃"
 yds_event.49.a:0 "三座大山杵在那儿两千年了。山不会自己长腿跑，但咱们可以去挖山脚！"
 yds_event.49.d:0 "行政楼三楼那张成都名校地缘沙盘，是地理教研组牺牲了两个周末、就着两盆韩包子赶制出来的。底图是成都市中心城区的超清卫星航拍图，上头压着块厚实的有机玻璃。\n\n玻璃板上扎着几枚工字钉，钉死了蓉城教育界让人喘不过气的几座大山：深蓝图钉钉在磨子桥林荫街，那是傲气冲天的成都七中；正红图钉扎在文庙前街，那是两千年文脉的石室四中；明黄图钉扣在宁夏街，那是治军森严的树德九中。\n\n而在锦江边上的九眼桥头，地理组老王找遍了抽屉，发现别的彩色图钉全用完了，只能顺手摸了颗绿油油的塑料图钉扎在盐道街中学的校址上。老王端起老茶缸吹了吹茶叶沫子，操着一口川普嘿嘿一笑：‘绿颜色好嘛！青出于蓝而胜于蓝。四七九再牛气，那也是坐在老黄历上；咱们九眼桥的河水翻起浪来，迟早把这几座大山的墙脚全给冲垮！’"
 yds_event.49.t:0 "沙盘上的名校"
 yds_event.5.a:0 "蒋校长的三花茶里泡了架歼-20，这波在大气层！"
 yds_event.5.d:0 "唐思懿找上我的时候，我正在走廊窗台底下罚抄第八遍《中学生日常行为守则》——午休在课桌底下偷看了一回《七龙珠》，被巡逻纠察队抓了个现行。\n\n‘张诚，你是物理课代表，’她把一张叠得整整齐齐的白色A4纸递到我鼻尖底下，‘帮我算一哈，从三楼走廊按三十度角扔出去，纸飞机能飞多远？能不能直接扎进升旗台？’\n\n我愣了一下：‘你疯了哇？蒋光平今天要在国旗下讲话！’\n\n‘自习课全被改成了强制大纲补差，连各人自习的时间都要充公，’唐思懿眼神贼亮，半点没有被记过处分的晦气样，‘既然校领导听不懂人话，那就让试卷纸跟他们摆龙门阵！’\n\n接下来的三天，高二一班直接化身地下兵工厂。每张课桌肚子里都在偷偷折飞机，数学课代表在算流体力学升力公式，语文课代表负责在机翼上抄各种顺口溜，最绝的是化学课代表周敬淞，不知道从实验室哪个卡卡角角顺了点荧光试剂抹在纸尖尖上。\n\n周一清早升旗仪式，国歌刚放完，蒋光平清了清嗓子刚凑到话筒前。\n\n高三教学楼三楼的整排窗户啪的一声齐刷刷推开！\n\n下一秒，四百多只白花花的纸飞机跟下暴雪一样漫天乱飞！有的挂在银杏树丫丫上，有的直接一头栽进了操场积水里，其中一只甚至划了个刁钻的弧线，稳稳当当扎进了蒋光平摆在讲台上的茶杯里，把老头刚泡的茉莉花茶溅了一桌子。蒋校长端着盖碗茶的手悬在半空，眼珠子瞪得铜铃大，脸上的表情红一阵白一阵，比川剧变脸还精彩。\n\n机翼上清清楚楚写着八个大字：‘把学习的时间，还给学生各人！’\n\n保安和值周老师举着扫帚手忙脚乱在操场上追纸飞机，唐思懿站在三楼栏杆边上瞅着下头的洋相，噗嗤一声笑出来：‘你看嘛，纸飞机能在天上飞，全靠空气动力学，可教科书上偏偏把这一节定成了超纲！’"
 yds_event.5.t:0 "纸飞机与抗议"
 yds_event.50.a:0 "傲慢是拿清北名额喂出来的。想治他们的低血压，就得在考场上干翻他们！"
 yds_event.50.d:0 "成都七中的回函，是在盐中发出联考合作公函后的第十三个工作日才慢吞吞寄到的。\n\n信封用的是七中定制的纯白道林纸，带着烫金暗纹，左上角印着八个大字：‘四川省成都市第七中学’。信封连胶水都没封严实，里头的信笺统共就写了三行字：‘贵校来函收悉。关于学术交流事宜，我校教研处将按惯例安排接待。另附：本届全国五大学科竞赛，我校已有三十四人保送清北，供贵校参考。’\n\n校长看完气得把信纸往桌上一拍：‘你瞅瞅！连标点符号都透着股看不起人的傲慢劲！三十四人保送清北很了不起哇？’教导主任在旁边递上一杯刚泡好的竹叶青：‘消消气消消气，人家毕竟是全省做题界的天花板。想治七中的傲慢病，别在嘴皮子上争长短，得在全省一诊的联考大榜上，把他们的尖子生硬生生拉下马！’"
 yds_event.50.t:0 "林荫街的来信"
 yds_event.51.a:0 "两千年的老学堂连孔夫子都熬走了，自然不介意听听做题暴发户的思路。"
 yds_event.51.d:0 "石室中学接待外宾的第一项议程，是领着你在文庙里逛园子。\n\n人家学校的底子本身就是文庙。西汉景帝年间文翁化蜀建石室精舍，两千一百多年的老青砖踩在脚底下，院子里随便挑棵银杏树，树龄都比在场所有人的太爷爷还要老。石室马校长穿着一身青灰色棉麻长衫，在大成殿西侧的偏房里抚弄一张唐式古琴，琴声古朴悠扬，把前来谈判的盐中代表听得面面相觑。\n\n一曲弹罢，马校长端起盖碗茶，慢条斯理地开口：‘做学问如烹小鲜，急功近利成不了大器。盐中近年靠绩点和题海声名鹊起，但文翁教化讲究温良敦厚，切莫为了几张考卷，丢了读书人的体面。’\n\n盐中带队的高老师抿了口茶，笑着回了一句：‘马校长，体面固然要紧，但今年全省理综压轴题求导，光靠四书五经可解不出来。两千年的牌坊再硬，也得看高考大榜给不给面子嘛！’"
 yds_event.51.t:0 "文庙街的琴声"
 yds_event.52.a:0 "一千多双球鞋同时砸地的闷响，真会让人产生手握一个装甲旅的错觉。"
 yds_event.52.d:0 "树德中学的清晨，是从六点二十分整刺耳的军号声开始的，比教育局标准作息整整提前了十分钟。\n\n别家学校早操跑三圈一千二百米，宁夏街这边雷打不动必须跑满四圈一千六百米。多出来的四百米，是转业军人出身的张校长掐着秒表定的规矩：每分钟两百米的行军步速，每一步必须精确到一米三，四圈下来刚好把肺活量和做题意志拉到极限。\n\n一千多名学生穿戴整齐，步伐划一，皮鞋和运动鞋踩在塑胶跑道上发出地动山摇的闷响。盐中的观察员站在看台上，手里的早饭包子都差点吓掉了：‘乖乖，这哪是重点高中，简直就是个全副武装的做题装甲师！’\n\n晨跑结束，没有一个人去喝水，全员在三秒钟内拔足冲进教室，操场瞬间空空荡荡。张校长走到盐中代表面前，敬了个标准的军礼：‘在宁夏街，意志力也是一门必须及格的必修课！想要跟树德结盟，先让你们的娃娃在操场上跑满四圈再说！’"
 yds_event.52.t:0 "宁夏街的晨跑"
 yds_event.53.a:0 "林荫街与九眼桥联手，全川其他学校的模拟考好日子算是过到头了！"
 yds_event.53.d:0 "《林荫学术共建协议》是在成都七中行政楼的圆桌会议室正式敲定的。\n\n红木长桌上铺着七中百年校庆特供的蜀锦台布，金线绣着历任校长的题词。七中校长扶了扶金丝边眼镜，把厚厚的合作文本推到盐中校长面前：‘联合命题、教研互通、实验设备共享。但有一条必须写进前言：在全国竞赛和强基计划中，两校必须一致对外，绝不互相拆台挖角。’\n\n盐中校长提起金笔，在落款处刷刷签下了大名。谁能想到，这桩轰动蓉城教育圈的世纪盟约，牵线人居然是当年七中一个死活不肯转学的竞赛刺头，如今成了盐中物理实验室的挑大梁骨干。\n\n两只手在蜀锦台布上紧紧握在一起。林荫街的顶尖做题家与九眼桥的铁血达尔文主义者正式联手，整个四川高中的应试版图，从这一刻起彻底被焊成了一块铁板。"
 yds_event.53.t:0 "林荫协定的签字"
 yds_event.54.a:0 "七中不要的量子狂人，到了九眼桥就是改写全省联考格局的核武器！"
 yds_event.54.d:0 "成都七中物理教研组台柱子孙志远老师，是在一个雷雨交加的周三深夜决定跳槽的。\n\n孙老头在林荫街教了二十年物理，亲手带出过四个全省前十和两块国际金牌。七中给了他特级教师津贴和专属实验室钥匙，可老头子这晚还是拎着一个破帆布包走了。原因荒诞得像个段子：老头非要在高一选修课给学生讲量子力学超导理论，教务处领导以‘严重脱离高考大纲、浪费尖子生精力’为由，强行停了他的课，还勒令他写检查。\n\n孙老头一怒之下摔了保温杯：‘高考大纲算个铲铲！高中生连超导都不准琢磨，以后拿啥子去跟洋人搞科研？’\n\n当晚，老头打着伞踏着积水径直敲开了盐道街中学的校门。校长连夜从床上爬起来，端着一碗热气腾腾的担担面和全套物理实验室采购自主权双手奉上。孙志远抹了把脸上的雨水，把七中压箱底的三本绝密竞赛季刊拍在桌上：‘下个月联考，老子亲自带盐中的娃娃，把七中的物理分数线干穿！’"
 yds_event.54.t:0 "教研室的内线"
 yds_event.55.a:0 "五百年老槐树作证，文翁石室与九眼桥的做题家们歃血为盟！"
 yds_event.55.d:0 "石室中学大成殿西侧那棵歪脖子古槐树，相传是明朝嘉靖年间栽下的老古董，树干粗得需要三个壮汉才能合抱。\n\n四中的学生管它叫‘文脉树’，大考前夜总有娃娃摸黑来树底下背古文，据说要是有一朵槐花落在衣领上，第二天语文保底多拿五分。盐道街与石室的全面战略结盟仪式，就选在这棵五百年老槐树的浓荫底下举行。\n\n没有繁文缛节，石室马校长从槐树底下挖出了一坛陈年老花雕，斟满两碗粗陶大碗。盐中代表接过海碗一饮而尽：‘四中的文史底蕴，配上盐中的数理突击，咱们把成都市教科院的命题权牢牢抓在手里！’\n\n微风拂过，老槐树的白花簌簌落在两份红头协议上。五百年的古树什么风浪没见过，而今天它作证的，是两所蓉城名校联手垄断文史数理命题权的铁壁同盟。"
 yds_event.55.t:0 "文庙古槐下的结盟"
 yds_event.56.a:0 "网吧老板主动贴横幅拒接学生，两校政教处联手把网瘾治成了绝症！"
 yds_event.56.d:0 "《成都市中心城区名校联合行为规范与净化行动协定》的签署现场，肃杀得像反黑除恶动员大会。\n\n两校政教处主任并排站在三米宽的签字板前，人手一支粗头马克笔，神情冷得像雕像。协议的核心杀招只有一条：‘对九眼桥、磨子桥及小天竺街所有黑网吧、台球厅实施无死角跨校联合清剿！’\n\n当晚八点，两校保卫处联袂出击，带着对讲机和高清探头，把周边所有网吧堵得水泄不通。当场抓获正在通宵打CS和跑跑卡丁车的高二学生四十七名，缴获上网卡两百余张。战果辉煌到九眼桥几家最大黑网吧的老板连夜挂出横幅保命：‘严禁盐中、七中学生入内，违者老板当场去世’！\n\n政教主任看着缴获的战利品冷冷一笑：‘想翻墙去网吧当枪王？老老实实回教室给老子刷完这套高考真题！’"
 yds_event.56.t:0 "签字板上的铁律"
 yds_event.57.a:0 "被足球砸脸顶多流鼻血，比被一诊理综卷子砸脑壳舒服多了！"
 yds_event.57.d:0 "一年一度的蓉城名校全面对抗赛，共设三项硬仗：拼脑力的‘文星杯’奥数联赛、拼唾沫星子的校际辩论赛，以及拼肉体碰撞的十一人制足球赛。\n\n前两场打成一比一平，决定命运的足球决战在盐中主场打响。面对七中高大威猛的体育特长生，盐中门将、高三理科班的游林泰成了整场比赛的焦点。\n\n在全场三千人的嘶吼声中，七中前锋一脚近距离势大力沉的怒射直奔死角！游林泰连头盔都没戴，飞身鱼跃，用额头硬生生把球挡了出去！足球狠狠砸在他脸上，鼻血当场飙了出来，人躺在草皮上半天没动弹。队医赶紧冲上去喷云南白药，游林泰抹了把脸上的血沫子，咧着嘴嘿嘿傻笑：‘慌个锤子！被足球砸一下顶多流鼻血，比在教室被一诊理综卷砸爽快多了！换个球继续干！’\n\n全场爆发出雷鸣般的欢呼。最终盐中以一比零绝杀夺冠，连七中的带队教练都不得不摇头叹服：‘九眼桥这帮娃娃做题做疯了，踢球连命都不要！’"
 yds_event.57.t:0 "球场与讲台的硝烟"
 yds_event.58.a:0 "从垫底混子混成四七九头上的太上皇，高处风大，穿哪件校服抗冻？"
 yds_event.58.d:0 "成都市教育局年终总结表彰大会，今年破天荒地设在金牛宾馆大礼堂举行。\n\n在四川这片地界上，金牛宾馆这四个字本身就代表着官方最高规格的认可。上午九点整，在铺着鲜红地毯的主席台正中央，一号贵宾席上端端正正坐着盐道街中学的校长。\n\n礼堂聚光灯打亮，省教育厅厅长亲自将象征全川中学最高荣誉的‘天府教育卓越功勋鼎’颁发给盐中。台下坐着四七九和全省百强中学的校长们，掌声雷动，但不少人的表情比喝了苦瓜汁还精彩。\n\n整整八年，老盐中从当年并校时的垫底混子，一路踩着题海、绩点达尔文和铁血纪律，硬生生干翻了所有百年名校，登上了全川教育的太上皇宝座！校长站在聚光灯下，抚摸着沉甸甸的铜鼎，眼神深邃地望向窗外锦江的方向。王冠已经戴在头上，但九眼桥的狂风，才刚刚吹起来。"
 yds_event.58.t:0 "至高无上的盐道冠冕"
 yds_event.6.a:0 "秩序安逸得很——只要你各人不用活在这份‘安逸’里头。"
 yds_event.6.d:0 "学校里头那些打烂仗的破事刚按下去，头一个早晨，我是被一阵诡异的动静吵醒的。\n\n大喇叭倒还在吱呀吱呀响，但往常放的周杰伦《双截棍》跟川普英语听力全被掐了个干干净净，换成了首慢得让人直打哈欠的钢琴曲。那调子跟老茶馆里的挂钟摆锤一样，半天撞一下，政教处红头通知管这叫‘静心涤虑曲’，说是能帮全校师生‘洗掉浮躁、涵养平均心境’。后来音乐课代表悄悄跟我摆龙门阵，说这原本是莫扎特的《小星星》，被电教馆老师硬生生把音频拉慢了三倍，听起像在火葬场给期中考试开追悼会。莫扎特老人家要是晓得自己的谱子被整成这个死样子，怕是要气得从奥地利跳出来找蒋校长打平伙。\n\n走廊头也连夜大变样。每隔五米就拿白乳胶贴了张‘均等自律公约’，连水龙头出水量都被后勤大爷拿扳手给拧到了筷子粗细，理由是‘杜绝用水特权，实现全员节水指标均等化’。我跑去洗个手，接半天连个肥皂沫沫都冲不干净，真是毛焦火辣。\n\n经过高二一班门口，原先那帮最跳、下课在走廊上踢毽子打闹的尖子生，这会儿个个把头埋在厚厚的‘大纲统一测试卷’底下，大气都不敢出一口。窗玻璃上倒映着他们呆滞的眼神，像一排刚从流水线上下来的白皮罐头。"
 yds_event.6.t:0 "静默的走廊"
 yds_event.60.a:0 "目标：石室中学（去偷文庙古籍教研组的古文押题秘籍）"
 yds_event.60.b:0 "目标：树德中学（去拷宁夏街军事化跑操步频与理综提速表）"
 yds_event.60.c:0 "目标：成都七中（去拔林荫街物理竞赛组的保密服务器网线）"
 yds_event.60.d:0 "我们在成都各大名校后门埋下的钉子发回了密报。四七九的期末内部压轴卷和竞赛题库，就锁在各校教研室那几台不联网的老联想电脑里。\n\n是时候派出我们的特别行动小分队了：打着学术交流的幌子，带上大容量U盘和两盒九眼桥特产蛋烘糕，钻进对手的文印室和教研组。只要挑个防备最松懈的软柿子下手，今晚我们就能把对手辛辛苦苦押了半年的机密题库连底端回盐道街！"
 yds_event.60.e:0 "今天教研组在老茶馆聚餐，改天再去顺手牵羊"
 yds_event.60.t:0 "学区渗透：窃取学术机密"
 yds_event.61.a:0 "目标：石室中学（提前截胡文庙前街的中考状元苗子）"
 yds_event.61.b:0 "目标：树德中学（在宁夏街路口堵截他们的长跑特长生）"
 yds_event.61.c:0 "目标：成都七中（在磨子桥天桥底下硬抢他们的数学竞赛神童）"
 yds_event.61.d:0 "斯文扫地的时候终于到了！中考放榜当天，成都市各大初中名校校门口挤得比春熙路跨年还水泄不通。\n\n招生办直接出动了两辆撕掉车贴的金杯考斯特，车里备足了刚出炉的军屯锅盔、冰镇唯怡豆奶，以及当场盖章的‘清北强基全额奖学金承诺书’。面对中考前一百名的天才苗子，讲道理那是扯淡，谁手快、谁舍得砸真金白银，谁就能把未来的高考状元连人带书包扛上车！"
 yds_event.61.e:0 "交警在考点门口抄牌贴罚单，扯扯扯，今天先收队"
 yds_event.61.t:0 "学区博弈：强抢生源大作战"
 yds_event.62.a:0 "目标：成都外国语学校（把他们的同声传译名师挖来教川普英语）"
 yds_event.62.b:0 "目标：成都市实验外国语学校（掏空他们文科组的压轴大题总舵手）"
 yds_event.62.c:0 "目标：川师附中（把狮子山上的省级示范课骨干打包带走）"
 yds_event.62.d:0 "成都市二线名校里藏着不少常年被教案折磨、工资条还不如九眼桥串串香店长的特级骨干名师。\n\n只要我们舍得批一笔不记名的校长特别津贴，再让人事处主任拎着两瓶五粮液、两只青城山老腊肉和一套锦江区学区房的定金合同上门夜谈，没有哪个高三教研组长能顶得住这种糖衣炮弹。把人家的定海神针连同他电脑里二十年的精华教案一锅端回盐中，既能让我们少奋斗十年，又能让对手的尖子班当场瘫痪！"
 yds_event.62.e:0 "账上的银子还要留着给食堂加红烧肉，下个月再挖"
 yds_event.62.t:0 "学区博弈：重金挖角名师"
 yds_event.63.a:0 "大捷！盐道街包揽全市前十，四七九的考号全被挤去吃灰了！"
 yds_event.63.b:0 "惨败……平均分掉穿二本线，教导主任已经在锦江边上吹冷风了……"
 yds_event.63.d:0 "一年一度的成都市高三‘零诊’统考成绩单，今晨八点整在市教科院机房解密下发。\n\n这场全成都十几万名做题家在同一台光电读卡机下过筛子的大联考，是检验各校究竟是在搞素质教育还是在混吃等死的终极修罗场。如果前期的题海战术与挖人战役攒够了家底，今天就是盐道街把四七九按在地上摩擦的加冕日；要是平时光顾着瞎折腾，明天的全市校长例会上，咱们就得坐到垃圾桶旁边听训了！"
 yds_event.63.t:0 "成都市联合模拟考试结果公布"
 yds_event.7.a:0 "七个空桌子。昨天他们还在那儿跟你抢食堂窗口的最后一份回锅肉。"
 yds_event.7.d:0 "早上第一节自习还没打铃，大喇叭就滋啦滋啦响了起来。\n\n那种电流声刺得人耳朵痛，紧接着政教处王主任那口地道的椒盐川普灌满了每一间教室。老太太念通知的语气平得像在街沿边数黄豆，内容却是一份货真价实的‘斩立决名单’：‘经校党委行政联席会慎重研究，高二一班唐思懿、周敬淞等七名同学，因擅自串联、私自散发未经审核之违规油印品，严重破坏校内均等化学风，经市局督导组核准，给予开除学籍处分，即日离校。’\n\n全班鸦雀无声，只有电风扇在头顶上吱呀转。\n\n我转头望向一班那排靠窗的黄金座位，桌兜里还塞着半袋冷掉的蛋烘糕，红领巾和理综错题本整整齐齐码在桌角，只是椅子全空了。保洁嬢嬢黑着脸提着大号黑色塑料袋走进来，像收垃圾一样把桌上的文具、复习资料连同那罐没喝完的北冰洋汽水，一股脑扫进袋子里。塑料袋拖过水泥地板，发出刺耳的摩擦声。\n\n班长李向荣低着头，钢笔在草稿纸上死死戳出一个黑疙瘩，墨水浸透了三层纸。走廊外头，七个书包正被保安像拎贼娃子一样拎出校门。那扇老铁门哐当一声锁上的时候，整座教学楼像是被抽走了脊梁骨。"
 yds_event.7.t:0 "一班的空座位"
 yds_event.8.a:0 "只要一个秒表和一个文件夹，就能把讲台上最有灵气的脑壳变成木头。"
 yds_event.8.d:0 "督导组常驻行政楼三楼的第三天，我总算见识了啥子叫‘戴起脚镣跳坝坝舞’。\n\n李春老师是我们高二年级嘴皮子最溜的物理骨干，平时讲麦克斯韦方程组能扯到九眼桥下的漩涡和打麻将杠上开花，再枯燥的公式到了他嘴里都巴适得板。但这天上午，李老师站在讲台上，额头上的冷汗顺着鬓角往下淌，手里死死攥着督导组下发的《教学标准化秒表流程表》。\n\n教室后门开着半扇，两个穿着灰西装、提着公文包的督导组干部面无表情地坐在加座上。左边那个拿个秒表，右边那个手里捧着印满格子的考评表。李老师刚讲了一句‘这个电子轨道啊，就跟咱们茶馆里摆的盖碗一样’，后排的灰西装立马咔哒按停秒表，推了推金丝眼镜，冷冰冰地在‘课堂隐喻超纲率’一栏里扣了两分。\n\n李老师的喉结动了动，硬生生把下半截俏皮话咽回肚子里。接下来的四十分钟，这位全校最生动的老师变成了个没有感情的复读机，一字不差地念着教案上的黑体字。下课铃打响的那一瞬间，秒表正好跳到45分00秒，灰西装满意地点了点头，在总评里打了个‘A级合规’。\n\n李老师收拾教案的时候，手抖得连粉笔都拿不稳，一根崭新的白色粉笔啪嗒摔在地上，碎成了三截。"
 yds_event.8.t:0 "灰西装的注视"
 yds_event.9.a:0 "我们整齐得跟同一口锅里煮出来的挂面一样。恭喜我们全员二本。"
 yds_event.9.d:0 "三年后，大礼堂的主席台上拉起了大红横幅。\n\n蒋光平校长红光满面地站在聚光灯下，背后是一块超大投影幕布，上面赫然打着盐道街中学这三年的辉煌战果：高三年级期末统考平均分标准差，从合并当初的18.6一路断崖式下跌到了3.2！全成都市、全四川省最低！\n\n‘同志们，娃娃们！’蒋校长的嗓门在麦克风里震天响，‘这是统计学的奇迹，也是均等化教育的伟大胜利！以前我们学校，拔尖的天才考七百分，吊车尾的混子考两百分，贫富差距大得吓死人！现在呢？全校两千二百名考生，最高分四百九十一，最低分四百八十六！差距只有五分！我们成功消灭了分数的阶级差别！’\n\n台下坐着黑压压一片穿蓝白校服的学生，整齐划一地鼓掌。掌声热烈、节奏精准，不多一拍，不少一拍，跟设定好程序的马达一模一样。我坐在第一排，瞅着台下那一双双空洞麻木的眼睛——没有考砸的沮丧，也没有金榜题名的狂喜，只有一滩望不到底的死水。\n\n几个月后的全国高考，清华北大在四川的录取名单上，盐道街中学破天荒挂了个零蛋；但二本达标率却做到了惊人的百分之百。省教育厅的表彰锦旗送来那天，九眼桥头的锦江河水依然慢悠悠流着，只是这所百年名校的棺材板上，终于被敲进了最后一颗合规的铆钉。"
 yds_event.9.t:0 "流水线的终极胜利"
 yds_event.99.a:0 "九眼桥的河水流了千把年，哪个管你桌子上盖的是啥子章嘛。"
 yds_event.99.d:0 "1936年，成都，盐道街。\n\n府南河的水从西向东慢悠悠穿过锦江区，在九眼桥头打了个回旋。清晨六点半，河堤边的老茶铺刚把竹椅子搬出来排开，茶博士提着大铜壶烧水，水汽同秋早的白雾搅在一堆。桥头卖蛋烘糕和军屯锅盔的推车油烟滋啦作响，三两个穿蓝白校服的学生嘴里叼着个红糖锅盔，书包沉得快把肩膀勒脱臼，踢着路边的小石子往校门口晃。\n\n而在行政楼校长室的办公桌上，市教育局那份并校红头文件的印泥还没完全干透。直径四厘米的标准正红公章，盖下去那下怕是用足了两斤力气，在纸背面压出个鼓囊囊的印子。就是这么一记闷章，把底子硬扎的老盐道街中学和一所连像样实验室莫得的普通中学，硬生生按进了一个户口本里。"
 yds_event.99.next:0 "下一页 →"
 yds_event.99.t:0 "盐道街中学：一九三六年"
 yds_national_war.1.a:0 "发卷！今天就让全国的学霸见识哈，啥子叫九眼桥的做题降维打击！"
 yds_national_war.1.d:0 "当盐道街中学的油印机彻底被摇到冒烟时，四川盆地已经装不下这帮做题狂人了。\n\n秦岭北麓，陕南考霸同盟把清晨五点的跑操哨子吹得跟防空警报一样响，想拿‘一天睡四小时’的睡眠剥夺构筑马奇诺防线；长江中游，武汉楚天集团在防空洞里连夜启封了三十吨黄冈密卷，准备对入鄂的川军考生搞无差别降维打击；而在云贵高原的崇山峻岭间，滇黔联考军阀在盘山公路两旁全贴满了偏题怪题！\n\n在[GetLeaderName]的大笔一挥下，《跨省统一命题与考纲整肃特别行动纲领》正式盖印生效！九眼桥头的锦江河水依旧慢悠悠地流，但教务处的作战沙盘上，沾满红墨水的判卷大箭头已经气势汹汹地越过了剑门关。属于全中国做题家的军阀混战时代，正式鸣锣开考！"
 yds_national_war.1.t:0 "全国教育大战爆发"
 yds_national_war.10.a:0 "按停国家印钞机一般的答题印厂，九眼桥的标准就是全国唯一的国标！"
 yds_national_war.10.d:0 "北京西单那座神秘的灰色大院门前，盐道街特别督导组的卡车车队堵了个水泄不通。\n\n这是全国教育大战的终极一役：查封教育部考试中心直属的国家级标准答案印刷厂！当厚重的大铁门被推开时，厂房里隆隆作响的德国进口海德堡轮转机正在飞速印制着原本决定全中国考生生死的《全国统考官方指导标准》。\n\n盐中特派员一步跨上主控台，啪的一声拍下总电闸红钮！机器轰鸣骤停，现场死一般寂静。特派员从公文包里抽出那份写满川渝方言批注的《盐道街全科统考评分终极准则》，拍在厂长的脸上：‘从今天起，全国所有试卷的给分标准，全由九眼桥说了算！’"
 yds_national_war.10.t:0 "查封教育部标准答案印厂"
 yds_national_war.2.a:0 "九宫格配盖碗茶，川渝做题大军合体，全国考霸准备颤抖吧！"
 yds_national_war.2.d:0 "山城重庆的十八梯上，棒棒军挑着的不是山货特产，全是成捆的巴川中学月考大题！\n\n成渝教育一体化的大旗插上朝天门码头那一天，九眼桥的三花盖碗茶与嘉陵江的九宫格老火锅，终于在联合命题委员会的红木长桌上握手言和。两地的教育官僚抱头痛哭，当场签署了《互认周考成绩与严禁跨江查寝备忘录》。\n\n从此以后，川渝两地两百万做题大军彻底合流！成都的导数压轴题配上重庆的立体几何怪题，合编成了一本让全中国高三生闻风丧胆的《巴蜀绝密大联考》。这台马力全开的西南做题航母，正顺着长江滚滚东去，准备把沿江各省的名校全冲个稀巴烂！"
 yds_national_war.2.t:0 "成渝教育一体化"
 yds_national_war.3.a:0 "剪断夺命电铃线，胡辣汤换下衡水跑操，西北学子终于能睡安稳觉了！"
 yds_national_war.3.d:0 "秦岭山头的晨雾还没散尽，西安城墙上的高考倒计时牌已经换了姓。\n\n当盐道街的先锋教研大员推开陕南考霸总部的大门时，李军校长正襟危坐在大办公桌后，双手颤抖着交出了那份令无数西北娃儿闻风丧胆的《衡式凌晨五点零五分极限跑操与早读军规》。老校长神情凝重，活像冷战时期在地下发射井交出核手提箱的落魄元帅。\n\n成都来的督导员掏出大剪刀，咔嚓一声剪断了连通全校宿舍的五点起床电铃线：‘五点起床跑操？脑壳都要跑木！成何体统！明早全员改到七点半起，早自习前必须喝上一碗热气腾腾的肉丸胡辣汤！’关中平原几十万被折磨得眼圈乌黑的做题家们抱头痛哭：‘苍天有眼啊，原来早上还能睡醒！’"
 yds_national_war.3.t:0 "陕南考霸同盟覆灭"
 yds_national_war.4.a:0 "三千箱黄冈密卷收归国库，全湖北考生今晚集体开炫热干面！"
 yds_national_war.4.d:0 "武汉长江大桥底下，楚天集团的总司令周鹏校长亲自打开了地下防空洞的重锁冷轧钢门。\n\n里头整整齐齐码着三千箱被称为华中战略武器的《黄冈名师绝密压轴卷》。盐道街的接收大员戴着防化手套上前开箱验货，抽出一张物理卷瞄了一眼，倒吸一口冷气：‘好家伙，第一道大题就是带电粒子在非均匀时空场里的三维回旋，出题人的亲妈来了都算不出答案！’\n\n周鹏抹了把额头上的虚汗，苦笑着把公章推过去：‘这套生化武器，以后归九眼桥管了。’当天下午，黄鹤楼下摆起了盛大的热干面庆功宴。全湖北的尖子生喜极而泣，纷纷把手里的偏题怪题扔进长江喂鱼，宣告江汉平原正式并入盐道街教学大纲！"
 yds_national_war.4.t:0 "攻克江汉平原"
 yds_national_war.5.a:0 "给山河四省卷王放双休，他们吓得以为自己被教育局枪毙了！"
 yds_national_war.5.d:0 "山河四省的千万级卷王大军，今天第一次体验到了盐中空降的‘双休郊游新政’。\n\n当[GetLeaderName]签署的《关于严禁周六周日强制补课并推行春游放风的红头通告》贴在衡水和大明湖畔的高中校门口时，全校师生吓得脸色煞白，甚至有几个尖子生当场晕了过去，以为全校被上级集体开除学籍了！直到督导员硬生生把他们推上开往泰山和千佛山的大巴车，大家才明白：这是真放假！\n\n在泰山顶上的夕阳下，几个齐鲁学霸捧着被收缴的《五年高考三年模拟》，泪流满面：‘原来周末不用在教室掐秒表，太阳也是暖和的啊！’在九眼桥的从容作息感化下，山河四省的千万考生彻底臣服，心甘情愿将盐道街奉为天下做题之正统！"
 yds_national_war.5.t:0 "平定山河四省"
 yds_national_war.6.a:0 "虾饺早茶挡不住九眼桥的真题大棒，全粤私立学阀全员归降！"
 yds_national_war.6.d:0 "广州天河区的高档写字楼里，华南私立教育集团的AP国际部高管们，在精致的虾饺早茶前签署了认输协议。\n\n这些常年在维多利亚港数钞票、满嘴托福雅思词汇的国际学阀，在盐中纯国产的导数与立体几何组合拳面前输得底裤都不剩。他们苦心经营的‘二十万一年直通常春藤’滤镜，被盐中普通工薪班考上全额奖学金的奇迹无情打碎。\n\n双轨制的优越感彻底破产。从珠江新城到深圳湾，各大国际学校的豪华门头悄悄换上了‘盐道街中学大湾区国际教研分部’。老广们一边嚼着凤爪，一边感慨：‘做题这个事情，终归还得是内地老法师够硬扎！’"
 yds_national_war.6.t:0 "瓦解华南国际部"
 yds_national_war.7.a:0 "包邮区的高冷学阀被拔了底裤，江南贡院从此尽姓盐！"
 yds_national_war.7.d:0 "江南贡院的烟雨中，江浙沪名校联盟的高冷姿态碎了一地。\n\n他们曾经自诩为中国最懂强基计划、最讲究奥数血统的贵族门阀，动辄用自主命题里的文言文微积分嘲讽全国卷。但在盐道街精密无比的绩点达尔文大军面前，他们的老底子被扒得一干二净。第三轮联考大榜出炉，盐中火箭班以平均分高出十八分的绝对优势横扫全场！\n\n苏州园林的茶社里，盟主吴校长颤抖着端起碧螺春，向盐中代表低头认输：‘吴侬软语讲得再漂亮，也抵不过盐中的秒表和错题本。从今往后，包邮区的考卷，全按九眼桥的规矩印！’"
 yds_national_war.7.t:0 "江浙沪包邮区降服"
 yds_national_war.8.a:0 "一碗热气腾腾的牛肉拉面，把河西走廊所有考点连进了九眼桥大内网！"
 yds_national_war.8.d:0 "河西走廊的漫天风沙，没能阻挡盐中教研车队的行军步伐。\n\n兰州一中大门前，牛肉拉面的热气与堆成小山的高考模拟卷混在一堆。西北的荒漠狂风见证了老盐中教改特派团的铁血手腕：不仅把大西北所有的落后考点接上了九眼桥的同步网络课堂，更为贫困学子空投了整整五十万套免费的独家押题教辅。\n\n当祁连山脚下的娃娃们第一次通过光纤网络听完孙志远老师的量子物理公开课时，整个西北学界彻底沸腾。河西走廊千里疆域，从此心向九眼桥，成了西南做题帝国最坚不可摧的西北屏障！"
 yds_national_war.8.t:0 "河西走廊大收编"
 yds_national_war.9.a:0 "过桥米线配真题，大西南各省全员并入九眼桥大家庭！"
 yds_national_war.9.d:0 "彩云之南的滇池湖畔，贵阳遵义的红旗招展，西南各省最后的割据学阀全员交出了印信。\n\n在热气腾腾的过桥米线香气中，两省教育厅的官员们与盐道街代表签下了《大西南应试命运共同体公约》。所有民办高中的乱收费被连根拔起，偏远山区的考点全部并入全川标准化试题库。大西南三千万学子，终于在同一面题海战旗下找到了阶级跃迁的笔直阶梯！"
 yds_national_war.9.t:0 "西南边陲大整合"
 yds_national_war_coring.1.a:0 "关中做题家睡足了八小时，成绩反而暴涨，九眼桥法力无边！"
 yds_national_war_coring.1.d:0 "经过一百八十天的慢节奏作息腐蚀，陕南各校终于彻底洗脱了衡水式神经质跑操的阴影。\n\n督导组从各班后门查抄出来的三万根戒尺被当街当成了柴火，换上了成都人民公园同款的竹躺椅与盖碗茶歇。娃娃们面色红润、精神饱满，在刚刚结束的全省一模中，陕南分校的理综均分不仅没跌，反而暴涨了二十五分！面对这令人发指的数据，西北师生彻底服气，心悦诚服地将盐道街校徽缝在了心口上！"
 yds_national_war_coring.1.t:0 "陕南学区全面同化"
 yds_national_war_coring.2.a:0 "热干面与担担面的史诗级合体，江汉考阀彻底成了自家铁哥们！"
 yds_national_war_coring.2.d:0 "武汉街头的热干面摊上，如今摆满的都是盐中编写的《高考数学压轴题速杀三十六计》。\n\n经过半年的学术并轨，曾经傲视天下的黄冈模式与盐中达尔文绩点体系实现了完美融合。湖北考霸们不再钻牛角尖死磕偏题，而是把效率拉满，在联考中与成都本部杀得难解难分。两地教研组通宵连线开研讨会，江汉平原彻底融入了盐道街的帝国版图！"
 yds_national_war_coring.2.t:0 "江汉学区全面同化"
 yds_national_war_coring.3.a:0 "卷王们终于不自虐了，山河四省从此成了盐中坚不可摧的大后方！"
 yds_national_war_coring.3.d:0 "山河四省的高中校园里，破天荒第一次在周日下午听到了流行音乐的广播声。\n\n一百八十天的心理脱敏训练，让这群习惯了自我折磨的千万卷王终于相信：不跑操真的不会被雷劈。当他们学会用高效的思维导图替代无休止的机械抄写时，四省的高考达线率刷新了历史记录。黄河两岸的千军万马，从此誓死捍卫盐道街大纲！"
 yds_national_war_coring.3.t:0 "山河四省学区全面同化"
 yds_national_war_coring.4.a:0 "少爷小姐们开始刷五三，华南学区彻底收归国有！"
 yds_national_war_coring.4.d:0 "广州与深圳的私立贵族高中，如今规规矩矩地挂上了‘盐道街大湾区实验校区’的铜牌。\n\n资本的傲慢被扎实的应试逻辑彻底驯服，有钱人家的少爷小姐们也开始乖乖坐在自习室里刷真题。大湾区的雄厚资金与盐中的做题方法论强强联手，华南学区全面完成了向九眼桥的效忠大典！"
 yds_national_war_coring.4.t:0 "华南学区全面同化"
 yds_national_war_coring.5.a:0 "江南贡院改姓盐，包邮区做题精英全员归心！"
 yds_national_war_coring.5.d:0 "江南水乡的古老书院与现代高中的玻璃幕墙上，如今飘扬的全是盐中红白相间的校旗。\n\n吴地的细腻解题风格与川蜀的大刀阔斧实现了史诗级互补。江浙考生用上了盐中的极速算力，盐中吸收了华东的文史深意。大公鸡的腹心粮仓，自此全部收归九眼桥教务处统领！"
 yds_national_war_coring.5.t:0 "华东学区全面同化"
 yds_national_war_coring.6.a:0 "丝路重镇开满盐中花，大西北做题铁骑全员集结！"
 yds_national_war_coring.6.d:0 "丝绸之路沿线的两千所中学，如今全部接入了盐道街全息智能教学终端。\n\n从戈壁绿洲到黄土高原，每一个渴望通过高考改变命运的孩子，手里都攥着最新版的盐中内部讲义。教育资源的鸿沟被彻底填平，西北学区如期完成核心化改造，成为帝国最纯粹的信仰高地！"
 yds_national_war_coring.6.t:0 "西北学区全面同化"
 yds_national_war_coring.7.a:0 "大西南铁板一块，盐道街威名响彻十万大山！"
 yds_national_war_coring.7.d:0 "云贵高原的崇山峻岭间，书声琅琅，与府南河畔的钟声遥相呼应。\n\n西南各省完成了彻底的教研体制大并轨。落后的办学设施被全部翻修，统考阅卷全面实现机器秒级复核。大西南连成了一整块坚不可摧的教育铁壁，九眼桥的权威在这里犹如神明！"
 yds_national_war_coring.7.t:0 "西南学区全面同化"
 yds_national_war_preemptive.2.a:0 "抢先空投绝密核卷，先让全国考生把眼泪哭干！"
 yds_national_war_preemptive.2.d:0 "兵贵神速！与其等全国各地的教育军阀把偏题怪题砸到我们脸上，不如抢先出击！\n\n由盐道街特级教师突击队连夜封闭赶制的三套《全国超难度全真模拟摸底卷》，今晨通过特快专递与加密数据流，同时空投至全国三十一个省市的考点教研室！这套试卷题量翻倍、深度拉满，每一道压轴题都直奔考生的认知盲区，足以在开战首日让全国各地的做题军阀当场陷入全员不及格的恐慌！"
 yds_national_war_preemptive.2.t:0 "先发制人命题打击！"
 yds_national_war_mob_stage1_tt:0 "§G盐道街中学§!进入【全国高考战争总动员】\n§R陕南秦岭考霸同盟§!将获得【衡式战时总动员】\n§R华中楚天考霸集团§!将获得【奥赛突击旅总动员】\n§R滇黔名校联考同盟§!将获得【高原游击总动员】\n§Y（各政权的动员强化将在对应讨伐国策完成后生效）§!"
 yds_national_war_mob_stage2_tt:0 "§R山河四省教育联盟§!将获得【绝望壁垒全面死守】\n§R华南考试同盟§!将获得【沿海全力经济动员】\n§R华东学校组织§!将获得【江南精英总动员】\n§Y（各政权的动员强化将在对应讨伐国策完成后生效）§!"
 yds_national_war_mob_ebs_tt:0 "§R最高教育局巡视督导组§!将获得【督导组战时全境管制】\n§Y（该动员强化将在对应讨伐国策完成后生效）§!"
 yds_olympiad_event.1.a:0 "金牌就是硬通货！早操晚自习全砍了，把好苗子关进机房闭关集训！"
 yds_olympiad_event.1.b:0 "稳妥为先！竞赛不能荒废常规课，打好综合地基才能防暴毙。"
 yds_olympiad_event.1.d:0 "随着学科奥赛特长班试点正式挂牌，校务处那张老红木会议桌差点又被各路老师拍散架了。\n\n激进派奥赛教练挥舞着清北强基保送名额表，大声主张‘唯金牌论’——把体育课、早操甚至午休全停了，把二十几个精挑细选的数学物理好苗子关进小黑屋往死里刷竞赛真题；而稳健派班主任邓霜则敲着盖碗茶盖提醒：‘把鸡蛋全放在一个篮子里，万一考场上脑壳一懵翻了车，娃娃们常规高考和保送两头落空，到时候哪个对他们的人生负责？’\n\n是孤注一掷赌出国决金牌，还是稳扎稳打走全科均衡？全校的科研资源与学生命运，全系于这道战略单选题。"
 yds_olympiad_event.1.t:0 "奥赛试点：确立学校培养路线"
 yds_olympiad_event.100.a:0 "造化弄人……收拾书包回教室，咱们高考考场见真章！"
 yds_olympiad_event.100.d:0 "国决放榜的电子大屏缓缓滚动完毕，最后一线奇迹破灭了——盐道街代表队在五大学科总决赛中，无一人斩获国家金牌！\n\n备考室里弥漫着令人窒息的死寂。撕碎的草稿纸散落一地，几个熬秃了头的天才少年抱着书包红了眼眶。高额的竞赛投入最终化为泡影，大家不得不抹干眼泪，灰溜溜地回班重新翻开常规《五年高考三年模拟》，准备在常规高考的泥潭里重新趟过。"
 yds_olympiad_event.100.t:0 "金牌落空：备考室内的叹息"
 yds_olympiad_event.101.a:0 "一金落袋为安！清北保送名额到手，这波血赚！"
 yds_olympiad_event.101.d:0 "突破！国家级金牌的零蛋纪录终于被打破了！\n\n随着获奖名单正式盖章，盐道街代表队成功斩获一枚含金量十足的国家级学科奥赛金牌，并直接锁定清华北大的保送资格！虽然其他学科遗憾折戟，但这枚金牌如同一道划破夜空的闪电，彻底证明了九眼桥做题家也能登上全国最高的学术殿堂！"
 yds_olympiad_event.101.t:0 "一金保底：完成保送的破局突破"
 yds_olympiad_event.102.a:0 "双金到手！从今往后，成都竞赛看咱们九眼桥！"
 yds_olympiad_event.102.d:0 "双星闪耀！国决考场传来天大捷报，盐中战队豪取两枚学科竞赛国家金牌，双双入选国家集训队！\n\n两个清华北大保送资格当场敲定，全校师生涌上操场欢庆！四七九在成都市垄断竞赛话语权的时代被彻底终结，各大高校招生办的特派专员已经在九眼桥老茶馆里排队登门求贤，盐道街的竞赛强校地位坚如磐石！"
 yds_olympiad_event.102.t:0 "双金辉煌：奠定竞赛强校基石"
 yds_olympiad_event.103.a:0 "三金登顶！全川名校集体破防，九眼桥一战封神！"
 yds_olympiad_event.103.d:0 "奇迹！这是足以载入四川中等教育史册的黄金奇迹！\n\n三枚国家奥赛金牌！三尊国家集训队保送名额！盐中军团以摧枯拉朽之势横扫国决赛场，不仅将老对手们甩得连尾灯都看不见，更让教育部特派专员当场拍案叫绝！闪闪发光的纯金奖牌挂在少年们的胸前，九眼桥的钟声在这一刻轰然鸣响，金色风暴席卷全川！"
 yds_olympiad_event.103.t:0 "三金临门：盐道街的金色奇迹"
 yds_olympiad_event.2.a:0 "放宽心，正常发挥！把平时整理的错题本再翻一遍就行。"
 yds_olympiad_event.2.b:0 "动用校友会专项科研基金，给重点苗子提供特供深海鱼油补脑！"
 yds_olympiad_event.2.c:0 "找九眼桥文印内线，去摸摸对手各科的压轴模拟题！"
 yds_olympiad_event.2.d:0 "成都市八校大联考的硝烟，在锦江两岸悄然弥漫。\n\n石室、树德、七中等老牌竞赛豪门早就磨刀霍霍，打算拿盐中这支刚组建的草台班子祭旗。这场考试表面上是学术联谊，背地里却是争夺来年中考全川顶尖生源的刺刀见红大恶斗！在考卷启封前的最后一天，教练组必须敲定出战阵容：是靠平时死磕出来的真本事，还是去黑市找点偏方？\n\n§O当前已派出的学生及其加成：§![GetYDSExamBonusLai][GetYDSExamBonusTuo][GetYDSExamBonusZhou][GetYDSExamBonusEluo][GetYDSExamBonusDeng]"
 yds_olympiad_event.2.t:0 "成都市八校大联考正式开考"
 yds_olympiad_event.20.a:0 "红榜高高挂起！今晚食堂全员加餐回锅肉！"
 yds_olympiad_event.20.d:0 "大喜讯！八校联考总评成绩今日放榜，盐道街中学的奥赛梯队在总积分榜上一举杀入前两名！\n\n在数学与物理单科上，我们的尖子生更是一举斩获全市前五的亮眼战绩，狠狠打了磨子桥和文庙老牌学阀一记响亮的耳光。校门口的大红花与祝捷横幅连夜挂起，初三优质生源的咨询电话直接把教务处总机打爆了！"
 yds_olympiad_event.20.t:0 "联考大捷：红榜高悬"
 yds_olympiad_event.21.a:0 "胜败乃兵家常事，赶紧把错题吃透，国决见真章！"
 yds_olympiad_event.21.d:0 "惨败！八校联考成绩下发，盐中战队在对手刁钻的压轴题围剿下全面溃败，总分暴跌至中游垫底。\n\n好几个平时被寄予厚望的竞赛苗子在考场上脑壳短路，压轴大题几乎全军覆没。看着布告栏上惨淡的名次，教练组垂头丧气，而对手学校的冷嘲热讽早已传遍了九眼桥。我们必须在国决前痛定思痛、重整旗鼓！"
 yds_olympiad_event.21.t:0 "联考失利：滑铁卢之痛"
 yds_olympiad_event.3.a:0 "战鼓擂响，愿九眼桥的河水保佑这群少年逆天改命！"
 yds_olympiad_event.3.d:0 "冬日的清晨，全国五大学科奥林匹克竞赛总决赛在国家奥体中心正式拉开战幕！\n\n来自全国各省的做题怪物齐聚一堂，考场外停满了各大名校的助威大巴。盐道街中学的五名战将穿着印有九眼桥校徽的运动夹克，在寒风中昂首步入考场。草稿纸已经就位，铅笔芯削得锋利如刀。这是智商与意志的终极肉搏，数万道题海沉浮积累的全部功力，将在未来四小时内凝固成历史！"
 yds_olympiad_event.3.t:0 "全国奥赛决赛开幕"
 yds_olympiad_event.310.a:0 "神仙辅助线！赖神牛批！快看下一科！"
 yds_olympiad_event.310.d:0 "数学国决考场里，草稿纸被撕得像漫天鹅毛大雪。\n\n面对今年那道连大学教授看了都直嘬牙花子的平面几何与数论恶心压轴题，赖思翰在咬烂了两根2B铅笔后突然灵光一闪，在交卷铃响前五分钟硬生生画出了一条神仙辅助圆，将整个不等式完美闭环！阅卷组全体老师起立鼓掌，全国数学奥赛金牌稳稳收入囊中！"
 yds_olympiad_event.310.t:0 "数学决赛结果：数海弄潮"
 yds_olympiad_event.311.a:0 "数学大厦果然凶险，收拾心情继续死磕高考！"
 yds_olympiad_event.311.d:0 "数学决赛的压轴大题残忍得毫无道理。\n\n面对那道反人类的多项式同余大题，赖思翰在草稿纸上算到手指抽筋，但最终还是被一个隐蔽的奇偶性陷阱绊住了脚。铃声敲响时答题卡空了半截，赖思翰红着眼眶走出考场，金牌遗憾擦肩而过。"
 yds_olympiad_event.311.t:0 "数学决赛结果：遗憾受挫"
 yds_olympiad_event.320.a:0 "全绿 AC！平时机房电费和显卡真没白烧！"
 yds_olympiad_event.320.d:0 "信息学决赛机房里，几十把机械键盘敲得跟加特林对射一样火爆。\n\n面对两道极度阴险的树形动态规划与网络流难题，庹文面无表情地灌下半瓶冰红茶，手指在键盘上拉出道道残影。凭借平时在盐中机房死磕出的神仙常数优化技巧，她在最后两分钟按下编译提交——屏幕上二十个测试点刷出刺眼夺目的全绿 Accepted！信息学全国金牌当场拿下！"
 yds_olympiad_event.320.t:0 "信息学决赛结果：指尖狂舞"
 yds_olympiad_event.321.a:0 "卡常失败，该死的评测机！只能来年再战了！"
 yds_olympiad_event.321.d:0 "评测机的无情黑屏给信息学考场判了死刑。\n\n庹文在最后半小时孤注一掷推导的分块算法，在遇到恶毒的极端测试数据时当场爆发了致命的 Memory Limit Exceeded 内存超限。刺眼的红色红叉刷满屏幕，积分跌落金牌线，键盘前的少女只能默默拔掉了U盘。"
 yds_olympiad_event.321.t:0 "信息学决赛结果：算法折戟"
 yds_olympiad_event.330.a:0 "这就是传说中的玄学滴定法吗？太神了！"
 yds_olympiad_event.330.d:0 "化学决赛实验室里弥漫着令人上头的有机溶剂味道。\n\n面对反人类的未知金属络合物合成与提纯大题，周敬淞展现出了堪比老药师的鬼魅直觉。他不仅在笔试中精准猜中芳香烃重排机理，更在实验台上使出了出神入化的‘半滴悬空微量滴定法’，在溶液微微变粉的刹那精准停水！评委老师惊为天人，化学全国金牌稳稳落入囊中！"
 yds_olympiad_event.330.t:0 "化学决赛结果：灵性博弈"
 yds_olympiad_event.331.a:0 "试管翻车，玄学终究没能战胜热力学！"
 yds_olympiad_event.331.d:0 "离心机刺耳的啸叫声宣告了化学实验的翻车。\n\n因为手心出汗，周敬淞在第二步水浴加热时温度超标了两度，导致原本该结晶的紫色络合物瞬间分解成了一滩焦黑的沉淀物。看着试管底部的糊状物，周敬淞长叹了一口气，与金牌失之交臂。"
 yds_olympiad_event.331.t:0 "化学决赛结果：熔炼失利"
 yds_olympiad_event.332.a:0 "社死当场，这回真要上《今日说法》了……"
 yds_olympiad_event.332.d:0 "化学考场进行到一半，场外的无线电监测车突然拉响了刺耳的警报！\n\n三名巡考员带着保安直接破门而入，冲到周敬淞的实验台前，当众从他的石棉网夹层底下抠出了一台微型高频骨传导接收器！人赃并获，当场社死！周敬淞被架出考场，盐道街中学的名字在十分钟内被直接顶上了教育部严重作弊通报的榜首！"
 yds_olympiad_event.332.t:0 "化学决赛结果：作弊败露！"
 yds_olympiad_event.340.a:0 "物理大厦巍然耸立！宁姐手撕麦克斯韦太帅了！"
 yds_olympiad_event.340.d:0 "物理国决试卷刚发下来，全考场就响起了一片倒吸冷气的声音——压轴大题居然要求在非惯性系下推导强磁场多体粒子的非线性轨迹！\n\n然而在孙志远老头的魔鬼特训下，俄罗宁贝连眼皮都没眨一下。她气定神闲地列出一长串极其优雅的拉格朗日与哈密顿正则方程，像印刷机一样工工整整写满了六页答题卡，以全场第一的绝对高分斩获物理全国金牌！"
 yds_olympiad_event.340.t:0 "物理决赛结果：力透纸背"
 yds_olympiad_event.341.a:0 "差之毫厘谬以千里，物理学就是这么冷酷无情！"
 yds_olympiad_event.341.d:0 "非线性方程的泥潭吞噬了最后一丝希望。\n\n在推导微观对称性自发破缺模型时，俄罗宁贝在第三个积分符号上少算了一个二分之一系数，引发了连锁雪崩式计算错误。虽然推导逻辑无懈可击，但数值计算的硬伤让她与金牌失之交臂，令人扼腕叹息。"
 yds_olympiad_event.341.t:0 "物理决赛结果：物理折戟"
 yds_olympiad_event.350.a:0 "队长威武！生物金牌稳稳拿下，迎接总决赛狂欢！"
 yds_olympiad_event.350.d:0 "作为盐中奥赛军团的定海神针，邓云博在生物决赛考场上展现出了外科手术般的沉着与精准。\n\n无论是拿单面刀片徒手切出透光的植物茎秆横截面，还是在显微镜下秒认出十几种冷门寄生虫解剖图谱，乃至最后那道让人脑壳爆炸的群体遗传漂变大题，他都处理得滴水不漏，毫无争议地将生物学全国金牌揽入怀中！"
 yds_olympiad_event.350.t:0 "生物决赛结果：全能队长"
 yds_olympiad_event.351.a:0 "一泡毁所有，显微镜下的残酷现实让人心碎！"
 yds_olympiad_event.351.d:0 "显微镜的焦距调到了极限，但切片上的气泡还是毁掉了整个实验。\n\n因为压片手法稍重了一丝，细胞核染色标本发生了重叠变形，导致细胞分裂中期的识别扣除了关键分数。邓云博在走出考场时无奈地摇了摇头，这枚筹划了三年的生物金牌最终遗憾擦肩。"
 yds_olympiad_event.351.t:0 "生物决赛结果：错失金牌"
 yds_olympiad_event.4.a:0 "教务处大门反锁！把记者挡在门外，赶紧召开公关危机大会！"
 yds_olympiad_event.4.d:0 "纸终究包不住火！全国奥赛组委会与省教育厅联合下发特急通报，实名曝光盐道街中学在近期联考选拔中收买文印室内鬼、倒卖绝密押题卷的严重违纪行为！\n\n地下交易的聊天记录和转账单被挂在了各大家长群与贴吧头条，全川舆论彻底哗然。四七九等老对手趁机在省报发文痛斥‘学术浮夸与斯文扫地’，盐中的声誉在一夜之间暴跌，省厅督导组的车队已经杀到了校门口！"
 yds_olympiad_event.4.t:0 "惊天丑闻！竞赛作弊行径败露"
 yds_route_guide.1.a:0 "已阅，把这份防暴毙手册钉在校长办公桌上！"
 yds_route_guide.1.d:0 "欢迎查阅《盐道街之梦》教务处绝密生存手册与全路线全景指南！本模组内置多条魔幻现实主义主线、派系火并系统与跨省做题战争，请各位校领导务必熟读以下操作规程，谨防在任期内被学生掀翻或被教育局跨省查办：\n\n━━━━━━━━━ 一、三大常规主线与博弈 ━━━━━━━━━\n经历开局摸底后，将通过【盐中大危机】事件链确立学校实际控制人：\n- 1. 蒋光平（校务官僚 / 红星公社均等线）：通过大纲绝对统一与科层整编，严惩拔尖与特权，牺牲顶尖名校光环换取全校资源的绝对平均化。（注意：均等派与官僚专制路线禁绝奥赛精英选拔，无法点击任何奥赛国策，高考放榜必败并沦为落榜复读同盟！）\n- 2. 李刚（老校区复兴军 / 绩点达尔文 / 校友资本线）：托古改制，以残酷淘汰制重塑精英荣光；或联合川东校友资本商会，推行试卷商业化买卖与校友经济特权。\n- 3. 唐思懿 / 邓霜（高一·一班改革联盟）：学生自治 vs 师长立宪改良。启动专属【权力平衡 (BOP)】。过渡期领袖‘自治委员会’具有全方位行政死锁惩罚，必须全力倾斜支持唐思懿（激进学生自治）或邓霜（体制内稳健立宪）尽早独任领袖以解除死锁。\n\n━━━━━━━━━ 二、两大隐藏暴毙线路 ━━━━━━━━━\n在学风危机循环倒计时中，若未能维系四维动态平衡，将触发灾难性全面崩溃：\n- 【虚无白卷线】：GPA 跌破 40 触发。全校交白卷彻底摆烂，引发教育局全面接管与虚无主义自毁。\n- 【极权高压托管线】：教育局干预度达到 100% 触发。空降冷血官僚‘刘彦’，推行二十四小时全景监控与机器化高压统治。（注意：极权路线同样禁绝奥赛国策，高考放榜必败）\n\n━━━━━━━━━ 三、奥赛国家队与高考放榜 ━━━━━━━━━\n随着主线推进，必须第一时间解锁并推进右侧【奥赛国家队分支】（除非走均等派/官僚/极权线被强制锁定）：\n- 开启五大学科尖子生集训、八校大联考与全国奥赛冲刺；\n- 1938年6月7日清晨全国统一高考放榜（Gaokao Reckoning）：奥赛积分将直接折算为统考加成。若抢进全国前三甲，斩获【象牙塔技术霸权】；若排名落后，将引爆全国落榜生复读大同盟起义宣战！\n- 【政党锁定机制】：当政党为极端教务统制、大纲绝对均等派、校务官僚专制时，无法点击奥赛国策，该路线必然在全国高考决战中成为失败者！\n\n━━━━━━━━━ 四、成都学区地缘整合 ━━━━━━━━━\n决议面板开放学区渗透，针对成外、实外、川师附中及顶尖名校‘四七九’展开生源截胡与挖角，彻底统一天府蓉城！"
 yds_route_guide.1.t:0 "《盐道街之梦》 路线与结局指南"
 yds_school_district_event.1.a:0 "把法兰西语的听力磁带和牛角面包机一并拉回盐道街！"
 yds_school_district_event.1.d:0 "经过连续三个学期的奖学金截胡与保送名额渗透，百草路的成都外国语学校终于低下了高贵的头颅。\n\n成外董事会在城西宾馆乖乖签下了《教研并轨与资源共享协定》。从下周开始，成外引以为傲的小语种保送名额和原版全英文教材库，将作为战利品优先供盐道街学子挑选。连他们食堂那台全自动烘焙牛角包的进口烤箱，都被我们派卡车连夜拉回了九眼桥本部！"
 yds_school_district_event.1.t:0 "成外附庸化"
 yds_school_district_event.10.a:0 "千金买马骨，顺手把对手的马厩也给拆了！"
 yds_school_district_event.10.d:0 "人事处主任拎着装满现金支票与特级教师聘书的皮箱凯旋归来！\n\n对手学校的三名学科带头人在‘专属住房津贴、晚自习免坐班、奥赛奖金直接分成’的诱人条件面前当场倒戈。老教师们连夜把装满近十年命题规律的移动硬盘塞进书包，喜气洋洋地到盐中办妥了入职手续。"
 yds_school_district_event.10.t:0 "高薪挖角成功"
 yds_school_district_event.11.a:0 "填志愿前千万莫带家长看后操场的狗尾巴草，稳住就是胜利！"
 yds_school_district_event.11.d:0 "为了办好这次初三尖子生家长开放日，后勤处提前三天把全校厕所用白猫洗洁精刷了四遍，食堂刘嬢嬢更是拿出了国宴手艺免费派发回锅肉。\n\n几百名原本打算去报四七九的中产家长，在参观完我们摆满奖杯的陈列室并尝过红烧肉后当场沦陷。招生办门口的预录登记表差点被激动的家长们挤撕，场面比春熙路百货大楼打折还要火爆！"
 yds_school_district_event.11.t:0 "校园开放日圆满结束"
 yds_school_district_event.12.a:0 "造谣一张嘴，对手招生办跑断腿，兵不血刃拿下生源！"
 yds_school_district_event.12.d:0 "动漫社与网络兴趣组联手搞的五十个水军小号，过去一周在各大中考贴吧和鸡娃家长群里立下了奇功。\n\n‘某老牌名校即将取消早晚自习、全员推行素质减负’的惊天假消息，引发了全市初三家长的恐慌。生怕自家娃儿考不上大学的家长们连夜撤回了志愿，哭着喊着把孩子的学籍往盐道街中学的报名窗口塞！"
 yds_school_district_event.12.t:0 "教改谣言四起"
 yds_school_district_event.2.a:0 "把他们的文科状元苗子全部编入本部火箭班！"
 yds_school_district_event.2.d:0 "在盐中招生办高强度的挖墙脚攻势下，成都市实验外国语学校的生源护城河彻底决堤。\n\n为了保住民办高中的办学资质，实外董事会派人连夜送来降表，同意将本校文科尖子班整体改组为‘盐道街中学预备人才基地’，每年按固定比例向本部输送做题尖兵。实外校长在签字时手抖得拿不稳笔，眼睁睁看着自家苦心栽培的文科苗子全穿上了盐中的蓝白校服。"
 yds_school_district_event.2.t:0 "实外附庸化"
 yds_school_district_event.3.a:0 "锦江区从此只有一个太阳，那就是九眼桥！"
 yds_school_district_event.3.d:0 "同在锦江区的老邻居川师附中，在发现自家连续三届高三教研组长都在领盐道街的特聘津贴后，终于认清了现实。\n\n今天上午，两校正式打通了校园围墙与师资编制。狮子山上的优秀师范实习生，从此将成为盐道街无尽题海流水线上最廉价的改卷劳力。校门口的公交牌悄悄加了一行小字：‘盐道街中学东区实训基地’。"
 yds_school_district_event.3.t:0 "川师附中附庸化"
 yds_school_district_event.4.a:0 "磨子桥的旧神跌落神坛，现在轮到九眼桥坐庄了！"
 yds_school_district_event.4.d:0 "林荫街那块屹立了百年的金字招牌，在今天上午的全市联考成绩通报会上发出了清脆的碎裂声。\n\n随着最后一批奥赛金牌教练带着核心题库跳槽至盐道街，曾经不可一世的成都七中彻底丧失了对全川数理状元的垄断权。联考大榜张贴出来，前十名里有八个赫然顶着‘盐道街中学’的名头。曾经不可一世的七中教研主任，如今也得老老实实坐在盐中礼堂后排抄教案了。"
 yds_school_district_event.4.t:0 "七中陨落"
 yds_school_district_event.5.a:0 "文翁太守泉下有知，也得在九眼桥刷两套理综压轴卷！"
 yds_school_district_event.5.d:0 "从西汉景帝文翁化蜀算起，文庙前街这所延续了两千一百年的官办学府老祖宗，今天终于迎来了它历史上最霸道的太上皇。\n\n石室马校长在大成殿前，神情肃穆地将历代藏书阁的钥匙移交给我校代表。大成殿前的香炉依旧青烟缭绕，但两千年文脉积攒下来的古文阅读押题秘籍，自此全部收归盐道街教务处统一调度！"
 yds_school_district_event.5.t:0 "千年石室，今日臣服"
 yds_school_district_event.6.a:0 "从明天清早六点二十起，他们出操改喊盐道街口号！"
 yds_school_district_event.6.d:0 "哪怕是一千六百米跑操练出来的钢铁意志，在绝对的分数鸿沟面前也得低下头颅。\n\n随着树德连续三次在成都市模考中被盐道街拉开三十分以上的巨大差距，宁夏街引以为傲的准军事化防线彻底瓦解。张校长于今晨主动递交了《校际协同并轨方案》，全盘接受盐道街的绩点法则重塑。从明天清晨开始，全校出操改用盐道街的新校歌！"
 yds_school_district_event.6.t:0 "树德意志的崩溃"
 yds_school_district_event.20.t:0 "二流学校完全掌控"
 yds_school_district_event.20.d:0 "随着成外、实外与川师附中三所外围强校的教研公章先后锁进盐中保险柜，成都市中心城区的生源封锁网已彻底沦为我们的私家猎场。\n\n再也没有任何一所公办或民办高中敢在招生季跟九眼桥叫板，通往四七九核心领地的合围圈，在锦江两岸轰然合拢！"
 yds_school_district_event.20.a:0 "外围小弟全部归顺，大军直指四七九大本营！"
 yds_school_district_event.21.t:0 "四七九名校统合"
 yds_school_district_event.21.d:0 "林荫街的奥赛题库、文庙街的千年古槐文脉、宁夏街的铁血军事跑操……这三座曾经压得全川学子喘不过气来的应试图腾，如今已尽数换上了盐道街中学的分校门牌！\n\n从磨子桥到天府广场，大成都学区的每一张模拟考卷上，都深深烙下了盐道街不可动摇的霸主印记。全川百万做题家，今天起共尊九眼桥为天下第一关！"
 yds_school_district_event.21.a:0 "从此成都没有四七九，只有盐道街和它的三个附属校区！"

