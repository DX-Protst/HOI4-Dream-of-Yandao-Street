 exam_vanguardism:0 "题海斯达汉诺夫主义"
 exam_vanguardism_desc:0 "将做题效率提升至生理极限的极权训练法，要求学生如流水线机器般高速吞吐试卷。"
 bureau_totalitarianism:0 "督导铁腕极权"
 bureau_totalitarianism_desc:0 "教育局最高督察机构实施的全天候全方位监控体系，抹杀一切情感与灵魂。"
 national_totalism:0 "军管校政统制"
 national_totalism_desc:0 "将全校完全纳入准军事管制的极端威权体系。"
 student_unionism:0 "学生联合工团主义"
 student_unionism_desc:0 "由各班班级委员会与工团代表联合执掌校政最高权柄。"
 club_syndicalism:0 "社团自治公社"
 club_syndicalism_desc:0 "打破行政区划，由兴趣社团自主组织学习与生活。"
 academic_syndicalism:0 "学术研究公社"
 academic_syndicalism_desc:0 "学科代表与课代表直接接管教研与题库资源。"
 educational_egalitarianism:0 "大纲均等社会主义"
 educational_egalitarianism_desc:0 "大纲绝对统一，严厉打压重点班拔尖特权，推行教育资源无差别平分。"
 red_star_commune:0 "红星教育公社"
 red_star_commune_desc:0 "基层师生联合建立的民主自治公社体制。"
 nihilistic_anarchism:0 "白卷虚无主义公社"
 nihilistic_anarchism_desc:0 "拒绝一切分数评价体系，焚毁所有试卷与教辅资料。"
 welfare_reformism:0 "课业减负福利改良"
 welfare_reformism_desc:0 "严格执行法定休息时间，增设心理辅导与课外活动津贴。"
 specialty_student_alliance:0 "艺体特长生联合同盟"
 specialty_student_alliance_desc:0 "打破纯文化课单一评价，为特长生争取同等地位与资源。"
 progressive_pedagogy:0 "进步主义素质教育"
 progressive_pedagogy_desc:0 "倡导个性化教学与探究式学习的开明教育哲学。"
 student_libertarianism:0 "学生主权论"
 student_libertarianism_desc:0 "坚信学生是校园的真正主人，享有自治、言论与追求自由的不可剥夺之权利。"
 civic_liberalism:0 "校园公民自治"
 civic_liberalism_desc:0 "以程序正义与民主法治为基石的校园议事规则。"
 holistic_education:0 "全人素质自由派"
 holistic_education_desc:0 "注重道德、审美与独立思考能力的全面通识教育。"
 academic_laissez_faire:0 "自招竞赛自由市场"
 academic_laissez_faire_desc:0 "通过市场竞标与自主招生渠道自主配置尖端教育资源。"
 modular_credit_system:0 "学分走班自选制"
 modular_credit_system_desc:0 "学生根据自身需求自由选购课程模块并积累学分。"
 alumni_capitalism:0 "校友基金垄断资本"
 alumni_capitalism_desc:0 "富商校友与赞助财团深度渗透并主导学校重大经营决策。"
 traditional_pedagogy:0 "百年名校正统学派"
 traditional_pedagogy_desc:0 "传承老名校薪火相传的严肃治学传统与学者风骨。"
 moral_discipline_conservatism:0 "尊师重道保守主义"
 moral_discipline_conservatism_desc:0 "强调长幼尊卑与礼乐秩序，维护教师阶层的传统神圣性。"
 regional_protectionism:0 "本土学区守旧派"
 regional_protectionism_desc:0 "抵御外省应试资本入侵，保护本地师生的生存空间。"
 tutor_guided_democracy:0 "师长监护立宪制"
 tutor_guided_democracy_desc:0 "在班主任权威庇护与理性引导下稳妥推进的渐进式改良。"
 technocratic_reformism:0 "特级名师技术官僚"
 technocratic_reformism_desc:0 "由学术领军教师依据科学数据主导的理性治理。"
 managed_council:0 "受控学生评议会"
 managed_council_desc:0 "在校方指导框架内设立的温和协商议政机制。"
 principal_autocracy:0 "校务家长专制"
 principal_autocracy_desc:0 "校长享有无可争辩的一票否决权与全校人财物绝对裁决权。"
 bureaucratic_despotism:0 "行政督导专员专政"
 bureaucratic_despotism_desc:0 "上级教育局空降专员凭行政公文行使凌驾于全校之上的专断权威。"
 military_boarding_regime:0 "全封闭军事化督治"
 military_boarding_regime_desc:0 "以秒表、哨声与铁丝网构建的全封闭军事化作息高压统制。"
 meritocratic_darwinism:0 "绩点达尔文主义"
 meritocratic_darwinism_desc:0 "唯分数论英雄，将绩点作为划分特权阶级与惩处差生的唯一真理。"
 alumni_revanchism:0 "老校复兴复仇同盟"
 alumni_revanchism_desc:0 "为洗雪合并耻辱、夺回老名校荣誉而集结的狂热复仇联盟。"
 exam_hell_fanaticism:0 "极端应试做题狂热"
 exam_hell_fanaticism_desc:0 "在万人同考的绝望修罗场中被狂暴煽动起来的应试圣战意志。"
 nihilistic_xuexism:0 "虚无白卷主义"
 nihilistic_xuexism_desc:0 "当一切竞争失去意义，只有白卷才是对荒谬世界最彻底的反抗。"
 corporatist_xuexism:0 "社团封建割据"
