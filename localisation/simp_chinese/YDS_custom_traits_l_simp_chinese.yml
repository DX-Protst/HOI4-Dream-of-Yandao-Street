l_simp_chinese:
 YDS_autonomous_council_trait:0 "联合自治委员会（无休止争端）\n\n§R委员会由高一·一班学生自治代表与开明教师代表联合设立，因缺乏具备终决权的领袖，委员会常年陷入无休止的路线辩论与程序性扯皮中。在权力天平（BOP）决出真正的领导核心之前，行政效率低下、军令难以协调且民心浮动。§!"
 YDS_corporatist_anarchy_trait:0 "社团割据\n\n§L以社团为基层的自治联盟，虽然缺乏统一指挥，但内部活力无穷。§!"
 YDS_deng_shuang_trait:0 "沉默的筑桥人\n\n§L在激进与保守之间，邓霜选择了第三条路——改良。她擅长在制度的缝隙中周旋，用教案、课堂和班会课一点一滴地争取师生的信任。她不是冲锋在前的旗手，但在她的身后，是一座座被悄悄搭建起来的自由桥梁。§!"
 YDS_jiang_guangping_trait:0 "均等化的铁腕推手\n\n§L这位来自教育局的校委会主任坚信，教育公平就是将所有学生拉回同一条起跑线上。他擅长行政整合与资源调配，能够迅速稳定合并后的混乱局面，却也因此牺牲了学术的深度与多元性。在他的治下，学校正变成一座高墙耸立、书声却日渐单调的标准化堡垒。§!"
 YDS_li_gang_trait:0 "老校区的秘密旗手\n\n§L作为老盐道街最后的理想主义者，李刚的身上焕发着狂热的复兴意志。他擅长地下组织与物资筹措，能够快速建立起一支忠诚于老校区的精英武装。在他的字典里，失败者不配接受最好的教育——而他将用一切手段，甄别出那些天生的胜出者。§!"
 YDS_liu_yan_trait:0 "冷酷的应试机器操作员\n\n§L这位曾经的语文教师有着一双能看穿任何偷懒行为的鹰眼。他对纪律和分数的偏执已经超越了教育学的范畴，进入了一种近乎工业管理的领域。在他的治下，学生的每一分钟都被量化为产出，教师的每一堂课都被标准化为流水线工序。他不需要感激，不需要爱戴——他只需要数据上的完美。§!"
 YDS_nihilist_anarchy_trait:0 "绝对虚无\n\n§L对规则与竞争的彻底否定，使得一切纪律在这里都失去了意义。§!"
 YDS_tang_siyi_trait:0 "自治的火种\n\n§L这位一班的少年领袖身上有着与年龄不符的沉稳与激情。他擅长演讲、组织与动员，能够将最分散的个体凝聚为一个为自治而战的集体。他相信自由不是给予的，而是争取来的——哪怕这自由的代价，是一场与整座旧秩序为敌的漫长内战。§!"
